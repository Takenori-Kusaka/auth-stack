    ## 0. 要旨

    - v1.2: 模擬連携検証（会議室予約サービス。AI による模擬で、実在の連携チームの検証ではない）は、AI アシスタントによる代理予約（`sub`＝利用者、`act.ptype`＝`ai_agent`）を正規の書き方で判定に進められず、全件 403（PDP 呼出し 0 回）で止めた（report C-2）[D]。原因は 3 つあった [D]。(1) CON-03 の `subject.properties.actor` は `type`・`id` が必須だが、CON-02 の写像表は `ai_agent` を null（未決）とし、actor の `type` を書けなかった。(2) ADR-017 D17-16 の許可条件（scope ∧ 利用者の権限 ∧ エージェントの上限 ∧ 承認 grant）のうち、どれを誰がどの欄で評価するかが契約になかった。(3) tool サーバーが受け取る token が外部 AT か内部 access token（K3）かが読めなかった（report L-13）。
    - 本契約は ADR-017・ARC-04 §8 の決定を変えずに、次の 5 点を契約にする [D]。
      1. **委任の付与**: エージェントの委任用 client が PAR で委任を要求し、利用者が AS の画面で同意と step-up をし、エージェントが tool サーバーごとの代理 token を得る（§2.1、ADR-017 D17-08・D17-15・D17-17・D17-22）。
      2. **代理 token の取得経路と受け取る token の種別**: tool サーバー（依存サービス）が受け取るのは edge の exchange 後の K3 と K5 だけであり、外部 AT は受け取らない（§2.2、report L-13 の解消）。edge 初回 exchange は、外部 AT がエージェントの委任用 client に発行されたものなら、出力の `act` にエージェント主体を入れる（§4 ED-1。CON-05 への申し送り HO12-AG-04）。
      3. **tool 側 PEP の判定の組み立て**: ADR-017 D17-16 の 4 条件の評価位置と PDP 要求の書き方を規則 AD-01〜AD-12 として固定し、actor の `type` の暫定値を置く（§4、§5）。
      4. **人の承認**: 承認を要する tool 呼出し（D17-20）の承認要求・承認 grant の取得・tool 側 PEP での消費を定める（§2.3）。ADR-017 L17-5 の決定まで無効で、無効の間は承認を要する呼出しを拒否する（D17-25）。
      5. **取消**: 利用者・エージェント・委任元の停止による委任の終了と、反映の経路を定める（§2.4）。
    - 会議室の予約（write、修飾子なし、承認不要）は 1〜3 だけで正例の経路が通る [D]。承認を要する tool は L17-5 の決定まで拒否のままである [D]。
    - 自律動作（`sub` 自体が `ai_agent` の token）は ADR-017 K17-1 が未決のため本契約の範囲外とし、tool 側 PEP は引き続き PDP を呼ばずに拒否する（INT-02 SM-3、AGN-14）[D]。

    ## 1. 範囲

    | 範囲内 | 範囲外（正本） |
    |---|---|
    | 委任の要求（PAR）、利用者の同意と step-up（`/authorize`）、代理 token の取得と更新（`/token`）、エージェント側の委任の終了（`/revoke`） | 利用者の通常のログイン・OIDC profile（ADR-005、DL-69 収載） |
    | 利用者による委任の一覧と取消（`/delegation-grants`） | エージェント主体の登録・審査・棚卸し（ADR-017 D17-39〜D17-45、DL-48。登録手段の契約は §9 HO12-AG-05） |
    | 承認の要求と承認 grant の取得（PAR の `authorization_details`）、tool 側 PEP による承認 grant の消費（`/approval-grants/consume`） | 帯域外承認（CIBA 型）。RFC 10027 のリスク評価を経るまで無効（ADR-017 D17-22） |
    | edge 初回 exchange の代理拡張（ED-1〜ED-4）、tool 側 PEP の判定規則（AD-01〜AD-12）、actor の型の暫定写像 | 自律動作（ADR-017 K17-1 未決）、エージェント間の再委任の交換そのもの（CON-05 /token、R08） |
    | 理由コード AG01〜AG14・AP01〜AP07、負例 AGN-01〜AGN-28 | MCP 固有の要件（ADR-017 D17-26 の adapter。連携契約 v1 に含めない） |

    ## 2. 正例の経路

    ### 2.1 委任の付与と代理 token の取得

    ```mermaid
    sequenceDiagram
      autonumber
      participant U as 利用者（ブラウザ）
      participant G as エージェント（委任用 client、PC-16 は SVID）
      participant A as AS
      participant E as edge と STS・TTS
      participant T as tool サーバー（依存サービス、PEP）
      participant P as PDP façade
      G->>A: POST /par（scope=tool、resource=T、PKCE、delegation_lifetime）
      A-->>G: 201 request_uri
      G->>U: AS の /authorize へ誘導（エージェントの UI では同意させない）
      U->>A: ログイン、同意画面で agent・tool・資源・期限を確認、操作階層が求める step-up
      A-->>G: 302 code（redirect_uri へ）
      G->>A: POST /token（code、code_verifier、resource=T、mTLS）
      A-->>G: 外部 AT（opaque、aud=T、cnf=G の証明書、scope ⊆ 委任 ∩ エージェント上限）
      G->>E: tool 呼出し（外部 AT、mTLS）
      E->>E: AT を検証、cnf と提示証明書の一致、SVID の登録テナント＝AT の tid（ED-2）
      E->>E: exchange: K3（sub=U、act={sub=G, ptype=ai_agent}、scope、gref、tid）、K5（write 以上）
      E->>T: K3（Authorization）＋K5（Txn-Token）
      T->>T: AD-01〜AD-06（種別、entry point の宣言、scope ⊇ tool、tid の照合）
      T->>P: evaluation（subject=core/user U、actor={core/workload, G, ai_agent}、action、resource）
      P-->>T: allow / deny
      T-->>E: 業務応答（deny は CON-16 §2.7 の写像）
    ```

    - 利用者の同意と step-up は AS の画面でだけ行う（ADR-017 D17-22・D17-23）[D]。エージェントの UI・会話での同意を委任の根拠にしない [D]。
    - AS は委任の要求を受けると、(i) 要求した client が委任用 client（§9 HO12-AG-05 の種別 C8d）であること、(ii) 利用者のテナントにその client のエージェント主体が登録され有効であること（ADR-017 D17-07）、(iii) 要求 scope がエージェント主体の tool allowlist と操作階層の上限と自律度区分の範囲内であること（D17-16 の 3、D17-40）、(iv) 期限が上限以下であることを確かめ、満たさなければ拒否する（AG02〜AG07）[D]。
    - 委任 grant は AS の委任 grant 台帳（ARC-04 §5.4、ADR-005 D7-3）に記録し、`gref`（grant 参照）として K3 に引き継ぐ（ARC-04 §5.5）[D]。

    ### 2.2 tool サーバーが受け取る token（report L-13 の解消）

    | 経路 | エージェントが送る token | tool サーバーが受け取る token | 根拠 |
    |---|---|---|---|
    | 既定（依存サービスが tool サーバー） | 外部 AT（opaque、aud＝tool サーバーの resource、エージェントの証明書に束縛） | edge が exchange した K3（`sub`＝利用者、`act`＝エージェント主体）と K5 | ADR-005 D1-2・D1-4、ADR-023 D23-10 の 1（外部 opaque token は edge だけが検証）、CON-16 §1.1 |
    | tool サーバーから下流 API | （エージェントは関与しない） | 下流は tool サーバーが CON-05 /token で取り直した K3（`act`＝tool の workload、入れ子にエージェント） | ADR-017 D17-15、ARC-04 §8.2 |

    - INT-02 P-08 の図の「外部 AT（aud=M）」は、エージェントが edge に送る token を指す [D]。依存サービスである tool サーバーは外部 AT を受け取らず、届いたら拒否する（CON-16 §1.1、AGN-23）[D]。
    - edge の外で外部 AT を直接受ける tool サーバー（MCP server を単独の RS として公開する形）は本契約の範囲外で、ADR-017 D17-26 の adapter とともに定める（§10 の論点 V12-AG-1）[D]。

    ### 2.3 人の承認（承認 grant。preview、ADR-017 L17-5 の決定まで無効）

    ```mermaid
    sequenceDiagram
      autonumber
      participant U as 利用者
      participant G as エージェント
      participant A as AS（承認記録の状態ストア）
      participant E as edge
      participant T as tool サーバー（PEP）
      G->>E: 承認要の tool 呼出し（承認 grant なし）
      E->>T: K3＋K5
      T-->>G: 403 Problem approval_required（tool_id、authorization_details の type）
      G->>A: POST /par（authorization_details=[agent_tool_call: tool、資源、action、args_hash]）
      G->>U: AS の /authorize へ誘導
      U->>A: 操作内容（AS が表示する送信先・金額・対象）を確認し step-up
      A-->>G: code
      G->>A: POST /token（code、code_verifier）
      A-->>G: 承認 grant 参照（token_type=N_A、一回限り、短命）
      G->>E: 同じ tool 呼出し＋Agent-Approval ヘッダ
      E->>T: K3＋K5＋Agent-Approval（無改変）
      T->>T: 実際の引数から args_hash を計算
      T->>A: POST /approval-grants/consume（参照、tool、資源、action、args_hash、sub、actor、tid、txn）
      A-->>T: 200 consumed（一致し未使用のときだけ）
      T->>T: PDP の判定（§2.1 と同じ）と業務処理
    ```

    - 操作内容は AS が保持する承認記録にだけ置き、token の claim には載せない [D]。tool 側 PEP は実際の引数から計算した `args_hash` を AS に渡し、AS が承認記録と照合して一回限りで消費する（ADR-017 D17-21 の「jti を AS の状態ストアで消費」「tool 側 PEP が引数との一致を検証」）[D]。
    - 承認 grant の鍵束縛（D17-21 の `cnf`）は、承認記録に発行先のエージェント主体を記録し、消費時に K3 の `act.sub` と照合することで代える [D]。K3 の `act.sub` は、edge がエージェントの証明書に束縛された外部 AT を検証したうえで STS が付けた値なので（ED-1・ED-2）、他のエージェント主体は他人の承認 grant を消費できない（AGN-20）[D]。この読替えは §10 の論点 V12-AG-3 として ADR-017 に申し送る。
    - `args_hash` は、tool 目録で承認に束縛すると宣言した引数（`approval_bound_args`）と資源・action を 1 つの JSON オブジェクトにし、正規化して SHA-256 を取り、base64url（padding なし）で表す [D]。正規化の方式は RFC 8785（JSON Canonicalization Scheme）を案とするが、本契約の改訂者は原典を照合しておらず（未確認）、GA 前に確定する（x-open-issues）[D]。
    - 消費の呼出しは要求経路で AS を呼ぶので、ADR-023 D23-10 の 1（要求経路で AS を呼ばない）と食い違う [D]。ADR-017 D17-21・D17-25 は承認 grant の検証を「tool 側 PEP の状態照会」とし、承認要の呼出しに限った経路であるため、本契約は ADR-017 に従い、承認記録の状態ストアを cell 内に置く案で定めた [D]。食い違いは §10 の論点 V12-AG-2 とする。
    - 承認 grant の発行・消費に届かなければ、承認を要する tool 呼出しを拒否する（grace なし。ADR-017 D17-25、AP07）[D]。

    ### 2.4 取消（委任の終了）と反映

    | 起点 | 操作 | 反映 |
    |---|---|---|
    | 利用者 | AS の画面、または第一者 BFF から `DELETE /delegation-grants/{grant_id}` | 委任 grant を失効。refresh token を無効化。ADR-006 の失効状態に `gref` を載せ、STS の exchange を R10 で拒否 |
    | エージェント（タスク完了） | `POST /revoke`（RFC 7009。refresh token を送ると委任 grant ごと失効） | 同上 |
    | 委任元の利用者の停止・削除 | DL-08 のライフサイクル | 当該利用者の全委任を失効（ADR-017 D17-43） |
    | 停止（kill switch）: エージェント主体・定義・所有者・tool サーバー・委任元 | control plane（本契約の範囲外） | 資格情報の新規発行停止、委任 grant の失効、ADR-006 の失効伝播（ADR-017 D17-37） |

    - 依存サービス（tool サーバー）は取消の反映のために要求経路で AS を呼ばない（ADR-023 D23-10）[D]。反映は edge・STS の拒否（R10）と K3 の短い寿命、PDP façade の G 段（主体停止）で行う [D]。取消から拒否までの時間は ADR-006 の剥奪反映 SLO で縛り、TC-017-07 で測る（値は TBD、DL-20）[D]。

    ## 3. 凍結区分（ADR-022 D-1・D-2）

    | 要素 | 区分 |
    |---|---|
    | 本契約の全 operation と規則 ED-1〜ED-4・AD-01〜AD-12 | preview（ADR-017 が proposed、K17-1・L17-2・L17-3・L17-5 が未決のため） |
    | 承認の要求（PAR の `authorization_details`）、承認 grant の取得、`consumeApprovalGrant` | preview かつ無効（ADR-017 L17-5 の契約変更審査会の決定まで。AS は `authorization_details` を含む PAR を AG10 で拒否する） |
    | actor の型の暫定写像（§5） | preview（ADR-017・ARC-05 §16 の未決 7 の決定で置き換える。置換えは本契約の破壊的変更として扱う） |
    | 理由コード AG01〜AG14・AP01〜AP07 の意味 | preview |
    | 寿命・上限の値、URL | 凍結しない |

    preview の要素の GA 昇格・改版・廃止を判断する期限は TBD（所有者 CTO、期限 DEC-8 前、決め方 ADR-022 D-1-2）[D]。

    ## 4. 規則

    ### 4.1 edge 初回 exchange の代理拡張（ED。CON-05 /token の (a) への追加）

    | # | 規則 | 根拠 |
    |---|---|---|
    | ED-1 | subject_token がエージェントの委任用 client に発行された外部 AT なら、STS は出力 K3 の `act` を `{sub: エージェント主体の sub, ptype: ai_agent}` とする。値は AS の委任 grant 台帳から取り、要求元（edge）の申告や要求パラメータから取らない。委任用 client 以外に発行された外部 AT の出力には、CON-05 のとおり `act` を付けない | ADR-017 D17-08（下流では `act`＝現在の行為者）、ADR-009 D09-14（actor の身元を申告から取らない）、CON-06 internalAccessTokenClaims の examples[2] |
    | ED-2 | edge は、外部 AT の `cnf` と提示された証明書の一致を検証し、第一者のエージェント（PC-16）なら提示 SVID の主体が登録されたテナントと AT の `tid` の一致を確かめる。不一致は拒否し、監査に記録する | ADR-017 D17-07 (b)。依存サービスは提示 SVID を見られないので、この照合は edge が行う（§10 の論点 V12-AG-4） |
    | ED-3 | ED-1 の K3 には `scope` を必ず入れる（委任 grant の scope ∩ 交換登録簿の上限）。edge は ED-1 の要求について、操作階層が write 以上なら Txn-Token を発行する。read-sensitive の発行は ADR-017 L17-2・U-02 の決定に従う | ADR-017 D17-16 の 1、ADR-005 D9-3 |
    | ED-4 | 委任 grant の失効・期限切れ、委任元の利用者の停止、エージェント主体の停止は R10 で拒否する | ADR-017 D17-37・D17-43、CON-05 R10 |

    ### 4.2 tool 側 PEP の規則（AD）

    CON-16 §2.1 の処理順（`authenticate`→`bind_tenant`→`authorize`→`enforce`）は変えず、K3 の最外 `act.ptype` が `ai_agent` の要求に次を重ねる [D]。

    | # | 段 | 規則 | 根拠 |
    |---|---|---|---|
    | AD-01 | authenticate | 受け取るのは K3 と K5 だけ。外部 AT が届いたら拒否する | CON-16 §1.1、§2.2 |
    | AD-02 | authenticate | `sub` の `ptype` が `ai_agent` の K3（自律動作）は、PDP を呼ばずに拒否する | ADR-017 K17-1 未決、INT-02 SM-3 |
    | AD-03 | authenticate | 最外 `act.ptype` が `ai_agent` の K3 は、entry point 台帳でその entry point に `agent_delegation`（`AgentToolDeclaration`）を宣言している場合に限り先へ進める。宣言がなければ PDP を呼ばずに拒否する | ADR-017 D17-14（tool 目録に載った tool だけを呼べる） |
    | AD-04 | authenticate | 判定に使う actor は最外の `act` だけ。入れ子の `act` は監査にだけ使う | RFC 8693 §4.1（CON-05 info.x-profile.act-chain） |
    | AD-05 | authorize の前 | K3 の `scope` が無い、または宣言の `tool_scope` を含まなければ、PDP を呼ばずに 403 を返す（`WWW-Authenticate: Bearer error="insufficient_scope"` と `scope` に `tool_scope`）。scope を補う・別 token に切り替えることはしない | ADR-017 D17-16 の 1・D17-15、ARC-04 §8.2 の注記。CON-16 U-3（K3 の scope を判定に使わない）の例外として、エージェント経由の要求に限る（§9 HO12-AG-07） |
    | AD-06 | bind_tenant | K5 があれば `tctx.tid`＝K3 の `tid`＝資源のテナントを照合する（CON-16 §2.4）。write 以上は K5 が必須 | ADR-017 D17-07 (b)、CON-16 §2.4 |
    | AD-07 | authorize | 宣言の `approval` が `required`、または修飾子に `+FIN`・`+XT` があるか操作階層が privileged なら、`Agent-Approval` ヘッダの承認 grant を `consumeApprovalGrant` で消費できた場合だけ先へ進める。ヘッダがなければ 403 Problem `approval_required` を返す。L17-5 の決定まではこの tool を常に拒否する | ADR-017 D17-20・D17-21・D17-25 |
    | AD-08 | authorize | PDP 要求の `subject` は `sub` の主体（`type` は CON-02 の写像で `core/user`、`properties.principal_type` は `human`）、`subject.properties.actor` は §5 の暫定写像で書く | CON-03 Subject・SubjectProperties、CON-02 x-subject-type-map の「委任の場合は最上位の ptype を使う」 |
    | AD-09 | authorize | `+XT` の tool は、宛先がテナント管理者の登録した送信先 allowlist の範囲外なら、承認 grant があっても拒否する | ADR-017 D17-33 |
    | AD-10 | 全段 | エージェントが要求に入れた自己申告（「承認済み」「安全」などの欄、MCP の tool annotation、独自ヘッダ）を判定の入力にしない | ADR-017 D17-14・D17-35 |
    | AD-11 | enforce | 受け取った K3・K5・承認 grant 参照を下流へ転送しない。下流は CON-05 /token で取り直す | ADR-017 D17-15・D17-34 |
    | AD-12 | 監査 | E2 に、エージェント主体（`act.sub`）、委任／自律の区分、委任元（`sub`）、tool（`tool_id`）、承認 grant の ID（消費応答の `approval_id`）を記録し、承認 grant 参照・token の全文は残さない。欄は CON-08 への申し送り（HO12-AG-08）で確定するまで拡張欄に書く。v1.2 の同期: CON-08 版 0.4.0 の `DetailEnforcement` の `agent_principal`・`delegation_mode`・`tool_id`・`approval_id` で確定した。AD-02〜AD-07 で PDP を呼ばずに拒否した記録は `decision_source`=`none`、`no_decision_cause`=`subject_unmapped`、`reason_code`=`deny_subject_unmapped` とする | ADR-017 D17-47・D17-48 |

    - ADR-017 D17-16 の 4 条件の評価位置（v1.2 の暫定）[D]:

    | 条件 | 評価位置（暫定） | 恒久の案 |
    |---|---|---|
    | 1 token の scope が tool を含む | tool 側 PEP（AD-05） | 同じ |
    | 2 利用者の権限（R 段） | PDP façade（AD-08 の subject で通常どおり） | 同じ |
    | 3 エージェント主体ごとの上限（tool allowlist・操作階層の上限・自律度区分） | 発行時: AS が委任の付与と token 発行で scope を上限内に絞る（§2.1 (iii)）。実行時: tool 側 PEP の AD-05 | ADR-017 L17-3（G 段の第 7 規則）が決まれば façade でも評価する |
    | 4 承認 grant | tool 側 PEP が AS で消費（AD-07） | ADR-017 L17-5 の決定に従う |

    - 条件 3 を実行時に PDP で評価しない暫定は、上限を下げたときの反映が既発行の token の寿命と委任の失効に依存するという弱点を持つ [D]。上限を下げる操作では、該当するエージェント主体の委任 grant を失効させる（ADR-017 D17-37 の停止の一種として扱う）[D]。この扱いは §10 の論点 V12-AG-5 として申し送る。

    ## 5. actor の型の暫定写像（report C-2 の (1) の解消）

    | 最外 `act.ptype` | `subject.properties.actor.type` | `subject.properties.actor.id` | `subject.properties.actor.principal_type` | 状態 |
    |---|---|---|---|---|
    | `ai_agent` | `core/workload`（暫定） | `act.sub` | `ai_agent` | v1.2 の暫定（preview）。ADR-017・ARC-05 §16 の未決 7 で置き換える |
    | `workload` | `core/workload` | `act.sub` | `workload` | CON-02 の subject の写像と同じ（ARC-05 §3.1） |
    | `service_account` | `core/client`（暫定） | `act.sub` | `service_account` | CON-02 の subject の写像と同じ |
    | `human` またはその他 | —（拒否） | — | — | 人が actor になる委任は定義しない。PDP を呼ばずに拒否する（SM-3 と同じ扱い） |

    - 理由 [D]: (i) エージェント主体は 1 主体 1 SPIFFE ID の X.509-SVID で認証する（ADR-017 D17-07・D17-44、資格情報クラス NC-1）ので、認証の形は workload と同じである。(ii) ADR-017 D17-06 は WIMSE arch 草案が AI 仲介者を委任された workload の特殊例とすることを引いている。(iii) 委任の判定（R 段）は `subject`（利用者）の関係だけを使い、actor の型をモデルの relation に使わないので、暫定値が R 段の結果を変えない。(iv) 類型は `principal_type` で区別でき、`sub` の文字列から推測しない（ADR-021 D21-10）。
    - 制約 [D]: 認可モデル（CAM）は、`core/workload` の relation を委任の actor の判定に使ってはならない（R 段で actor を参照する permission を書かない）。`principal_type` の値は CON-06 `principalType` の値をそのまま写す。CON-03 の `actor` は `type`・`id` だけを定義し追加の項目を禁じていないので、`principal_type` を追加の項目として置く（CON-03 への申し送り HO12-AG-03）。
    - `subject` 自体が `ai_agent` の場合（自律動作）の写像は CON-02 のとおり null（未決）のままで、AD-02 で拒否する [D]。
    - CON-02 `x-subject-type-map` の rules は「現在の actor は context 側（CON-03）」と書くが、CON-03 の欄は `subject.properties.actor` である（report C-2）[D]。本契約は CON-03 の欄に従う。CON-02 の文言の訂正は HO12-AG-02。

    PDP 要求の例（会議室の代理予約。`x-pdp-request-example`）は info.x-pdp-request-example に置いた。

    ## 6. prompt injection の封じ込め（契約上の担保）

    ADR-017 §2.6 の 7 統制のうち、本契約が要求・応答の形で担保するものを示す [D]。モデルの頑健性には依存しない（ATK-16、attacker-model §3.16）[D]。

    | 統制 | 本契約での担保 | 負例 |
    |---|---|---|
    | D17-31 タスク単位の委任縮小 | 全権の scope と scope の省略を拒否、resource 必須、絶対期限の上限（AG03〜AG05） | AGN-01〜AGN-03 |
    | D17-32 承認 grant | 操作内容は AS の画面で利用者が確認し、引数ハッシュで束縛、一回限り（§2.3、AD-07） | AGN-17〜AGN-20、AGN-22 |
    | D17-33 外部送信先の allowlist | AD-09。AS は allowlist 外の宛先への承認要求も拒否する（AG12） | AGN-27 |
    | D17-34 token の素通し禁止 | AD-01・AD-11、tool サーバーは外部 AT を受けない | AGN-23、AGN-24 |
    | D17-35 tool 側 PEP の独立判定 | AD-10（自己申告・annotation を使わない）、tid の照合（ED-2・AD-06） | AGN-16、AGN-21 |
    | D17-36 量の上限 | 本契約の範囲外（値 TBD、集計の位置は §9 HO12-AG-09） | — |
    | D17-37 停止 | §2.4。ED-4 の R10 | AGN-26 |

    - 注入された指示で、エージェントが利用者の権限外の資源（他人の予約、他テナントの会議室）を tool の引数に入れても、PDP の R 段は `subject`＝利用者で評価し、テナント照合は L0 で行うので、拒否と不存在は同じ応答になる（AGN-25）[D]。委任権限の内側での不正操作は予防できない残余で、ADR-017 RR17-01 のとおり事業責任者の受容に回す [D]。

    ## 7. 誠実性

    本契約は AI エージェント（Claude）が v1.2 の改訂として、ADR-017・ARC-04 §8・ARC-05・CON-02〜CON-06・CON-14・CON-16・INT-02 と、13_integration-trial/room-booking/report.md（AI による模擬連携検証の記録で、実在の開発チームの検証ではない）を読んで起草した [D]。新たな外部原典は取得していない。規範の記述（RFC 8693・8707・9126・9396・7636・7009 の強度）は ADR-017・CON-05 の脚注と調査ノートの照合結果に依る [D]。作成者以外による独立レビュー・人による照合は未実施で、負例は 1 件も実行していない（CONVENTIONS §8）[D]。機械検証は、改訂者が 2026-10-15 に `npx --yes @redocly/cli@latest lint`（2.64.0、recommended 規則、設定ファイルなし）でエラー 0・警告 2（info.x-lint-notes の 2 件）を確かめ、info.x-pdp-request-example の subject・action・resource が CON-03 の Subject・Action・Resource に、AgentToolDeclaration の例が同スキーマに適合することを jsonschema 4.26.0（Draft 2020-12）で確かめた [M]。生データは改訂者の一時作業領域にだけ置いた。CTO/CISO の決裁を経ていない [D]。

