  x-reason-codes:
    as:
      description: 委任・承認の要求（/par・/authorize・/token）の理由コード。応答は RFC 6749 §5.2（/authorize は redirect の error）の error だけを返し、理由コードは AS の台帳にだけ記録する（CON-05 の R・T と同じ）[D]
      AG01: { error: invalid_client, http: 401, meaning: client 認証の失敗、または提示証明書が登録と不一致 }
      AG02: { error: unauthorized_client, http: 400, meaning: 要求 client が委任用 client（C8d）でない、または委任用 client が client_credentials など許されない grant を要求（ADR-017 D17-09） }
      AG03: { error: invalid_scope, http: 400, meaning: scope の省略・空・全権を表す値（`*` など）・tool 目録にない値 }
      AG04: { error: invalid_target, http: 400, meaning: PAR で resource がない、token 要求で resource が 1 つでない、または委任 grant に含まれない resource }
      AG05: { error: invalid_request, http: 400, meaning: delegation_lifetime が上限を超える、または形式違反（丸めずに拒否） }
      AG06: { error: invalid_scope, http: 400, meaning: 要求 scope がエージェント主体の tool allowlist・操作階層の上限・自律度区分を超える（D17-16 の 3） }
      AG07: { error: access_denied, http: 302, meaning: 利用者のテナントに当該 client のエージェント主体が登録されていない・停止中、または利用者が同意しなかった（D17-07） }
      AG08: { error: invalid_grant, http: 400, meaning: code の再使用・期限切れ、PKCE の検証失敗、code を得た client と token 要求の client（証明書）が異なる }
      AG09: { error: invalid_grant, http: 400, meaning: refresh token による更新が委任 grant の絶対期限を超える、または委任 grant が失効済み }
      AG10: { error: invalid_request, http: 400, meaning: authorization_details を含む要求（ADR-017 L17-5 の決定まで無効） }
      AG11: { error: invalid_authorization_details, http: 400, meaning: （L17-5 の決定後）未知の type、型定義に合わない要素、委任 grant が覆わない tool の承認要求 }
      AG12: { error: invalid_authorization_details, http: 400, meaning: （L17-5 の決定後）+XT の宛先がテナントの送信先 allowlist の外（D17-33） }
      AG13: { error: access_denied, http: 302, meaning: 操作階層・修飾子が求める step-up を利用者が完了しなかった }
      AG14: { error: invalid_request, http: 400, meaning: PKCE の code_challenge_method が S256 でない、または code_challenge がない }
    approval:
      description: 承認 grant の消費（consumeApprovalGrant）の理由コード。応答は RFC 9457 の Problem で code だけを返す [D]
      AP01: { code: unauthenticated, http: 401, meaning: mTLS の SVID が無効、または承認 grant の消費を許された tool サーバーとして登録されていない }
      AP02: { code: not_found, http: 404, meaning: 承認 grant 参照が存在しない・期限切れ }
      AP03: { code: approval_mismatch, http: 403, meaning: tool・資源・action・args_hash のいずれかが承認記録と一致しない（TC-017-03） }
      AP04: { code: approval_mismatch, http: 403, meaning: sub・actor（エージェント主体）・tid が承認記録と一致しない（TC-017-04） }
      AP05: { code: already_consumed, http: 409, meaning: 消費済みの承認 grant（TC-017-04 の replay） }
      AP06: { code: approval_mismatch, http: 403, meaning: 承認を発行した tool サーバー（resource）と消費を要求した tool サーバーが異なる }
      AP07: { code: unavailable, http: 503, meaning: 承認記録の状態ストアに届かない。呼出し側は承認要の呼出しを拒否する（D17-25） }
