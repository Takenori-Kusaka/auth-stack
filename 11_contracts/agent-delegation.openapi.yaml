      - { id: HO12-AG-06, status: 一部済, where: "CON-06 版 0.3.0（(a) examples[2] の説明、(b) act.ptype=ai_agent で scope 必須）。(c) は CON-05・CON-06 の x-open-issues と ADR-026 V12-26-4 の未決" }
      - { id: HO12-AG-07, status: 済, where: "CON-16 版 0.3（§2.5 の actor 行、U-1・U-3、ST-1 の鋳造。v1.2 の改訂）" }
      - { id: HO12-AG-08, status: 済, where: "CON-08 版 0.4.0（agent_principal・delegation_mode・tool_id・approval_id、subject_unmapped、examples の動詞化）" }
      - { id: HO12-AG-09, status: 未反映（範囲外）, where: "04_architecture・DL-20 は同期の範囲外。ADR-017 V12-17-7 に論点として記録" }
      - { id: HO12-AG-10, status: 一部済, where: "CV-062（AGN-12〜AGN-14・AGN-16〜AGN-23・AGN-25）と CON-16 ST-9 は v1.2 の改訂で済。残りの AGN と承認の消費のスタブは DL-120 の受入れ (10)(13)" }
      - { id: HO12-AG-11, status: 未反映（範囲外）, where: "research/standards-status.md は同期の範囲外" }
      - { id: HO12-AG-12, status: 済, where: "INT-02 版 0.10 §3.7.2 の ai_agent 行" }
      - { id: HO12-AG-13, status: 対象外, where: "13_integration-trial の記録は改めない（再試験で扱う）" }
  x-v1.2-design-issues:
    description: v1.2 で判明した論点（設計の穴）。本契約は ADR の決定を変えずに暫定を置いた。ADR-017 の「v1.2 で判明した論点」として追記することを申し送る（宛先の ADR は編集していない）
    items:
      - id: V12-AG-1
        to: ADR-017 D17-13・D17-15、ARC-04 §8.2
        issue: ADR-017・ARC-04 §8.2 はエージェントが tool サーバーへ直接 token を提示する図だが、ADR-005 D1-4・ADR-023 D23-10 では外部 opaque token は edge だけが検証する。依存サービスが tool サーバーの場合、tool サーバーが受け取るのは K3 である（本契約 §2.2）。edge を通らない tool サーバー（単独の RS として公開する MCP server）の位置付けを決める必要がある
      - id: V12-AG-2
        to: ADR-017 D17-21・D17-25、ADR-023 D23-10
        issue: 承認 grant の一回限りの消費を AS の状態ストアで行う（D17-21）と、tool 側 PEP が要求経路で AS を呼ぶことになり、D23-10 の 1 と食い違う。選択肢は (a) 承認要の呼出しに限り D23-10 の例外とする（本契約の暫定）、(b) 承認記録を tool サーバー宛ての署名付き形式で渡し、消費（jti の記録）を tool サーバー自身の状態ストアで行う、(c) edge が消費する
      - id: V12-AG-3
        to: ADR-017 D17-21、L17-5
        issue: D17-21 は承認 grant を cnf でエージェントの鍵に束縛するとするが、tool サーバーは edge の後ろにありエージェントの鍵を見られない。本契約は承認記録に発行先のエージェント主体を記録し、K3 の act.sub と照合して代えた。あわせて、操作内容を token の claim に載せず AS の記録に置く形は、L17-5 の (a)(b) と別の選択肢 (c) として検討に値する
      - id: V12-AG-4
        to: ADR-017 D17-07 (b)
        issue: tid 一致検査の 3 者のうち「提示された SVID の主体が登録されたテナント」は、edge の後ろの tool サーバーでは検査できない。本契約は edge で検査する（ED-2）とした。D17-07 (b) の検査位置の記述を改める必要がある
      - id: V12-AG-5
        to: ADR-017 D17-16、L17-3
        issue: 条件 3（エージェント主体ごとの上限）は L17-3 が決まるまで実行時に評価する位置がない。本契約は発行時の絞込みと AD-05 で代え、上限を下げる操作で委任 grant を失効させるとした。上限の変更から反映までの時間が委任 grant の失効の反映時間に依存する
      - id: V12-AG-6
        to: ADR-017 D17-50、ARC-05 §16 の未決 7、ADR-021
        issue: 委任の actor としての ai_agent に AuthZEN の型が要る。本契約は core/workload＋principal_type＝ai_agent を暫定にした（§5）。独立の core 型にするなら、本契約の破壊的変更になる
paths:
  /par:
    post:
      operationId: pushAuthorizationRequest
      tags: [agent-delegation]
      summary: 委任または承認の要求を AS に送る（RFC 9126 PAR）
      x-freeze-class: preview
      x-requirements: [R-029, R-209, G-102]
      description: |
        v1.2。エージェントの委任用 client が、委任の要求（tool・resource・期限）または承認の要求（`authorization_details`）を PAR で AS に送る [D]（ADR-017 D17-21 は承認の要求を PAR で送るとする）。委任用 client には `require_pushed_authorization_requests` を課し、PAR を経ない `/authorize` を受け付けない [D]。

        - 委任の要求: `scope` に tool 目録の tool ID を空白区切りで入れる。全権を表す値・省略は AG03 で拒否する（ADR-017 D17-17）[D]。`resource` に tool サーバーの resource 識別子を 1 つ以上入れる（RFC 8707）[D]。
        - 承認の要求: 対象の委任 grant の scope に含まれる tool について、`authorization_details` に type `agent_tool_call` の要素をちょうど 1 つ入れる [D]。ADR-017 L17-5 の決定まで AG10 で拒否する [D]。
        - client 認証は mTLS（第一者 PC-16 はエージェント主体の X.509-SVID、第三者 PC-15 は登録した証明書）か private_key_jwt とし、共有秘密は使わない（ADR-017 D17-44、ADR-009 D09-18）[D]。
      security:
        - agentClientMtls: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - $ref: '#/components/schemas/DelegationAuthorizationRequest'
                - $ref: '#/components/schemas/ApprovalAuthorizationRequest'
            examples:
              delegateRoomBooking:
                summary: 正例。会議室の代理予約のための委任（tool 2 つ、期限 2 時間）
                value:
                  response_type: code
                  client_id: mfzgk3dbnrxw2zlsmvzxi2lonr
                  redirect_uri: https://agent.example.com/oauth/callback
                  scope: rsv.book rsv.view
                  resource: https://svc.id-domain.example/s/r7sv2kq4
                  code_challenge: 7yS2mXk4zHqRbWnC0aV1pLdT9uFeJ3gQ6oIw8rNs5Yc
                  code_challenge_method: S256
                  state: k2n7q4w9x3m8
                  delegation_lifetime: 7200
                  agent_task_ref: znpazxoyw7qcxcvtjppgoem4nq
      responses:
        '201':
          description: 受付（RFC 9126 の応答）。`request_uri` は一回限りで短命
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushedAuthorizationResponse'
              examples:
                accepted:
                  value:
                    request_uri: urn:ietf:params:oauth:request_uri:cjtw2w6gs4n7lks6wjkmrxe7b3
                    expires_in: 60
        '400':
          $ref: '#/components/responses/OAuthError400'
        '401':
          $ref: '#/components/responses/OAuthError401'
        '503':
          $ref: '#/components/responses/Unavailable503'
  /authorize:
    get:
      operationId: authorizeAgentDelegation
      tags: [agent-delegation]
      summary: 利用者が AS の画面で委任または承認に同意する（step-up を含む）
      x-freeze-class: preview
      description: |
        v1.2。利用者のブラウザが PAR の `request_uri` で AS の認可画面を開く [D]。AS は利用者を認証し、要求した tool のうち最も高い操作階層・修飾子が求める保証（DL-09 の AAL・フィッシング耐性。+FIN は PR step-up）を満たすまで step-up を求める（ADR-017 D17-22）[D]。

        - 同意画面に、エージェント（定義名・所有者）、tool、resource、期限、承認の要求なら操作内容（対象・宛先・金額）を AS が表示する（ADR-017 D17-38 の既定案）[D]。エージェントの UI での確認は同意に数えない（D17-23）[D]。
        - 利用者のテナントに要求 client のエージェント主体が登録されていなければ、同意画面を出さずに `access_denied` で返す（AG07。D17-07）[D]。
        - 応答は redirect_uri への 302 で、`code`・`state`・`iss` を付ける。`iss` は MCP 接続条件（ADR-017 D17-27 の RFC 9207）と同じ扱いにする [D]。
      security: []
      parameters:
        - name: client_id
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/OpaqueId'
        - name: request_uri
          in: query
          required: true
          schema:
            type: string
            pattern: '^urn:ietf:params:oauth:request_uri:[A-Za-z0-9_-]{1,64}$'
      responses:
        '200':
          description: 認可画面（ログイン、step-up、同意画面）。同意・拒否の操作の後に 302 で redirect_uri へ戻す
          content:
            text/html:
              schema:
                type: string
        '302':
          description: redirect_uri へ戻す。成功時は `code`・`state`・`iss`、拒否時は `error`（access_denied など）・`state`・`iss`
          headers:
            Location:
              description: redirect_uri に応答パラメータを付けた URL
              schema:
                type: string
                format: uri
        '400':
          description: client_id・request_uri が無効（期限切れ・再使用・他 client のもの）。redirect_uri へは戻さず、利用者に AS の画面でエラーを示す（RFC 6749 §4.1.2.1 の扱い。CON-14 §5A と同じ）
          content:
            text/html:
              schema:
                type: string
  /token:
    post:
      operationId: requestAgentToken
      tags: [agent-delegation]
      summary: 代理 token（tool サーバー宛ての外部 AT）または承認 grant を得る
      x-freeze-class: preview
      description: |
        v1.2。エージェントの委任用 client が code（または refresh token）を代理 token に交換する [D]。

        - `resource` はちょうど 1 つで、委任 grant に含まれる tool サーバーであること（AG04。ADR-017 D17-15）[D]。
        - 発行する外部 AT は opaque で、`aud`＝`resource`、エージェントの証明書に束縛（cnf）、scope ⊆ 委任 grant の scope ∩ エージェント主体の上限（AG06）である [D]。
        - refresh token は confidential client に限り発行し、委任 grant の絶対期限を超えて更新しない（AG09。ADR-017 D17-43）[D]。refresh token と `resource` で、同じ委任 grant に含まれる別の tool サーバー宛ての AT を得てよい [D]。
        - 承認の要求で得た code を交換した場合、`access_token` に承認 grant 参照を入れ、`token_type` を `N_A`（access token として使えない）とし、承認した `authorization_details` を返す（L17-5 の決定まで、承認の code は発行されない）[D]。
        - 委任用 client の client_credentials grant は AG02 で拒否する（ADR-017 D17-09、AGN-10）[D]。
        - 成功応答には `Cache-Control: no-store` を付ける [D]（CON-05 と同じ）。
      security:
        - agentClientMtls: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - $ref: '#/components/schemas/AuthorizationCodeTokenRequest'
                - $ref: '#/components/schemas/RefreshTokenRequest'
            examples:
              codeForRoomBooking:
                summary: 正例。code を会議室予約サービス宛ての代理 token に交換
                value:
                  grant_type: authorization_code
                  code: jlvcpktsyfcbmv35zs7c2qoyo6
                  code_verifier: dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXkdBjftJeZ4CVP
                  redirect_uri: https://agent.example.com/oauth/callback
                  resource: https://svc.id-domain.example/s/r7sv2kq4
      responses:
        '200':
          description: 発行成功
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AgentAccessTokenResponse'
                  - $ref: '#/components/schemas/ApprovalGrantResponse'
              examples:
                delegatedToken:
                  summary: 正例。会議室予約サービス宛ての代理 token（opaque）
                  value:
                    access_token: opq_7q3dspmctugmv3qn6t7l5hsusx
                    token_type: Bearer
                    expires_in: 300
                    scope: rsv.book rsv.view
                    refresh_token: rt_lnbxquat7sdwkxlbmhroa25v66
                    delegation_expires_at: 1792062000
        '400':
          $ref: '#/components/responses/OAuthError400'
        '401':
          $ref: '#/components/responses/OAuthError401'
        '503':
          $ref: '#/components/responses/Unavailable503'
  /revoke:
    post:
      operationId: revokeAgentToken
      tags: [agent-delegation]
      summary: エージェントが委任を終える（RFC 7009）
      x-freeze-class: preview
      description: |
        v1.2。タスクを終えたエージェントは refresh token を送って委任 grant ごと失効させる [D]。access token を送った場合はその token だけを失効させる [D]。失効は ADR-006 の失効状態に `gref` として載り、STS の exchange は R10 で拒否する（ED-4）[D]。
      security:
        - agentClientMtls: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RevocationRequest'
            examples:
              endTask:
                value:
                  token: rt_lnbxquat7sdwkxlbmhroa25v66
                  token_type_hint: refresh_token
      responses:
        '200':
          description: 受付（未知の token でも 200 を返す）
        '400':
          $ref: '#/components/responses/OAuthError400'
        '401':
          $ref: '#/components/responses/OAuthError401'
  /delegation-grants:
    get:
      operationId: listDelegationGrants
      tags: [delegation-management]
      summary: 利用者が自分の委任を一覧する
      x-freeze-class: preview
      description: |
        v1.2。第一者 BFF が、利用者の session に基づく AS 管理用 token で呼ぶ（呼出し元認証の詳細は x-open-issues）[D]。返すのは token の主体（利用者）が与えた委任だけで、他の利用者の委任は返さない [D]。
      security:
        - asManagementToken: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, expired, revoked]
      responses:
        '200':
          description: 委任の一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DelegationGrantList'
              examples:
                oneActive:
                  value:
                    items:
                      - grant_id: onsxe5tjmnswg33oonsw45dhoj
                        agent_principal: gxy2qrzzqwzzbjn74jrotdu6vv
                        agent_definition_name: 社内アシスタント
                        client_id: mfzgk3dbnrxw2zlsmvzxi2lonr
                        tid: ozxw4zltnfzgk3dfnzqxi2lpny
                        scope: rsv.book rsv.view
                        resources: [https://svc.id-domain.example/s/r7sv2kq4]
                        status: active
                        created_at: 1792054800
                        expires_at: 1792062000
        '401':
          $ref: '#/components/responses/Problem401'
        '503':
          $ref: '#/components/responses/ProblemUnavailable503'
  /delegation-grants/{grant_id}:
    parameters:
      - name: grant_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/OpaqueId'
    delete:
      operationId: revokeDelegationGrant
      tags: [delegation-management]
      summary: 利用者が委任を取り消す
      x-freeze-class: preview
      description: |
        v1.2。利用者（または第一者 BFF が利用者の操作として）委任 grant を取り消す [D]。取り消した委任から発行された refresh token は無効になり、`gref` は ADR-006 の失効状態に載る [D]。他の利用者の grant_id には 404 を返し、存在を示さない（AGN-28）[D]。
      security:
        - asManagementToken: []
      responses:
        '204':
          description: 取消済み（既に失効していても 204）
        '401':
          $ref: '#/components/responses/Problem401'
        '404':
          $ref: '#/components/responses/Problem404'
        '503':
          $ref: '#/components/responses/ProblemUnavailable503'
  /approval-grants/consume:
    post:
      operationId: consumeApprovalGrant
      tags: [approval]
      summary: tool 側 PEP が承認 grant を照合して一回限りで消費する
      x-freeze-class: preview（ADR-017 L17-5 の決定まで無効）
      servers:
        - url: https://as-approval.{cell}.id-domain.example
          description: cell 内の承認記録の状態ストア（仮置き。URL は配置スナップショットで配布し凍結しない）。ADR-023 D23-10 との食い違いは x-v1.2-design-issues V12-AG-2
          variables:
            cell:
              default: cell-opaque-code
      description: |
        v1.2。tool 側 PEP が `Agent-Approval` ヘッダで受け取った承認 grant 参照と、実際の呼出しから得た値（tool、資源、action、`args_hash`、K3 の `sub`・`act.sub`・`tid`、K5 の `txn`）を送る [D]。AS は承認記録と照合し、すべて一致して未使用なら原子的に消費して 200 を返す（ADR-017 D17-21）[D]。

        - 不一致・消費済み・期限切れは拒否し、理由コードは台帳にだけ記録する（AP02〜AP06）[D]。
        - 届かない・503 のとき、tool 側 PEP は承認要の呼出しを拒否する（grace なし。AP07、D17-25）[D]。
        - L17-5 の決定までは承認 grant が発行されないので、本操作は呼ばれない [D]。
      security:
        - svidMtls: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalConsumeRequest'
            examples:
              consumeForBooking:
                summary: 例示。目録で承認要と宣言した tool（予約）の承認 grant を消費
                value:
                  approval_grant_ref: d5ugjg4oivltah6rqjoxxdnoex
                  tool_id: rsv.book
                  resource:
                    type: rsv/room
                    id: k4mz7qx2wd3ra5np6tc2hvy7be
                  action: book
                  args_hash: zrDRmlTufTK_fEwF96uvV7963seILnFP6lLo4xbSomc
                  sub: mfrggzdfmztwq2lknnwg23tpob
                  actor_sub: gxy2qrzzqwzzbjn74jrotdu6vv
                  tid: ozxw4zltnfzgk3dfnzqxi2lpny
                  txn: 7q3dspmctugmv3qn6t7l5hsusx
      responses:
        '200':
          description: 照合が一致し消費した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalConsumeResult'
              examples:
                consumed:
                  value:
                    result: consumed
                    approval_id: lnbxquat7sdwkxlbmhroa25v66
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          $ref: '#/components/responses/Problem409'
        '503':
          $ref: '#/components/responses/ProblemUnavailable503'
servers:
  - url: https://as.id-domain.example
    description: AS（外部向け）。ホスト名は仮置き（`<id-domain>` は ADR-021 の名前空間で未確定）。実際の URL は discovery と配置スナップショットで配布し、凍結しない（ADR-022 D-2）
tags:
  - name: agent-delegation
    description: v1.2。委任の要求・同意・代理 token の取得・終了（preview）
  - name: delegation-management
    description: v1.2。利用者による委任の一覧と取消（preview）
  - name: approval
    description: v1.2。承認 grant の消費（preview。ADR-017 L17-5 の決定まで無効）
components:
  securitySchemes:
    agentClientMtls:
      type: mutualTLS
      description: |
        エージェントの委任用 client の認証。第一者のエージェント（PC-16）はエージェント主体の X.509-SVID による mTLS（tls_client_auth、SAN URI 照合）、第三者（PC-15）は登録した証明書による mTLS か private_key_jwt（ES256 か PS256）[D]（ADR-017 D17-44、CON-14 §3）。発行する token は提示証明書に束縛する。共有秘密は使わない（ADR-009 D09-18）[D]。
    svidMtls:
      type: mutualTLS
      description: tool サーバー（依存サービス）の X.509-SVID による mTLS（CON-05 と同じ）。承認 grant の消費を許すのは、承認を要する tool を tool 目録に登録した tool サーバーだけ（AP01）[D]
    asManagementToken:
      type: http
      scheme: bearer
      description: 第一者 BFF（CON-14 C1）が利用者の session に基づいて得た AS 管理用の token。発行経路と scope 名は x-open-issues（委任の管理 API の呼出し元認証）[D]
  headers:
    CacheControlNoStore:
      description: no-store（token・request_uri を含む応答）
      schema:
        type: string
        const: no-store
  responses:
    OAuthError400:
      description: 要求の拒否（RFC 6749 §5.2 の形式）。理由コード（info.x-reason-codes.as）は応答に入れず台帳にだけ記録する [D]
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OAuthErrorResponse'
          examples:
            invalidScope:
              summary: AG03・AG06
              value:
                error: invalid_scope
            invalidTarget:
              summary: AG04
              value:
                error: invalid_target
            invalidRequest:
              summary: AG05・AG10・AG14
              value:
                error: invalid_request
            unauthorizedClient:
              summary: AG02
              value:
                error: unauthorized_client
            invalidGrant:
              summary: AG08・AG09
              value:
                error: invalid_grant
    OAuthError401:
      description: client 認証の失敗（AG01）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OAuthErrorResponse'
          examples:
            invalidClient:
              value:
                error: invalid_client
    Unavailable503:
      description: AS に届かない・過負荷。エージェントは Retry-After を守って再試行し、未署名の代替経路を作らない（ADR-013 D13-15・D13-23）[D]
      headers:
        Retry-After:
          description: 再試行までの秒数
          schema:
            type: integer
            minimum: 0
    Problem401:
      description: 呼出し元の認証の失敗（RFC 9457 Problem）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unauthenticated:
              value:
                type: about:blank
                status: 401
                code: unauthenticated
    Problem403:
      description: 承認記録との不一致（AP03・AP04・AP06）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            mismatch:
              value:
                type: about:blank
                status: 403
                code: approval_mismatch
    Problem404:
      description: 存在しない・期限切れ・他の利用者のもの（存在を示さない）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            notFound:
              value:
                type: about:blank
                status: 404
                code: not_found
    Problem409:
      description: 消費済みの承認 grant（AP05）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            consumed:
              value:
                type: about:blank
                status: 409
                code: already_consumed
    ProblemUnavailable503:
      description: 届かない・過負荷（AP07 など）。承認の消費なら、呼出し側は承認要の呼出しを拒否する（D17-25）
      headers:
        Retry-After:
          description: 再試行までの秒数
          schema:
            type: integer
            minimum: 0
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unavailable:
              value:
                type: about:blank
                status: 503
                code: unavailable
  schemas:
    OpaqueId:
      description: 基盤が払い出す不透明識別子（受信側の形は CON-02 OpaqueId。印字可能 ASCII 1〜64 文字。解析しない）
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[\x21-\x7E]{1,64}$'
    TenantId:
      description: テナント識別子（CON-02 TenantId と同じ受信側の形）
      $ref: '#/components/schemas/OpaqueId'
    ToolId:
      description: tool 目録の tool ID（scope の値として使う）。命名規則は tool 目録の契約（§9 HO12-AG-05、CON-04）で確定する。本契約は RFC 6749 の scope-token の文字集合だけを課す
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[\x21\x23-\x5B\x5D-\x7E]+$'
      not:
        const: '*'
    ScopeList:
      description: 空白区切りの ToolId の列。空・`*`・全権を表す値を含まない（AG03）
      type: string
      minLength: 1
      maxLength: 2048
      pattern: '^[\x21\x23-\x29\x2B-\x5B\x5D-\x7E]+( [\x21\x23-\x29\x2B-\x5B\x5D-\x7E]+)*$'
    ResourceIndicator:
      description: tool サーバーの resource 識別子（RFC 8707。絶対 URI、fragment なし）
      type: string
      format: uri
      pattern: '^https://[^#]+$'
      maxLength: 512
    Base64urlSha256:
      description: SHA-256 の base64url（padding なし、43 文字）
      type: string
      pattern: '^[A-Za-z0-9_-]{43}$'
    NumericDate:
      type: integer
      minimum: 0
    DelegationAuthorizationRequest:
      type: object
      description: v1.2。委任の要求（PAR の本文）。authorization_details を含めない
      required: [response_type, client_id, redirect_uri, scope, resource, code_challenge, code_challenge_method]
      properties:
        response_type:
          type: string
          const: code
        client_id:
          $ref: '#/components/schemas/OpaqueId'
        redirect_uri:
          type: string
          format: uri
          pattern: '^https://'
        scope:
          $ref: '#/components/schemas/ScopeList'
        resource:
          description: tool サーバーの resource 識別子。複数の場合は form の同名パラメータを繰り返す
          oneOf:
            - $ref: '#/components/schemas/ResourceIndicator'
            - type: array
              minItems: 1
              maxItems: 8
              items:
                $ref: '#/components/schemas/ResourceIndicator'
        code_challenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
        code_challenge_method:
          type: string
          const: S256
        state:
          type: string
          maxLength: 256
        delegation_lifetime:
          description: 委任 grant の絶対寿命の希望（秒）。上限（info.x-profile）を超えれば拒否（AG05）。省略時は上限
          type: integer
          minimum: 60
        agent_task_ref:
          description: エージェント側のタスクの参照（監査の相関用。判定に使わない）
          $ref: '#/components/schemas/OpaqueId'
        authorization_details:
          description: 委任の要求では送らない
          not: {}
    AgentToolCallDetail:
      type: object
      description: v1.2。承認の要求の操作内容（RFC 9396 の authorization_details の要素。type は agent_tool_call）。L17-5 の決定まで受け付けない
      required: [type, tool_id, resource, action, args_hash]
      properties:
        type:
          type: string
          const: agent_tool_call
        tool_id:
          $ref: '#/components/schemas/ToolId'
        resource:
          type: object
          required: [type, id]
          properties:
            type:
              type: string
              minLength: 1
              maxLength: 128
            id:
              type: string
              minLength: 1
              maxLength: 256
        action:
          type: string
          minLength: 1
          maxLength: 128
        args_hash:
          $ref: '#/components/schemas/Base64urlSha256'
        display:
          description: AS が同意画面に表示する操作内容（宛先・金額・対象）。AS は表示した値から args_hash を再計算して一致を確かめる。エージェントが与えた説明文は表示しない
          type: object
          additionalProperties:
            type: [string, number, integer, boolean]
    ApprovalAuthorizationRequest:
      type: object
      description: v1.2。承認の要求（PAR の本文）。ADR-017 L17-5 の決定まで AG10 で拒否する
      required: [response_type, client_id, redirect_uri, code_challenge, code_challenge_method, authorization_details, delegation_grant_ref]
      properties:
        response_type:
          type: string
          const: code
        client_id:
          $ref: '#/components/schemas/OpaqueId'
        redirect_uri:
          type: string
          format: uri
          pattern: '^https://'
        code_challenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
        code_challenge_method:
          type: string
          const: S256
        state:
          type: string
          maxLength: 256
        delegation_grant_ref:
          description: 承認の対象となる tool を含む委任 grant の参照（委任の token 応答で得た値ではなく、AS が refresh token から引く。エージェントは自分の委任 grant だけを指定できる）
          $ref: '#/components/schemas/OpaqueId'
        authorization_details:
          description: JSON 配列を文字列化した値（RFC 9396）。要素は AgentToolCallDetail をちょうど 1 つ
          type: string
          contentMediaType: application/json
          contentSchema:
            type: array
            minItems: 1
            maxItems: 1
            items:
              $ref: '#/components/schemas/AgentToolCallDetail'
    PushedAuthorizationResponse:
      type: object
      required: [request_uri, expires_in]
      properties:
        request_uri:
          type: string
          pattern: '^urn:ietf:params:oauth:request_uri:[A-Za-z0-9_-]{1,64}$'
        expires_in:
          type: integer
          minimum: 1
    AuthorizationCodeTokenRequest:
      type: object
      required: [grant_type, code, code_verifier, redirect_uri, resource]
      properties:
        grant_type:
          type: string
          const: authorization_code
        code:
          type: string
          minLength: 1
          maxLength: 256
        code_verifier:
          type: string
          pattern: '^[A-Za-z0-9._~-]{43,128}$'
        redirect_uri:
          type: string
          format: uri
        resource:
          description: ちょうど 1 つ（AG04）。承認の code の交換では委任 grant の tool サーバー
          $ref: '#/components/schemas/ResourceIndicator'
        scope:
          description: 省略時は委任 grant の scope のうち resource が提供する tool
          $ref: '#/components/schemas/ScopeList'
    RefreshTokenRequest:
      type: object
      required: [grant_type, refresh_token, resource]
      properties:
        grant_type:
          type: string
          const: refresh_token
        refresh_token:
          type: string
          minLength: 1
          maxLength: 512
        resource:
          $ref: '#/components/schemas/ResourceIndicator'
        scope:
          $ref: '#/components/schemas/ScopeList'
    AgentAccessTokenResponse:
      type: object
      description: v1.2。代理 token の応答。access_token は opaque（edge だけが検証する）
      required: [access_token, token_type, expires_in, scope, delegation_expires_at]
      properties:
        access_token:
          type: string
          minLength: 1
          maxLength: 512
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          minimum: 1
        scope:
          $ref: '#/components/schemas/ScopeList'
        refresh_token:
          type: string
          minLength: 1
          maxLength: 512
        delegation_expires_at:
          description: 委任 grant の絶対期限（NumericDate）。エージェントはこの時刻以後に更新を試みない
          $ref: '#/components/schemas/NumericDate'
    ApprovalGrantResponse:
      type: object
      description: v1.2。承認の code の交換結果。access_token は承認 grant 参照で、access token として使えない（token_type=N_A）。L17-5 の決定まで発行しない
      required: [access_token, token_type, expires_in, authorization_details]
      properties:
        access_token:
          $ref: '#/components/schemas/OpaqueId'
        token_type:
          type: string
          const: N_A
        expires_in:
          type: integer
          minimum: 1
          maximum: 300
        authorization_details:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: '#/components/schemas/AgentToolCallDetail'
    RevocationRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 512
        token_type_hint:
          type: string
          enum: [refresh_token, access_token]
    OAuthErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [invalid_request, invalid_client, invalid_grant, unauthorized_client, unsupported_grant_type, invalid_scope, invalid_target, invalid_authorization_details, access_denied]
        error_description:
          description: 理由コード・登録内容を推測させる文を入れない（CON-05 §2 の 5 と同じ）
          type: string
          maxLength: 256
    DelegationGrant:
      type: object
      required: [grant_id, agent_principal, client_id, tid, scope, resources, status, created_at, expires_at]
      properties:
        grant_id:
          $ref: '#/components/schemas/OpaqueId'
        agent_principal:
          $ref: '#/components/schemas/OpaqueId'
        agent_definition_name:
          type: string
          maxLength: 128
        client_id:
          $ref: '#/components/schemas/OpaqueId'
        tid:
          $ref: '#/components/schemas/TenantId'
        scope:
          $ref: '#/components/schemas/ScopeList'
        resources:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ResourceIndicator'
        status:
          type: string
          enum: [active, expired, revoked]
        created_at:
          $ref: '#/components/schemas/NumericDate'
        expires_at:
          $ref: '#/components/schemas/NumericDate'
    DelegationGrantList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DelegationGrant'
    ApprovalConsumeRequest:
      type: object
      additionalProperties: false
      required: [approval_grant_ref, tool_id, resource, action, args_hash, sub, actor_sub, tid]
      properties:
        approval_grant_ref:
          $ref: '#/components/schemas/OpaqueId'
        tool_id:
          $ref: '#/components/schemas/ToolId'
        resource:
          type: object
          required: [type, id]
          properties:
            type:
              type: string
              minLength: 1
              maxLength: 128
            id:
              type: string
              minLength: 1
              maxLength: 256
        action:
          type: string
          minLength: 1
          maxLength: 128
        args_hash:
          description: tool 側 PEP が実際の呼出しの引数から計算した値（エージェントの申告値を使わない。AD-10）
          $ref: '#/components/schemas/Base64urlSha256'
        sub:
          description: K3 の sub（委任元の利用者）
          $ref: '#/components/schemas/OpaqueId'
        actor_sub:
          description: K3 の最外 act.sub（エージェント主体）
          $ref: '#/components/schemas/OpaqueId'
        tid:
          $ref: '#/components/schemas/TenantId'
        txn:
          description: K5 の txn（相関用。判定に使わない）
          $ref: '#/components/schemas/OpaqueId'
    ApprovalConsumeResult:
      type: object
      required: [result, approval_id]
      properties:
        result:
          type: string
          const: consumed
        approval_id:
          description: 監査に記録する承認 grant の ID（参照そのものではない。AD-12）
          $ref: '#/components/schemas/OpaqueId'
    Problem:
      type: object
      description: RFC 9457 の Problem（CON-02 Problem の採用範囲。§9 への申し送りは CON-05 HO-02 と同じ扱い）。code だけを返し、理由コード・識別子を含めない
      required: [type, status, code]
      properties:
        type:
          type: string
        status:
          type: integer
        code:
          type: string
          enum: [unauthenticated, not_found, approval_mismatch, already_consumed, unavailable, approval_required]
    AgentToolDeclaration:
      type: object
      description: |
        v1.2。entry point 台帳で entry point ごとに宣言する、エージェント経由の呼出しの許可（AD-03）。tool 目録（ADR-017 D17-14）の写しであり、正本は CAM の permission catalog（CON-04 への申し送り。§9 HO12-AG-05 の (c) と合わせて決める）。宣言のない entry point は act.ptype=ai_agent の要求を拒否する
      additionalProperties: false
      required: [tool_id, tool_scope, tier, approval]
      properties:
        tool_id:
          $ref: '#/components/schemas/ToolId'
        tool_scope:
          description: AD-05 で K3 の scope に含まれることを確かめる値（v0 では tool_id と同じ値）
          $ref: '#/components/schemas/ToolId'
        tier:
          description: 操作階層（CON-02 OperationTier の表記）
          type: string
          enum: [read-sensitive, write, privileged/T, privileged/P]
        modifiers:
          type: array
          items:
            type: string
            enum: [+FIN, +XT, +SEC, +REG]
        approval:
          description: required なら AD-07。+FIN・+XT・privileged は宣言にかかわらず required として扱う
          type: string
          enum: [none, required]
        approval_bound_args:
          description: 承認に束縛する引数名（args_hash の対象）
          type: array
          items:
            type: string
      examples:
        - tool_id: rsv.book
          tool_scope: rsv.book
          tier: write
          approval: none
          approval_bound_args: [start, end, attendee_count]
