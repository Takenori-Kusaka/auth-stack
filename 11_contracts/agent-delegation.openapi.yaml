        to: 11_contracts/README.md（CON-00）、traceability/deliverables.md
        content: 本契約を契約一覧・早見表（「AI エージェントに代理させる → 本ファイル、Prism（承認の消費は自前スタブ）」）・ファイル構成に登録し、文書ID（仮番 CON-18）と DL（仮番 DL-124）を確定する。CON-17・DL-123 は同じ v1.2 で新設の external-grant.openapi.yaml が仮番として使っている。SHA-256 を §2.1 に載せ、§2.3 の検査結果に本契約の lint を加える
