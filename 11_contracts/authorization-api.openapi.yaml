servers:
  - url: https://{cell}.pdp.{idDomain}
    description: cell ごとの PDP façade（ADR-011 D5-3、ADR-013）。ホスト名の規則は未決（ADR-021 D21-28 の自社所有ドメイン修飾に従う）。
    variables:
      cell:
        default: cell-placeholder
        description: cell の識別子（cell 名をテナント識別子に埋め込まない。ADR-021 D21-36）。
      idDomain:
        default: id-domain.invalid
