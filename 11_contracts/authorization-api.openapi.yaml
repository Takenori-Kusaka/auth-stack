  /access/v1/evaluations:
    post:
      tags: [evaluation]
      operationId: evaluateAccessBatch
      summary: 複数の認可判定（AuthZEN 1.0 §7）
      description: |
        AuthZEN 1.0 §7 の Access Evaluations [N]。上位の subject・action・resource・context は各要素の既定値になる（§7.1.1）[N]。
        `options.evaluations_semantic` は `execute_all`（既定）・`deny_on_first_deny`・`permit_on_first_permit` [N]。
        PEP SDK の「全て必要」は `deny_on_first_deny`、「いずれか」は `permit_on_first_permit` に固定し、一覧の後段 Check は `execute_all` を使う（ADR-011 D3-7）[D]。
        `permit_on_first_permit` を privileged 以上の操作（permission catalog の操作階層）に使った要求は、要求全体を 400 で拒否する（ADR-011 D3-7 の実施方法として本契約が定める）[D]。
        応答の上位 `decision` は返さない（AuthZEN の RECOMMENDED）[N]。上位の `context.x-authz-profile.batch_decision_id` は一覧 1 回の判定記録の主キーに使う（ADR-025 D25-18）[D]。
        v1.1（I-1、P-01）: 応答の `evaluations` は要求の `evaluations` と同じ件数・同じ順序で返す（AuthZEN §7.2）[N]。PEP は件数の不一致を「判定が得られない」として扱う [D]。汎用モックは要求の件数を見ずに静的な例を返すので、要求件数ごとに対になる例を置いた（下表）。モックでは `Prefer: example=<応答例>` で件数の合う例を選ぶか、要求件数に合わせて応答を組み直す echo proxy（CON-11 の kit。§12 N-2）を前に置く。件数が 4 以上の正例は例ではなく proxy で作る。PEP の件数検査を外して合わせない [D]。

        | 要求件数 | 要求例 | 応答例 | 内容 |
        |---|---|---|---|
        | 1 | `postCheckOne` | `oneItem` | 許可 1 件 |
        | 2 | `postCheck` | `mixed`（先頭。既定） | 許可 1 件、資源なし 1 件 |
        | 3 | `postCheckThree` | `threeItems` | 許可 2 件、関係なし 1 件 |

        v1.1 の同期（CON-11 §14.3 H11-1 (2)）: 対の例がない件数（4 件以上、または例と異なる組合せ）を汎用モックで確かめるときは、`11_contracts/kit/echo-proxy.js` の規則 R5（応答の件数を要求の件数に合わせる）をモックの前に置く。件数の連動は AuthZEN §7.2 による契約の振舞いであり、モックの例の件数ではない [D]。

        一覧の後段 Check は `execute_all` の fully_consistent で呼ぶので、許可要素の実効モードは例でも fully_consistent にした（v1.0 は minimize_latency で、格下げとして fail-closed になった）[D]。
      x-maturity: GA
      x-authzen-section: "§7"
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/TxnToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
