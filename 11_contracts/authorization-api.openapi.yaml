  /access/v1/search/resource:
    post:
      tags: [search]
      operationId: searchResources
      summary: Resource Search（AuthZEN 1.0 §8.5。preview・SDK 一覧ヘルパ内部専用）
      description: |
        AuthZEN 1.0 §8.5 の Resource Search [N]。`resource` は `type` だけを持ち、`id` は SHOULD で省略され、含まれていても MUST で無視される [N]。
        **呼出し制限**: SDK の一覧ヘルパ以外の呼出しは CI 検査と façade の受付制御で拒否する（ADR-025 D25-03）[D]。v1.1（I-6）の同期（INT-02 §9.2 HO11-3 (a)）: PEP 配置 PP-2（契約適合の自前実装。SDK を使わない）は本 operation を呼べない。一覧の候補生成は INT-02 §3.8 の方式（L2・L3）による。façade は mTLS の workload ID で呼出し元を認証するだけで、同じ workload の中の SDK とアプリコードを区別できないので、PP-2 の呼出しの禁止は façade では強制できず、INT-02 §3.8.3 の NP09-4a（アプリコードの静的検査）・NP09-4b（申告）・NP09-4c（監査の照合）で確かめる [D]。汎用モックは本 operation に 200 を返すので、モックで呼べたことは呼んでよいことを意味しない（CON-11 の汎用モックの制約）[D]。受付制御の方式（workload ID の許可リスト等）は未決（ADR-025）で、許可されない呼出し元には 403 を返す [D]。
        **結果は認可の根拠にならない**: 返す前に各資源を evaluations（`execute_all`）で後段 Check する（ADR-025 D25-04、ADR-022 D-2-2）[D]。
        **件数**: `page.total` は返さない。`page.count` はこの応答の件数だけを表す（ADR-025 D25-13）[D]。
        **打切り**: engine の列挙が上限・制限時間に達した場合は `context.x-authz-profile.completeness` に `incomplete` と理由を返し、「完全」と返さない（ADR-025 D25-07）[D]。
        **ページング**: 原子的スナップショットを保証しない（重複・欠落があり得る）[N]。続きのページは最初の要求と同一のパラメータで要求する（MUST）[N]。`page.token` は主体・テナント・条件・model revision に束縛される（ADR-025 D25-15）[D]。
        **結果の型（v1.1（P-20））**: façade は `results` の各要素の `type` を要求の `resource.type` と同じ値にする。AuthZEN §8.5.1 の要求は `resource.type` を必須とする [N]。返す要素の型が要求の型と一致することは本 profile が課す契約である [D]。一覧ヘルパは `type` の異なる要素を候補から除き、契約違反として記録する。除いた後の候補だけを後段 Check にかける。違反を理由に一覧全体を失敗させるかは一覧ヘルパの fail-mode（DL-19）に従う [D]。
        **汎用モックの制約（v1.1（P-20））**: 汎用モック（Prism）は要求の `resource.type` を見ずに静的な例（`docs/document`）を返す。自ドメインの型（例 `expense/report`）で検索した結果に `docs/document` が返るのはモックの制約であり、契約の振舞いではない。モックで自ドメインの型の正例を確かめるときは、`results[].type` を要求の型に書き換える echo proxy（CON-11 の kit。§12 N-2）を前に置く。型の検査を外して合わせない [D]。応答例 `truncated`・`lastPage` は要求例 `firstPage`（`docs/document`）への応答である [D]。
      x-maturity: preview
      x-authzen-section: "§8.5"
      x-callers: PEP SDK の一覧ヘルパ（ADR-011 D5-2）だけ
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/TxnToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceSearchRequest"
            x-negative-examples:
              description: スキーマに違反する負例（DL-80 の契約試験で 400 を確かめる）。
              limitTooLarge:
                summary: 負例（limit 超過）
                description: page.limit が上限 100 を超える。400 を返す（ADR-025 D25-17）。
                value:
                  subject:
                    type: core/user
                    id: 4f3kq9w2x7m1p8s6t0v5b3n2zc
                    properties:
                      tid: t5wq2hzr7nmc4ka3vd6pxe2bfy
                  action:
                    name: read
                  resource:
                    type: docs/document
                    properties:
                      tid: t5wq2hzr7nmc4ka3vd6pxe2bfy
                  page:
                    limit: 5000
            examples:
              firstPage:
                summary: 正例（最初のページ）
                value:
                  subject:
                    type: core/user
                    id: 4f3kq9w2x7m1p8s6t0v5b3n2zc
                    properties:
                      tid: t5wq2hzr7nmc4ka3vd6pxe2bfy
                  action:
                    name: read
                  resource:
                    type: docs/document
                    properties:
                      tid: t5wq2hzr7nmc4ka3vd6pxe2bfy
                  context:
                    x-authz-profile:
                      profile_version: "1.0"
                  page:
                    limit: 50
              foreignToken:
                summary: 負例（他の主体に発行された page token）
                description: 別の主体・テナントに束縛された page.token を提示している。403 を返す（ADR-025 D25-15。cursor の使い回し、ATK-03・ATK-05）。同じ主体・テナントで検索条件や limit だけを変えた要求、期限切れの token は 400 とする（AuthZEN §8.2 は続きのページで entity とパラメータの変更を MUST で禁じ、PDP がエラーを返すことを SHOULD とする。状態コードは本契約の選択）[N][D]。
                value:
                  subject:
                    type: core/user
                    id: 8z6x4c2v0b9n7m5q3w1e8r6t4y
                    properties:
                      tid: t5wq2hzr7nmc4ka3vd6pxe2bfy
                  action:
                    name: read
                  resource:
                    type: docs/document
                    properties:
                      tid: t5wq2hzr7nmc4ka3vd6pxe2bfy
                  page:
                    token: v1.c.Zm9yZWlnbi1jdXJzb3ItYm91bmQtdG8tYW5vdGhlcg
      responses:
        "200":
          description: 候補の資源（後段 Check 前。認可の根拠にしない）。
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestIdEcho"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceSearchResponse"
              examples:
                truncated:
                  summary: 正例（打切りあり。要求例 firstPage への応答）
                  description: engine の列挙が上限に達したため incomplete を返す。total は返さない。
                  value:
                    results:
                      - type: docs/document
                        id: 9m2n4b6v8c1x3z5l7k9j2h4g6f
                      - type: docs/document
                        id: 1a3s5d7f9g2h4j6k8l0z2x4c6v
                    page:
                      next_token: v1.c.b3BhcXVlLW1hYy1ib3VuZC1jdXJzb3I
                      count: 2
                    context:
                      x-authz-profile:
                        decision_id: s3d6f9g2h5j8k1l4z7x0c3v6bm
                        model_revision:
                          model_revision: docs@01JB7X4K2Q
                          guardrail_catalog_version: g@2026.10.1
                        completeness:
                          status: incomplete
                          reason: enumeration_truncated
                lastPage:
                  summary: 正例（最後のページ）
                  description: 続きがない場合 next_token は空文字列（AuthZEN §8.2.2 の MUST）。
                  value:
                    results: []
                    page:
                      next_token: ""
                      count: 0
                    context:
                      x-authz-profile:
                        decision_id: n4m7q0w3e6r9t2y5u8i1o4p7as
                        model_revision:
                          model_revision: docs@01JB7X4K2Q
                          guardrail_catalog_version: g@2026.10.1
                        completeness:
                          status: complete
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
