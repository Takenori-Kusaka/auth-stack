    ## 11. v1.1 の変更（模擬連携検証の反映）
    AI エージェントによる模擬連携検証（13_integration-trial/report.md。経費精算サービスを想定した模擬であり、実在の連携チームによる検証ではない）で、本書に起因する詰まりが P-01・P-05・P-20 として挙がった。改善提案 I-1・I-5 に沿って次のとおり改めた [D]。

    | # | 対応（詰まり／提案） | 変更 | 箇所 |
    |---|---|---|---|
    | V-1 | P-01／I-1 | evaluation の応答例の先頭に fully_consistent の許可 `allowWrite` を置き、要求例 `allowWrite`（write の `update`）を加えた。§7 に「実効モードが要求より弱い許可は判定が得られない、同じか強いモードは受け入れる」を明記した | §7、`/access/v1/evaluation` |
    | V-2 | P-01／I-1 | evaluations に要求件数 1・2・3 の対の例を置き、許可要素の実効モードを fully_consistent にした。件数の一致（AuthZEN §7.2）と PEP の検査を明記した | `/access/v1/evaluations` |
    | V-3 | P-01／I-1 | 応答ヘッダ X-Request-ID に、要求側の例と同じ値の例を付け、echo 前提の値であることとモックでの確かめ方を書いた | components/headers/XRequestIdEcho、components/parameters/XRequestId |
    | V-4 | P-01 | Deprecation・Sunset を各応答の宣言から外し、最上位の `x-conditional-response-headers` に移した（モックが `Deprecation: string` を返さないように） | §2、`x-conditional-response-headers` |
    | V-5 | P-01 | metadata の `policy_decision_point` がモックで一致しないことは MUST NOT が働いた結果であり、検査を外さずに確かめる方法を書いた | `/.well-known/authzen-configuration` |
    | V-6 | P-05／I-5 | `action.name` を動詞の permission 名に統一し、CON-02 `NameSegment` と同じ pattern を課した。scope の形の負例を加えた。`subject.type` と主体類型の区別を Subject に書いた | components/schemas/Action・Subject、全 examples |
    | V-7 | P-20 | search の `results[].type` は要求の型と一致することを契約にし（`x-constraint`）、一覧ヘルパの扱いとモックの制約を書いた | `/access/v1/search/resource`、ResourceSearchResponse |

    汎用モック（Prism 5.12.0 で確認した振舞い。13_integration-trial §5・W-1・W-2）で examples を使うときの制約と回避方法 [M][D]:

    | 制約 | 影響 | 回避方法（PEP の検査は外さない） |
    |---|---|---|
    | 既定で応答 examples の先頭を返す | evaluation は `allowWrite`、evaluations は `mixed`（2 件）、search は `truncated` が返る | `Prefer: example=<例の名前>` で選ぶ |
    | X-Request-ID を写さず例の値を返す | 例と異なる値を送ると echo 不一致 | 要求に例の値を付けるか、echo proxy を置く |
    | evaluations の件数を要求に合わせない | 対の例のない件数は件数不一致 | 対の例（1〜3 件）を選ぶか、件数を合わせる proxy を置く |
    | search の `results[].type` を要求に合わせない | 自ドメインの型の検索に `docs/document` が返る | 型を書き換える proxy を置く |
    | metadata の `policy_decision_point` が例の固定値 | モックの URL と一致しない | PDP 識別子を例の値に設定するか、書き換える proxy を置く |

    - 互換性: V-6 の pattern は制約を強める変更である。本書は v1 凍結（DEC-8）前の draft なので、`profile_version` は 1.0 のまま据え置く [D]。v1.0 の例どおり `can_read` 等を送っていた実装は、モデルに同名の permission がない限り本番で deny になるので、版上げの前に名前を改める必要がある（§12 N-3）[D]。V-4 は宣言の位置の変更で、非推奨時の応答の形は変えない [D]。
    - 残余: echo proxy・件数合わせ・型の書換えはモックの前段の試験用部品であり、本書の examples だけでは件数 4 以上と自ドメインの型の正例を作れない。proxy の提供は CON-11 の kit に申し送る（§12 N-2）[D]。

