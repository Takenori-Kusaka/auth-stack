                    limit: 50
              foreignToken:
                summary: 負例（他の主体に発行された page token）
                description: 別の主体・テナントに束縛された page.token を提示している。403 を返す（ADR-025 D25-15。cursor の使い回し、ATK-03・ATK-05）。同じ主体・テナントで検索条件や limit だけを変えた要求、期限切れの token は 400 とする（AuthZEN §8.2 は続きのページで entity とパラメータの変更を MUST で禁じ、PDP がエラーを返すことを SHOULD とする。状態コードは本契約の選択）[N][D]。
                value:
                  subject:
                    type: core/user
                    id: 8z6x4c2v0b9n7m5q3w1e8r6t4y
                    properties:
                      tid: 7hd2k9q1w8e3r6t0y5u4i2o1pa
                  action:
                    name: can_read
                  resource:
                    type: docs/document
                    properties:
                      tid: 7hd2k9q1w8e3r6t0y5u4i2o1pa
                  page:
                    token: v1.c.Zm9yZWlnbi1jdXJzb3ItYm91bmQtdG8tYW5vdGhlcg
      responses:
        "200":
          description: 候補の資源（後段 Check 前。認可の根拠にしない）。
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestIdEcho"
            Deprecation:
              $ref: "#/components/headers/Deprecation"
            Sunset:
              $ref: "#/components/headers/Sunset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceSearchResponse"
              examples:
                truncated:
                  summary: 正例（打切りあり）
                  description: engine の列挙が上限に達したため incomplete を返す。total は返さない。
                  value:
                    results:
                      - type: docs/document
                        id: 9m2n4b6v8c1x3z5l7k9j2h4g6f
                      - type: docs/document
                        id: 1a3s5d7f9g2h4j6k8l0z2x4c6v
                    page:
                      next_token: v1.c.b3BhcXVlLW1hYy1ib3VuZC1jdXJzb3I
                      count: 2
                    context:
                      x-authz-profile:
                        decision_id: s3d6f9g2h5j8k1l4z7x0c3v6bm
                        model_revision:
                          model_revision: docs@01JB7X4K2Q
                          guardrail_catalog_version: g@2026.10.1
                        completeness:
                          status: incomplete
                          reason: enumeration_truncated
                lastPage:
                  summary: 正例（最後のページ）
                  description: 続きがない場合 next_token は空文字列（AuthZEN §8.2.2 の MUST）。
                  value:
                    results: []
                    page:
                      next_token: ""
                      count: 0
                    context:
                      x-authz-profile:
                        decision_id: n4m7q0w3e6r9t2y5u8i1o4p7as
                        model_revision:
                          model_revision: docs@01JB7X4K2Q
                          guardrail_catalog_version: g@2026.10.1
                        completeness:
                          status: complete
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    workloadMtls:
      type: mutualTLS
      description: |
        PEP（依存サービスの workload）の認証。workload ID の mTLS（ADR-009）を必須とする（ADR-011 D5-7）[D]。AuthZEN では PDP による PEP の認証は SHOULD、通信の保護は MUST [N]。
  parameters:
    XRequestId:
      name: X-Request-ID
      in: header
      required: false
      description: |
        PEP が要求ごとに採番する不透明値（AuthZEN §10.1.3。要求 ID の付与は MAY、ヘッダ名は RECOMMENDED）[N]。
        自社 profile では PEP SDK・契約適合実装は必ず付ける（ADR-011 D5-5、ARC-06 §3.6）[D]。AuthZEN 準拠の受理範囲を保つため、façade は欠けた要求を 400 にはしない [D]。
      schema:
        type: string
        minLength: 1
        maxLength: 128
        examples: [r-01JB9Q2W3E4R5T6Y7U8I9O0PAS]
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: W3C Trace Context の traceparent。相関だけに使い、証拠や認可の入力にしない。主体・テナントを tracestate・baggage に載せない（ADR-011 D8-1・D8-4）[D]。
      schema:
        type: string
        pattern: "^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$"
  headers:
    XRequestIdEcho:
      description: 要求に X-Request-ID があれば、PDP は同じ値を応答に含める（AuthZEN §10.1.3 の MUST）[N]。engine が返さない場合も façade が補う（ADR-011 D5-5、OpenFGA は返さない RS-07#68）[D]。PEP SDK は不一致を「判定が得られない」として扱う [D]。
      schema:
        type: string
    Deprecation:
      description: 非推奨の告知（RFC 9745、Proposed Standard）。値は RFC 9651 §3.3.7 の Date（`@` に続く Unix 時刻）[N]（RS-16#34）。
      schema:
        type: string
        pattern: "^@-?[0-9]{1,15}$"
    Sunset:
      description: 提供終了の予定日時（RFC 8594、Informational）。値は HTTP-date [N]（RS-16#35）。Deprecation の日時より前にしない（RFC 9745）[N]。
      schema:
        type: string
    RetryAfter:
      description: 再試行までの待ち時間（RFC 9110 §10.2.3）。429・503 で返す [N]。
      schema:
        type: string
  responses:
    BadRequest:
      description: |
        要求の誤り（AuthZEN §10.1.2、本文はエラーメッセージ文字列）[N]。AuthZEN の必須項目（subject.type/id、resource.type/id、action.name）の欠落、JSON の誤り、search の `page.limit` 超過、search の続きのページで最初の要求と entity・パラメータが異なる要求と期限切れの `page.token`（AuthZEN §8.2 の SHOULD でエラー）、privileged 操作での `permit_on_first_permit`、要求本文の上限超過（上限値 TBD）を含む [N][D]。
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestIdEcho"
      content:
        text/plain:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
          examples:
            missing:
              summary: 負例の応答
              value: "subject.id is required"
    Unauthorized:
      description: PEP の認証失敗（mTLS の workload ID を検証できない）。AuthZEN §10.1.2 [N]。
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestIdEcho"
      content:
        text/plain:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
    Forbidden:
      description: 認証済みの PEP がこの操作を許されていない（search の受付制御で許可されない呼出し元、他主体・他テナントに束縛された page token）。AuthZEN §10.1.2 [N][D]。認可判定の拒否ではない（拒否は 200・decision=false）。
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestIdEcho"
      content:
        text/plain:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
    TooManyRequests:
      description: テナント単位・クライアント単位のクォータ超過（ADR-010 D-29、ADR-013 D13-17）[D]。RFC 6585 §4 の 429 で、Retry-After を付ける（RFC では MAY）。429 の応答はキャッシュに保存してはならない（MUST NOT）[N]。AuthZEN §10.1.2 の表にない profile の追加 [D]。PEP SDK は「判定が得られない」として fail-mode を適用する [D]。
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestIdEcho"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        text/plain:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
    InternalError:
      description: façade 内部の誤り（AuthZEN §10.1.2 の 500）[N]。PEP SDK は「判定が得られない」として扱う [D]。
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestIdEcho"
      content:
        text/plain:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
    ServiceUnavailable:
      description: façade の過負荷による shed（低い操作階層から。ADR-010 D-29）または保守（RFC 9110 §15.6.4、Retry-After は MAY）[N][D]。engine 不達は 503 ではなく 200・`deny_unavailable` で返す（ADR-011 D3-6）[D]。AuthZEN §10.1.2 の表にない profile の追加 [D]。
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestIdEcho"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        text/plain:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
  schemas:
    ErrorMessage:
      type: string
      description: AuthZEN §10.1.2 の「エラーメッセージ文字列」[N]。利用側は文字列一致に依存しない（ADR-022 D-3-2）。主体・テナント・資源の識別子を含めない [D]。
      maxLength: 512
    TenantId:
      type: string
      description: テナント識別子（`tid`。ADR-021 D21-12 で払い出す不透明値）。受信側の形式は CON-02 `TenantId`（`OpaqueId`、印字可能 ASCII 1〜64 文字）に揃える。払い出しの符号化は DL-71 で確定（未決（ADR-021 D21-09））。
      minLength: 1
      maxLength: 64
      pattern: "^[\\x21-\\x7E]{1,64}$"
      examples: [7hd2k9q1w8e3r6t0y5u4i2o1pa]
    EntityType:
      type: string
      description: |
        Subject.type・Resource.type（AuthZEN §5.1・§5.2 の `type`）。値は ADR-021 D21-26 の `<名前空間コード>/<型名>`。横断型は予約名前空間 `core`（例 `core/user`、`core/workload`、`core/tenant`）[D]。文字集合の規則は名前空間台帳（DL-71）で確定するため、本契約は pattern を課さない（未決（ADR-021））。
      minLength: 1
      maxLength: 128
      examples: [core/user, docs/document]
    SubjectProperties:
      type: object
      description: AuthZEN の `subject.properties`（OPTIONAL、自由形式）[N]。本 profile の項目を置く [D]。
      properties:
        tid:
          $ref: "#/components/schemas/TenantId"
          x-profile-required: true
          x-on-missing: deny_indeterminate
        principal_type:
          type: string
          description: 主体類型（人間／workload／AI エージェント／service account。ADR-005 D9-4、ADR-017）。値の名前は DL-75 で確定（未決（ADR-021 D21-38））。sub の文字列から類型を推論させない（ADR-021）。
        actor:
          type: object
          description: 委任時の現在の actor（RFC 8693 の `act` の top-level の主体。アクセス制御に使えるのは top-level claim と現在の actor だけ（RFC 8693 の MUST））[N]（RS-04#66）。
          properties:
            type:
              $ref: "#/components/schemas/EntityType"
            id:
              type: string
          required: [type, id]
    ResourceProperties:
      type: object
      description: AuthZEN の `resource.properties`（OPTIONAL、自由形式）[N]。
      properties:
        tid:
          allOf:
            - $ref: "#/components/schemas/TenantId"
          description: PEP が L0 で照合済みの resource-derived tenant（ARC-06 §3.3）。
          x-profile-required: true
          x-on-missing: deny_indeterminate
    Subject:
      type: object
      description: AuthZEN 1.0 §5.1 の Subject。`type`・`id` は REQUIRED、`properties` は OPTIONAL [N]。
      required: [type, id]
      properties:
        type:
          $ref: "#/components/schemas/EntityType"
        id:
          type: string
          minLength: 1
          maxLength: 256
          description: 主体の不透明識別子（`sub` 等。ADR-021 D21-09）。
        properties:
          $ref: "#/components/schemas/SubjectProperties"
    Resource:
      type: object
      description: AuthZEN 1.0 §5.2 の Resource。`type`・`id` は REQUIRED、`properties` は OPTIONAL [N]。
      required: [type, id]
      properties:
        type:
          $ref: "#/components/schemas/EntityType"
        id:
          type: string
          minLength: 1
          maxLength: 256
        properties:
          $ref: "#/components/schemas/ResourceProperties"
    SearchResourceSelector:
      type: object
      description: Resource Search の `resource`（AuthZEN §8.5.1）。`type` は必須、`id` は SHOULD で省略し、含まれていても MUST で無視される [N]。
      required: [type]
      properties:
        type:
          $ref: "#/components/schemas/EntityType"
        id:
          type: string
          description: 無視される（AuthZEN §8.5.1）。
        properties:
          $ref: "#/components/schemas/ResourceProperties"
    Action:
      type: object
      description: AuthZEN 1.0 §5.3 の Action。`name` は REQUIRED、`properties` は OPTIONAL [N]。`name` は型の内側で一意な permission 名（ADR-021 D21-26、permission catalog は DL-26）[D]。
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        properties:
          type: object
    RequestContext:
      type: object
      description: |
        AuthZEN 1.0 §5.4 の Context（自由形式）[N]。自社 profile の項目は `x-authz-profile` に置く（AuthZEN 1.0 外）[D]。
        その他のキーは条件評価の入力候補で、属性辞書（ADR-011 D9-4）に登録されたキーだけを評価に使う。PEP 供給の context の受入範囲は未決（ADR-011）[D]。
      properties:
        x-authz-profile:
          $ref: "#/components/schemas/ProfileRequest"
    ConsistencyMode:
      type: string
      description: 整合性モード（ADR-011 D6-1）。弱い順に minimize_latency < at_least_as_fresh < fully_consistent。façade は格上げはしても格下げはしない（ADR-011 D6-3）[D]。
      enum: [minimize_latency, at_least_as_fresh, fully_consistent]
    ConsistencyToken:
      type: string
      description: |
        façade が発行する版付きの不透明値（`版‖engine 識別‖engine 固有値または書込時刻‖MAC`、ADR-010 D-14）。利用側は解釈せず保存・返送するだけ（ADR-011 D10-1 C-3）[D]。
        最大長は 1,024 バイトの初期案で、DL-72 凍結前に確定（ADR-011 D6-4、NA-010-2（前提台帳へ追加要））。JSON Schema の maxLength は文字数を数えるので、印字可能 ASCII に限って文字数＝バイト数とする（CON-02 `ConsistencyToken` と同じ）[D]。解釈できない token（版不明・engine 識別の不一致・MAC 不一致）はエラーにせず fully_consistent に格上げ（ADR-010 D-15、ADR-011 D6-1）[D]。
      minLength: 1
      maxLength: 1024
      pattern: "^[\\x21-\\x7E]{1,1024}$"
    ProfileRequest:
      type: object
      description: 要求側の自社 profile（AuthZEN 1.0 外）。キー名 `x-authz-profile` は暫定（未決（ADR-021））。
      x-authzen-extension: true
      properties:
        profile_version:
          type: string
          pattern: "^[0-9]+\\.[0-9]+$"
          description: profile の版（major.minor）。欠ければ 1.0 として扱う。未対応の major なら decision=false・`unsupported_profile`（ADR-011 D6-1）[D]。
        consistency:
          type: object
          properties:
            mode:
              allOf:
                - $ref: "#/components/schemas/ConsistencyMode"
              description: 欠ければ操作階層ごとの既定（ARC-05 §9.1。write 以上は fully_consistent）。既定より弱い指定は既定に格上げ（ADR-011 D6-3）。read-sensitive の OpenFGA での扱いは未決（ADR-010 §2.12、U-03）で、暫定は常時格上げ。
            token:
              $ref: "#/components/schemas/ConsistencyToken"
        model:
          type: object
          properties:
            pin:
              type: string
              maxLength: 128
              description: registry の model revision（DL-73）。欠ければテナントの現行固定版。最新版にはしない（ADR-011 D6-1、ADR-016 D16-30）[D]。
        txn:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[\\x21-\\x7E]{1,64}$"
          x-maturity: preview
          description: |
            PEP が検証した Txn-Token の `txn`（一意の取引識別子。名前と意味は RFC 8417 の IANA 登録で固定、ADR-021 D21-36）の写し。decision event の相関に使い、認可の入力にしない [D]。Transaction Tokens は Internet-Draft（-11、確認日 2026-10-03、SS-B04）。発行範囲と façade での Txn-Token 検証の要否は未決（ADR-005 H-20・ADR-009、U-02）。Txn-Token の全文は送らない（ログに残さない義務。ADR-021 D21-37）[D]。
    Reason:
      type: string
      description: |
        判定理由の閉じた列挙（ADR-011 D6-1）: `allow`, `deny_guardrail:<規則ID>`, `deny_no_relation`, `deny_indeterminate`, `deny_unavailable`, `unsupported_profile`。エンドユーザーに返さない [D]。
        規則 ID の形式は未決（ADR-011、CAM）で、本契約の暫定は CON-02 `DecisionReason` と同じ `[a-z0-9][a-z0-9._-]{0,63}`（先頭は英小文字・数字）[D]。
        値の追加を minor（後方互換）とするか major とするかは未決（ADR-016 P16-2。ADR-016 の現行定義では閉じた enum への追加は破壊的）。どちらの結論でも、PEP は未知の値を拒否として扱う [D]。
      pattern: "^(allow|deny_no_relation|deny_indeterminate|deny_unavailable|unsupported_profile|deny_guardrail:[a-z0-9][a-z0-9._-]{0,63})$"
      examples: [allow, deny_guardrail:g1, deny_indeterminate]
    ModelRevision:
      type: object
      description: 評価に使った model revision と G 段カタログの版（ADR-011 D6-1）。存在は必須、表現は preview（ADR-022 D-2）。監査記録に残る形式は不可逆側（ADR-011 可逆性 (4)）[D]。
      x-maturity: preview
      required: [model_revision, guardrail_catalog_version]
      properties:
        model_revision:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[\\x21-\\x7E]{1,64}$"
          description: registry（DL-73）が採番した不変の model revision。項目名と形式は CON-02 `ModelRevision`・CON-08 と揃える [D]。
        guardrail_catalog_version:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[\\x21-\\x7E]{1,64}$"
          description: G 段カタログの版 [D]。
    Obligation:
      type: object
      description: |
        許可に付く PEP の義務（preview。AuthZEN 1.0 外）。AuthZEN Profile for Obligations は WG Draft（SS-C18、本文未読）で、本契約はそれに依存しない [N][D]（RS-07#67）。
        AuthZEN は decision=true でも PEP が context を理解できなければ拒否してよい（MAY）とする [N]。本 profile は、理解できない obligation が付いた許可を PEP が拒否として扱うことを必須とする [D]。語彙は未決（ADR-011 §8・ADR-022）。
      x-maturity: preview
      required: [type]
      properties:
        type:
          type: string
          maxLength: 128
          description: 名前空間付きの obligation 名（例示 `core/record_returned_items`）。
        parameters:
          type: object
    ProfileDecision:
      type: object
      description: 応答側の自社 profile（AuthZEN 1.0 外）。キー名 `x-authz-profile` は暫定（未決（ADR-021））。
      x-authzen-extension: true
      required: [decision_id, reason, model_revision, consistency]
      properties:
        decision_id:
          type: string
          minLength: 16
          maxLength: 64
          description: façade が採番する推測困難で一意な ID（監査の主キー）。PEP は採番しない（ADR-011 D5-3・D6-1、ARC-06 §3.7）。時刻・ホスト名・cell 名を埋め込まない（ADR-021 D21-36）[D]。
        reason:
          $ref: "#/components/schemas/Reason"
        model_revision:
          $ref: "#/components/schemas/ModelRevision"
        consistency:
          type: object
          required: [mode]
          properties:
            mode:
              allOf:
                - $ref: "#/components/schemas/ConsistencyMode"
              description: 実効モード（必須）。
            token:
              $ref: "#/components/schemas/ConsistencyToken"
        obligations:
          type: array
          items:
            $ref: "#/components/schemas/Obligation"
    DecisionContext:
      type: object
      description: AuthZEN 1.0 §5.5 の Decision の `context`（OPTIONAL）[N]。
      properties:
        error:
          type: object
          description: evaluations の個別要素の誤り（AuthZEN §7.2.1 の例の形）[N]。
          properties:
            status:
              type: integer
            message:
              type: string
        x-authz-profile:
          $ref: "#/components/schemas/ProfileDecision"
    Decision:
      type: object
      description: |
        AuthZEN 1.0 §5.5 の Decision。`decision` は REQUIRED [N]。false なら要求を先に進めてはならない（MUST NOT）[N]。
        本 profile では `context.x-authz-profile` を必須とし、欠ければ PEP は判定なしとして扱う（ARC-06 §3.5）[D]。
      required: [decision]
      properties:
        decision:
          type: boolean
        context:
          $ref: "#/components/schemas/DecisionContext"
    EvaluationRequest:
      type: object
      description: AuthZEN 1.0 §6.1 の Access Evaluation 要求 [N]。
      required: [subject, action, resource]
      properties:
        subject:
          $ref: "#/components/schemas/Subject"
        action:
          $ref: "#/components/schemas/Action"
        resource:
          $ref: "#/components/schemas/Resource"
        context:
          $ref: "#/components/schemas/RequestContext"
    EvaluationItem:
      type: object
      description: evaluations の要素。省略した項目は上位の値を既定値とする（AuthZEN §7.1.1）[N]。上位と合わせて subject・action・resource が揃わない要素は 400 [N]。
      properties:
        subject:
          $ref: "#/components/schemas/Subject"
        action:
          $ref: "#/components/schemas/Action"
        resource:
          $ref: "#/components/schemas/Resource"
        context:
          $ref: "#/components/schemas/RequestContext"
    EvaluationsRequest:
      type: object
      description: |
        AuthZEN 1.0 §7.1 の Access Evaluations 要求 [N]。`evaluations` が無いか空の要求は、単一の Access Evaluation 要求（§6.1）と同じに振る舞う（後方互換）[N]。そのため、その場合は上位の subject・action・resource が必須になる（下の anyOf）[D]。
        `evaluations` に 1 件以上ある場合、上位の subject・action・resource は、全要素がそれを持つときに限り省略できる（§7.1、§7.1.1 の MUST）[N]。要素ごとの補完後の充足はスキーマで表せないので façade が検査し、欠ければ 400 とする（§10.1.1）[N][D]。
        要素数の上限は TBD（所有者: 認可・PDP チーム、期限: DL-72 凍結前、決め方: DL-20 の遅延予算と ADR-025 D25-17 の評価件数予算）。
      anyOf:
        - required: [evaluations]
          properties:
            evaluations:
              minItems: 1
        - required: [subject, action, resource]
      properties:
        subject:
          $ref: "#/components/schemas/Subject"
        action:
          $ref: "#/components/schemas/Action"
        resource:
          $ref: "#/components/schemas/Resource"
        context:
          $ref: "#/components/schemas/RequestContext"
        evaluations:
          type: array
          items:
            $ref: "#/components/schemas/EvaluationItem"
        options:
          type: object
          properties:
            evaluations_semantic:
              type: string
              enum: [execute_all, deny_on_first_deny, permit_on_first_permit]
              default: execute_all
    EvaluationsResponse:
      type: object
      description: |
        AuthZEN 1.0 §7.2 の応答。`evaluations` は要求の順序どおり。`evaluations` がある場合、上位の `decision` は省略（RECOMMENDED）し、あっても PEP は無視してよい [N]。上位の `context.x-authz-profile.batch_decision_id` は AuthZEN 1.0 外 [D]。
        要求の `evaluations` が無いか空の場合（§7.1 の後方互換）は、§6.2 と同じ Decision（上位の `decision` と、`context.x-authz-profile` に ProfileDecision）を返す [N][D]。
        どちらの形かは要求で決まる。PEP SDK は本 endpoint を `evaluations` 1 件以上でだけ呼ぶ（単一判定は §6 の endpoint を使う。本契約の SDK 規則）ので、SDK が受けるのは前者だけである [D]。
      anyOf:
        - required: [evaluations]
        - required: [decision]
      properties:
        decision:
          type: boolean
          description: 要求の `evaluations` が無いか空の場合だけ使う（§7.1・§6.2）[N]。
        evaluations:
          type: array
          items:
            $ref: "#/components/schemas/Decision"
        context:
          type: object
          properties:
            x-authz-profile:
              anyOf:
                - $ref: "#/components/schemas/ProfileBatch"
                - $ref: "#/components/schemas/ProfileDecision"
    ProfileBatch:
      type: object
      description: evaluations 応答の上位に置く自社 profile（AuthZEN 1.0 外）。`batch_decision_id` は一覧 1 回の判定記録の主キー（ADR-025 D25-18）[D]。
      x-authzen-extension: true
      required: [batch_decision_id]
      properties:
        batch_decision_id:
          type: string
          minLength: 16
          maxLength: 64
    PageRequest:
      type: object
      description: AuthZEN §8.2.1 の page（`token`・`limit`・`properties`）[N]。`limit` の上限 100 は本 profile（ADR-025 D25-17）[D]。
      properties:
        token:
          type: string
          maxLength: 1024
          description: 前回応答の `next_token`。façade が主体・テナント・条件・model revision に束縛し MAC を付けた短命値（ADR-025 D25-15）[D]。
        limit:
          type: integer
          minimum: 0
          maximum: 100
        properties:
          type: object
    PageResponse:
      type: object
      description: AuthZEN §8.2.2 の page。`next_token` は REQUIRED で、続きがなければ空文字列（MUST）[N]。`total` は OPTIONAL だが本 profile では返さない（ADR-025 D25-13）[D]。
      required: [next_token]
      properties:
        next_token:
          type: string
          maxLength: 1024
        count:
          type: integer
          minimum: 0
        total:
          description: AuthZEN §8.2.2 では OPTIONAL だが、本 profile では返さない（ADR-025 D25-13）。存在すれば契約違反。
          not: {}
        properties:
          type: object
    ResourceSearchRequest:
      type: object
      description: AuthZEN 1.0 §8.5.1 の Resource Search 要求 [N]。
      required: [subject, action, resource]
      properties:
        subject:
          $ref: "#/components/schemas/Subject"
        action:
          $ref: "#/components/schemas/Action"
        resource:
          $ref: "#/components/schemas/SearchResourceSelector"
        context:
          $ref: "#/components/schemas/RequestContext"
        page:
          $ref: "#/components/schemas/PageRequest"
    Completeness:
      type: object
      description: |
        結果の完全性（ADR-025 D25-07・D25-21。AuthZEN 1.0 外、preview）。façade の search が返し得る理由は `enumeration_truncated`・`deadline_exceeded`。`index_lagging`・`budget_exhausted` は一覧ヘルパが付ける。`known_good_only` は KD13-6 で既知良好判定が許された場合にだけ加える（未決（ADR-013 KD13-6））[D]。
      x-maturity: preview
      required: [status]
      x-constraint: "`status`=`incomplete` なら `reason` は必須、`complete` なら `reason` を付けない [D]。コード生成器との相性のため if/then ではなく契約試験キット（DL-80）で検査する。"
      properties:
        status:
          type: string
          enum: [complete, incomplete]
        reason:
          type: string
          enum: [enumeration_truncated, index_lagging, budget_exhausted, deadline_exceeded]
    ResourceSearchResponse:
      type: object
      description: AuthZEN 1.0 §8.3 の Search 応答（`results` は REQUIRED、`page`・`context` は OPTIONAL）[N]。
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/Resource"
        page:
          $ref: "#/components/schemas/PageResponse"
        context:
          type: object
          properties:
            x-authz-profile:
              type: object
              x-authzen-extension: true
              required: [decision_id, model_revision, completeness]
              properties:
                decision_id:
                  type: string
                  minLength: 16
                  maxLength: 64
                model_revision:
                  $ref: "#/components/schemas/ModelRevision"
                completeness:
                  $ref: "#/components/schemas/Completeness"
    PdpMetadata:
      type: object
      description: |
        AuthZEN 1.0 §9.1 の PDP metadata。`policy_decision_point` と `access_evaluation_endpoint` は REQUIRED [N]。
        `search_subject_endpoint`・`search_action_endpoint` は v1 で公開しないので載せない（ADR-011 D5-2）[D]。`signed_metadata` は v1 では使わない（応答署名を採らない ADR-011 D5-7 に揃える）[D]。
      required: [policy_decision_point, access_evaluation_endpoint]
      properties:
        policy_decision_point:
          type: string
          format: uri
          pattern: "^https://[^?#]+$"
          description: PDP 識別子。https scheme で query・fragment を持たない URL（AuthZEN §9.1.1）[N]。
        access_evaluation_endpoint:
          type: string
          format: uri
        access_evaluations_endpoint:
          type: string
          format: uri
        search_resource_endpoint:
          type: string
          format: uri
        capabilities:
          type: array
          items:
            type: string
          description: AuthZEN §9.1.2 の capability URN の配列（項目名は `capabilities`）[N]。§8.2.1 の本文は同じものを `supported_capabilities` と呼んでいるが、§9.1.2 の定義と §12.1.3 の登録に従い `capabilities` を使う [N][D]。本 profile の URN は未決（ADR-021 の名前空間）[D]。
