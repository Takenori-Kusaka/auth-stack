              permitAnyOnPrivileged:
                summary: 負例（privileged 操作での permit_on_first_permit）
                description: tenant の設定変更（privileged）に「いずれか」の意味論を使っている。要求全体を 400 で拒否する（ADR-011 D3-7）。
                value:
