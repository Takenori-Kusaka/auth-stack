    ## レビュー記録
    > 模擬パネルは AI エージェントによる自己レビューであり、実在の CTO/CISO の決裁ではない [D]。

    ### ラウンド1（2026-10-15、模擬パネル redteam 役）
    | 重大度 | 指摘 | 対応 | 箇所 |
    |---|---|---|---|
    | High | façade は PEP の mTLS 認証だけで要求を受け付け、`subject.id`・`tid` を検証済み token・Txn-Token と突き合わせない。G 段規則 1 は PEP が渡した 2 つの `tid` を比べるだけである。侵害された依存サービス（ATK-06）が同じ cell の全テナント・他ドメインの資源型を Check でき、関係の存在（T-034）を引き出す oracle になる。判定・照会側に呼出し元ごとの宣言がなく、ATK-06 の「PDP への探索的な Check」に T・統制・TC がない（G-078 の追跡切れ）。DEC-8 で現形のまま凍結すると、裏付けの必須化が major 改版になる | 本書内: (1) §4.1 に問題を明記。(2) §4.2 に G 段規則 `caller_scope`（判定宣言。SPIFFE ID 全体で照合）を v1 の契約として追加。(3) §4.3 に G 段規則 `subject_binding` を追加し、`Txn-Token` ヘッダ（全 operation の parameters）と `subject_evidence.access_token`（ProfileRequest、preview）の欄を予約。照合規則（`sub`↔`subject.id`、token のテナント↔`subject.properties.tid`）を定め、必須化は判定宣言の属性で行うので major 改版を要しない形にした。必須化の時期は §9 に ADR-011 の未決として明記。(4) §4.4 に照会の広がりの検知を追加。(5) §5 に G 段規則 1 の限界を明記。(6) §8 と evaluation の要求・応答の examples に負例 2 件（`callerOutOfScope`、`subjectBindingMismatch`）を追加。他文書: threat-catalog T-087、ARC-05 X-14、ADR-011、CON-04 の tuple 書込みのテナント結合、kri.md、CON-11、PoC 計画、ARC-06・ARC-15 を §10（M-1〜M-9）に申し送り。新たな事実の根拠は RS-06 の検証済み原典（Transaction Tokens 草案、WIMSE identifier・mutual-tls 草案）[^10][^11][^12] | info.version、§4.1〜§4.4、§5、§8、§9、§10、components（TxnToken、SubjectEvidence、ProfileRequest、`txn`）、/access/v1/evaluation の examples |
    | — | 残余 | 裏付けの必須化までは、裏付けを省いた照会を宣言範囲内で止められない（§4.3 の残余リスク）。threat-catalog・kri.md・CON-11・PoC 計画の実際の追記は宛先文書の担当が行う（本書では未完了） | §4.3、§10 |
x-conditional-response-headers:
  description: |
    v1.1（I-1、P-01）: 非推奨になった endpoint の 200 応答にだけ付くヘッダ。非推奨でない endpoint は送らないので、各 operation の `responses` には宣言しない（宣言すると汎用モックが常に値を返す）[D]。適用範囲は §2 の互換規則、期間の値は DL-70・ADR-016 [D]。
  applies-to: 非推奨になった operation の 200 応答
  headers:
    Deprecation:
      description: 非推奨の告知（RFC 9745、Proposed Standard）。値は RFC 9651 §3.3.7 の Date（`@` に続く Unix 時刻）[N]（RS-16#34）。
      schema:
        type: string
        pattern: "^@-?[0-9]{1,15}$"
    Sunset:
      description: 提供終了の予定日時（RFC 8594、Informational）。値は HTTP-date [N]（RS-16#35）。Deprecation の日時より前にしない（RFC 9745）[N]。
      schema:
        type: string
servers:
  - url: https://{cell}.pdp.{idDomain}
    description: cell ごとの PDP façade（ADR-011 D5-3、ADR-013）。ホスト名の規則は未決（ADR-021 D21-28 の自社所有ドメイン修飾に従う）。
    variables:
      cell:
        default: cell-placeholder
        description: cell の識別子（cell 名をテナント識別子に埋め込まない。ADR-021 D21-36）。
      idDomain:
        default: id-domain.invalid
        description: 自社所有ドメイン（ADR-021 D21-28）。値は仮置き。
security:
  - workloadMtls: []
tags:
  - name: metadata
    description: PDP metadata（AuthZEN 1.0 §9）。GA。
  - name: evaluation
    description: Access Evaluation / Access Evaluations（AuthZEN 1.0 §6・§7）。GA。
  - name: search
    description: Resource Search（AuthZEN 1.0 §8.5）。preview。SDK の一覧ヘルパ内部専用（ADR-011 D5-2、ADR-025 D25-03）。
paths:
  /.well-known/authzen-configuration:
    get:
      tags: [metadata]
      operationId: getPdpMetadata
      summary: PDP metadata の取得（AuthZEN 1.0 §9）
      description: |
        AuthZEN 1.0 §9 の PDP metadata を返す [N]。提供は RECOMMENDED で、本 façade は必ず提供する（ADR-011 D5-6）[D]。
        公開しない search endpoint（subject・action）のパラメータは載せない [D]。
        負例: 返された `policy_decision_point` が取得に使った識別子と一致しない場合、PEP SDK はそのメタデータを使ってはならない（AuthZEN §9.2.3 の MUST NOT。PDP mix-up 対策）[N]。
        v1.1（I-1、P-01）: 汎用モックは例の固定値（`https://cell-placeholder.pdp.id-domain.invalid`）を返すので、モックの URL で取得すると必ず不一致になる。これは上の MUST NOT が正しく働いた結果であり、検査を外して合わせない。汎用モックでは `11_contracts/kit/echo-proxy.js` の規則 R3（`policy_decision_point` を proxy の URL に書き換える）を前に置くのが既定の方法である（CON-11 §14.3 H11-1 (3)）。それ以外の方法としては、PEP の設定で PDP 識別子を例の値にし、その名前をモックに解決させるか、`policy_decision_point` をモックの URL に書き換える proxy（CON-11 の kit。§12 N-2）を前に置く [D]。
      x-maturity: GA
      x-authzen-section: "§9"
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: PDP metadata。
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestIdEcho"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PdpMetadata"
              examples:
                ok:
                  summary: 正例
                  value:
                    policy_decision_point: https://cell-placeholder.pdp.id-domain.invalid
                    access_evaluation_endpoint: https://cell-placeholder.pdp.id-domain.invalid/access/v1/evaluation
                    access_evaluations_endpoint: https://cell-placeholder.pdp.id-domain.invalid/access/v1/evaluations
                    search_resource_endpoint: https://cell-placeholder.pdp.id-domain.invalid/access/v1/search/resource
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /access/v1/evaluation:
    post:
      tags: [evaluation]
      operationId: evaluateAccess
      summary: 単一の認可判定（AuthZEN 1.0 §6）
      description: |
        AuthZEN 1.0 §6 の Access Evaluation [N]。評価順序は L0（PEP 内）→ G 段（façade）→ R 段（engine）で、既定拒否・deny 優先・評価不能は deny とする（ADR-011 D3-1〜D3-3、ARC-05 §4.1）[D]。
        拒否は 200 と `decision: false` で返す（AuthZEN §10.1.2）[N]。
        自社 profile の項目は `context.x-authz-profile` に置く（AuthZEN 1.0 外）[D]。
        v1.1（I-1、P-01）: 汎用モック（Prism）は既定で応答 examples の先頭を返すので、先頭を `fully_consistent` の許可 `allowWrite` にした。§7 の格下げ検査により `fully_consistent` の許可は read・write どちらの要求にも合うため、先頭の例だけで read と write の両方の正例を確かめられる [D]。v1.0 は先頭が `at_least_as_fresh` の許可だけで、write の正例が格下げとして fail-closed になった [D]。特定の例を返させるときは `Prefer: example=<例の名前>` を付ける（Prism の機能。本番の façade は解釈しない）[D]。
      x-maturity: GA
      x-authzen-section: "§6"
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/TxnToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluationRequest"
            x-negative-examples:
              description: スキーマに違反する負例。正例の examples とは分けて置く（スキーマ検査器が負例を不適合として報告するため）。契約試験キット（DL-80）はこれらが 400 になることを確かめる。
              missingSubjectId:
                summary: 負例（AuthZEN 必須項目の欠落）
                description: subject.id が欠けている。AuthZEN §10.1.1 により 400 Bad Request を返す。
                value:
                  subject:
                    type: core/user
                  action:
                    name: read
                  resource:
                    type: docs/document
                    id: 9m2n4b6v8c1x3z5l7k9j2h4g6f
              scopeFormActionName:
                summary: 負例（action.name に scope の形を入れた。v1.1（I-5））
                description: action.name に OAuth scope の形 `docs.document.read` を入れている。permission 名は `read`（型は resource.type で表す）。CON-02 `NameSegment` の pattern に反するので 400（§10.1.1）。v1.0 では受理され、本番で判定宣言（§4.2）に当たらず全件 deny_guardrail:caller_scope になっていた（13_integration-trial P-05）。
                value:
                  subject:
                    type: core/user
                    id: 4f3kq9w2x7m1p8s6t0v5b3n2zc
                    properties:
                      tid: t5wq2hzr7nmc4ka3vd6pxe2bfy
                  action:
                    name: docs.document.read
                  resource:
                    type: docs/document
                    id: 9m2n4b6v8c1x3z5l7k9j2h4g6f
                    properties:
                      tid: t5wq2hzr7nmc4ka3vd6pxe2bfy
            examples:
              allowWrite:
                summary: 正例（write の更新。v1.1（I-1）。応答例 allowWrite と対）
                description: write 階層の permission `update` を fully_consistent で評価する。Txn-Token は write 以上の経路で運ばれるので `Txn-Token` ヘッダにも付ける（§4.3 (a)）。`txn` は検証済み Txn-Token の `txn` の写し（preview）。
                value:
                  subject:
                    type: core/user
