  description: |
    > 文書ID: CON-03 / 版: 0.1 / 状態: draft / 最終更新: 2026-10-15
    > 対応要求: R-098, R-144, R-205（DL-72 行）、R-142, R-109, R-152, R-204, R-262／G-066, G-072, G-109, G-118, G-120, G-121
    > 依存文書: info.x-depends-on を参照
    > 作成方法: AI エージェント（Claude）が ADR-011 ほかの決定を契約に落として起草した。CTO/CISO の決裁を経ていない（CONVENTIONS §8）[D]。
    > 独立レビュー: 作成者とは別のエージェント（Claude）が 2026-10-15 に原典（AuthZEN 1.0 Final）を再取得して照合し、修正した。記録は 11_contracts/review-notes/CON-03.md。人による照合は未実施 [D]。

    ## 1. 位置付け
    - 本契約は PEP（依存サービスの SDK または契約適合の自前実装）が cell 内の PDP façade を呼ぶ唯一の認可判定契約である（ADR-011 D5-1・D5-3・D5-4）[D]。engine（OpenFGA・SpiceDB 等）のネイティブ API・ヘッダを依存サービスが呼ぶことは CI で拒否する（ADR-022 D-3-2、G-072）[D]。
    - 準拠先は OpenID AuthZEN Authorization API 1.0 で、状態は final（OpenID Final Specification）である（確認日 2026-10-03、standards-status SS-C13）[N][^1]（RS-07#60）。Implementer's Draft（SS-C14）は置換済みで使わない [D]。
    - AuthZEN 1.0 は search API（subject・resource・action の 3 種、§8）を**含む** [N][^2]（RS-07#65）。本契約は resource search だけを preview として定め、subject search と action search は v1 では公開しない（下記 §3）[D]。
    - AuthZEN は PDP の状態管理と policy 言語を範囲外とし、整合性トークンや鮮度の指定を定義していない [N][^1]（RS-07#61）。そのため decision_id・model/policy revision・consistency・reason・obligation・txn は、AuthZEN 1.0 外の版付き自社 profile として `context` で運ぶ（ADR-011 D6-1）[D]。

    ## 2. 準拠範囲と自社 profile の区分（AuthZEN の項目名・意味は変えない）
    | 区分 | 項目 | 成熟度（ADR-022 D-2） |
    |---|---|---|
    | AuthZEN 1.0 | evaluation（§6）、evaluations と `options.evaluations_semantic`（§7）、Subject/Resource/Action/Context/Decision の情報モデル（§5）、PDP metadata（§9）、X-Request-ID の往復（§10.1.3） | GA |
    | AuthZEN 1.0 | resource search（§8.5）とページング（§8.2） | preview（ADR-022 D-2。SDK の一覧ヘルパの内部専用。ADR-011 D5-2） |
    | AuthZEN 1.0 | subject search（§8.4）、action search（§8.6） | 公開しない（v1）。subject search は ADR-011 D5-2・ADR-025 D25-03 の決定。action search は ADR に明記がなく未決（ADR-011／ADR-025）。本契約は安全側として公開しない |
    | 自社 profile（AuthZEN 1.0 外） | `decision_id`、不透明な consistency token | GA（ADR-022 D-2 の DL-72 行） |
    | 自社 profile（AuthZEN 1.0 外） | `model_revision` の表現、`obligations`、search の `completeness` | preview（ADR-022 D-2、ADR-025 D25-21） |
    | 自社 profile（AuthZEN 1.0 外） | `reason`、`consistency.mode`、`model.pin`、`profile_version` | GA 候補。ADR-022 D-2 の DL-72 行は GA 範囲にこれらを挙げていない。存在と意味は ADR-011 D6-1 で決定済みだが、GA 区分は未決（ADR-022）。`reason` の値追加の互換区分も未決（ADR-016 P16-2） |
    | 自社 profile（AuthZEN 1.0 外） | `txn` | preview。Transaction Tokens が Internet-Draft（-11、IESG 未提出、確認日 2026-10-03、SS-B04）であり、Internet-Draft に依存する要素は preview 以下に置く（ADR-022 D-1-1）。値の意味だけを固定し、発行範囲は未決（ADR-005 H-20・ADR-009、U-02） |
    | 注記 | GA の Decision 応答が preview の `model_revision`（表現）を必須で含む | ADR-022 D-1-1 の「GA から preview への必須依存を作らない」との関係は未決（ADR-022）。本契約は ADR-011 D6-1 の「存在は必須」に従い、表現の変更は profile_version の major で扱う [D] |

    - 互換規則: minor では後方互換な追加だけを行う（AuthZEN §4 の "MAY augment" / "MUST NOT modify" に揃える）[N][^1]（RS-07#62）[D]。制約を強める変更は `profile_version` の major を上げ、未対応の façade は `unsupported_profile` で拒否する（ADR-011 D6-2）[D]。endpoint の識別子は v1 を含む（AuthZEN の SHOULD）[N][^1]（RS-07#62）。
    - 非推奨の告知は Deprecation header（RFC 9745、Proposed Standard）と Sunset header（RFC 8594、Informational）で行う [N][^6][^7]（RS-16#34, #35）。期間の値は DL-70・ADR-016 で決める [D]。

    ## 3. search 系の扱い
    - resource search は PEP が直接呼ぶ契約にしない。SDK の一覧ヘルパの内部だけで使い、返却前に evaluations（`execute_all`）で後段 Check することを必須とする（ADR-011 D5-2、ADR-025 D25-04、ADR-022 D-2-2）[D]。AuthZEN 自身が「search の結果を evaluation にかけると true に SHOULD なるが保証されない」と述べる [N][^2]（RS-07#65）。
    - ページングは原子的スナップショットを保証せず、結果の重複・欠落があり得る [N][^2]（RS-07#65）。続きのページの要求は最初の要求と同一の entity とパラメータを MUST で求められる [N][^2]。façade は `page.token` を主体・テナント・検索条件・model revision に束縛した MAC 付きの短命値として発行し、他の主体・テナントで提示された token を拒否する（ADR-025 D25-15）[D]。状態コードは、他の主体・テナントの token が 403、同じ主体での条件・`limit` の変更と期限切れが 400 である（AuthZEN §8.2 は変更時にエラーを返すことを SHOULD とする）[N][^2][D]。
    - `page.total` は返さない。候補段の件数を依存サービスに返さないためである（ADR-025 D25-13、RS-07#78）[D]。AuthZEN でも `total` は OPTIONAL である [N][^2]。
    - `page.limit` の上限は 100 とし、超えた要求は 400 にする（ADR-025 D25-17）[D][NA-025-1（前提台帳へ追加要）]。
    - subject search は OpenFGA の AuthZEN 実装にページングがなく、SpiceDB の LookupSubjects がカーソル非対応のため v1 で公開しない（ADR-011 D5-2）[V][^5][D]（RS-07#23, #68）。権限棚卸しは privileged の管理 API（DL-26）で扱う（ADR-025 D25-03）[D]。

    ## 4. 認証（PEP の認証）
    - PEP–PDP 間の通信の保護は AuthZEN で MUST、PDP による PEP の認証は SHOULD である [N][^3]（RS-07#66）。本契約は workload ID の mTLS（ADR-009）を必須とする（ADR-011 D5-7）[D]。認証できない場合は 401 を返す（AuthZEN §10.1.2）[N][^3]。
    - 応答署名（AuthZEN では PDP の MAY）は v1 では採らない（ADR-011 D5-7）[D]。**未決（ADR-013 KD13-6、reconciliation-notes U-04）**: read-sensitive の fail-static を許すと決まった場合は、read-sensitive の判定記録への署名を本 profile の要件に加える [D]。
    - PEP SDK は `/.well-known/authzen-configuration` の `policy_decision_point` が取得に使った識別子と一致しないメタデータを使わない（AuthZEN §9.2.3 の MUST NOT）[N][^3]（RS-07#66）。

    ## 5. テナント境界
    - テナント（`tid`）を `subject.properties` と `resource.properties` の両方に入れる（ADR-011 D6-1）[D]。`resource.properties.tid` は PEP が L0 で照合済みの resource-derived tenant であり、要求パラメータ・path・header の生値ではない（ARC-06 §3.3）[D]。
    - façade は engine に渡す前に、G 段規則 1 として両者の不一致を決定論的に deny する（ADR-010 D-28、ARC-05 §4.1）[D]。応答は decision=false、reason=`deny_guardrail:<規則ID>` である [D]。越境共有はゲストに資源側テナントの token を発行する形で表すので、照合式に例外はない（ADR-024 D24-01・D24-07）[D]。
    - `tid` の欠落は AuthZEN 上の必須項目の欠落ではないので 400 にせず、評価不能（decision=false、`deny_indeterminate`）とする（ADR-011 D3-3）[D]。
    - façade はテナントから store・cell を引いて routing する（ADR-011 D5-3）[D]。自 cell に収容されていないテナントの要求の応答は未決（ADR-013）であり、本契約の暫定動作は decision=false、`deny_indeterminate` とする [D]。
    - PEP の L0 拒否（PDP を呼ばない拒否）の理由値は façade の `reason` に含めない。値は未決（ADR-011／ADR-012 L-05、ARC-06 L06-2）で、ARC-06 §3.7 の暫定名（`l0_missing` 等）を監査（DL-77）側で使う [D]。

    ## 6. レート制限・過負荷
    - DoS 対策（rate limiting など）は AuthZEN で SHOULD である [N][^3]（RS-07#66）。façade はテナント単位・クライアント（workload）単位の同時実行数上限とクォータを置き、一覧（search）は Check と別レーン・別クォータにする（ADR-010 D-29、ADR-013 D13-17、ADR-025 D25-17）[D]。値は TBD（所有者: 認可・PDP チーム、期限: DL-72 凍結前、決め方: DL-20・DL-58 の容量と TC 実測）[D][A-025, A-046]。
    - クォータ超過は 429 と Retry-After で返す [N][^8]。429 は HTTP 標準のステータスであり、AuthZEN §10.1.2 の表（400・401・403・500）にはない。本契約での使用は profile の追加である [D]。
    - 過負荷時の shed（低い操作階層から）と engine 不達は区別する。façade 自体が受け付けられない場合は 503（Retry-After 付き）[N][^9]、façade が受け付けたが engine に届かない場合は 200・decision=false・`deny_unavailable` を返す（ADR-011 D3-6）[D]。PEP SDK はいずれも「判定が得られない」として操作階層ごとの fail-mode（DL-19、ADR-013 D13-25）を適用し、fail-open しない（ADR-013 D13-23）[D]。
    - クォータ判定系が止まった場合は各ノードが最後の閾値で動く fail-static とする（ADR-013 D13-17）[D]。

    ## 7. エラー
    - 認可の拒否は HTTP エラーではなく 200 と `{"decision": false}` で返す（AuthZEN §10.1.2）[N][^3]。
    - 要求全体の誤りは HTTP ステータスで返し、本文は AuthZEN の表どおり「エラーメッセージ文字列」とする [N][^3]。依存サービスは本文の文字列一致に依存しない（ADR-022 D-3-2）[D]。
    - evaluations の個別要素の誤りは要素の `context.error`（`status`・`message`）で返し、decision は false とする（AuthZEN §7.2.1）[N][^2]。本 profile では同時に `reason`=`deny_indeterminate` を付ける [D]。
    - PEP SDK は、façade 不達・timeout、`deny_unavailable`、`deny_indeterminate`、`unsupported_profile`、`decision_id` の欠落、X-Request-ID の echo 不一致を「判定が得られない」として扱う（ARC-06 §3.5）[D]。
    - `reason` はエンドユーザーに返さない（ADR-011 D6-1）[D]。

    ## 8. 正例・負例
    各 operation の `examples` に正例とスキーマ上は妥当な負例を置き、スキーマに違反する負例（400 になるもの）は `x-negative-examples` に分けた。負例の説明は各 example の `description` に書く。主な負例: テナント不一致（`deny_guardrail`）、必須属性の欠落（400）、未対応の profile major（`unsupported_profile`）、整合性の格下げ要求（格上げして評価）、解釈できない consistency token（`fully_consistent` に格上げ）、engine 不達（`deny_unavailable`）、privileged 操作での `permit_on_first_permit`（400）、evaluations が空で上位の既定値もない要求（400）、search の `limit` 超過（400）、他主体の page token（403）。応答側は評価不能（`deny_indeterminate`）と未対応 profile（`unsupported_profile`）の例を置く。

    ## 9. 未決（ADR で決まっていない点。本契約の暫定値は安全側）
    | 論点 | 決める場 | 暫定 |
    |---|---|---|
    | profile キー名 `x-authz-profile` と `tid` のキー名 | ADR-021（D21-25〜D21-28 の名前空間台帳。DL-71） | 本書の名前 |
    | consistency token の最大長 | ADR-011 D6-4（DL-72 凍結前、候補 engine の実測） | 1,024 バイト（ADR-010 D-14、NA-010-2（前提台帳へ追加要）） |
    | OpenFGA の窓方式 W | ADR-010 §2.12 決裁案 2（U-03） | 常時格上げ（ADR-011 D6-3） |
    | 応答署名と read-sensitive の fail-static | ADR-013 KD13-6（U-04） | 署名なし、PEP は known-good を使わない |
    | `txn` の発行範囲と façade での Txn-Token 検証 | ADR-005 H-20・ADR-009（U-02） | `txn` は任意。値は検証済み Txn-Token の `txn` の写し |
    | obligation の語彙 | ADR-011 §8・ADR-022（AuthZEN Profile for Obligations は WG Draft、SS-C18） | preview。未知の obligation は PEP が deny |
    | 越境共有・型付き例外による許可を区別する reason | ADR-024 D24-20 からの申し送り | 未追加（`allow` のみ） |
    | action search | ADR-011／ADR-025 | 公開しない |
    | evaluations の要素数上限・要求本文の上限 | 認可・PDP チーム（DL-20） | TBD |
    | G 段規則 ID の形式 | ADR-011（CAM、DL-17） | `[a-z0-9_.-]{1,64}` |

