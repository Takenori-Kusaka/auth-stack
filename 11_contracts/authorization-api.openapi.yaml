    | N-3 | 10_integration/integration-patterns.md（INT-02。認可モデル例の行）、10_integration/authz-modeling-guide.md（INT-03） | `docs.document.read`・`docs.document.update` を「操作（scope の形）」としている記述を、`action.name` は `read`・`update`（permission 名）、scope の形は CON-02 `ExternalScope` に限る、と書き分ける。判定宣言（§4.2）の登録時に、宣言した permission がモデルに存在することを lint で確かめる手順を加える |
    | N-4 | 11_contracts/schemas/audit-event.schema.json（CON-08） | `action.name` の説明の例 `can_read` を `read` に改める |
    | N-5 | 11_contracts/schemas/common.schema.json（CON-02） | `ActionName` は本書の Action.name と同じ pattern（`NameSegment`）であることを確認し、凍結前に本書が `$ref` で参照できる形にする。I-5 の後半（`subject.type` の写像を 1 か所に）として、token の `ptype`（`human` 等）から `subject.type`（`core/user` 等）と `principal_type` への写像表の正本を置く |
    | N-6 | 11_contracts/review-notes/CON-03.md、traceability/change-log.md | 本改訂（版 0.3、V-1〜V-7）の記録 |

    ## 13. v1.1 の同期（他文書からの申し送りの反映）
    v1.1 の各改訂が本書に宛てた申し送りを、v1.1 の同期作業（AI エージェント）で反映した。人による照合は未実施である [D]。

    | 申し送り | 内容 | 反映 |
    |---|---|---|
    | CON-02 HO-I7-1（v1.1（I-7）） | `TenantId` を CON-02 への参照にし、例の tid を払い出し規則に合う値に替える | `components/schemas/TenantId` を `./schemas/common.schema.json#/$defs/TenantId` への参照にした。例の tid を `t5wq2hzr7nmc4ka3vd6pxe2bfy`・`u3nb7xk2qm5zr4ha6tc2wfe7dy` に替えた（すべての出現）。`operation_tier` は CON-02 `OperationTier` への参照のまま [D] |
    | CON-04 HO-V11-4（v1.1（I-7）） | `operation_tier` の写像が不要になった旨 | façade は `operation_tier` を CON-04 の `CamPermission.tier` から引く。v1.1 で両者が同じ CON-02 `OperationTier` の表記（`read-sensitive`、`privileged/T` など）になったので、façade は表記の写像を持たない。v1.0 の CON-04 の表記（`read_sensitive`・`privileged`）は受理しない [D] |
    | CON-11 §14.3 H11-1（v1.1（I-1）） | echo proxy の所在、件数連動、metadata、例の名前の変更の注意 | (1) `XRequestIdEcho` の説明に `11_contracts/kit/echo-proxy.js` を記した。(2) evaluations の説明に規則 R5 を記した。(3) PDP metadata の説明に規則 R3 を記した。(4) 改版の注意: `Prefer: example=` で選ぶ例の名前（`allowWrite`・`mixed`・`oneItem`・`threeItems` など）を変える改版は、CON-11 kit/README.md §2.2 の R7 の例と連携チームの CI に影響するので、CON-01 CP-60 の通知の対象とする [D] |
    | INT-02 §9.2 HO11-1（v1.1（I-5）） | examples の `can_read` を `read` に、`Action.name` の説明 | 本書 v1.1（版 0.3）の §11 V-6 で反映済みであることを確かめた（examples に `can_read` は 0 件、`Action` の説明に scope の形と `can_` 前置を使わない旨がある）[D] |
    | INT-02 §9.2 HO11-3 (a)（v1.1（I-6）） | PP-2 は searchResources を呼べないこと、façade が SDK とアプリコードを区別できないこと | `/access/v1/search/resource` の description に加えた。(b)(c) は CON-11 に反映した [D] |
    | INT-02 §9.2 HO11-5、INT-03 §16.4 HO-V11-3 | 主体以外を subject にする照会、判定宣言に core の permission を入れること | 決裁事項なので §9 に未決として加えた [D] |
    | INT-03 §16.4 HO-V11-8 | §12 N-3 の INT-03 の分を閉じる | INT-03 版の N-26・§15.2 S-5 で反映済み。N-3 は INT-02 の分（認可モデル例の行）を残す [D] |
    | CON-08 x-handoff-v1.1 の 4（v1.1（I-5）） | `subject.type` の写像の正本、監査の `human` と別の欄であること | `Subject` の説明に CON-02 `x-subject-type-map` と、CON-08 の欄との違いを記した [D] |
    | §12 N-5 の確認 | `ActionName` と本書の `Action.name` の pattern | CON-02 `ActionName` は `NameSegment` への参照で、本書の `Action.name` の pattern と同じであることを確かめた。本書から `$ref` で参照できる形である（参照への置換は凍結前に行う）[D] |

    - 互換性: `TenantId` の参照化は値の集合を変えない。例の値の変更は契約の振舞いを変えないが、汎用モックの応答の値が変わるので、例の値を試験の期待値に固定していた連携チームは期待値を替える必要がある [D]。

