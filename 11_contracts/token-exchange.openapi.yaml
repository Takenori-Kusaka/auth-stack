      text: 内部開始取引の txn の意味（入口を edge と内部開始の 2 つとするか）。DEC-3 の決裁資料、CTO＋CISO
    - id: ADR-026（内部開始の subject_token 種別）
      text: 本契約の提案 X74-01（下記 InternalStartReference）。ADR-026 D26-16 が DL-74 に内部開始の要求形式を求め、ADR-009 D09-24 が unsigned_json を禁じたため、受付記録への不透明な参照を subject_token にする形を置いた。A4（イベント consumer）の参照形式は DL-71 の受付記録参照形式と合わせて決める（未決）
    - id: Txn-Token の置換（ADR-026 D26-03 の段内置換、draft-11 §13.15）
      text: ADR-026 は同一段の内部で scope を狭める置換を認めるが、草案は Txn-Token を subject_token にする要求の subject_token_type を定めていない（§11.2 に Txn-Token の値がない）。v0.1 は置換要求を定義せず T03 で拒否する。追加時は txn・sub・aud を変えない・期限切れを置換しない（草案 §13.15 の MUST NOT）を負例 N-34 として契約に入れる。所有者 CTO、期限 DL-115 凍結前
    - id: ADR-017 L17-1
      text: AS 製品（第一候補）の公式文書が delegation を Preview とし token exchange の resource に未対応と記す。本契約は製品に依存しない要求・応答形を固定し、STS の構成基盤は TC-017-11 の結果で決める（CTO、Gate 3）
    - id: ADR-017 L17-2
      text: +AGT の要求で tctx に起点エージェントを入れるか（U-02 と同時）
    - id: ADR-017 L17-5
      text: authorization_details（RFC 9396）の受付開始。v1 では受け付けない（invalid_request）
    - id: ADR-009 P09-1（DEC-3）
      text: SPIFFE trust domain の数（本番 3 か 1 か）。例の SPIFFE ID はパーティション別の案で書いたが、契約の形は変わらない
    - id: ADR-009 D09-37
      text: 法域パーティション越えの委任（identity chaining 草案 -17、RFC Ed Queue）。本契約 v0.1 では定義せず、RFC 発行後に preview として追加する
    - id: DL-115 KC-1
      text: tctx の claim 名（tid, root_jti, gref, sid, tier, ptxn, ver）は名前案。確定は DL-115
    - id: 記述形式
      text: openapi 欄 3.1.0 と ADR-022 D-2 の 3.1.2 の表記統一（DL-69）
  x-reason-codes:
    sts:
