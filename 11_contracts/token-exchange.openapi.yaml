    tts:
      T01: { error: invalid_client, http: 401, meaning: mTLS の SVID が無効、または未登録 }
      T02: { error: invalid_request, http: 400, meaning: actor_token が含まれる }
      T03: { error: invalid_request, http: 400, meaning: subject_token が未署名・期限切れ・他 cell の issuer・typ 不一致、または subject_token_type が unsigned_json・self_signed・v0.1 で定義しない種別（Txn-Token を subject_token にする置換要求を含む） }
