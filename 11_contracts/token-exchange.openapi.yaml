    ## 0. 要旨

    - 本契約は、cell 内 STS が提供する RFC 8693 token exchange（利用者委任の各 hop で、呼出し先 1 サービスを aud とする内部 access token を取り直す）と、TTS への Transaction Token 要求の 2 操作を定める [D]（ADR-009 D09-10, D09-32）。
    - Transaction Token の要求を同じ RFC 8693 の形式で扱うのは ADR-009 D09-27・D09-32 に従う [D]。草案は、リモートの TTS に HTTP で要求する場合は RFC 8693 を使わなければならない（MUST）とする [N][^4]（RS-06#32）。ADR-022 D-2 は `requested_token_type` に txn_token を指定する行を preview、それ以外を GA 候補と分けたので、本契約も 2 つの operation に分け、各要素に `x-freeze-class` を付けた [D]。
    - 標準の項目名・意味は変えない。社内 profile は許容値を絞るだけである [D]。絞った点は次の 6 つである [D]。(1) `actor_token` を送られたら拒否（ADR-009 D09-14）、(2) `resource` をちょうど 1 つ必須（D09-11）、(3) access token 要求では `audience` を受け付けない（ARC-04 W55-14 を本契約で確定）、(4) scope は subject_token の scope と交換登録簿の上限の共通部分以下（D09-15）、(5) `act` の深さ上限と循環拒否（D09-16）、(6) refresh token を発行しない。
    - `may_act` は token に載せず、subject_token に含まれていても判定に使わない [D]（ADR-009 D09-17）。RFC 8693 は `may_act` を、ある主体が actor になることを認可されているという表明として定義し [N][^1]、処理義務を定めていない（RS-06#45）。
    - 値（N_act、各寿命）は根拠となる実測がないため初期案または TBD とし、所有者・期限・決め方を `info.x-profile` に記した [D]。

    ## 1. 本契約の範囲

    | 範囲内 | 範囲外（正本） |
    |---|---|
    | 同期呼出しの各 hop の exchange（P-03）、edge の最初の exchange | 外部 client の token 取得・OIDC profile（ADR-005、DL-69 収載） |
    | Txn-Token の要求（edge 起点、内部開始） | M2M の client credentials grant（ADR-009 D09-19、ARC-04 §4.4） |
    | エラーコードと理由コード（R01〜R10、T01〜T08） | 発行する token の claim の正本（DL-75、DL-115） |
    | 負例の期待結果 | 法域パーティション越えの委任（identity chaining。下記「未決」） |

    ## 2. 処理の要点（ADR-009・ARC-04 の写像）

    1. クライアント認証は X.509-SVID による mTLS（RFC 8705 の `tls_client_auth`、SAN URI 照合）だけとする [D]（ADR-009 D09-14）。RFC 8693 はクライアント認証を OAuth 2.0 の通常の仕組みで行うとする [N][^1]。RFC 9700 は非対称暗号のクライアント認証を RECOMMENDED とする [N][^7]（RS-17#19）。共有 client secret（client_secret_basic 等）は定義しない [D]（ADR-009 D09-18）。
    2. actor（`act` の現在の actor）は、STS がクライアント認証で確かめた要求元の主体とし、要求元の自己申告を使わない [D]（ARC-04 §5.3）。actor を別の bearer token で表すと、その token の窃取・偽造が委任の偽装に直結するためである [D]（ADR-009 D09-14、CVE-2025-55241 の教訓。RS-05#34）。
    3. 判定順は ARC-04 §5.2 の図のとおり（mTLS → actor_token 有無 → subject_token → resource → 登録簿 → scope → act 深さ・循環 → 失効状態）とし、最初に該当した理由で拒否する [D]。
    4. 出力 token の不変条件: `aud`＝`resource` の 1 値、`sub`・tid・grant 参照・`sid` は入力と同じ、`act` は現在の actor を最外に追加、`cnf` は要求元 SVID の x5t#S256、`exp` は info.x-profile.lifetimes の式 [D]（ARC-04 §5.5）。RFC 8693 は入力 token と出力 token の間に強い結び付きを作らず、失効の伝播を STS の一般的性質としないので [N][^1]（RS-06#44）、寿命の入れ子で上限を固定する [D]（ADR-009 D09-40）。
    5. 拒否の理由詳細（R01〜R10、T01〜T08）は `error_description` に入れず、交換台帳・発行台帳にだけ記録する [D]（ARC-04 W55-18）。要求元への応答から交換登録簿の内容を推測させないためである [D]。
    6. TTS・STS に届かない場合（503 等）、呼出し元は未署名の代替経路で下流を呼ばない [D]（ADR-009 D09-42、ADR-013 D13-15・D13-23）。

    ## 3. 凍結区分（ADR-022 D-1・D-2）

    | 要素 | 区分 |
    |---|---|
    | `/token`（access token の exchange）の要求・応答・エラーコード・subject/actor token 種別・resource 必須・act の深さ上限の規則 | GA 候補（DEC-8 前は draft） |
    | `/txn-token`（requested_token_type=txn_token）の要求・応答 | preview（draft-11 依存） |
    | 内部開始の subject_token 種別（本契約の提案） | preview |
    | 派生 token の寿命の値、エンドポイント URL・配置 | 凍結しない |
    | 理由コード R01〜R10・T01〜T08 の意味 | GA 候補（エラーコードの意味の変更は破壊的変更。ADR-022 D-5-1） |

    preview の要素には GA 昇格・改版・廃止を判断する期限を付ける（ADR-022 D-1-2）。期限の値は TBD（所有者 CTO、期限 DEC-8 前、決め方 ADR-022 D-1-2）[D]。`/token`（GA 候補）は `/txn-token`（preview）に必須依存しない（ADR-022 D-1-1）[D]。

    ## 4. 記述形式

    `openapi` 欄は 3.1.0 とした [D]。ADR-022 D-2 は記述言語を OpenAPI 3.1.2 とするが、OAS の patch 版は文書の誤りの訂正・明確化であって機能集合を変えず、3.1 を支えるツールは 3.1.* のすべてと互換であるべき（SHOULD）で、patch 版をツールは考慮すべきでない（SHOULD NOT）とされる [N][^8]。本契約は 3.1 系の機能だけを使い、契約群の統一表記は DL-69（11_contracts/README.md）で決める（未決。所有者 CTO、期限 DEC-8 前）[D]。

    モック・コード生成の注意 [D]: 拒否すべき標準パラメータ（`actor_token`、`audience` 等）は `not: {}` で表したため、スキーマ検証型のモック（要求検証つきのモックサーバ）は、これらを含む要求を RFC 6749 §5.2 形式の 400 ではなく各ツール固有の検証エラーで返す。契約試験で期待するエラー応答（`invalid_request` 等）は `x-negative-request-examples` と `info.x-negative-examples` を正とし、モックの検証エラーで代用しない。コード生成では `not: {}` のプロパティが任意型の欄として生成され得るので、client SDK はこれらを送出しない。

    ## 5. 未決（ADR で決まっていない点）

    info.x-open-issues に一覧化した。主なものは、Txn-Token の発行範囲（未決（ADR-005 U2／ADR-009 P09-2、U-02））、内部束縛 I1/I2（未決（ADR-005 K-6））、内部開始の `tctx`（未決（ADR-026 L26-1））と `txn` の意味（未決（ADR-026 L26-2））、AS 製品の delegation 対応（未決（ADR-017 L17-1））である [D]。

    ## 6. 誠実性

    本契約は AI エージェント（Claude）が ADR・設計文書・research を通読して起草した [D]。research にない原典（RFC 8693 §2.2.1・§2.2.2・§3、RFC 6749 §3.2・§5.1・§5.2、Transaction Tokens draft-11 §11.1・§11.4・§13.3、OAS 3.1.2 §4.1）は起草者が 2026-10-15 に取得して照合した。作成者以外のエージェントによる独立レビュー（RFC 8693 §2.1〜§3、draft-11 §9.1・§9.2・§11.1〜§11.4・§13.15 を 2026-10-15 に再取得して照合）を 2026-10-15 に行い、記録を 11_contracts/review-notes/CON-05.md に置いた。人による照合と traceability/ への照合ログ追記は未了である（CONVENTIONS §8）。負例は 1 件も実行しておらず、本契約の主張はすべて設計段階のものである [D]。

