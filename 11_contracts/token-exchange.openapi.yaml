    ## 8. モックでの使い方（v1.1（P-19、P-11））

    - 静的な例を返すモック（Prism 5.12.0 で確認）は、要求の `scope` に関係なく 1 つの例を返す。応答の例を選ぶには、要求に `Prefer: example=<例の名前>` を付ける（例: `Prefer: example=hopToPayment`）[D]。この挙動は Prism 5.12.0 の実装（`@stoplight/prism-http-server` の `dist/getHttpConfigFromRequest.js` が `Prefer` ヘッダの `code`・`example`・`dynamic` を読む）で 2026-10-15 に確認したもので、公式文書での確認は未了（未確認）である [D]。他のモックは各ツールの方法による。
    - 応答の `scope` は STS が「要求 scope ∩ subject_token の scope ∩ 登録簿の上限」で決める（profile の (4)）。例の値は 1 つの場合を示すだけで、利用者は応答の `scope` が要求以下であることだけを確かめ、要求と一致することを前提にしない [D]。
    - Txn-Token の例は試験鍵で署名済みで、`exp` は 1792051260（2026-10-15T08:01:00Z）である。署名検証の正例試験は時計を `iat`〜`exp` の間に固定して行う [D]。期限切れ・鍵不一致などの負例は、info.x-test-signing-key の秘密鍵で payload を書き換えて署名し直して作る（手順は同欄）[D]。
    - 試験鍵は公開されているので、これで署名された token は誰でも作れる。本番・検証環境の trust 設定（配置スナップショットの TTS 鍵）に `kid` が `test-only-` で始まる鍵を入れてはならず、受信側 SDK はその `kid` の token を本番 profile で拒否する（§9 HO-04）[D]。

