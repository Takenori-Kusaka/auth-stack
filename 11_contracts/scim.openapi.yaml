  license:
    name: Proprietary（社内契約。外部公開の可否は DL-69 で決める）
    identifier: LicenseRef-internal-contract
  contact:
    name: 認証チーム（契約所有者。ADR-022 D-3 の契約変更審査会が変更を審議）
servers:
  - url: https://{scimHost}/v1/scim/v2
    description: テナントの home cell の SCIM endpoint。host 名は未決（ADR-021 D21-25、ADR-013 の cell 振分け）。`/v1` は契約 major（ADR-016）、`v2` は SCIM 版（RFC 7644 §3.13）。
    variables:
      scimHost:
        default: scim.id-domain.example
        description: 仮置き。本番の host 名は ADR-021 の `<id-domain>` 配下で DL-71 が払い出す。
security:
  - oauthClientCredentials: [scim]
    mtlsClient: []
  - oauthClientCredentials: [scim]
x-security-note: 1 つ目（OAuth＋mTLS）が既定。2 つ目（OAuth のみ）は end-to-end mTLS を張れない相手に限る DPoP＋nonce の例外（ADR-005 の外部 M2M 行）を表し、接続単位で有効にする。staticBearerException は D04-40 の例外で、接続単位の受容票がある場合だけ有効にするためトップレベルの security に含めない。
x-lint-notes:
  tool: "@redocly/cli lint（recommended 設定）"
  date: "2026-10-15"
  errors: 0
  warnings:
    - rule: operation-2xx-response
      location: /Bulk post, /Me get
      reason: v1 で提供しない endpoint を 501 として明示するため、2xx 応答を意図して持たない（RFC 7644 §3.12 の 501）。
    - rule: no-unused-components
      location: components.securitySchemes.staticBearerException
      reason: 例外専用（D04-40）。受容票のある接続に限るため、意図してトップレベル・操作の security で参照しない。
tags:
  - name: Users
    description: User 資源（テナント内の所属を表す）。RFC 7643 §4.1・§4.3 と本基盤の拡張。
  - name: Groups
    description: Group 資源。v1 の members は同じテナントの User だけ。
  - name: Discovery
    description: ServiceProviderConfig・ResourceTypes・Schemas（RFC 7644 §4）。
  - name: Unsupported
    description: v1 で提供しない endpoint。501 を返す。
paths:
  /ServiceProviderConfig:
    get:
      tags: [Discovery]
      operationId: getServiceProviderConfig
      summary: 対応機能の取得
      description: v1 の対応機能を返す。値は components.examples.ServiceProviderConfigV1 を正とする [D]。v1 では認証を求める。RFC 7643 §5 の「authenticationSchemes は事前認証なしで取得できるようにすべき（SHOULD）」からの逸脱であり、公開化の可否は未決（§7、DL-26）。
      responses:
        "200":
          description: 対応機能
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ServiceProviderConfig"
              examples:
                v1:
                  $ref: "#/components/examples/ServiceProviderConfigV1"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /ResourceTypes:
    get:
      tags: [Discovery]
      operationId: listResourceTypes
      summary: 資源型の一覧
      responses:
        "200":
          description: User と Group の 2 型
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ListResponse"
              examples:
                v1:
                  $ref: "#/components/examples/ResourceTypesV1"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /ResourceTypes/{name}:
    get:
      tags: [Discovery]
      operationId: getResourceType
      summary: 資源型の取得
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            enum: [User, Group]
      responses:
        "200":
          description: 資源型
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ResourceType"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /Schemas:
    get:
      tags: [Discovery]
      operationId: listSchemas
      summary: 対応スキーマの一覧
      description: User・Group・Enterprise User 拡張・本基盤の連携拡張の 4 スキーマを返す。返す属性定義は v1 で受け付ける属性だけに絞る [D]。client はこれを見て非対応属性を送らないようにする。
      responses:
        "200":
          description: スキーマ一覧
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /Schemas/{schemaUri}:
    get:
      tags: [Discovery]
      operationId: getSchema
      summary: スキーマの取得
      parameters:
        - name: schemaUri
          in: path
          required: true
          schema:
            type: string
            enum:
              - urn:ietf:params:scim:schemas:core:2.0:User
              - urn:ietf:params:scim:schemas:core:2.0:Group
              - urn:ietf:params:scim:schemas:extension:enterprise:2.0:User
              - urn:example:authstack:scim:schemas:extension:federation:1.0:User
      responses:
        "200":
          description: スキーマ（RFC 7643 §7 の表現）
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimSchemaDefinition"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /Users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: User の照会（GET）
      description: |
        資格情報のテナント内だけを照会する [D]。filter は §6 の制限に従う。個人情報を含む filter は POST /Users/.search を推奨する [D]（RFC 7644 §7.5.2 の SHOULD）。GET の query 文字列はアクセスログに平文で残さない [D]。
      parameters:
        - $ref: "#/components/parameters/Filter"
        - $ref: "#/components/parameters/StartIndex"
        - $ref: "#/components/parameters/Count"
        - $ref: "#/components/parameters/Attributes"
        - $ref: "#/components/parameters/ExcludedAttributes"
      responses:
        "200":
          description: 照会結果（ListResponse）。0 件でも 200。
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
              examples:
                byUserName:
                  $ref: "#/components/examples/UserListByUserName"
        "400":
          $ref: "#/components/responses/QueryBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      x-audit-events: []
      x-negative-examples:
        - name: or を含む filter
          request: GET /Users?filter=userName eq "a@example.com" or userName eq "b@example.com"
          expect: 400 invalidFilter
          reason: §6。論理演算子は and だけ。
        - name: 存在確認だけの filter
          request: GET /Users?filter=userName pr
          expect: 400 invalidFilter
          reason: pr は非対応。RFC 7644 Table 9 が tooMany の例に挙げる形でもある。
        - name: 部分一致
          request: GET /Users?filter=userName sw "a"
          expect: 400 invalidFilter
          reason: 列挙・推測に使える部分一致を提供しない [D]。
        - name: 深い paging
          request: GET /Users?startIndex=10001&count=200
          expect: 400 tooMany
          reason: 暫定上限（10,000 件目）超過。差分照会（meta.lastModified gt）を使う。
        - name: 上限超えの count
          request: GET /Users?count=1000
          expect: 200。itemsPerPage は 200 以下
          reason: count を超えて返さない（MUST NOT）。上限を超える count は maxResults に切り詰める [D]。
        - name: テナント URL prefix
          request: GET /Tenants/{other-tid}/v2/Users
          expect: 404
          reason: §2。テナント明示の手段を定義しない。
      x-tests: [TC-004-12, TC-004-14, TC-004-17]
    post:
      tags: [Users]
      operationId: createUser
      summary: User の作成（所属の追加）
      description: |
        資格情報のテナントに所属を作る。`federatedSubject` で既存の主体・JIT 作成済みの主体と照合し（D04-41）、§3 の C1・C3・C4・C5 に従う。`userName`・`externalId`・email では照合・結合しない [D]。
        `password`、`roles`、`entitlements`、`x509Certificates`、`ims`、`photos` を含む要求は 400 `invalidValue` で拒否する [D]。黙って無視すると、顧客管理者が権限や資格情報を設定したと誤認するためである [D]。password の受付は ADR-001・ADR-003 の範囲外である。
        readOnly 属性（`id`・`meta`・`groups`、連携拡張の readOnly 属性）は拒否せず無視する（RFC 7644 §3.3 の SHALL。§3.1）。
      parameters:
        - $ref: "#/components/parameters/Attributes"
        - $ref: "#/components/parameters/ExcludedAttributes"
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: "#/components/schemas/User"
            examples:
              bound:
                $ref: "#/components/examples/UserCreateBound"
              pendingBinding:
                $ref: "#/components/examples/UserCreateWithoutSubject"
          application/json:
            schema:
              $ref: "#/components/schemas/User"
      responses:
        "201":
          description: 作成した（C1 の結び付けを含む）。Location と ETag を返す。
          headers:
            Location:
              $ref: "#/components/headers/Location"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/User"
              examples:
                bound:
                  $ref: "#/components/examples/UserCreatedBound"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
