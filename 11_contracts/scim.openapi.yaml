      x-tests: [TC-004-12]
    delete:
      tags: [Groups]
      operationId: deleteGroup
      summary: Group の削除
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: 削除した
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      x-audit-events: [scim.received]
  /Bulk:
    post:
      tags: [Unsupported]
      operationId: bulkNotSupported
      summary: Bulk（v1 非対応）
      description: v1 では提供しない。ServiceProviderConfig の bulk.supported=false と一致させる [D]。提供の要否は初回投入時間の実測（DL-20）で判断する（未決）。
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /Me:
    get:
      tags: [Unsupported]
      operationId: meNotSupported
      summary: /Me（非対応）
      description: SCIM client は利用者ではないため提供しない [D]。
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "501":
          $ref: "#/components/responses/NotImplemented"
components:
  securitySchemes:
    oauthClientCredentials:
      type: oauth2
      description: |
        本基盤の AS が SCIM client に発行する access token（opaque。ADR-005）。client 認証は private_key_jwt または mTLS（D04-40）。scope 名 `scim` は仮名（ADR-021・DL-71 で確定）。audience は SCIM API に限る（ADR-005 の共通 aud 禁止）。
      flows:
        clientCredentials:
          tokenUrl: https://login.id-domain.example/oauth2/token
          scopes:
            scim: 'SCIM の User・Group の読み書き（仮名。他の管理 API・監査 API の scope と分離する: DL-26 IAM-SaaS-18）'
    mtlsClient:
      type: mutualTLS
      description: 外部 M2M の sender constraint の既定（ADR-005）。access token を client 証明書に束縛する。DPoP＋nonce は end-to-end mTLS を張れない相手に限る例外（ADR-005）。
    staticBearerException:
      type: http
      scheme: bearer
      description: |
        例外専用（D04-40、NA-004-2）。長寿命の静的 bearer しか送れない顧客 IdP に限り、受容票（DL-05）・移行期限・rotation 周期の上限・送信元制限・P-5 を条件に接続単位で有効にする。既定では無効。トップレベルの security には含めない。
      x-exception-only: true
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      description: SCIM の id。テナント内の所属を表す不透明な値（§2）。大文字小文字を区別して比較する [D]。
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: "^[a-z0-9-]+$"
    Filter:
      name: filter
      in: query
      required: false
      description: §6 の制限付き filter。components.schemas.SearchRequest の x-filter-profile を参照。
      schema:
        type: string
        maxLength: 1024
      examples:
        userNameEq:
          value: userName eq "bjensen@example.com"
        lastModified:
          value: meta.lastModified gt "2026-10-01T00:00:00Z"
    StartIndex:
      name: startIndex
      in: query
      required: false
      description: 1 始まり。1 未満は 1 と解釈する（SHALL、RFC 7644 §3.4.2.4）。startIndex＋count−1 が暫定上限 10,000 を超えたら 400 tooMany [D]。
      schema:
        type: integer
        default: 1
    Count:
      name: count
      in: query
      required: false
      description: 1 ページの件数。負は 0 と解釈する（SHALL）。maxResults（暫定 200）を超える値は 200 に切り詰める [D]。
      schema:
        type: integer
    Attributes:
      name: attributes
      in: query
      required: false
      description: 返す属性の列挙（RFC 7644 §3.9）。
      schema:
        type: string
    ExcludedAttributes:
      name: excludedAttributes
      in: query
      required: false
      description: 返さない属性の列挙（RFC 7644 §3.9）。
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: 弱い ETag。不一致は 412（§5）。送ることを推奨する [D]。
      schema:
        type: string
      example: W/"3694e05e9dff590"
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: 一致すれば 304。
      schema:
        type: string
  headers:
    ETag:
      description: 資源の弱い ETag。meta.version と同じ値（RFC 7644 §3.14）。
      schema:
        type: string
    Location:
      description: 作成した資源の URI。
      schema:
        type: string
        format: uri
    RetryAfter:
      description: 再試行までの秒数（RFC 6585 §4 の MAY を本基盤は必須にする [D]）。
      schema:
        type: integer
        minimum: 1
  responses:
    QueryBadRequest:
      description: |
        400（照会: GET と POST /.search）。scimType は invalidFilter・tooMany・invalidSyntax・invalidValue（RFC 7644 Table 9 の Applicability に従う）。mock は先頭の example（invalidFilter）を返す。
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/ScimError"
          examples:
            invalidFilter:
              $ref: "#/components/examples/ErrorInvalidFilter"
            tooMany:
              $ref: "#/components/examples/ErrorTooMany"
    BadRequest:
      description: |
        400（作成・置換・部分更新）。scimType は RFC 7644 Table 9 の値（invalidValue・mutability・invalidSyntax・invalidPath・noTarget・invalidVers、PATCH の path filter では invalidFilter）。uniqueness は 409 で返す（§3）。mock は先頭の example（invalidValue）を返す。
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/ScimError"
          examples:
            invalidValue:
              $ref: "#/components/examples/ErrorInvalidValue"
            mutability:
              $ref: "#/components/examples/ErrorMutability"
    Unauthorized:
      description: 401。token の欠落・期限切れ・失効・sender constraint 不一致（TC-004-17）。
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/ScimError"
    Forbidden:
      description: |
        403。scope 不足、接続が停止中（顧客 IdP の切離し・遮断）、テナントを示す header と資格情報のテナントの不一致（§2）。不一致は SEC の検知対象。
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/ScimError"
          examples:
            tenantMismatch:
              $ref: "#/components/examples/ErrorTenantMismatch"
    NotFound:
      description: 404。存在しない、削除済み、または他テナントの資源（区別しない）。
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/ScimError"
          examples:
            notFound:
              $ref: "#/components/examples/ErrorNotFound"
    Conflict:
      description: 409 uniqueness（C4・C4'）。要照合キューに置き、テナント管理者に通知する。版の不一致には 409 ではなく 412 を使う（§5）。
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/ScimError"
          examples:
            uniqueness:
              $ref: "#/components/examples/ErrorUniqueness"
    PreconditionFailed:
      description: 412。If-Match が最新の ETag と一致しない（C6）。
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/ScimError"
    PayloadTooLarge:
      description: 413。要求本文が上限（暫定 1 MiB。TBD、DL-20）を超えた。
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/ScimError"
    TooManyRequests:
      description: 429。テナント単位の流量制限（§8）。Retry-After を必ず付ける [D]。
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/ScimError"
          examples:
            rateLimited:
              $ref: "#/components/examples/ErrorRateLimited"
    NotImplemented:
      description: 501。v1 で提供しない機能。
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/ScimError"
  schemas:
    ScimError:
      type: object
      description: RFC 7644 §3.12 のエラー形式。status は文字列（REQUIRED）。RFC 9457 Problem Details は SCIM 経路では使わない（標準の形式を変えない）[D]。
      required: [schemas, status]
      properties:
        schemas:
          type: array
          items:
            const: urn:ietf:params:scim:api:messages:2.0:Error
          minItems: 1
          maxItems: 1
        status:
          type: string
          pattern: "^[1-5][0-9]{2}$"
        scimType:
          type: string
          enum: [invalidFilter, tooMany, uniqueness, mutability, invalidSyntax, invalidPath, noTarget, invalidValue, invalidVers, sensitive]
        detail:
          type: string
          description: 人が読む説明。他テナントの資源の有無、主体の停止理由（SEC・LEG 等）、内部 ID を含めない [D]。
    Meta:
      type: object
      readOnly: true
      properties:
        resourceType:
          type: string
          enum: [User, Group]
        created:
          type: string
          format: date-time
        lastModified:
          type: string
          format: date-time
        location:
          type: string
          format: uri
        version:
          type: string
          description: 弱い ETag（§5）。
    Name:
      type: object
      properties:
        formatted:
          type: string
        familyName:
          type: string
        givenName:
          type: string
        middleName:
          type: string
        honorificPrefix:
          type: string
        honorificSuffix:
          type: string
    MultiValuedAttribute:
      type: object
      required: [value]
      properties:
        value:
          type: string
        display:
          type: string
        type:
          type: string
        primary:
          type: boolean
    Address:
      type: object
      properties:
        formatted:
          type: string
        streetAddress:
          type: string
        locality:
          type: string
        region:
          type: string
        postalCode:
          type: string
        country:
          type: string
        type:
          type: string
        primary:
          type: boolean
    GroupRef:
      type: object
      readOnly: true
      description: User.groups（readOnly。RFC 7643 §4.1.2）。本基盤では当該テナントの Group だけを返す [D]。
      properties:
        value:
          type: string
        display:
          type: string
        type:
          type: string
          enum: [direct, indirect]
      patternProperties:
        '^\$ref$':
          type: string
          format: uri
          description: SCIM の "$ref" 属性（Group の URI）。OpenAPI の参照記法と衝突するため patternProperties で表す。
    EnterpriseUser:
      type: object
      description: RFC 7643 §4.3。manager.value は同じテナントの User の id に限る [D]。
      properties:
        employeeNumber:
          type: string
        costCenter:
          type: string
        organization:
          type: string
        division:
          type: string
        department:
          type: string
        manager:
          type: object
          properties:
            value:
              type: string
            displayName:
              type: string
              readOnly: true
          patternProperties:
            '^\$ref$':
              type: string
              format: uri
              readOnly: true
              description: SCIM の "$ref" 属性（manager の URI）。
    FederationUserExtension:
      type: object
      description: |
        本基盤の拡張（urn:example:authstack:scim:schemas:extension:federation:1.0:User。URN は仮置き）。RFC 7643 §3.3 に従い、拡張 URN を JSON の容器として使い、core の属性を再定義しない [N][^1]。
      properties:
        federatedSubject:
          type: string
          minLength: 1
          maxLength: 256
          description: |
            上流 IdP が発行する不変の利用者 ID（OIDC の sub、Entra では tid＋oid、SAML の persistent NameID）。assertion の外部 subject と同じ値を送る（trust agreement で定める。DL-08 Y-02）。mutability=immutable、caseExact=true、returned=default。email 形式の値や UPN は不可 [D]（D04-21）。長さ上限 256 は暫定（OIDC sub と SAML persistent NameID の上限を受け入れる意図。上限値の原典照合は未了）。
          x-scim-mutability: immutable
          x-scim-caseExact: true
        upstreamIdpIdentifier:
          type: string
          readOnly: true
          description: 上流 IdP の識別子（OIDC issuer／SAML entityID）。資格情報の接続から導く（D04-39）。
          x-scim-mutability: readOnly
        connectionId:
          type: string
          readOnly: true
          description: 本基盤の顧客 IdP 接続 ID（ADR-021 D21-19 の接続 ID）。
          x-scim-mutability: readOnly
        bindingState:
          type: string
          readOnly: true
          enum: [bound, pendingBinding]
          description: bound は Y-02（連携 ID と結合済み）、pendingBinding は Y-03（結合待ち。ログイン不可）。要照合（Y-04）は SCIM 資源にならない（409 で返し要照合キューに置く）。
          x-scim-mutability: readOnly
        provisioningOrigin:
          type: string
          readOnly: true
          enum: [scim, jit]
          description: jit は M3 で JIT 作成済みの主体に SCIM の id を結び付けたもの（C1）。
          x-scim-mutability: readOnly
        effectiveStatus:
          type: string
          readOnly: true
          enum: [enabled, suspended]
          description: 全停止理由を合わせた実効状態。停止理由の内訳（SEC・LEG 等）は返さない [D]。
          x-scim-mutability: readOnly
        deprovisioning:
          type: object
          readOnly: true
          description: active=false・削除で起動した失効の進捗（区間 2 の計測点。TC-004-13）。
          x-scim-mutability: readOnly
          properties:
            state:
              type: string
              enum: [none, inProgress, completed]
            requestedAt:
              type: string
              format: date-time
            completedAt:
              type: string
              format: date-time
    User:
      type: object
      description: |
        RFC 7643 §4.1 の User。v1 で受け付けない属性（password、roles、entitlements、x509Certificates、ims、photos）は 400 invalidValue（§createUser）。未知の拡張 URN を schemas に含む要求は 400 invalidValue [D]。
        readOnly の属性は要求に含まれていても拒否せず無視する（POST は RFC 7644 §3.3、PUT は §3.5.1 の SHALL。説明 §3.1）。要求検証に使う validator・mock は readOnly 属性を除去してから検証する設定にする。
      required: [schemas, userName]
      properties:
        schemas:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
              - urn:ietf:params:scim:schemas:core:2.0:User
              - urn:ietf:params:scim:schemas:extension:enterprise:2.0:User
              - urn:example:authstack:scim:schemas:extension:federation:1.0:User
          contains:
            const: urn:ietf:params:scim:schemas:core:2.0:User
        id:
          type: string
          readOnly: true
          description: service provider が払い出す。client は指定してはならない（MUST NOT、RS-03#75）。
        externalId:
          type: string
          description: client 定義。テナント（provisioning domain）内でだけ一意として扱う（RS-14#33）。照合キーに使わない [D]（D04-41）。
        userName:
          type: string
          minLength: 1
          description: テナント内で一意（大文字小文字を区別しない。RS-03#75）。表示と配送経路にだけ使い、識別・結合・認可に使わない [D]（D04-21）。
        name:
          $ref: "#/components/schemas/Name"
        displayName:
          type: string
        nickName:
          type: string
        title:
          type: string
        userType:
          type: string
        preferredLanguage:
          type: string
        locale:
          type: string
        timezone:
          type: string
        active:
          type: boolean
          description: SCIM client が設定した値（停止理由 SRC の有無）。実効状態は拡張の effectiveStatus（§4）。
        emails:
          type: array
          items:
            $ref: "#/components/schemas/MultiValuedAttribute"
        phoneNumbers:
          type: array
          items:
            $ref: "#/components/schemas/MultiValuedAttribute"
        addresses:
          type: array
          items:
            $ref: "#/components/schemas/Address"
        groups:
          type: array
          readOnly: true
          items:
            $ref: "#/components/schemas/GroupRef"
        meta:
          $ref: "#/components/schemas/Meta"
        urn:ietf:params:scim:schemas:extension:enterprise:2.0:User:
          $ref: "#/components/schemas/EnterpriseUser"
        urn:example:authstack:scim:schemas:extension:federation:1.0:User:
          $ref: "#/components/schemas/FederationUserExtension"
      propertyNames:
        description: v1 で受け付けない属性（400 invalidValue）。password は受け付けない。roles・entitlements は認可属性の取込みが未決（ADR-010・ADR-011）のため受け付けない。x509Certificates・ims・photos は v1 の範囲外。properties に空の not を置くと mock・code generator が null の欄を生成するため、属性名の禁止として表す。
        not:
          enum: [password, roles, entitlements, x509Certificates, ims, photos]
      x-rejected-attributes: [password, roles, entitlements, x509Certificates, ims, photos]
    GroupMember:
      type: object
      required: [value]
      properties:
        value:
          type: string
          description: 同じテナントの User の id。
        display:
          type: string
          readOnly: true
        type:
          type: string
          enum: [User]
          description: v1 は User だけ（入れ子 group は未決）。
      patternProperties:
        '^\$ref$':
          type: string
          format: uri
          readOnly: true
          description: SCIM の "$ref" 属性（member の URI）。
    Group:
      type: object
      description: RFC 7643 §4.2。members の sub-attributes は immutable（追加・除去だけ可）[N][^1]。
      required: [schemas, displayName]
      properties:
        schemas:
          type: array
          minItems: 1
          items:
            const: urn:ietf:params:scim:schemas:core:2.0:Group
        id:
          type: string
          readOnly: true
        externalId:
          type: string
        displayName:
          type: string
          minLength: 1
        members:
          type: array
          items:
            $ref: "#/components/schemas/GroupMember"
        meta:
          $ref: "#/components/schemas/Meta"
    PatchOperation:
      type: object
      required: [op]
      properties:
        op:
          type: string
          enum: [add, remove, replace]
        path:
          type: string
        value: {}
    PatchOp:
      type: object
      description: RFC 7644 §3.5.2。
      required: [schemas, Operations]
      properties:
        schemas:
          type: array
          minItems: 1
          maxItems: 1
          items:
            const: urn:ietf:params:scim:api:messages:2.0:PatchOp
        Operations:
          type: array
          minItems: 1
          maxItems: 100
          description: 1 要求の操作数の上限は暫定 100（TBD、DL-20）[D]。
          items:
            $ref: "#/components/schemas/PatchOperation"
    SearchRequest:
      type: object
      description: RFC 7644 §3.4.3。sortBy・sortOrder は非対応（sort.supported=false）。
      required: [schemas]
      properties:
        schemas:
          type: array
          minItems: 1
          maxItems: 1
          items:
            const: urn:ietf:params:scim:api:messages:2.0:SearchRequest
        attributes:
          type: array
          items:
            type: string
        excludedAttributes:
          type: array
          items:
            type: string
        filter:
          type: string
          maxLength: 1024
        startIndex:
          type: integer
        count:
          type: integer
      x-filter-profile:
        operators: [eq]
        timeOperators:
          attribute: meta.lastModified
          operators: [gt, ge]
        logical: [and]
        maxAndTerms: 2
        rejected: [or, not, co, sw, ew, pr, ne, lt, le, "値 filter（照会での attr[...] 形式）"]
        attributes:
          User: [id, userName, externalId, "urn:example:authstack:scim:schemas:extension:federation:1.0:User:federatedSubject", meta.lastModified]
          Group: [id, displayName, externalId, meta.lastModified]
        onUnsupported: 400 invalidFilter
        onTooBroad: 400 tooMany
        note: 値はすべて暫定（TBD、所有者 CTO、期限 G4、決め方 PoC 実測と DL-20）。
    ListResponse:
      type: object
      required: [schemas, totalResults]
      properties:
        schemas:
          type: array
          minItems: 1
          maxItems: 1
          items:
            const: urn:ietf:params:scim:api:messages:2.0:ListResponse
        totalResults:
          type: integer
          minimum: 0
        startIndex:
          type: integer
        itemsPerPage:
          type: integer
        Resources:
          type: array
          items:
            type: object
    UserListResponse:
      allOf:
        - $ref: "#/components/schemas/ListResponse"
        - type: object
          properties:
            Resources:
              type: array
              items:
                $ref: "#/components/schemas/User"
    GroupListResponse:
      allOf:
        - $ref: "#/components/schemas/ListResponse"
        - type: object
          properties:
            Resources:
              type: array
              items:
                $ref: "#/components/schemas/Group"
    ServiceProviderConfig:
      type: object
      description: RFC 7643 §5。
      required: [schemas, patch, bulk, filter, changePassword, sort, etag, authenticationSchemes]
      properties:
        schemas:
          type: array
          items:
            const: urn:ietf:params:scim:schemas:core:2.0:ServiceProviderConfig
        documentationUri:
          type: string
          format: uri
        patch:
          $ref: "#/components/schemas/Supported"
        bulk:
          type: object
          required: [supported, maxOperations, maxPayloadSize]
          properties:
            supported:
              type: boolean
            maxOperations:
              type: integer
            maxPayloadSize:
              type: integer
        filter:
          type: object
          required: [supported, maxResults]
          properties:
            supported:
              type: boolean
            maxResults:
              type: integer
        changePassword:
          $ref: "#/components/schemas/Supported"
        sort:
          $ref: "#/components/schemas/Supported"
        etag:
          $ref: "#/components/schemas/Supported"
        authenticationSchemes:
          type: array
          items:
            type: object
            required: [type, name, description]
            properties:
              type:
                type: string
              name:
                type: string
              description:
                type: string
              specUri:
                type: string
                format: uri
              documentationUri:
                type: string
                format: uri
              primary:
                type: boolean
    Supported:
      type: object
      required: [supported]
      properties:
        supported:
          type: boolean
    ResourceType:
      type: object
      description: RFC 7643 §6。
      required: [schemas, name, endpoint, schema]
      properties:
        schemas:
          type: array
          items:
            const: urn:ietf:params:scim:schemas:core:2.0:ResourceType
        id:
          type: string
        name:
          type: string
        description:
          type: string
        endpoint:
          type: string
        schema:
          type: string
        schemaExtensions:
          type: array
          items:
            type: object
            required: [schema, required]
            properties:
              schema:
                type: string
              required:
                type: boolean
    ScimSchemaDefinition:
      type: object
      description: RFC 7643 §7 のスキーマ表現（属性定義の詳細は RFC の定義に従い、ここでは外形だけを固定する）。
      required: [id, attributes]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        attributes:
          type: array
          items:
            type: object
            required: [name, type]
            properties:
              name:
                type: string
              type:
                type: string
                description: RFC 7643 §7 の列挙は binary を含まないが、§2.3.6 が binary 型を定め、§8.7.1 の User スキーマ表現（x509Certificates.value）が "binary" を使うため、受信側の互換のために含める。v1 の /Schemas は binary 型の属性を返さない [D]。
                enum: [string, boolean, decimal, integer, dateTime, reference, complex, binary]
              multiValued:
                type: boolean
              required:
                type: boolean
              caseExact:
                type: boolean
              mutability:
                type: string
                enum: [readOnly, readWrite, immutable, writeOnly]
              returned:
                type: string
                enum: [always, never, default, request]
              uniqueness:
                type: string
                enum: [none, server, global]
  examples:
    ServiceProviderConfigV1:
      summary: v1 の対応機能（正例）
      value:
        schemas: [urn:ietf:params:scim:schemas:core:2.0:ServiceProviderConfig]
        documentationUri: https://docs.id-domain.example/scim/v1
        patch:
          supported: true
        bulk:
          supported: false
          maxOperations: 0
          maxPayloadSize: 0
        filter:
          supported: true
          maxResults: 200
        changePassword:
          supported: false
        sort:
          supported: false
        etag:
          supported: true
        authenticationSchemes:
          - type: oauthbearertoken
            name: OAuth 2.0 client credentials（private_key_jwt または mTLS による client 認証）
            description: 本基盤の AS が発行する短命の access token。scope は SCIM 専用。
            specUri: https://www.rfc-editor.org/rfc/rfc6749
            primary: true
    ResourceTypesV1:
      summary: 資源型（正例）
      value:
        schemas: [urn:ietf:params:scim:api:messages:2.0:ListResponse]
        totalResults: 2
        Resources:
          - schemas: [urn:ietf:params:scim:schemas:core:2.0:ResourceType]
            id: User
            name: User
            endpoint: /Users
            schema: urn:ietf:params:scim:schemas:core:2.0:User
            schemaExtensions:
              - schema: urn:ietf:params:scim:schemas:extension:enterprise:2.0:User
                required: false
              - schema: urn:example:authstack:scim:schemas:extension:federation:1.0:User
                required: false
          - schemas: [urn:ietf:params:scim:schemas:core:2.0:ResourceType]
            id: Group
            name: Group
            endpoint: /Groups
            schema: urn:ietf:params:scim:schemas:core:2.0:Group
    UserCreateBound:
      summary: 正例。不変 ID 付きの作成（Y-02 で結合済みになる）
      value:
        schemas:
          - urn:ietf:params:scim:schemas:core:2.0:User
          - urn:ietf:params:scim:schemas:extension:enterprise:2.0:User
          - urn:example:authstack:scim:schemas:extension:federation:1.0:User
        externalId: bjensen
        userName: bjensen@example.com
        name:
          familyName: Jensen
          givenName: Barbara
        displayName: Barbara Jensen
        active: true
        emails:
          - value: bjensen@example.com
            type: work
            primary: true
        urn:ietf:params:scim:schemas:extension:enterprise:2.0:User:
          employeeNumber: "701984"
          department: Sales
        urn:example:authstack:scim:schemas:extension:federation:1.0:User:
          federatedSubject: 7c1f2b9e-0d4a-4c55-9b0e-3f6a8d2e1a90
    UserCreateWithoutSubject:
      summary: 正例（ただし結合待ち）。不変 ID を送れない IdP。201 で bindingState=pendingBinding、ログイン不可（Y-03・C3）
      value:
        schemas: [urn:ietf:params:scim:schemas:core:2.0:User]
        userName: ajones@example.com
        active: true
    UserCreatedBound:
      summary: 作成応答（正例。UserCreateBound に対する service provider の表現）
      value:
        schemas:
          - urn:ietf:params:scim:schemas:core:2.0:User
          - urn:ietf:params:scim:schemas:extension:enterprise:2.0:User
          - urn:example:authstack:scim:schemas:extension:federation:1.0:User
        id: q7m2x9k4c1v8b3n6z5l0p2r4t6
        externalId: bjensen
        userName: bjensen@example.com
        name:
          familyName: Jensen
          givenName: Barbara
        displayName: Barbara Jensen
        active: true
        emails:
          - value: bjensen@example.com
            type: work
            primary: true
        urn:ietf:params:scim:schemas:extension:enterprise:2.0:User:
          employeeNumber: "701984"
          department: Sales
        meta:
          resourceType: User
          created: "2026-10-15T01:02:03Z"
          lastModified: "2026-10-15T01:02:03Z"
          location: https://scim.id-domain.example/v1/scim/v2/Users/q7m2x9k4c1v8b3n6z5l0p2r4t6
          version: W/"a330bc54f0671c9"
        urn:example:authstack:scim:schemas:extension:federation:1.0:User:
          federatedSubject: 7c1f2b9e-0d4a-4c55-9b0e-3f6a8d2e1a90
          upstreamIdpIdentifier: https://idp.customer.example
          connectionId: c4k8w2m6q0s3v7y1
          bindingState: bound
          provisioningOrigin: scim
          effectiveStatus: enabled
          deprovisioning:
            state: none
    UserDeactivated:
      summary: active=false の応答（正例）。失効は進行中
      value:
        schemas:
          - urn:ietf:params:scim:schemas:core:2.0:User
          - urn:example:authstack:scim:schemas:extension:federation:1.0:User
        id: q7m2x9k4c1v8b3n6z5l0p2r4t6
        userName: bjensen@example.com
        active: false
        meta:
          resourceType: User
          version: W/"b441cd65g1782da"
        urn:example:authstack:scim:schemas:extension:federation:1.0:User:
          bindingState: bound
          effectiveStatus: suspended
          deprovisioning:
            state: inProgress
            requestedAt: "2026-10-15T09:00:00Z"
    UserActiveButSuspended:
      summary: C7。active=true だが SRC 以外の停止理由が残る（理由の内訳は返さない）
      value:
        schemas:
          - urn:ietf:params:scim:schemas:core:2.0:User
          - urn:example:authstack:scim:schemas:extension:federation:1.0:User
        id: q7m2x9k4c1v8b3n6z5l0p2r4t6
        userName: bjensen@example.com
        active: true
        urn:example:authstack:scim:schemas:extension:federation:1.0:User:
          bindingState: bound
          effectiveStatus: suspended
    UserListByUserName:
      summary: userName eq の照会結果（正例）
      value:
        schemas: [urn:ietf:params:scim:api:messages:2.0:ListResponse]
        totalResults: 1
        startIndex: 1
        itemsPerPage: 1
        Resources:
          - schemas: [urn:ietf:params:scim:schemas:core:2.0:User]
            id: q7m2x9k4c1v8b3n6z5l0p2r4t6
            userName: bjensen@example.com
            active: true
    SearchByExternalId:
      summary: POST /.search（正例）
      value:
        schemas: [urn:ietf:params:scim:api:messages:2.0:SearchRequest]
        filter: externalId eq "bjensen"
        attributes: [id, userName, active]
        startIndex: 1
        count: 10
    PatchDeactivate:
      summary: 無効化（Y-07。正例）
      value:
        schemas: [urn:ietf:params:scim:api:messages:2.0:PatchOp]
        Operations:
          - op: replace
            path: active
            value: false
    PatchReactivate:
      summary: 再有効化（Y-08。SRC だけ解除）
      value:
        schemas: [urn:ietf:params:scim:api:messages:2.0:PatchOp]
        Operations:
          - op: replace
            path: active
            value: true
    PatchRemoveMember:
      summary: member の除去（正例）
      value:
        schemas: [urn:ietf:params:scim:api:messages:2.0:PatchOp]
        Operations:
          - op: remove
            path: members[value eq "q7m2x9k4c1v8b3n6z5l0p2r4t6"]
    GroupCreate:
      summary: Group の作成（正例）
      value:
        schemas: [urn:ietf:params:scim:schemas:core:2.0:Group]
        displayName: Sales
        externalId: grp-sales
        members:
          - value: q7m2x9k4c1v8b3n6z5l0p2r4t6
            type: User
    ErrorInvalidFilter:
      summary: 負例への応答。非対応の演算子
      value:
        schemas: [urn:ietf:params:scim:api:messages:2.0:Error]
        status: "400"
        scimType: invalidFilter
        detail: The operator 'or' is not supported by this service provider.
    ErrorTooMany:
      summary: 負例への応答。深い paging
      value:
        schemas: [urn:ietf:params:scim:api:messages:2.0:Error]
        status: "400"
        scimType: tooMany
        detail: Use meta.lastModified filters for incremental retrieval.
    ErrorMutability:
      summary: 負例への応答。immutable・readOnly 属性の変更
      value:
        schemas: [urn:ietf:params:scim:api:messages:2.0:Error]
        status: "400"
        scimType: mutability
        detail: Attribute federatedSubject is immutable.
    ErrorInvalidValue:
      summary: 負例への応答。v1 で受け付けない属性、または他テナント・存在しない id の参照（C10。区別しない）
      value:
        schemas: [urn:ietf:params:scim:api:messages:2.0:Error]
        status: "400"
        scimType: invalidValue
        detail: A required value was missing, or the value specified was not compatible with the operation or attribute type.
    ErrorUniqueness:
      summary: 負例への応答。重複作成（C4）
      value:
        schemas: [urn:ietf:params:scim:api:messages:2.0:Error]
        status: "409"
        scimType: uniqueness
        detail: A conflicting user exists. The request has been queued for administrator review.
    ErrorNotFound:
      summary: 負例への応答。存在しない・削除済み・他テナント（区別しない）
      value:
        schemas: [urn:ietf:params:scim:api:messages:2.0:Error]
        status: "404"
        detail: Resource not found.
    ErrorTenantMismatch:
      summary: 負例への応答。テナント header と資格情報の不一致
      value:
        schemas: [urn:ietf:params:scim:api:messages:2.0:Error]
        status: "403"
        detail: The request is not permitted for this client.
    ErrorRateLimited:
      summary: 負例への応答。流量超過
      value:
        schemas: [urn:ietf:params:scim:api:messages:2.0:Error]
        status: "429"
        detail: Per-tenant request rate exceeded. Retry after the indicated interval.
x-negative-examples-global:
  - name: 静的 bearer（例外未登録の接続）
    request: Authorization に長寿命の静的 token
    expect: 401
    reason: D04-40。TC-004-17（規則外の認証による受理 0 件）。
  - name: 期限切れ token
    request: 期限切れの access token
    expect: 401
    reason: TC-004-17。
  - name: 他テナントの client 資格情報
    request: テナント B の SCIM client の token でテナント A の id を操作
    expect: 404（path）／400 invalidValue（body）。SEC 検知
    reason: C10・D04-39。TC-004-17・TC-004-12。
  - name: SCIM 以外の scope の token
    request: 管理 API 用 scope の token で /Users を呼ぶ
    expect: 403
    reason: scope の分離（D04-40、DL-26 IAM-SaaS-18）。
  - name: 証明書に束縛されていない token
    request: mTLS 接続の証明書と token の束縛が一致しない
    expect: 401
    reason: sender constraint（ADR-005）。
  - name: TLS なし
    request: http:// で接続
    expect: 接続を受け付けない
    reason: RFC 7644 §7.2（MUST）。
  - name: 切離し済み接続の資格情報
    request: trust agreement 終了後の token
    expect: 401（token 失効済み）
    reason: D04-47・DL-26 §5.4（終了時に SCIM 資格情報を失効）。
x-traceability:
  closes-desk: 契約の机上定義（R-040・R-132 の API 定義部分）。R-040・R-132 自体は閉じ方 C（実測）であり open のまま。
  evidence: E4（契約試験・PoC の自動試験結果。12_poc と DL-80 で取得予定）
  handoffs:
    - to: DL-69（11_contracts/README.md）
      item: openapi 欄の値（3.1.0／3.1.2）の全契約での統一、拡張 URN の名前空間の扱い。
    - to: DL-20
      item: テナント単位の保証流量、区間 2 の失効時間、maxResults、深い paging 上限、本文上限、PatchOp 操作数上限、優先レーンの要否。
    - to: DL-26
      item: GET filter の個人情報露出（RFC 7644 §7.5.2 の SHOULD からの逸脱）と discovery endpoint の認証必須（RFC 7643 §5 の SHOULD からの逸脱）の受容票候補。
    - to: ADR-023 L23-3（CTO＋CISO、G4）
      item: control plane 停止中の active=false・DELETE の受付（Tier 0 入力）。決裁後に作成系停止時の応答（503 等）を本契約へ追加する。
    - to: DL-77
      item: scim.tenant_mismatch（仮名）の監査イベント名の確定。
    - to: traceability（照合ログ）
      item: research ノート外の原典（RFC 7644 §3.3・§3.4.2.1・§3.4.2.2・§3.4.2.4・§3.4.3・§3.5.1・§3.5.2・§3.7.4・§3.12・§3.13・§7.5.2、RFC 7643 §2.2・§3.3・§4.2・§5・§7・§8.5、RFC 6585 §4、RFC 6963 §3.6）の照合を記録する。独立レビュー（review-notes/CON-07.md）で §3.7.4 と RFC 7643 §2.2 以外を再照合済み。
