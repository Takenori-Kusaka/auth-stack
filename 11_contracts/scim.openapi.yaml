  description: |
    # SCIM API profile（CON-07 / DL-76）

    > 文書ID: CON-07 / 版: 0.1.0 / 状態: draft / 最終更新: 2026-10-15
    > 対応要求: R-040, R-132（主）／R-039, R-044, R-046, R-047, R-109, R-131, R-170, R-172, G-095, G-115, G-118, G-119, G-120, G-134, G-137（関連）
    > 依存文書: info.x-depends-on を参照
    > 注記: 本契約の起草と独立レビューには AI エージェント（Claude）を用いた。独立レビューの記録は 11_contracts/review-notes/CON-07.md にあり、RFC 7643・RFC 7644・RFC 6585・RFC 6963 の参照箇所は作成者以外が 2026-10-15 に原文と照合した。IPSIE 草案・SP 800-63C-4・RFC 9700 の参照は research ノートの検証済み項目に依る。

    ## 1. 目的と範囲
    - 顧客 IdP（SCIM client）から本基盤（SCIM service provider）への User・Group の受信を定める [D]（ADR-004 §1.8）。
    - 依存サービスへの下流配信は SCIM ではなく、ライフサイクルイベント（G-137、ADR-022 D-2）で行う [D]。本 API を依存サービスが呼ぶことはない [D]。
    - 主張タグは CONVENTIONS §3 に従う。`[N]` は原典の規範強度をそのまま写し、`[D]` は設計推論、`[A-xxx]` は前提台帳の仮定を示す。

    ## 2. テナントスコープ（D04-39、C10、Y-01）
    - テナントは SCIM client の資格情報（access token の client と tid）から導く [D]（ADR-004 D04-39）。RFC 7644 はマルチテナンシーを OPTIONAL とし、方式を規定しない [N][^2]（RS-14#33）。資格情報からテナントを推定してよい（MAY）とし、client がテナントを明示する方式を使う場合はテナント越えを防ぐアクセス制御を置くべき（小文字 should）とする [N][^2]（RS-14#33）。
    - 本契約はテナントを明示する手段（URL prefix `/Tenants/{tenant_id}`、サブドメイン、HTTP header）を定義しない [D]。テナントを示す header を実装が認識した場合に資格情報のテナントと異なれば 403 で拒否し、SEC の検知対象にする（監査イベント `scim.tenant_mismatch` を仮名とする。名前は DL-77 で確定）[D]。
    - 他テナントの資源 id を path・body（`members.value`、`manager.value`）で指定した要求は、存在しない id と同じ応答（path は 404、body は 400 `invalidValue`）を返し、存在の有無を漏らさない [D]。拒否は SEC の検知対象にする [D]（DL-08 C10）。
    - SCIM 資格情報と顧客 IdP 接続は 1 対 1 とする [D]（D04-39）。上流 IdP 識別子は資格情報の接続から導き、要求では受け取らない [D]。
    - SCIM の `id` はテナント内の所属（membership）を表す資源の不透明 ID とし、本基盤の `sub` とは別の値にする [D]。同じ主体が複数テナントに所属しても、テナントごとに別の `id` を払い出し、他テナントの所属の有無を開示しない [D]（ADR-004 D04-49）。払出し規則は ADR-021 D21-14（122 bit 以上の乱数、テナント ID・個人情報を含めない）に従い、削除後も再割当てしない [D]（ADR-021 D21-13）。`id` は安定していて再割当てされない（MUST）[N][^1]（RS-03#75）。
    - `sub` を SCIM 応答に含めるかは未決（ADR-021・DL-71）。v1 では含めない [D]。

    ## 3. プロビジョニングのモデルと JIT との衝突解決（D04-38、D04-41、D04-42、DL-08 §15.2）
    - モデル（M1 JIT／M2 SCIM 正本／M3 SCIM＋JIT 補完）は接続ごとに trust agreement で宣言する [D]（D04-38）。SCIM 資格情報を発行できるのは M2・M3 の接続だけである [D]。どのモデルを使うかは trust agreement に文書化しなければならない（SHALL）[N][^7]（RS-03#77）。
    - 照合と結合は、拡張属性 `federatedSubject`（上流 IdP の不変 ID。assertion の外部 subject と同じ値）で行う [D]（D04-41）。`userName`・`externalId`・email は照合キーにも結合キーにも使わない [D]（D04-21、ADR-021 D21-14c）。
    - 事前プロビジョニングした account は、trust agreement に別の定めがない限り、作成時に連携 ID と結合しなければならない（SHALL）[N][^7]（RS-03#77）。

    | # | 場面 | 本 API の応答 | 状態遷移 |
    |---|---|---|---|
    | C1 | M3 で JIT 作成済みの主体に、同じ `federatedSubject` の POST が届く | 201。既存の主体に新しい SCIM `id` を結び付け、`provisioningOrigin`=`jit` を返す。重複を作らない | Y-02 |
    | C2 | SCIM 作成済みの利用者の初回ログイン | 本 API の外（連携 ID で照合） | — |
    | C3 | POST に `federatedSubject` がない | 201。`bindingState`=`pendingBinding`。ログインを許さない | Y-03 |
    | C4 | `userName` が別の連携 ID を持つ現存の利用者と同じ | 409 `uniqueness`。要求は要照合キューに置き、自動で統合しない | Y-04 |
    | C4' | 同じ `federatedSubject` の SCIM 管理下の利用者が既にある | 409 `uniqueness` | Y-04 |
    | C5 | 削除済みの利用者と同じ `userName` | 201。新しい主体・新しい `id`。409 にしない | Y-01→Y-02 |
    | C6 | 同じ資源への同時更新 | If-Match があれば ETag で判定し不一致は 412。If-Match がなければ後勝ち | — |
    | C7 | SRC 以外の停止理由がある利用者に `active=true` | 200。`active`=true、`effectiveStatus`=`suspended`。テナント管理者に通知 | Y-08 |
    | C8 | 無効化・削除済みの利用者が連携ログイン | 本 API の外（M2・M3 では SCIM の状態を正本とし拒否） | — |
    | C10 | 他テナントの資源を操作 | 404（path）／400 `invalidValue`（body）。SEC 検知 | Y-01 |

    - 重複する資源の作成には 409 と `scimType`=`uniqueness` を返さなければならない（MUST）[N][^2]（RS-14#31、RS-03#76）。
    - 削除済みの資源を衝突の判定に含めるべきでなく（SHOULD NOT）、同じ `userName` での作成を 409 で失敗させるべきでない（SHOULD NOT）[N][^2]（RS-14#10、RS-03#75）。本基盤はこれを必須の規則として扱う [D]（D04-42）。

    ### 3.1 属性の mutability の扱い（POST・PUT・PATCH）
    - POST の要求本文に含まれる readOnly 属性は無視しなければならない（SHALL）[N][^2]（RFC 7644 §3.3）。PUT でも readOnly 属性の値は無視する（SHALL）[N][^2]（RFC 7644 §3.5.1）。本基盤は `id`・`meta`・`groups` と連携拡張の readOnly 属性（`upstreamIdpIdentifier`・`connectionId`・`bindingState`・`provisioningOrigin`・`effectiveStatus`・`deprovisioning`）を 400 で拒否せず無視し、無視した属性名を `scim.received` に記録する [D]。`id` は client が指定してはならない（MUST NOT）[N][^1]（RFC 7643 §3.1、RS-03#75）が、これは client 側の義務であり、server 側の扱いは上の SHALL に従う [D]。
    - immutable 属性（`federatedSubject`）は、PUT で既存の値と異なる値が来たら 400 `mutability` を返すべき（SHOULD）であり、既存の値がなければ適用する（SHALL）[N][^2]（RFC 7644 §3.5.1）。本基盤は 400 `mutability` を必ず返す [D]。PATCH では readOnly・immutable 属性を変更してはならず（client の MUST NOT）、値がない immutable 属性への `add` は許される（MAY）[N][^2]（RFC 7644 §3.5.2）。mutability に合わない PATCH 操作には 400 `mutability` を返す [D]。
    - 実装上の注意: OpenAPI の `readOnly: true` を要求検証で「存在したら拒否」と解釈する validator・mock の設定は、上の SHALL に反する。要求検証では readOnly 属性を除去してから検証する設定にする [D]。

    ## 4. deprovision（D04-43〜D04-45、Y-07〜Y-09）
    - `active` の最終的な意味は service provider が決める [N][^1]（RS-14#34）。本基盤では `active=false` を当該テナントの所属の停止（停止理由 SRC）とし、web session、refresh token、PAT、API 鍵、SSH 鍵、端末の資格情報、委任ジョブ、利用者が与えた OAuth grant とエージェントへの委任をまとめて失効させる [D]（D04-43）。
    - `active=true` は SRC の理由だけを解除し、SEC・LEG・TEN・ADM の理由は解除しない [D]（D04-44）。`active` は SCIM client が最後に設定した値を返し、実効状態は拡張属性 `effectiveStatus` で返す [D]。
    - DELETE は当該テナントの所属を除去する（Y-09）[D]。他テナントの所属は止めない [D]（D04-51）。削除後の全操作には 404 を返さなければならず（MUST）、以後の照会結果から除かなければならない（MUST）[N][^2]。成功時は 204 を返す（SHALL）[N][^2]。
    - 無効化・削除の時間は 2 区間に分ける [D]（D04-45）。区間 1（顧客 IdP 側の送信周期）は本基盤の統制外であり trust agreement に記す [D]。区間 2（受信から全手段の失効まで）を数値契約の対象とし、値は TBD（所有者: CISO、期限: G4、決め方: TC-004-13 の実測と DL-20）[D]。IPSIE AL SCIM 草案（Draft 00）は受信後 5 分以内の失効を SHOULD とするが、草案であり参照値にとどめる [N][^5][D]（RS-14#37）。
    - 応答は失効の完了を待たずに返す [D]。失効の進捗は拡張属性 `deprovisioning` で読める [D]。この属性は TC-004-13 の区間 2 の計測点にも使う [D]。
    - provisioning API への到達は利用者の認証を意味しない [N][^7]（RS-14#38）。

    ## 5. 版・ETag（D04-42、C6）
    - ETag は MAY であり、client の If-Match も MAY である [N][^2]（RS-14#32）。本基盤は全資源で弱い ETag を返し（`ETag` header と `meta.version`）、If-Match があれば検査し、不一致には 412 を返す [D]。RFC 7644 は版の不一致に 409 と 412 の両方を定義している [N][^2]（RS-03#76）。本契約は PUT・PATCH・DELETE の不一致を 412 に統一する [D]。
    - If-Match のない更新は後勝ちになる [D]。このため IdP が管理する属性は本基盤側（管理画面・管理 API）から変更できないようにする [D]（D04-42）。
    - If-None-Match 付きの GET で変更がなければ 304 を返す [N][^2]。

    ## 6. 照会と filter の制限
    - 認識しない filter 演算には 400 `invalidFilter` を返さなければならない（MUST）[N][^2]。結果が多すぎると判断した場合は 400 `tooMany` で拒否する（SHALL）[N][^2]。`count` を指定された場合はそれより多くの結果を返してはならない（MUST NOT）[N][^2]。これら 3 点（RFC 7644 §3.4.2.1・§3.4.2.2・§3.4.2.4 の Table 6）は research ノートの検証済み項目になく、作成者が原文を照合したうえで、独立レビューが 2026-10-15 に原文と再照合した（review-notes/CON-07.md）。
    - 受け付ける filter は `x-filter-profile`（components.schemas.SearchRequest）に列挙したものに限る [D]。演算子は `eq`（列挙した属性）と `meta.lastModified` の `gt`・`ge`、論理演算子は `and` だけとする [D]。`or`・`not`・`ne`・`co`・`sw`・`ew`・`pr`・`lt`・`le`（`meta.lastModified` 以外の `gt`・`ge` を含む）・角括弧の値 filter（照会での使用）は 400 `invalidFilter` とする [D]。PATCH の path filter `members[value eq "<id>"]` は受け付ける [D]。
    - 個人情報を含む filter を GET の URL で送ることについて、RFC 7644 は client に POST（/.search）を使うべき（SHOULD）とし、server に 403 で拒否すべき（SHOULD）とする [N][^2]（§7.5.2。作成者が 2026-10-15 に原文を照合）。本基盤は主要 IdP 製品との相互運用のため GET の `userName eq` と `externalId eq` を受け付け、URL の query 文字列をアクセスログに平文で残さない（filter 値を伏せる）ことで代える [D]。これは SHOULD からの逸脱であり、残余リスク（中継装置のログへの露出）を DL-26 の受容票候補として申し送る [D]。POST /.search を推奨経路とする [D]。
    - 1 ページの上限（`filter.maxResults`）は暫定 200 とする（RFC 7643 §8.5 の例示値。TBD、所有者: CTO、期限: G4、決め方: PoC 実測と DL-20）[D]。`startIndex`＋`count` の深い paging は上限（暫定 10,000 件目まで）を超えたら 400 `tooMany` とする [D]。最大テナント 10万人 [A-009] の全件照会は `meta.lastModified` による差分照会で行う前提であり、cursor（RFC 9865）の採否は未決（DL-08・DL-20）[D]。

    ## 7. 認証（D04-40、ADR-005）
    - SCIM client は OAuth 2.0 client_credentials で本基盤の AS から短命の access token を得る [D]（D04-40）。client 認証は非対称（private_key_jwt または mTLS）とする [D]。RFC 9700 は非対称暗号による client 認証を RECOMMENDED とする [N][^6]（RS-04#20）。
    - scope は SCIM 専用とする [D]（D04-40）。scope 名は不可逆の名前空間決定であり未決（ADR-021 D21-25〜D21-28、DL-71）。本契約では仮名 `scim` を使う [D]。IPSIE 草案は access token を `scim` scope に限ることを MUST とする [N][^5]（RS-14#36）。
    - 外部 client に渡す access token は opaque とし、edge が introspection で検証する [D]（ADR-005 境界）。外部 M2M の sender constraint は mTLS を既定とする [D]（ADR-005 の client 種別表）。token の寿命の値は ADR-005・ADR-006 で決める（TBD）[D]。
    - 長寿命の静的 bearer token しか送れない顧客 IdP は、移行期限付きの例外（受容票、DL-05）とし、rotation 周期の上限、送信元の制限、P-5 の保護操作を条件にする [D]（D04-40、NA-004-2）。RFC 7644 は弱い認証や無認証で発行された token を使うべきでない（SHOULD NOT）とする [N][^2]（RS-14#31）。
    - TLS は必須である。SCIM の client と service provider は transport 層の保護を必須とし（MUST）、service provider は TLS 1.2 に対応しなければならない（MUST）[N][^2]（RS-14#31）。provisioning API は相互認証された経路で使わなければならない（SHALL）[N][^7]（RS-03#78）。
    - SCIM 資格情報の発行・更新・削除は保護操作 P-5 とし、trust agreement の終了時に失効させる [D]（D04-47、DL-26 §4）。資格情報の管理は本 API の範囲外（管理 API）である [D]。
    - discovery の endpoint（`/ServiceProviderConfig`・`/ResourceTypes`・`/Schemas`）も v1 では認証を求める [D]。RFC 7643 §5 は `authenticationSchemes` を事前認証なしで取得できるようにすべき（SHOULD）とする [N][^1]。本契約はこの SHOULD から逸脱しており、認証なしの公開にするか（内容はテナントに依らない静的な値）は未決とし、DL-26 の受容票候補として申し送る [D]。

    ## 8. 流量制限（D04-46）
    - テナント単位の保証値と全体容量を分けて設計する [D]（D04-46）。テナント単位の保証値は TBD（所有者: CTO、期限: G4、決め方: PoC 実測と DL-20）[D]。IPSIE 草案はテナントごとに 25 req/s 以上を MUST とするが、草案であり参照値にとどめる [N][^5]（RS-14#36）。
    - 参考の桁: 25 req/s で最大テナント 10万人 [A-009] を 1 件 1 要求で初回投入すると 4,000 秒（約 67 分）である [D][A-009]。定常の変更量は B2B 登録 70万 × 1%/日 = 7,000 件/日（平均 0.1 req/s 未満）である [D][A-031]（前提台帳 §12 手順 16 の B2B 登録数）。容量の支配要因は定常ではなく初回投入と一斉変更である [D]。
    - 上限を超えた要求には 429 を返し、`Retry-After` を付ける [D]。429 は送信量が多すぎることを示し、Retry-After を含めてよい（MAY）[N][^8]（RFC 6585 §4。作成者が 2026-10-15 に原文を照合）。SCIM の `scimType` に 429 用の値はないため、`scimType` は付けない [D]。
    - 無効化（`active=false`）と DELETE を通常の作成・更新より優先して処理する優先レーンの要否は未決（ADR-004 は保証値と全体容量の分離までを決めている。DL-20 で判断）。
    - control plane の停止中にも無効化・削除を受け付ける（Tier 0 の剥奪入力として扱う）かは未決（ADR-023 L23-3。所有者 CTO＋CISO、期限 G4）。ARC-01 の C20 は設計候補として「作成系が止まっても無効化・削除は Tier 0 の入力で受ける」としている [D]。決裁後、作成系だけが止まる場合の応答（503 と Retry-After など）を本契約に追加する [D]。

    ## 9. 監査（D04-47）
    - SCIM 資源の作成・変更・削除はすべて顧客監査ログに記録する [D]（D04-47）。IPSIE 草案は SCIM 資源を作成・削除・変更する要求の監査記録を SHALL とする [N][^5]（RS-14#36）。
    - 各操作の `x-audit-events` に DL-08 §15.1 の監査イベント名（`scim.received`、`scim.bound`、`scim.unbound`、`scim.conflict`、`scim.disabled`、`scim.enabled`、`scim.deleted`）を記す。正準スキーマは DL-77（ADR-014）が持つ [D]。

    ## 10. 版と非推奨（ADR-016）
    - 契約の major を path に置き（`/v1/`）、文書は SemVer とする [D]（ADR-016 D16-01）。SCIM の版識別子は資源 endpoint の直前に置かなければならない（MUST）[N][^2]（RFC 7644 §3.13。作成者が 2026-10-15 に原文を照合）。両者を満たすため base URL を `/v1/scim/v2` とする [D]。`/v1` が SCIM 版 1 と誤読されないよう、資源 endpoint の直前には常に `v2` を置く [D]。
    - 非推奨は RFC 9745 の Deprecation と RFC 8594 の Sunset で告知する [D]（ADR-022 D-5-3）。

    ## 11. 未決事項（本契約では決めない）
    | 項目 | 未決の所在 |
    |---|---|
    | 拡張 URN の本番名前空間（`urn:example` は RFC 6963 §3.6 により本番では NOT RECOMMENDED [N][^9]）、scope 名、SCIM host 名 | ADR-021 D21-25〜D21-28、DL-71 |
    | テナント単位の保証流量、区間 2 の失効時間、maxResults、深い paging の上限 | DL-20（ADR-004 D04-45・D04-46） |
    | cursor paging（RFC 9865）の採否 | DL-08・DL-20 |
    | 入れ子 group、roles・entitlements の取込み（認可属性としての利用） | ADR-010・ADR-011（v1 は受け付けない） |
    | Bulk の提供 | ADR-004 は決めていない。初回投入時間の実測（DL-20）で判断 |
    | SET（RFC 9967）による非同期通知 | ADR-022 で preview |
    | 大規模 group の members の返却方法 | ADR-010・DL-20（A-036 の fanout） |
    | 無効化・削除の優先レーン | DL-20 |
    | control plane 停止中の無効化・削除の受付（Tier 0 入力）と作成系停止時の応答 | ADR-023 L23-3、ARC-01 C20 |
    | GET filter の個人情報露出（§6）の受容 | DL-26 の受容票候補 |
    | discovery endpoint の認証要否（RFC 7643 §5 の SHOULD からの逸脱、§7） | DL-26 の受容票候補 |
    | access token の寿命 | ADR-005・ADR-006 |

