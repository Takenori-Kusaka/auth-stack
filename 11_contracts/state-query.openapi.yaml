                  tid: t5wq2hzr7nmc4ka3vd6pxe2bfy
                  hold_ref: hk3vq7m2xh5d4ta6pzr2nbw7yc
      responses:
        '200':
          description: 照合の結果。適合（QC-8）し verdict=proceed のときだけ実行してよい（QC-2。v1.1（I-10）で QC-8 を追加）。応答の区分は QC-9
