                  summary: 一致（LQ00）
                  value:
                    verification_id: vq9k2m4x7hd3ta6pnr2bw7cyz1
                    verdict: proceed
                    reason_code: LQ00
                    checked_at: '2026-10-15T03:00:05Z'
                    authoritative_as_of: '2026-10-15T03:00:05Z'
                    target: { kind: tenant, id: t5wq2hzr7nmc4ka3vd6pxe2bfy, state: D }
                    request_status: executable
                    hold_status: not_applicable
                    mapping_status: not_applicable
                    partition_last_sequence: '00000000000000000042'
                mismatch:
