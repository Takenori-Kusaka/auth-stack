openapi: 3.1.2
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Lifecycle state query API（ライフサイクル正本照会）
  version: 0.2.0
  summary: 依存サービスが破壊的・不可逆な処理の直前（CON-12 RO-12）と長期停止からの復旧時（CON-12 RO-9）に、テナント・主体・所属の現在状態と要求の有効性を正本から引く読取り専用 API
  description: |
    文書ID: CON-15 / 成果物: DL-121 / 版: 0.2.0 / 状態: draft / 凍結区分: preview / 最終更新: 2026-10-15
    対応要求: G-137, G-118, G-138, R-044, R-109 / 依存文書: 11_contracts/lifecycle-events.asyncapi.yaml（CON-12）、11_contracts/schemas/lifecycle-event.schema.json（CON-13）

    改版（v1.1（I-10））: 版 0.2.0 で、CON-12 版 0.5.0 の拡張 `x-state-query-api` の値（本契約の版 0.1.0）を本ファイルへ切り出した。切出しは内容を変えずに行い（字下げだけを 2 桁戻した）、その上で次を加えた [D]。
    (1) §2 に QC-8（応答と要求の結び付きの確認）と QC-9（応答の分類と扱い）を加え、QC-2 を QC-9 に結び付けた。不適合応答・4xx・未知の verdict・未知の reason_code・3xx・その他の 5xx の扱い（実行の可否、再試行、報告の outcome と failure_reason、警報先）を 1 つの表で定めた。
    (2) 同じ表を機械可読にした `x-response-classes` を info に置いた。
    (3) 負例 LQN-20〜LQN-29 を加えた。(4) §7 に汎用モック（Prism）で使う場合の注意を加えた。(5) §8 に他文書への申し送り（v1.1）を置いた。
    根拠は AI による模擬連携検証（13_integration-trial/report.md。実在の連携チームの検証ではない）の詰まり P-12（CON-15 が拡張内にあり汎用モックに渡せない）・P-13（不適合応答・4xx・未知 verdict の扱いが未定義）である [D]。
    版 0.1.0 の時点では、並行作業の約束により CON-12 の拡張 `x-state-query-api` の中に置いていた。AsyncAPI の AsyncAPI Object は `x-` で始まる拡張を持ってよい（MAY）[N][^aa31]。ただし AsyncAPI の検証器（@asyncapi/cli validate）は拡張の中の OpenAPI の `$ref`（`#/components/...`）を AsyncAPI 文書のルートから解決しようとして invalid-ref を 28 件出していた（2026-10-15 に本書の作成者が CON-12 版 0.5.0 で確認）[M]。単独ファイル化でこれも解消する [D]。
    ファイル名: traceability/deliverables.md §4.5・§8 と CON-12 §10 H3-3・H5-1 は例として `lifecycle-state.openapi.yaml` を挙げていたが、v1.1 の改訂計画で `state-query.openapi.yaml` とした。deliverables.md・CON-00 の所在の修正は §8 で申し送る [D]。

    ## 0. CON-12 §4.1 の最小要件との対応
    | §4.1 | 本契約 |
    |---|---|
    | Q-1 (a)(b) テナント・主体の現在状態（状態、収容 cell、保全と hold_ref、削除要求の request_id と状態） | getTenantState・getPrincipalState（TenantState・PrincipalState の state・cell・legal_hold・hold_refs・open_requests）。所属は getMembershipState |
    | Q-1 (c) mapping_ref の有効性と内容（対応表の digest、request_id、役割） | getMappingState（MappingState） |
    | Q-1 (d) RO-9 の全件突合の一括照会（ページング付き） | listReconciliationSnapshot |
    | Q-2 publisher と別の workload・別の配備、最新の書込みの反映、古い読取りなら unknown | QS-1、LQ11、QC-3 |
    | Q-3 相互 TLS、broker を経ない、登録簿のサービスだけ、監査記録 | workloadMtls、QC-5、QS-3、QS-4 |
    | Q-4 不透明 ID と状態だけ | QS-2 |
    | Q-5 凍結区分 | §5 |
    | （本契約で追加）RO-12 の照合を 1 回の呼出しで行い、判定と理由コードを返す | verifyLifecycleAction、§4 |

    ## 1. 使う場面（CON-12 の義務との対応）
    | 場面 | CON-12 の義務 | 使う operation |
    |---|---|---|
    | 削除の実行（tenant.deletion.requested・user.deletion.requested、猶予 G_del の満了後） | RO-12、RO-13 | verifyLifecycleAction（action=delete_tenant_data・delete_principal_data） |
    | 保全解除による削除の再開（tenant/user.legal_hold.released） | RO-12 | verifyLifecycleAction（action=resume_deletion_after_hold_release） |
    | 統合・分割の付け替え（tenant.merge.cutover・tenant.split.cutover） | RO-12 | verifyLifecycleAction（action=retarget_tenant_references） |
    | 所属除去に伴うデータの削除・移管（membership.removed） | RO-12 | verifyLifecycleAction（action=remove_membership_data） |
    | W_replay を超えて停止した後の全件突合 | RO-9 | listReconciliationSnapshot、getTenantState・getPrincipalState・getMembershipState |

    ## 2. 受信側（呼ぶ側）の規則
    - QC-1 直前照会: verifyLifecycleAction は、不可逆な処理を始める直前に呼ぶ。`checked_at` から実行開始までの許容時間 Q_fresh は TBD（CON-12 §7 に追加を申し送り）で、超えたら照会し直す [D]。
    - QC-2 fail closed: HTTP 200 で、応答が本契約の VerificationResult に適合し、`verdict=proceed` の場合だけ実行する。それ以外（未知の verdict、スキーマ不適合、4xx、5xx、timeout、接続失敗）はすべて実行しない [D]。実行しない場合の再試行・報告（outcome と failure_reason）・警報は、応答を QC-9 の区分 RC-1〜RC-9 に分けて決める（v1.1（I-10））[D]。
    - QC-3 結果の写像: `verdict=do_not_proceed` のとき、`reason_code` が LQ02（撤回）なら CON-13 DeletionReport を outcome=withdrawn で報告する。LQ08（猶予中）なら `grace_until` の後に照会し直す。LQ11（最新の正本を読めない）は照会不能として QC-4 と同じに扱う（CON-12 §4.1 Q-2）。それ以外の値と未知の値は「正本不一致」として outcome=failed で報告し、SOC へ警報する（CON-12 RO-12）[D]。
    - QC-4 到達不能: 503・429・timeout・接続失敗は「照会不能」とし、実行を保留する。`Retry-After` があればその時間を待ち、なければランダム化した指数 backoff で再試行する。報告期限（事象の deadline）までに照会できなければ outcome=failed（理由: 照会不能）で報告する。503・429 以外の 5xx と 3xx の扱いは QC-9 の RC-3・RC-4 による（v1.1（I-10））。削除の遅延を偽造の受理より優先する（CON-12 RO-12）[D]。
    - QC-5 経路: 照会は本 API（publisher と別の workload ID・別の配備。CON-12 RO-12、§4.1 Q-2）へ workload ID の相互 TLS で直接行い、broker や事象の経路を経ない（CON-12 RO-12、§4.1 Q-3）。URL は設定（CON-11 §11.4 の `LIFECYCLE_STATE_QUERY_URL`）から得て、コードに直書きしない（CON-00 §2.5 手順 6）[D]。
    - QC-6 キャッシュ禁止: 照会の結果を保存して後の判断に使わない。応答には `Cache-Control: no-store` を付ける。no-store は、cache が要求・応答のどの部分も保存してはならず（MUST NOT）、他の要求への応答に使ってはならない（MUST NOT）とする指示である [N][^9111]。同 RFC はこの指示を秘匿の手段として信頼できないとしているので、秘匿の根拠には使わない [N][^9111]。
    - QC-7 事象を引数にする: verifyLifecycleAction には、根拠にした事象の id・source・type・sequence を渡す。基盤は、その事象が正本側の outbox の記録（publisher が送る元）に当該パーティションの番号で載っているかを確かめる（LQ09）。署名の検証（RO-11）を省いてよい理由にはならない [D]。
    - QC-8 応答と要求の結び付き（v1.1（I-10））: verifyLifecycleAction の 200 応答は、次をすべて満たす場合だけ「適合」とする。満たさない応答は QC-9 の RC-8（不適合応答）として扱い、実行しない [D]。(a) `target.kind` が action と対応する（delete_tenant_data・retarget_tenant_references は tenant、delete_principal_data は principal、remove_membership_data は membership、resume_deletion_after_hold_release は要求に tid を入れたら tenant、sub だけなら principal）。(b) `target.id` が要求の tid（tenant）、sub（principal）、「tid/sub」（membership）と一致する（不透明値として文字列の完全一致で比べる）。(c) verdict=proceed のとき reason_code が LQ00 である。(d) reason_code=LQ08 のとき grace_until がある（LQN-17）。(e) verdict=proceed のとき request_status が withdrawn・in_grace・unknown でなく、hold_status が active・unknown でなく、mapping_status が mismatch・unknown でない。結び付きを確かめないと、別の対象についての proceed（汎用モックが固定の例を返す場合や、経路上で差し替えた応答）で削除を実行してしまうためである（13_integration-trial の P-13）[D]。
    - QC-9 応答の分類と扱い（v1.1（I-10））: 呼ぶ側は、応答を次の表の上から順に照らし、最初に当たった区分で扱う。区分は HTTP の状態コードで決め、Problem 本文の reason_code は記録にだけ使う（本文が Problem でない、reason_code がない、状態コードと食い違う場合も状態コードで決める。LQN-27）[D]。`Cache-Control: no-store` の有無は区分の判定に使わない（呼ぶ側は QC-6 により結果を保存しないため。欠落は記録して基盤チームへ連絡する）[D]。再試行は毎回新しい verifyLifecycleAction の呼出しとし、前の応答を使い回さない（QC-6）[D]。表の機械可読の写しは `info.x-response-classes` である。

    | 区分 | 判定条件 | 実行 | 再試行 | 報告期限までに proceed を得られない場合の報告（CON-13 DeletionReport） | 警報 |
    |---|---|---|---|---|---|
    | RC-1 到達不能 | 接続失敗、TLS の握手の失敗、timeout（照会の timeout は TBD。§5） | しない（保留） | する。ランダム化した指数 backoff（QC-4） | outcome=failed・failure_reason=state_query_unavailable | 期限の時点で所有者へ。TLS の握手の失敗が続くときは自サービスの証明書・登録の誤りの疑いとして所有者へ即時 |
    | RC-2 過負荷 | 429（LQ23）・503（LQ24） | しない（保留） | する。Retry-After があればその秒数の後、なければ backoff。待ちが報告期限を超える場合は期限に報告する | 同上 | 期限の時点で所有者へ |
    | RC-3 その他の 5xx | 503 以外の 5xx（500・502・504 など） | しない（保留） | する（backoff） | 同上 | 期限の時点で所有者へ。続く場合は基盤チームへ |
    | RC-4 転送 | 3xx | しない。`Location` を辿らない。設定の URL（QC-5）以外へ照会を送らないためである | しない（設定を確かめるまで） | 同上 | 所有者とプラットフォームチームへ即時（設定の誤りか経路の改ざんの疑い） |
    | RC-5 要求の誤り | 400（LQ20）と、本契約にない 4xx（401・405・406・409・413・415・422 など。403・404・429 を除く） | しない | 同じ要求を再送しない。実装・設定を直してから照会し直す | outcome=failed・failure_reason=processing_error（受信側の処理失敗） | 所有者へ即時 |
    | RC-6 拒否 | 403（LQ21） | しない | 自動では再送しない。受信サービスの登録簿（CON-12 LC-OI-4）と購読範囲を確かめてから照会し直す | outcome=failed・failure_reason=state_query_unavailable | 所有者とプラットフォームチームへ即時。購読範囲外の対象を指す事象を受けた疑いがあるので SOC へも送る |
    | RC-7 対象なし | 404（LQ22） | しない | しない | outcome=failed・failure_reason=source_of_truth_mismatch | SOC と所有者へ（CON-12 RO-12） |
    | RC-8 不適合応答 | 200 だが次のいずれか。media type が application/json でない、JSON として読めない、VerificationResult に適合しない（verdict 欄がない、verdict が未知の値、必須欄の欠落、型・pattern の違反）、QC-8 の (a)〜(e) を満たさない。および 200 以外の 2xx と 1xx 以外の上記にない状態コード | しない | する（backoff）。基盤の一時的な不具合の可能性があるため | outcome=failed・failure_reason=state_query_unavailable（正しい応答を得られなかったのであり、正本不一致とは判定しない） | SOC と所有者へ即時（照会 API の不具合か、経路上の偽の応答の疑い） |
    | RC-9 不実行の判定 | 200・適合・verdict=do_not_proceed | しない | reason_code による（QC-3）。LQ08 は grace_until の後、LQ11 は RC-1 と同じ、それ以外（未知の値を含む）は再試行しない | QC-3 と §4 の表（LQ02 は outcome=withdrawn、LQ11 は state_query_unavailable、それ以外と未知の値は source_of_truth_mismatch） | QC-3（正本不一致は SOC へ） |
    | RC-10 実行可 | 200・適合（QC-8 を満たす）・verdict=proceed | `checked_at` から Q_fresh 以内に実行する（QC-1） | — | 処理の結果による（completed など） | — |

    - 状態取得の operation（getTenantState・getPrincipalState・getMembershipState・getMappingState・listReconciliationSnapshot）の応答も同じ区分で分ける。ただしこれらの結果を根拠に不可逆な処理を実行しない（不可逆な処理は必ず verifyLifecycleAction の RC-10 を要する）。RO-9 の全件突合では、RC-1〜RC-6・RC-8 は突合を完了とせず処理の再開を保留し、RC-7 は例外台帳（DL-05）に登録して所有者へ連絡する（v1.1（I-10））[D]。
    - 報告期限に間に合わない区分（RC-1〜RC-6・RC-8）でも、削除の遅延を偽造の受理より優先する（CON-12 RO-12）。failure_reason の値は CON-13 DeletionReport の x-known-values（source_of_truth_mismatch・state_query_unavailable・processing_error・other）の範囲で選び、新しい値を作らない [D]。

    ## 3. 基盤（応答する側）の規則
    - QS-1 正本から読む: 本 API は publisher と別の workload ID・別の配備で動かし（CON-12 RO-12、§4.1 Q-2）、テナント状態・主体台帳の正本（outbox と同じ取引で書く store）から、最新の書込みを反映した読取りで答える。事象から作った投影は使わない。`authoritative_as_of` に読み取った時点を入れる [D]。最新の書込みを反映した読取りができない場合は状態を `unknown` にし、verifyLifecycleAction は do_not_proceed／LQ11 を返す。古い読取りで撤回を見落とすと、撤回済みの削除を実行してしまうためである（§4.1 Q-2）[D]。
    - QS-2 最小化: 状態の区分と参照だけを返し、テナント名・ドメイン名・email などの属性を返さない（CON-12 PO-11 と同じ方針）[D]。
    - QS-3 範囲: 呼出し元の workload が受信サービスの登録簿（CON-12 LC-OI-4）に載っていなければ 403（LQ21）にする。照会できる対象は、呼出し元が購読しているパーティションに限る [D]。
    - QS-4 記録: verifyLifecycleAction の結果は CON-08 の監査イベントとして記録する（呼出し元、事象 id、verdict、reason_code）。副作用はこの記録だけである [D]。
    - QS-5 過負荷: 過負荷・保守中は 503 と `Retry-After` を返す。503 は一時的な過負荷・保守で要求を処理できないことを示し、server は Retry-After を送ってよい（MAY）[N][^9110]。503 とともに送る Retry-After は、サービスが使えないと見込まれる時間を示す [N][^9110]。レート制限には 429 と `Retry-After` を返す。429 の応答は状況の説明を含めるべき（SHOULD）で、Retry-After を含めてよい（MAY）[N][^6585]。
    - QS-6 判定の順序: 次の順に調べ、最初に当てはまった理由コードで do_not_proceed を返す。LQ11 → LQ09 → LQ01 → LQ03 → LQ02 → LQ10 → LQ05・LQ06 → LQ07 → LQ04 → LQ08。どれにも当たらなければ proceed（LQ00）[D]。

    ## 4. 理由コード（開いた列挙。CON-00 §4.8 R-1）
    | code | 意味 | verdict・HTTP | 呼ぶ側の扱い（QC-3） |
    |---|---|---|---|
    | LQ00 | 一致。実行してよい | proceed・200 | 実行する |
    | LQ01 | request_id が正本に存在しない | do_not_proceed・200 | 正本不一致（failed、SOC 警報） |
    | LQ02 | 要求が撤回された | do_not_proceed・200 | outcome=withdrawn |
    | LQ03 | request_id はあるが対象（tid・sub）か種別が事象と違う | do_not_proceed・200 | 正本不一致 |
    | LQ04 | 対象の状態が処理の前提と違う（例: 削除要求の状態にない） | do_not_proceed・200 | 正本不一致 |
    | LQ05 | 保全が継続している（hold_ref が解除されていない） | do_not_proceed・200 | 正本不一致 |
    | LQ06 | hold_ref が正本に存在しない | do_not_proceed・200 | 正本不一致 |
    | LQ07 | mapping_ref が存在しないか、request_id・対象と結び付いていない | do_not_proceed・200 | 正本不一致 |
    | LQ08 | 猶予 G_del が満了していない | do_not_proceed・200 | grace_until の後に照会し直す |
    | LQ09 | 事象（id・sequence）が正本側の outbox の記録にない | do_not_proceed・200 | 正本不一致（偽造の疑い） |
    | LQ10 | 削除の対象に保全が掛かっている | do_not_proceed・200 | 正本不一致として報告し、保全の解除を待つ |
    | LQ11 | 最新の書込みを反映した正本を読めない（状態 unknown） | do_not_proceed・200 | 照会不能（QC-4）。正本不一致にはしない |
    | LQ20 | 要求の形が不正 | 400 | 照会不能ではなく実装の誤り。実行しない（QC-9 RC-5） |
    | LQ21 | 呼出し元が登録簿にない、または対象が購読範囲外 | 403 | 実行しない。所有者へエスカレーション（QC-9 RC-6） |
    | LQ22 | 対象（tid・sub・所属）が正本に存在しない | 404 | 正本不一致（QC-9 RC-7） |
    | LQ23 | レート制限 | 429 | 照会不能（QC-4、QC-9 RC-2） |
    | LQ24 | 一時的に応答できない | 503 | 照会不能（QC-4、QC-9 RC-2） |

    理由コードは開いた列挙である。呼ぶ側は、200 の応答にある未知の LQ 値を QC-3 により正本不一致として扱い（RC-9）、4xx・5xx の Problem にある未知の LQ 値は記録だけして状態コードで扱う（QC-9）[D]。

    ## 5. 凍結区分と GA への条件
    - 版 0.1.0 では全 operation が preview である（x-preview-expires: 2027-10-15。CON-12 の preview と同じ）[D]。版 0.2.0（v1.1）でも変えない。QC-8・QC-9 は呼ぶ側の規則の追加であり、要求・応答の形は変えていない [D]。
    - CON-12 §4.1 Q-5 の案は、識別子と応答の状態の列挙値を irreversible、操作を GA とするものである。本契約はこの案を目標とし、GA に上げるまでは preview に置く。preview の間も、状態の列挙値（TenantState の DL-49 §2.1 の ID、PrincipalState・MembershipState の値、RequestStatus、理由コードの意味）は、意味を変えずに追加だけを行う [D]。
    - CON-12 §6 は、照会 API が揃うまで CON-12 の GA の凍結（DEC-8 第 1 段）を付議しないとしている。このため、verifyLifecycleAction の要求・応答の形、QC-1〜QC-9（QC-8・QC-9 は v1.1 で追加）、§4 の理由コードの意味は、CON-12 の GA の付議の前に GA へ上げる候補である。上げる条件は、作成者以外の独立レビュー、モック（CON-11 MK-08）での x-negative-examples の実行（TC-026）、DL-49・DL-08 の所有者による状態区分の確認である [D]。
    - 数値（Q_fresh、照会の timeout、レート）はすべて TBD である。値を決めることは制約を強める変更として扱う（CON-00 §6.1）[D]。

    ## 6. 作成方法と誠実性
    AI エージェント（Claude）が CON-12 RO-9・RO-12・RO-13、CON-13 の data 定義（request_id・hold_ref・mapping_ref）、DL-49 §2.1 の主状態、DL-08 §4・§7.1 の状態機械を正本として起草した。
    外部原典（OpenAPI 3.1.2 の Security Scheme Object、RFC 9111 §5.2.2.5、RFC 9110 §10.2.3・§15.6.4、RFC 6585 §4、AsyncAPI 3.1.0 の AsyncAPI Object と Specification Extensions）は 2026-10-15 に原文を取得して照合した。作成者以外による独立レビューと人による照合は未実施である [D]。
    版 0.2.0（v1.1）の QC-8・QC-9・RC-1〜RC-10・LQN-20〜LQN-29 は、AI による模擬連携検証（13_integration-trial/report.md。実在の連携チームの検証ではない）の P-13 を、本書の既存の規則（QC-2〜QC-6、§4）と CON-12 RO-12・CON-13 の failure_reason の既知の値から導いた設計推論であり、新しい外部事実は加えていない [D]。

    ## 7. 汎用モック（Prism など）で使う場合の注意（v1.1（I-10））
    - 本ファイルは単独の OpenAPI 3.1.2 文書なので、汎用モックにそのまま渡せる。版 0.1.0 のように CON-12 から取り出す手順は要らない（P-12 の解消）[D]。
    - 汎用モックは operation の examples を返すだけで、要求の中身を見ない。verifyLifecycleAction の正例（proceed）は `target.id=t5wq2hzr7nmc4ka3vd6pxe2bfy` を返すので、QC-8 (b) を満たす正例の結合確認は要求の tid にこの値を使う。別の tid で呼ぶと、契約に忠実な呼ぶ側は RC-8（不適合応答）として実行しない。これは期待どおりの動作である [D]。
    - 正例以外の 200 の例（mismatch＝LQ01、graceNotElapsed＝LQ08）と 4xx・5xx の応答は、汎用モックの例の選択機能で取り出せる場合がある（選択の方法は製品ごとに違い、本契約では定めない）。2026-10-15 に本書の作成者が Prism 5.12.0 で本ファイルを起動し、要求ヘッダ `Prefer: example=mismatch`・`Prefer: example=graceNotElapsed` で LQ01・LQ08 の例が、`Prefer: code=403`・`code=429`・`code=503` で各 Problem が返ることを確かめた。同じ起動で、要求の tid を例と違う値にしても proceed（target.id は例の値）が返り、503 に Retry-After は付かなかった（ヘッダが任意のため）[M]。このため LQN-12（Retry-After: 120）と LQN-24 以外の QC-8 の負例は注入で作る。RC-1（timeout・接続失敗）、RC-3（500 など）、RC-4（3xx）、RC-8（不適合応答。verdict 欄の欠落・未知の verdict・QC-8 の不一致）は本契約の examples に無いので、汎用モックでは作れない。これらは CON-11 MK-08 の注入か、試験側の中継（CON-11 の kit）で作る（§8 V11-Q3）[D]。
    - 照会の timeout・Retry-After の上限・Q_fresh は TBD（§5）なので、試験では設定値として外から与える（CON-11 §11.4 への申し送りは §8 V11-Q4）[D]。

