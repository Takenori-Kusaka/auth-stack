paths:
  /v1/lifecycle/verifications:
    post:
      operationId: verifyLifecycleAction
      tags: [verification]
      summary: 不可逆な処理の直前に、事象と正本の一致を照合する（RO-12）
      description: 読取り専用の照合。副作用は監査記録だけ（§3 QS-4）。request_id などの参照を URL やアクセスログに残さないため、要求本文で渡す。
