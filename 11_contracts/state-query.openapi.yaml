                    verdict: do_not_proceed
                    reason_code: LQ08
                    checked_at: '2026-10-15T03:00:05Z'
                    authoritative_as_of: '2026-10-15T03:00:05Z'
                    target: { kind: tenant, id: t5wq2hzr7nmc4ka3vd6pxe2bfy, state: R }
                    request_status: in_grace
