  x-lint-notes: '版 0.2.0（v1.1（I-10））の検査: 2026-10-15 に本書の作成者が本ファイルを Redocly CLI 2.64.0（npx @redocly/cli@latest lint、recommended、設定ファイルなし）で検査し、エラー 0・警告 0。Python jsonschema 4.26.0 の check_schema は components.schemas の 19 件すべて合格、operation の examples 10 件はすべて適合。QC-8 の必要性の確認として、LQN-24（target.id の食い違い）・LQN-25（proceed と request_status=withdrawn）・LQN-29（target.kind の食い違い）・LQN-26（未知の reason_code）の応答はスキーマには適合し、LQN-13（verdict 欄なし、verdict=maybe）は不適合になることを確かめた（スキーマ検証だけでは RC-8 を判定できない）。Prism 5.12.0 で 6 operation すべてが 200 を返し、Prefer ヘッダで 403・429・503 と LQ01・LQ08 の例を取り出せた（mutualTLS は検査しないという警告あり。§7）。以下は版 0.1.0 の記録。2026-10-15 に本書の作成者が、この OpenAPI 文書（x-state-query-api の値）を単独のファイルとして取り出して検査した。Redocly lint 2.63.0（recommended、設定ファイルなし）はエラー 0・警告 0。Python jsonschema 4.26.0 の check_schema は components.schemas の 19 件すべて合格、operation の examples 10 件（mapping を含む）はすべて適合、要求の形の負例 5 件（LQN-11、保全解除で対象なし、未知の action、空白を含む tid、20 桁でない sequence）はすべて不適合。Prism 5.12.0 で 6 operation すべてが 200 を返した（mutualTLS は検査しないという警告あり）。組合せの規則（verdict と reason_code、LQ08 と grace_until）は、if/then で書くと Redocly の例検査が誤検知したので、本文と負例 LQN-17 で定めた。生データは作成者の一時作業領域にだけ置いた。'
