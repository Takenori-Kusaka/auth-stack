                    verdict: do_not_proceed
                    reason_code: LQ01
                    checked_at: '2026-10-15T03:00:05Z'
                    authoritative_as_of: '2026-10-15T03:00:05Z'
                    target: { kind: tenant, id: t5wq2hzr7nmc4ka3vd6pxe2bfy, state: A }
                    request_status: unknown
                    hold_status: not_applicable
                    mapping_status: not_applicable
                    partition_last_sequence: '00000000000000000041'
                graceNotElapsed:
                  summary: 猶予中（LQ08）
