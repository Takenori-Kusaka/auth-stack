    ## 10. 誠実性

    本契約は設計段階のもので、モックの起動と、AS・申請 API に対する負例の実行（TC-026）は行っていない [D]。版 0.2.0 で加えた §4A の 5 操作と申請種別は、実装も負例 CRN-21〜CRN-30 の実行もない [D]。版 0.3.0 の AR-8・CR22・CRN-31〜CRN-37 も同じく実装・実行していない。所有テナントの管理画面の承認 API はまだどの契約にもない（§9 H-17）[D]。版 0.3.1 の CR23・CRN-38〜CRN-41 も実装・実行していない。版 0.3.1 は POC-02 の X-C・X-D からの設計推論で、PoC は client 登録の経路を試験しておらず、POC-02 の値は立会人なしの自己実行であり Gate 4 の証拠ではない（PoC/R7反映）[D]。版 0.4.0 の data_processing・AR-9・CR24・CRN-42〜CRN-46 も実装・実行していない。管理者の同意と DL-34 の判定記録で移転・第三者提供の要件を満たすかは法的判断であり、本契約は判断していない（L-04・L-13、OI-P02）[D]。版 0.5.0 の §5A（redirect ホストのドメイン検証、AR-10、CR25〜CR28、CRN-47〜CRN-54）も実装・実行していない。再検証の周期・猶予期間・移行期間は TBD で、T-098 の残余の窓の大きさはこれらの値で決まる [D]。Redocly lint とスキーマ検査（examples の適合、負例 10 件のスキーマでの拒否）の結果は info.x-lint-notes に記した [M]。模擬パネルの判定は自己レビューであり、実在の CTO/CISO の決裁ではない（CONVENTIONS §8）[D]。

