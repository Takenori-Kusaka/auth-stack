    > 作成方法: AI エージェント（Claude）が ARC-02 §6・§8・§9、ADR-005・ADR-008・ADR-009・ADR-021・ADR-022、INT-04 §4.3、CON-11 §5 を読み、模擬パネル（ラウンド 1）の指摘に答えて起草した。版 0.2.0 の §4A（workload と交換可能な組の登録）は、ラウンド 6 の指摘に答えて ARC-04 §3.1・§3.2、ADR-009 D09-12〜D09-15、INT-04 §4.3、12_poc/code のソースを読んで加えた。research ノートにない原典（RFC 7591 §2・§3・§3.2.1・§3.2.2・§5、RFC 7592 全体、RFC 8705 §2.1.2・§3.4、RFC 9449 §5.2、RFC 9126 §6、OIDC Dynamic Client Registration 1.0 §2）は起草者が 2026-10-15 に RFC Editor・OpenID Foundation から取得して照合した。作成者以外による照合は未実施である。模擬パネルの判定は自己レビューであり、実在の CTO/CISO の決裁ではない（CONVENTIONS §8）[D]。

    ## 0. 要旨

    1. **連携開発者は、本契約で「何を申請し、何が返るか」を実装・試験できる** [D]。sandbox では RFC 7591 の登録 endpoint にセルフ登録し、`client_id` と RFC 7592 の管理用 URL・token を受け取る（承認なし。G-141(c)）。本番では登録申請 API に申請し、承認後に `client_id` を受け取る（OB-2(d)）[D]。
    2. **登録する中身は sandbox と本番で同じスキーマ（ClientMetadata）で検査する** [D]。種別（C1〜C6、C8。ARC-02 §6）ごとに grant、`token_endpoint_auth_method`、DPoP・mTLS の束縛、PAR、FAPI の層を必須項目・禁止項目として機械可読にした。sandbox で通った登録内容は、環境に依存する値（redirect URI、鍵）を差し替えれば本番の申請にそのまま使える [D]。
    3. **sandbox と本番の issuer・登録窓口・鍵・client_id を分ける** [D]（ADR-022 D-6-4、ADR-008 D8-50〜D8-52、ADR-021 D21-22）。sandbox の登録 endpoint は sandbox の AS にだけあり、本番の AS では動的登録を無効にする（ARC-02 §9.2 行 34）。sandbox への本番 redirect URI・本番の公開鍵の登録は拒否する（負例 CRN-01、CRN-13）[D]。
    4. **本番の承認者は既存の変更区分（operating-model §7.2）に当てはめた案である** [D]。標準の登録は認証・IdP チームの有資格者による作成者≠承認者の審査（CP-2 相当）、層 F（FAPI）や privileged scope は CISO 組織のセキュリティレビュアーを加え、app-only の権限（client_credentials の client が要求する scope）の付与は、単一テナントか複数テナントかを問わず CP-1 相当の別報告系統の二者とする（AR-4。ADR-008 D8-54）。顧客テナントを所有テナントとする client が app-only の権限か低リスクでない scope を要求するときは、そのテナントの管理者の同意記録がなければ払い出さない（AR-8。ADR-005 D7-2。版 0.3.0）（x-approval-rules）。承認者の確定は ONB-R2 と ADR-022 の改版による（未決（ADR-022））[D]。
    5. **内部 workload（C7）は client ではなく、SVID の登録エントリと交換可能な組で登録する** [D]（§4A、版 0.2.0 で追加、preview）。約 300 サービスのサービス間同期呼出し（INT-02 の P-03）が token exchange を使うには、この 2 つが要る（ADR-009 D09-13・D09-14、INT-04 OB-2(a)〜(c)）。sandbox ではどちらもセルフ登録（`registerSandboxWorkload`、`registerExchangePair`。呼出し先が他チームのサービスなら呼出し先の所有者の承認を待つ）、本番は申請 API の申請種別 `workload`・`exchange_pair` で承認付きにする [D]。selector は基盤が管理し workload が書き換えられない属性に限る（ARC-04 W55-08）[D]。sandbox がまだないため、それまでの暫定手順を §4A.5 に置いた [D]。
    6. **凍結区分**: sandbox の登録手段と本番の申請 API はどちらも preview である [D]。ADR-022 D-2 は非本番の動的登録を preview に置き、本番の登録手段は定めていないためである。種別ごとの必須項目は ARC-02 §6（GA）の写しなので GA とする [D]。ADR-022 D-2-3 は空欄を GA か preview の契約で埋めることを求めるので、G-138 の I-01 は本契約で「対応（登録手段は preview）」になる [D]。
    7. **本番の redirect URI のホストは、登録時に所有を確かめ、払出し後も確かめ続ける** [D]（§5A、版 0.5.0、凍結前是正 FZ-027、preview）。exact string matching は文字列の一致しか確かめず、ドメイン失効・dangling DNS で乗っ取られたホストにも認可応答を返す（THR-03 T-098）[D]。本番の create・update では、redirect_uris の各ホストに client と所有テナントに束縛した DNS TXT の検証を必須にし（CR25）、public suffix などは拒否し（CR26）、定期の再検証と NS・登録者・CNAME の宛先の変更の検知で失効を見つけたら、その redirect URI への応答を止め、猶予の後に client を停止する（CR28）[D]。

    ## 1. 範囲

    | 範囲内 | 範囲外（正本） |
    |---|---|
    | sandbox の client 登録・読取り・更新・削除（RFC 7591/7592 profile） | SVID の発行・更新そのもの、attestation の実装、trust domain と SPIFFE ID の path の形式（ARC-04 W55-02・W55-03・W55-07〜W55-10、DL-71） |
    | 本番の client 登録・変更・廃止の申請、承認、払出し結果の取得 | STS の exchange の判定そのもの（ADR-009 D09-11〜D09-16、CON-05） |
    | **C7 の workload の SVID 登録エントリ（ARC-04 W55-08、OB-2(a)(b)）の sandbox セルフ登録と本番の申請（§4A、版 0.2.0、preview）** | 登録簿の版管理と監査の仕組み（ADR-016、ADR-009 D09-13） |
    | **交換可能な組（ADR-009 D09-13、OB-2(c)）の sandbox 登録と本番の申請（§4A、版 0.2.0、preview）** | AI エージェントの委任 grant（ADR-017・ADR-026） |
    | 種別ごとの登録内容の検査規則、理由コード、負例 | token の取得・検証そのもの（ARC-02、CON-06） |
    | 承認の要否を決める規則（案） | 本基盤が RP として顧客 IdP に接続する C9（ADR-004。顧客 IdP 側の登録） |
    | | OIDC Back-Channel Logout の `backchannel_logout_uri` の登録（位置が未決。ADR-006 L6-2） |
    | | `authorization_details` の type の登録（ADR-017 L17-5） |

    ## 2. 流れ

    ```mermaid
    sequenceDiagram
      participant Dev as 連携開発者（consumer 台帳に登録済み）
      participant Portal as オンボーディング窓口
      participant SB as sandbox AS（issuer B）
      participant Req as 本番 登録申請 API
      participant Ap as 承認者（x-approval-rules）
      participant PA as 本番 AS（issuer A。動的登録は無効）
      Dev->>Portal: OB-1 完了後、initial access token を受け取る（sandbox 専用）
      Dev->>SB: POST /v1/register（ClientMetadata）＋ initial access token
      SB-->>Dev: 201 client_id、registration_client_uri、registration_access_token（承認なし）
      Dev->>SB: 結合試験（CON-11 の CV-xxx）
      Dev->>Req: POST /v1/client-registration-requests（同じ ClientMetadata、本番の値）
      Req-->>Dev: 202 request_id、required_approvals
      Ap->>Req: POST …/decisions（作成者≠承認者）
      Req->>PA: 承認がそろったら払出し
      Dev->>Req: GET …/{request_id}
      Req-->>Dev: status=provisioned、client_id（sandbox と別の値）
    ```

    ## 3. 種別ごとの必須項目（ARC-02 §6 の写し）

    表のセルのうちタグのないものは ARC-02 §6・§7・§8 からの設計推論 [D] である。規範の強度は脚注の原典どおりに写す。

    | 種別 | grant_types | response_types | token_endpoint_auth_method | 束縛（metadata） | PAR | 層（platform_risk_layer） | redirect_uris |
    |---|---|---|---|---|---|---|---|
    | C1 第一者 BFF | authorization_code（必須）、refresh_token | `["code"]` | private_key_jwt か tls_client_auth | BFF→edge は mTLS（登録 metadata ではなく経路の設定） | `require_pushed_authorization_requests: true` | B・H・F | https のみ |
    | C2 第一者ネイティブ・CLI | authorization_code、refresh_token | `["code"]` | none | `dpop_bound_access_tokens: true` | 任意 | B・H（F1〜F6 は発行しない） | loopback の IP リテラルか、`<id-domain>` を逆順にした private-use scheme（ADR-021 D21-24） |
    | C3 第三者サーバー型 | authorization_code、refresh_token | `["code"]` | private_key_jwt か tls_client_auth | `tls_client_certificate_bound_access_tokens: true`（既定）。DPoP は K-3 の例外で受容票が要る | 層 F なら必須 | B・H・F | https のみ |
    | C4 第三者ブラウザ内 | authorization_code、refresh_token | `["code"]` | none | `dpop_bound_access_tokens: true` | 任意 | B のみ | https のみ |
    | C5 外部 M2M、C8 AI エージェント（自身の資格情報） | client_credentials のみ | 空か省略 | private_key_jwt か tls_client_auth | `tls_client_certificate_bound_access_tokens: true` | 該当なし | B・F | 登録しない |
    | C6 外部 RP | authorization_code、refresh_token | `["code"]`（hybrid は未決のため不可） | private_key_jwt か tls_client_auth | C1・C3 と同じ | 層 F なら必須 | B・H・F | https のみ |

    - 全種別に共通の規則 [D]。
      - `token_endpoint_auth_method` を必須にする。RFC 7591 と OIDC Dynamic Client Registration 1.0 は、省略時の既定値を `client_secret_basic` と定めている [N][^1][^6]。省略を許すと共有秘密の client が登録されるので、既定値に頼らせない（ADR-009 D09-18）。
      - `client_secret_basic`・`client_secret_post`・`client_secret_jwt` は登録できない（ADR-005 D7-1、ADR-009 D09-18）。このため応答に `client_secret` は含まれない。
      - `implicit`・`password` の grant と `token` の response type は登録できない。ROPC の禁止は RFC 9700 §2.4 の MUST NOT、implicit の無効化は SHOULD NOT を超える自社判断である（ARC-02 §6）[N][^7]。
      - device authorization grant と jwt-bearer・saml2-bearer の grant は v0.1 では登録できない。device grant は業務 API で既定無効（ARC-02 §6 C2、ADR-005 D7-7）で、例外は受容票を付けて本番の申請で扱う（x-open-issues）。
      - redirect URI は登録値と要求値を exact string matching で照合しなければならない（MUST）。例外は native app の localhost URI の port 番号だけである [N][^7]（RS-04#1）。そのため wildcard（`*`）と fragment を含む URI は登録できない。loopback 以外の `http` も登録できない（ARC-02 §9.2 行 25）。
      - RFC 7591 は redirect URI を、TLS で保護されたサイト、localhost の http、client だけが使う非 HTTP の URL のいずれかに限っている（MUST）[N][^1]（§5）。本 profile は loopback を IP リテラル（`127.0.0.1`・`[::1]`）に絞る。これは自社判断である [D]。
      - `jwks_uri` と `jwks` は同じ要求・応答に両方を入れてはならない（MUST NOT）[N][^1]（§2）。
      - `tls_client_auth` を使う client は、証明書の主体を表す metadata をちょうど 1 つ使わなければならない（MUST）[N][^3]（RFC 8705 §2.1.2）。本 profile は `tls_client_auth_subject_dn`・`tls_client_auth_san_dns`・`tls_client_auth_san_uri` の 3 つから選ばせる [D]。
      - `dpop_bound_access_tokens: true` を登録した client の token 要求に DPoP header がなければ、AS は拒否しなければならない（MUST）[N][^4]（RFC 9449 §5.2）。
      - `token_endpoint_auth_signing_alg` を登録すると、その alg で署名していない private_key_jwt の token 要求は拒否しなければならない（MUST）。`none` は使ってはならない（MUST NOT）[N][^6]。本 profile では private_key_jwt の client にこの項目を必須にし、値を ES256 か PS256 に限る（ARC-02 §3.2・§8）[D]。
      - C6 の `id_token_signed_response_alg` は、省略すると RS256 になる [N][^6]。ARC-02 K1 は ES256 か PS256 で登録させるとしているので、本 profile は必須項目にする。層 F の client は、PS256 の鍵がない間（XR-04）は ES256 に限る [D]。層 B の既定 alg は ARC-02 KP-1 で未決である。
      - `client_id` と `client_secret` を登録者が要求に入れることはできない（ADR-021 D21-22）。`client_id` は基盤が払い出す不透明値で、環境ごとに別の値になる [D]。
      - 所有者（`platform_owner`）と所有テナント（`platform_owning_tenant`）は metadata に持たせ、`client_id` から推論させない（ADR-021 D21-22）[D]。所有者のない client は登録できない（ADR-008 D8-54 の棚卸し）[D]。
    - C7（内部 workload）は ClientMetadata では登録しない。§4A の WorkloadEntry と ExchangePair で登録する [D]。C7 は STS への client 認証に X.509-SVID の mTLS（RFC 8705 の `tls_client_auth` で SAN URI を照合）を使うので（ADR-009 D09-14・D09-19）、STS 側の client の設定は登録エントリから基盤が作り、利用者に ClientMetadata を書かせない [D]。
    - RFC 7591 が定めない項目名（`platform_` で始まる 5 項目）は本契約の名前案であり、名前空間の規則（ADR-021 D21-28）で確定する（未決（ADR-021））[D]。RFC 7591 は、AS が理解しない client metadata を無視しなければならない（MUST）としている [N][^1]（§2）。そのため、他の AS 製品へ移る場合もこれらの項目は登録記録の側（本契約の申請 API と台帳）に持ち、AS 製品の拡張機能に依存しない [D]。
    - RFC 9126 は、RFC 7591 の metadata が、動的登録を使わない場合にも client の一般的なデータモデルとして役に立つと述べている [N][^5]（§6）。本番の申請 API が RFC 7591 の項目名を使うのはこのためである [D]。

    ## 4. sandbox の登録 profile（preview）

    - endpoint は sandbox の AS（issuer B）だけに置き、URL は sandbox AS の metadata の `registration_endpoint` で知らせる（ADR-022 D-3-2 の URL 直書きの禁止）[D]。
    - RFC 7591 の登録 endpoint は、JSON の POST を受け付けなければならず（MUST）、TLS で保護しなければならない（MUST）[N][^1]（§3）。
    - **initial access token を必須にする** [D]。RFC 7591 は、登録 endpoint が initial access token を受け付けて、事前に認可した者だけに登録を限ってよい（MAY）とし、相互運用のためには initial access token なしの登録を許すべき（SHOULD）としている [N][^1]（§3）。本 profile はこの SHOULD から外れる。理由は次の 2 つである [D]。
      - 非本番にも本番と同じ認証の最低基準を適用するため（ADR-008 D8-53）。Midnight Blizzard では、非本番テストテナントのアカウントを足がかりに本番相当の OAuth アプリへ到達された（CON-11 §5.2 (a) [I]、RS-12#16）。
      - 登録した client に所有者（consumer 台帳の consumer_id）を必ず結び付けるため（ADR-008 D8-54）。
      - 補完統制: initial access token は consumer 台帳に登録済みのチームにだけ、オンボーディング窓口から発行する（OB-1 の完了が条件）。sandbox の AS でしか受理せず、consumer_id に結び付く。寿命と発行窓口は TBD（所有者 プラットフォームチーム長、期限 DEC-8 前、決め方 パイロットの利用記録）。
    - software statement は v0.1 では受け付けない（`unapproved_software_statement`）[D]。RFC 7591 は software statement に JWS の署名か MAC と `iss` を求める（MUST）[N][^1]（RS-16#20）。署名者（ソフトウェアの発行者）の台帳がまだないため、受け付けても検証の根拠がない [D]。
    - 応答は RFC 7591 §3.2.1 に従い、`client_id`（REQUIRED）と登録された metadata をすべて返す（MUST）[N][^1]。AS が要求値を既定値に置き換えた場合も、置き換えた値を返す [N][^1]。
    - 管理（読取り・更新・削除）は RFC 7592 の profile にする。RFC 7592 は Experimental である [N][^2]。応答には `registration_client_uri` と `registration_access_token` が REQUIRED である [N][^2]（§3）。
      - registration access token は bearer token で、管理 endpoint での唯一の認証になる。比較的長期の資格情報なので、開発者が保護しなければならない（MUST）[N][^2]（§5）。
      - RFC 7592 は、読取り・更新のときにこの token を回転させてよい（MAY）としている [N][^2]（§5）。本 profile はこれを必須にし、回転後は古い token を拒否する（負例 CRN-14）[D]。
      - 更新（PUT）は、以前に返された metadata をすべて含めなければならず、省略した項目は削除の要求として扱われる（MUST）[N][^2]（§2.2）。部分更新ではない点に注意する。
      - 削除すると `client_id` と registration access token が無効になる。AS はその client の grant と token をすぐに無効にすべき（SHOULD）である [N][^2]（§2.3）。本 profile では sandbox の AS がこれを行う [D]。
    - 重複の扱い: 同じ `software_id` と `software_version` を持つ別の client の登録は、疑わしいものとして扱い拒否すべき（SHOULD）とされる [N][^1]（§5）。本 profile では、別の consumer_id が同じ組を登録した場合に拒否する（CR12）[D]。
    - 環境の分離（G-141(a) の登録段階）[D]。
      - 本番のホスト（本番の `<id-domain>` 配下と、本番の client に登録済みの redirect URI のホスト）を redirect URI に含む登録を拒否する（CR04）。本番のホストの一覧は sandbox AS の設定として持つ。
      - 本番の client に登録済みの公開鍵（JWK thumbprint）と同じ鍵の登録を拒否する（CR13。ADR-008 D8-52 の別の署名鍵）。
      - sandbox で払い出した `client_id` は本番の AS では未知であり、本番の token endpoint は `invalid_client` を返す（CRN-12）。sandbox の token は本番の検証点で拒否される（CON-11 CV-011）。
    - 登録数の上限は consumer_id ごとに置き、超えた場合は 429 を返す（CR14）。値は TBD（所有者 プラットフォームチーム長、期限 DEC-8 前）。RFC 7591 は、認可なしの登録要求について DoS を防ぐためにレート制限してよい（MAY）としている [N][^1]（§3）。

    ## 4A. C7 の workload と交換可能な組の登録（版 0.2.0 で追加、preview）

    ### 4A.1 なぜ要るか

    - 内部のサービス間同期呼出し（INT-02 の種別 6、P-03）で token exchange を使うには、次の 2 つが要る [D]。(a) 呼出し元のインスタンスが、登録済みの SPIFFE ID を持つ X.509-SVID を持つこと（ARC-04 §2 の表、ADR-009 D09-01）。STS は actor の身元をこの SVID による mTLS から取る（ADR-009 D09-14）。(b) 「呼出し元 workload × 呼出し先サービス × scope の上限」が交換可能な組の登録簿にあること。登録簿にない exchange を STS は拒否する（ADR-009 D09-13）。
    - 版 0.1.1 までは、どちらも本契約の範囲外で、契約がなかった。このため P-03 のチームは、基盤の側で誰かが手で登録しない限り、exchange の結合試験に進めなかった（ラウンド 6 の指摘）[D]。版 0.2.0 で、client と同じ形（sandbox はセルフ登録、本番は承認付きの申請）の登録手段を preview で加えた [D]。
    - 登録エントリと組は client ではない。C7 には ClientMetadata を書かせない（§3）[D]。

    ### 4A.2 workload の登録エントリ（WorkloadEntry）

    - **SPIFFE ID は基盤が払い出し、登録者は指定できない（CR17）** [D]。path の形式が未決であり（ARC-04 W55-03、DL-71）、廃止した ID を別の workload に再割当てしないためである（W55-04）。WIMSE の identifier 草案は、識別子を別の workload に再割当てすべきでない（SHOULD NOT）とする [N][^9]（§4.5、RS-06#25）。Internet-Draft なので設計の参照にとどめる [D]。
    - **selector は、基盤が管理し workload 自身が書き換えられない属性に限る**（ARC-04 W55-08）[D]。本 profile が受け付ける型は `k8s:ns`（実行基盤の namespace）、`k8s:sa`（service account）、`image:digest`（署名済みイメージの sha256 digest）の 3 つである [D]。
      - `k8s:ns` と `k8s:sa` は必須とする。本番は `image:digest` も必須とする（CR16）[D]。
      - label、annotation、Pod・コンテナの名前、hostname、環境変数、プロセスの名前・パス、イメージの tag、IP アドレスは受け付けない（CR15）[D]。これらは workload か配備する人が自分で書けるためである [D]。WIMSE の workload identity practices 草案は、マルチテナント基盤で偽造しやすい属性だけでアクセスや federation を許してはならない（MUST NOT）とする [N][^8]（§5.8、RS-06#27）。Internet-Draft なので設計の参照にとどめる [D]。
      - `k8s:ns` は、その consumer_id に基盤が割り当てた namespace でなければならない。同じ selector の組を別の登録エントリがすでに持つ場合も拒否する（CR21）[D]。1 つの workload を 2 人の所有者が名乗れないようにするためである [D]。
      - selector の妥当性は、本番では AR-6 の承認者が見る（INT-04 OB-2(b)、ARC-04 W55-08 の第三者の構成レビュー）[D]。
    - **所有者のない登録エントリは作れない**（`platform_owner` の consumer_id と副所有者の連絡先を必須にする。ARC-04 W55-11）[D]。
    - 登録エントリは鍵を受け取らない。SVID の鍵は workload の側で作り、無関係なインスタンスと共有しない（ARC-04 W55-06）[D]。
    - 呼出し先として exchange を受ける場合は `expose_as_service: true` を指定する。基盤はサービスの正規識別子（不透明値。ADR-009 D09-11、ADR-021 の名前空間台帳）を払い出し、応答の `service_id` に入れる。呼出し元は exchange の `resource` にこの値を使う [D]。
    - 削除（廃止）すると、SPIFFE ID は墓石として保持し再発番しない（W55-04、ADR-021 D21-13）。SVID の新規発行を止め、発行済みの SVID は寿命（W55-09）で切れる。その workload を呼出し元か呼出し先に持つ交換可能な組は同時に無効になる [D]。
    - 環境の分離（G-141(a) の登録段階）[D]。sandbox の登録エントリは sandbox の trust domain で SPIFFE ID を払い出す。本番の trust domain の SPIFFE ID を要求のどこかに含む sandbox の登録は拒否する（CR20）[D]。WIMSE の mutual-tls 草案は、認可ポリシーが trust domain と trust anchor を考慮せずに識別子の path だけを評価してはならない（MUST NOT）とする [N][^10]（§5、RS-06#25）。本 profile は登録エントリと組を trust domain を含む完全な SPIFFE ID で記録するので、path が同じ sandbox の ID は本番の組に一致しない [D]。

    ### 4A.3 交換可能な組（ExchangePair）

    - 登録内容は、呼出し元（`caller_spiffe_id`。同じ環境の登録済みエントリ）、呼出し先（`callee_service_id`。§4A.2 で払い出したサービスの正規識別子か、基盤が提供する参照サービス）、scope の上限（`max_scope`）、理由（`justification`）である（ADR-009 D09-13）[D]。
    - `max_scope` は空にできず、wildcard（`*`）を含められない（CR19）[D]。STS が発行する scope は、subject_token の scope と `max_scope` の共通部分以下になる（ADR-009 D09-15）[D]。
    - 申請するのは呼出し元の所有者、承認するのは呼出し先の所有者である（ADR-009 D09-13、INT-04 OB-2(c)）[D]。sandbox でもこの承認は省かない [D]。
      - sandbox で、呼出し先が自分の consumer_id の workload か基盤の参照サービスなら、承認者は申請者自身と同じ所有者なので、201 で即時に有効になる [D]。
      - 呼出し先が他の consumer の workload なら、202 と `status: pending_callee_approval` を返し、呼出し先の所有者が `decideSandboxExchangePair` で承認すると有効になる [D]。中央の承認は待たない（G-141(c)）[D]。
    - 変更は ADR-016 の版管理と監査の対象にする（ADR-009 D09-13）。本契約は登録・削除の操作だけを定め、版管理の仕組みは範囲外とする [D]。
    - edge を呼出し元とする組（P-01・P-22 などで、edge が業務 API 宛ての内部 JWT に交換する経路。INT-02 §9.1 の問い。版 0.3.1、PoC/R7反映）の案: ADR-009 D09-13 をそのまま当てはめ、申請者は edge の所有者（プラットフォームチーム）、承認者は呼出し先の所有者（AR-7）とする。呼出し先のチームが自分の API を edge の背後に公開したいときは、プラットフォームチームに申請を依頼し、自分で AR-7 を承認する [D]。呼出し先のチームが自分で申請できる形にすると、edge が呼出し元の組を edge の所有者の知らないまま増やせるので採らない [D]。確定は ADR-009 の所有者による（未決（ADR-009））。

    ### 4A.4 本番の申請

    - 本番は §5 の申請 API に、申請種別 `subject: workload` か `subject: exchange_pair` で申請する [D]。本番の登録エントリと組は、承認がそろうまで払い出さない [D]。
    - 承認者案 [D]。AR-6（workload の create・update）: プラットフォームチームの有資格者（作成者≠承認者。selector の妥当性を見る。INT-04 OB-2(b) と同じ）。AR-7（exchange_pair の create・update）: 呼出し先の所有者（ADR-009 D09-13）。`max_scope` が privileged の scope（F1・F2）を含む組は AR-3 も要る。retire は AR-0 で、所有者だけで成立する。
    - 申請から払出しまでの SLI は未採番である（INT-04 ONB-R3）[D]。

    ### 4A.5 API ができるまでの暫定手順

    - 2026-10-15 時点で、共有 sandbox は未提供（K11-3）、契約試験キット本体（DL-120）は未実装で、PoC（POC-03）に登録 API はない [D]。PoC の workload は `12_poc/code/lib/topology.js` の固定一覧 `WORKLOADS` にあり、交換可能な組は `12_poc/code/config/ledger.json` の `exchange_registry`（呼出し元・呼出し先・`max_scope`）にあって、STS（`12_poc/code/sts/server.js`）が起動時に読む（2026-10-15 にソースで確認）[D]。
    - それまでは次のどちらかで進める [D]。
      1. **ローカル**: PoC を手元に複製し、`WORKLOADS` に名前を、`ledger.json` の `services` と `exchange_registry` に行を加えて起動し直す。この変更はリポジトリにコミットしない（POC-03 の試験の前提が変わるため）。selector の検査、承認、負例 CRN-21〜CRN-30 は再現できない。
      2. **共有 sandbox の提供後で API の提供前**: S1 窓口（INT-00 §8.1）に、本契約の WorkloadEntry・ExchangePair と同じ項目を書いて依頼し、プラットフォームチームが手で登録する。依頼の項目を本契約のスキーマに合わせておけば、API の提供後にそのまま移せる。
    - API の実装の所有者は PEP SDK・開発者支援チーム（ARC-04 の所有者と協議）、期限は DEC-8 第 1 段の前（キット本体 DL-120 の受入れが DEC-8 第 1 段の入力になるため。deliverables.md の DL-120 行）とする（x-open-issues の G-141(c) の workload）[D]。

    ## 5. 本番の登録申請 API（preview）と承認フロー（OB-2(d) の承認者案）

    - 本番の AS では動的登録を無効にする（ARC-02 §9.2 行 34。本番での採否は未決（ADR-022、ARC-02 AR-3））[D]。本番の client は、本 API への申請と承認を経て、プラットフォームが AS に払い出す [D]。
    - 申請者は consumer 台帳に登録されたチームの人である。認証は社内の workforce IdP（MFA 必須、ADR-008 D8-53）で行う [D]。
    - 申請の対象（`subject`）は `client`（既定）、`workload`、`exchange_pair` の 3 つである（後の 2 つは版 0.2.0 で追加。§4A.4）[D]。
    - 申請の種類は `create`（新規）、`update`（変更）、`retire`（廃止）の 3 つである。`retire` は権限を減らす変更なので、所有者だけで成立させ、中央の承認を待たない [D]。
    - 承認の要否は x-approval-rules で決まり、申請の応答の `required_approvals` に入る [D]。すべての承認がそろうまで払出しは行わない [D]。
    - 承認者は有資格者名簿（operating-model §5.5）に載った者に限り、申請者自身は承認できない（403。CRN-17）[D]。
    - 承認者案の根拠 [D]。
      - AR-1（全申請）を CP-2 相当にしたのは、client の登録が単一テナントか第一者の構成の変更であり、operating-model §7.2 の CP-2 が作成者≠承認者の peer review を定めているためである。ADR-022 D-7-1 の「下層の実装変更は peer review」にも合う。ただし AR-1 は基盤側の審査であり、所有テナントの意思を確かめない。単一テナントの変更でも、app-only の権限の付与は AR-4（CP-1）、所有テナントの同意は AR-8 で別に求める（版 0.3.0）。
      - AR-2（第三者・外部 RP）は ADR-005 D7-1 の「登録時の発行者確認」を写した。
      - AR-3（層 F・privileged scope）は、ADR-020 D20-03 が層を client の profile 属性と操作の分類の組で決めるとしているためである。層 F の client の誤登録は、F1・F2 の管理 API を外部から呼べる状態を作る。
      - AR-4（app-only の権限）は、ADR-008 D8-54 が app-only 権限の付与を一律に CP-1 の保護操作としているためである（T-071）。版 0.2.0 までは「複数テナントにまたがる」場合に限っていたが、D8-54 に単一テナントを除く定めはなく、operating-model §7.2 の CP-2（単一テナントの設定）に当てはめて CP-1 から外す理由もないので、版 0.3.0 で app-only の権限の付与すべてに広げた。client_credentials は利用者を介さないので、その client が要求する scope はすべて app-only の権限とみなす。RFC 6749 §4.4 は、client 自身の管理下にない資源への client_credentials のアクセスを、事前に AS と取り決めた（previously arranged）ものに限り、取決めの方法は範囲外としている [N][^11]。
      - AR-5（C3 で mTLS の代わりに DPoP）は ADR-005 K-3 の例外の扱いで、受容票を必須にする。
      - AR-6（workload）は INT-04 OB-2(b) の「プラットフォームチーム（作成者≠承認者）」を写した。AR-7（交換可能な組）は ADR-009 D09-13 の「呼出し先の所有者の承認」を写した。
      - AR-8（所有テナントの管理者の同意。版 0.3.0）は、ADR-005 D7-2 の「低リスク以外はテナント管理者の同意とし、privileged 操作として扱う」を登録の段階に写した。AR-1〜AR-4 の承認者はすべて基盤側の者なので、悪意のある社内チーム（ATK-17）や侵害された consumer（ATK-06）が `platform_owning_tenant` に被害テナントを書くと、そのテナントの誰も知らないまま、そのテナントの資源に届く client が払い出される（テナント越境）。RFC 6749 §4.4 の「事前の取決め」で守られるべき当事者は資源の所有者（ここでは所有テナント）であり、基盤側の承認ではその意思を確かめられない [N][^11][D]。先行例として、Microsoft Entra ID の admin consent workflow では、審査者に指定しても権限は昇格せず、承認するには管理者同意を付与できる権限が要り、Microsoft Graph のアプリケーション権限を求める要求を承認できるのは Global Administrator だけである [V][^12]（RS-17#63）。同意を求める範囲は、app-only の権限すべてと、操作の分類登録（DL-67）で低リスクに分類されていない scope である。分類が未登録の scope は低リスクとみなさない（fail-closed）[D]。
      - AR-8 の同意記録（`tenant_consent`）は、(a) 所有テナントの管理画面の承認 API（テナント管理者が申請 ID と scope の一覧を見て承認する。API の契約は本書の範囲外で、§9 H-17）の記録 ID か、(b) テナント管理者が署名した同意票の参照のどちらかである。同意記録は、テナント・申請（request_id か target_client_id）・scope の集合・有効期限に束縛し、同意の時点で同意者がそのテナントの管理者の役割を持っていたことを、受付時と払出しの直前に基盤が検査する。他テナントの同意、別の申請や狭い scope の同意、期限切れ、管理者でない者の同意は CR22 で拒否する [D]。AR-8 の判断は基盤側の承認者（workforce IdP の有資格者）が記録できない（403。CRN-34）[D]。
      - **同意の本体が束縛する項目と同意画面の表示（版 0.4.0、ラウンド 9 legal）**。版 0.3.x の同意はテナント・申請・scope の集合・期限だけを束縛し、誰に、何のために、どの区分のデータが、どの地域で、いつまで渡るかを束縛していなかった [D]。このため所在地指定テナント（A-062）の管理者が同意すれば、別の法域の cell や外部で動く app-only の client に、そのテナントの利用者全体のデータが渡り得た [D]。AR-8 の同意の本体は、上の 4 項目に加えて次の (i)〜(v) を束縛し、所有テナントの管理画面の同意画面に同じ値を表示する [D]。値は申請の `data_processing`（DataProcessingDeclaration）から写し、同意の本体の値と 1 つでも異なれば CR22 で拒否する（CRN-43）[D]。
        - (i) 受領者: client を運用する法人と事業ドメイン。表示名と識別子は基盤の法人台帳・consumer 台帳で検証した値を使い、申請者の自己申告（`client_name` など）をそのまま表示しない。RFC 7591 は AS がすべての client metadata を自己申告として扱うこと（MUST）を求め [N][^1]、`client_name` は認可時に利用者へ示す名前と定義している [N][^1]。CSA SSCF は連携の作成者を検証して同意画面に表示する仕組みを求めている（IPY-SaaS-02、must）[N][^13]（RS-14#50）。
        - (ii) 利用目的: 自由記述の `justification` と別に、同意画面に出す利用目的を 1 つの文で持つ。
        - (iii) データの区分: REQ-04 §3.2 の区分コード（CUS・PII・SPI・MED・AUD・AZD など）の集合。scope から基盤が導く区分を下限とし、申告がそれより狭ければ CR22 とする。scope と区分の対応表は未作成（§9 H-28）。
        - (iv) 処理・保存の地域: client を運用し、取得したデータを処理・保存する所在地群（ADR-013 の所在地群。値の集合は relationship-model-registry の `destination_region` と同じ）の集合。
        - (v) 保持期間: 受領者が取得したデータを保持する期間の上限（ISO 8601 の期間）。
        - 同意の本体の 9 項目（テナント・申請・scope・期限と (i)〜(v)）は監査記録に残し、所有テナントの管理者が後から参照できるようにする。これは CTL-02 §1.4 の「監査記録に共有元法人・共有先法人・利用目的を記録できるようにする」と同じ考え方である [D]。
      - **AR-9（所在地群と受領法人の判定記録。版 0.4.0、ラウンド 9 legal）**。管理者の同意は、テナント管理者の判断の記録であって、移転・第三者提供の法的根拠の判定ではない [D]。個人情報保護法は外国にある第三者への提供を、本人同意・基準適合体制・同等水準の国のいずれかによらせ（第 28 条）[N][^14]、GDPR は第三国移転を Chapter V の条件を満たす場合に限り（44 条）、十分性認定がなければ適切な保護措置を求め（46 条 1 項）[N][^15]、DORA は ICT 第三者サービス提供者との契約に、データを処理・保存する場所（地域または国）と変更の事前通知の義務を含めるよう求めている（30 条 2 項 (b)）[N][^16]（いずれも CTL-02 §3.5 の判定に使った原典。RS-02#8, #9, #47, #58）。テナントの管理者は B2B の委託元の担当者であり、利用者本人ではない（CTL-02 §1.2、L-02）[D]。そこで、次のどちらかに当たる申請は、DL-34（CTL-02）の判定記録の参照（`data_processing.transfer_assessment_ref`）を必須にし、ないか、判定記録が本申請の受領者・地域・区分を覆わなければ CR24 で拒否する（fail-closed）[D]。
        - (a) `processing_regions` に、所有テナントの所在地群（A-062。テナント配置表の値）にない所在地群がある（CRN-42）。relationship-model-registry の export が、所在地群外への送付先を DL-34 の判定記録なしに拒否する前例（ADR-018 D18-12(d)）に倣った [D]。
        - (b) 受領者の運用法人が基盤運営法人と別法人である（CRN-45）。CTL-02 §1.4 (β) のとおり、別法人への個人データの提供は第三者提供に当たり得、委託・共同利用の構成に収まるかは L-13 で決まる [D]。NA-8 が未確定の間は、別法人かどうかを法人台帳で判定し、不明なら別法人として扱う [D]。
        - 判定記録で足りるか（管理者の同意と判定記録の組で移転・第三者提供の要件を満たすか）の法的判断そのものは、本契約では決めない。L-04・L-13 と OI-P02（非机上の法務判断）に委ねる [D]。本規則は、その判断がない申請を払い出さない仕組みだけを置く [D]。
        - AR-9 の判定記録の参照は基盤側の承認者が decide で代わりに記録できない（403。AR-8 と同じ。CRN-34 に準じる）[D]。update で `data_processing` のどれか、または `platform_owning_tenant` を変える申請は、AR-8 の新しい同意と AR-9 の再評価を要する（CRN-44）[D]。
        - 限界 [D]: `processing_regions` は申請者の申告であり、client が実際にどこで動くかを基盤は登録時に確かめられない。C7 の workload なら SVID の trust domain と cell で確かめられるが、外部で動く C5 の client にはその手段がない。申告と異なる地域からの token 要求の検知（mTLS の証明書・送信元の地域の記録）は案にとどめ、§9 H-27 で残余リスクとして申し送った。
      - 同意を得られても、テナント管理者自身が悪意を持つ場合（ATK-02）や、管理者が欺かれて同意する場合（consent phishing、T-007）は防げない。この残余は §9 H-18 で残余リスク台帳に申し送った [D]。
      - **`platform_owning_tenant` の値そのものの検証（版 0.3.1、PoC/R7反映）**。AR-8 は同意記録と申請の一致を確かめるが、所有テナントの値が実在し、払出し後もその値に閉じることまでは確かめない [D]。POC-02 §6.2 の X-D（façade の関係書込 API が、object 側のテナント検査を通したうえで、他テナントの role を subject として受理した）と X-C（外部ゲストの閉じ込めが R 段の 1 層だけに依存した）は、テナント境界の検査を 1 つの層・1 つの欄に置くと、検査されない欄から越境が成立し得ることの兆候である [D]。POC-02 の値は立会人なしの自己実行で、Gate 4 の証拠ではなく、原因区分も作成者以外が確かめていない（POC-02 §1.3・§6.1）[D]。この含意を登録の経路に写し、次の 4 点を受付・払出し・実行時の別々の層で検査する [D]。
        - (1) 受付時: `platform_owning_tenant` は、REQ-05（02_requirements/tenant-lifecycle.md）§2.1 の主状態が A（有効）の顧客テナントで、申請先の環境（本番）のテナントでなければならない。未知の ID、P（申込中）・S1・S2（停止）・M（移行中。境界を変える設定は凍結）・N（解約予告）・R 以降の状態、sandbox のテナント ID は CR23 で拒否する（CRN-38）。払出しの直前にも再検査する。
        - (2) 変更時: update で `platform_owning_tenant` を T から U に変える申請は、T の client の廃止と U での新規登録と同じに扱う。U の管理者の新しい同意（AR-8）と AR-4 を要し、T の同意を流用できない（CR22。CRN-39）。
        - (3) 払出し後（実行時）: AS は、`platform_owning_tenant` を持つ client に発行する token の `tid` を登録記録の値に固定し、要求の値（resource・パラメータ・ヘッダ）から決めない。資源側テナントとの照合は、PEP が CON-06 の `tid` で別に行う（ARC-02 の検証規則）。登録時の承認だけに越境の防止を依存させないためである（CRN-40）。
        - (4) 同意の撤回とテナントの終了: 所有テナントの管理者が同意を撤回した場合と、テナントが R 以降の状態に入った場合は、その client を AR-0 の retire と同じに扱い、grant と token を無効化する。S1・S2 の間は token の発行を止める（CRN-41）。撤回から無効化までの時間は SLI が未採番で TBD（所有者 認証・IdP チーム、期限 DEC-8 前、決め方 パイロットの実測。§9 H-21）。撤回の受け口は、所有テナントの管理画面の承認 API（§9 H-17）に置く案である。
        - 4 点とも 2026-10-15 時点で実装も実行もない。PoC（12_poc/code）は client 登録の部品を持たず、POC-02 の 23 TC にも登録の経路はない [D]。追加の試験は §9 H-20 で申し送った。見直しトリガー: CRN-38〜CRN-41 のいずれかが立会い下の実行で受理された場合、または POC-02 の X-D が立会い下の再実行で設計の欠陥と分類された場合は、AR-8 と本節の検査点を見直す [D]。
    - 本書が新たに置いた承認者はない。AR-1〜AR-8 は既存の区分（CP-1・CP-2、ADR-005 D7-1・D7-2、ADR-008 D8-54、K-3、INT-04 OB-2(b)、ADR-009 D09-13）への当てはめである [D]。AR-9 は承認者ではなく、DL-34（CTL-02、法務責任者）の判定記録の有無を検査する規則である（版 0.4.0）[D]。ただし、当てはめ自体は本書の案であり、確定は ONB-R2 による [D]。
    - 申請から払出しまでの時間は SLI が未採番である（INT-04 ONB-R3）[D]。

    ## 5A. 本番の redirect URI のホストのドメイン検証（版 0.5.0、凍結前是正 FZ-027、preview）

    ### 5A.1 なぜ要るか

    - redirect URI は登録値と要求値を exact string matching で照合しなければならない（MUST）[N][^7]（§2.1、RS-04#1）。この照合が確かめるのは文字列の一致であり、そのホストを今誰が支配しているかではない [D]。版 0.4.1 までの本契約は、wildcard・fragment・loopback 以外の http を拒否し（CR03）、sandbox の登録に本番のホストを含めることを拒否する（CR04）だけで、redirect_uris のホストの所有確認も、払出し後の再検証もなかった [D]。
    - このため、連携事業者・顧客がドメインの更新を怠って第三者に再登録された場合や、redirect URI のホストが CNAME で指すクラウドの資源が解放されて第三者に取得された場合（dangling DNS）に、AS は登録値と一致する乗っ取られたホストへ認可コードと state・iss を返す（THR-03 T-098 の攻撃経路 (a)〜(c)）[D]。PKCE の verifier を同じ origin のブラウザ保存領域に置く公開 client では、乗っ取った origin から配信したスクリプトで verifier を読める場合があり、PKCE は防御にならない（T-098）[D]。
    - 本節は THR-03 申し送り T98-1 の (1)〜(4) を本契約に写したものである [D]。AR-2 の checks の「redirect URI のホストの所有」は人の確認だったが、本節で機械検査（AR-10）にした [D]。

    ### 5A.2 対象

    - 対象は、本番の申請 API の `subject: client` の create と、redirect_uris を変える update である [D]。redirect_uris に含まれる `https` のホストのすべてが対象になる [D]。
    - 対象外: C2 の loopback の IP リテラルと private-use scheme（DNS のホストを持たない）、C5・C8（redirect_uris を登録しない）、sandbox の登録（本番のホストは CR04 で拒否済み。sandbox のホストの乗っ取りは sandbox の client に限られる）[D]。sandbox を対象外にした残余は §5A.6 に書いた。
    - 版 0.5.0 より前に払い出した本番の client は、移行期間内に検証を済ませる。移行期間の長さは TBD（所有者 認証・IdP チーム、期限 DEC-8 前）で、期間が過ぎて検証のない redirect ホストは §5A.4 の失効と同じに扱う [D]。

    ### 5A.3 登録時の検証（CTL-01 C-027 の DNS TXT 方式の流用）

    - 申請者は、申請の前に `createRedirectHostVerification` でホストごとの検証を作り、基盤が払い出した TXT record（ラベルと値）をそのホストの DNS に置いてから、申請の `redirect_host_verifications` に検証 ID を入れる [D]。基盤は受付時と払出しの直前に TXT record を引き直して照合する [D]。
    - 方式は CTL-01 C-027（DNS TXT によるドメイン検証と、失効・再登録時の再検証。登録時＋定期再検証）を流用する [D]。IETF DNSOP の草案（Internet-Draft、未 RFC。状態は脚注 17）は、persistent 型の検証は検証を特定の利用者の口座に束縛し続ける場合にだけ適切で、DNS に token が残っていることだけを支配の証拠として扱ってはならないとしている [N][^17]（§3、RS-14#24）。Internet-Draft なので設計の参照にとどめる [D]。本 profile は次のとおり束縛する [D]。
      - 検証は、(a) ホスト（完全一致。親ドメインの検証で子のホストを覆わない）、(b) 所有テナント（`platform_owning_tenant`。ないときは所有者の consumer_id）、(c) 申請（request_id）か払出し後の client_id に束縛する。TXT の値は基盤が生成する一度きりの乱数で、申請者に選ばせない。
      - 別の client・別の所有テナント・別の consumer の検証を流用した申請は CR25 で拒否する（CRN-48）。同じホストを別の client が使うときも、その client の検証を別に作る。
    - DNS の照合は、信頼できる DNSSEC 検証リゾルバで行い（草案の MUST）、AD bit が立たない応答では地理的に分散した複数のリゾルバで照合する（草案の SHOULD）[N][^17]（§9.7、RS-14#26）。
    - **public suffix と共有ホスティングの拒否（CR26）**。草案は、Public Suffix List の ICANN division の public suffix の所有者検証を許可しないこと（SHOULD NOT）としている [N][^17]（§9.9、RS-14#26）。本 profile は、ホストそのものが ICANN division の public suffix である場合に加え、PSL の private division の suffix（共有ホスティング・PaaS の利用者ごとの名前）そのものか、その直下のホストも本番では拒否する [D]。直下の名前は利用者が資源を解放すると第三者が取得し得る、dangling DNS の典型の形だからである（T-098 の (b)）[D]。独自ドメインから CNAME で共有ホスティングを指す形は受け付け、§5A.4 の CNAME の宛先の監視の対象にする [D]。PSL の版の固定と更新の扱いは x-open-issues に置いた。
    - **CNAME の宛先の検査（CR27）**。ホストが CNAME の連鎖を持つ場合、連鎖の末端が解決できない（NXDOMAIN）か、宛先の資源が未割当てと判定できるときは拒否する（CRN-50）[D]。未割当ての判定の方法（宛先の事業者ごとの応答の型）は TBD（所有者 CISO、期限 G3）。判定できない宛先は拒否しない（判定の限界は §5A.6）。
    - AR-10 は承認者を持たない自動検査の規則で、基盤側の承認者は decide で代わりに記録できない（403。CRN-54）[D]。

    ### 5A.4 払出し後の再検証と変更の検知

    - 草案は、persistent 型では record の削除による取消の手順と再検証の頻度を明示すること（MUST）、ドメイン所有者の変更を監視して新しい token で再確認を求めてよいこと（MAY）を定める [N][^17]（§6.3、RS-14#25）。本 profile は次を行う [D]。
      - (1) 定期の再検証: 本番の client の redirect ホストのすべてについて TXT record を引き直す。周期は TBD（所有者 CISO、期限 G3、決め方 TH-TC-098 と運用試験。T98-1）。取消の手順（TXT を消すと次の再検証で失効する）と周期は、連携開発者向けの案内（INT-04 OB-2(d)）に載せる（§9 H-38）。
      - (2) 変更の検知: ホストの登録可能ドメインの NS の変更、登録者（登録データ）の変更、ホストの CNAME の宛先の変更と宛先の未割当て化を監視する。登録データの取得方法と監視の周期は TBD（所有者 CISO、期限 G3）。
      - (3) 再投入への備え: 草案は新しい所有者による旧 record の再投入の危険を挙げる [N][^17]（§9.11、RS-14#27）。NS か登録者の変更を検知したら、TXT record が残っていても検証を失効させ、新しい値での再検証を求める（旧い値は二度と受け付けない。CRN-52）[D]。
      - (4) 再有効化の扱い: 草案は、別の利用者による再検証を「再有効化」として扱うと旧所有者の資源へのアクセスを新所有者に与え得るとする [N][^17]（§9.13、RS-14#27）。失効した検証を、別の consumer・別の所有テナントの新しい検証で復活させない。失効した client の再開は、その client の所有者による update の申請と新しい検証を要する（CRN-53）[D]。
    - **失効時の動作（CR28。DL-24 との接続）**。
      - (a) 即時: 失効した検証のホストを含む redirect URI を、その client の有効な redirect URI から外したものとして扱う。その redirect URI を指定した認可要求に対し、AS はエラーを利用者に示し、その URI へ自動で redirect しない。RFC 6749 は、redirect URI が無効か一致しない場合に、AS はエラーを資源所有者に知らせるべき（SHOULD）で、無効な redirect URI へ user-agent を自動で redirect してはならない（MUST NOT）としている [N][^11]（§4.1.2.1）。所有者（`platform_owner` の consumer_id と副所有者）と、所有テナントがあればその管理者に通知する [D]。
      - (b) 猶予の後: 猶予期間（TBD。所有者 認証・IdP チーム、期限 DEC-8 前）の間に再検証が済まなければ、client を停止する。停止は OPS-01（DL-24）§2.5 の P-K1（client 単位の遮断）を使い、新しい token の発行と refresh を止める [D]。払出し後の client の状態（`platform_client_state`）を suspended にし、`suspension_reason_code` に CR28 を記録する [D]。
      - (c) 即時の停止: NS と登録者の変更が同時に検知された場合、または CNAME の宛先が未割当てになった場合は、猶予を置かずに (b) を行う。失効の検知の前の最後の成功した再検証の時刻から後に、その redirect URI へ返した認可コードで発行した grant と token は、P-REV（client 範囲の失効下限時刻の前進）で失効させる [D]。
      - (d) 再開: 所有者が新しい検証（新しい値）を済ませ、redirect URI の update を AR-1 と AR-10 で通した場合に限る。自動では再開しない [D]。
    - 停止は権限を減らす方向の変更なので、中央の承認を待たずに基盤が行う（AR-0 と同じ考え方）[D]。

    ### 5A.5 申請の項目と応答

    - 申請の `redirect_host_verifications` は、redirect_uris に含まれる `https` のホストごとに 1 つの検証 ID の配列である。ホストの集合と検証の集合が一致しない申請は CR25 で拒否する [D]。
    - 検証の状態（`RedirectHostVerification.status`）は `pending`（TXT 未確認）、`verified`、`failing`（再検証の失敗。猶予中）、`lapsed`（失効）、`superseded`（新しい検証に置き換え）の 5 つである [D]。

    ### 5A.6 限界と残余

    - 再検証の周期の間に乗っ取られたホストへは、次の再検証か変更の検知まで認可応答が返り得る（T-098 の残余 (1)）[D]。
    - 旧所有者の TXT の値をそのまま引き継いだ新しい所有者は、NS・登録者の変更が登録データに現れない形（同じ DNS 事業者の口座の譲渡など）では検知できない（T-098 の残余 (2)）[D]。
    - CNAME の宛先の未割当ての判定は、宛先の事業者が判定可能な応答を返す場合に限られる [D]。
    - sandbox の redirect ホストは検証しない。sandbox の client の token は本番の検証点で拒否される（CON-11 CV-011）ので、被害は sandbox の試験データに限られる [D]。
    - 2026-10-15 時点で、本節の規則は実装も実行もない。PoC（12_poc/code）は client 登録の部品を持たない [D]。

    ## 6. 凍結区分（ADR-022 D-1・D-2）

    | 要素 | 区分 |
    |---|---|
    | `client_id` の形式と「不透明に扱う」という契約 | 不可逆（ADR-021 D21-22） |
    | ClientMetadata の種別ごとの規則、理由コード CR01〜CR14 の意味 | GA（ARC-02 §6 の写し。DEC-8 前は draft） |
    | sandbox の登録・管理 endpoint（RFC 7591/7592 profile） | preview（ADR-022 D-2 の「非本番環境の動的登録」） |
    | 本番の登録申請 API、承認規則 AR-1〜AR-9、所有テナントの同意の参照（tenant_consent）と理由コード CR22（版 0.3.0）・CR23（版 0.3.1、PoC/R7反映）、データ処理の申告（data_processing）・AR-9・CR24（版 0.4.0） | preview（ADR-022 が本番の登録手段を定めていない。改版で区分を決める） |
    | workload の登録エントリと交換可能な組の登録（§4A の 5 操作、申請種別 workload・exchange_pair）、WorkloadEntry・ExchangePair のスキーマ、理由コード CR15〜CR21 | preview（版 0.2.0 で追加。ADR-022 D-2 に該当する行がない。§9 H-11） |
    | 本番の redirect ホストのドメイン検証（§5A の 2 操作、AR-10、`redirect_host_verifications`、RedirectHostVerification、払出し後の `platform_client_state`、理由コード CR25〜CR28） | preview（版 0.5.0、凍結前是正 FZ-027。本番の申請 API と同じ扱い） |
    | ホスト名、initial access token の寿命、登録数の上限、承認の SLI | 凍結しない |

    - GA の ClientMetadata 規則は、preview の endpoint に必須で依存していない。規則は申請 API と sandbox の両方で同じスキーマとして使うので、endpoint が変わっても規則は残る（ADR-022 D-1-1）[D]。

    ## 7. 標準からの逸脱と補完統制

    | 原典の規定 | 本 profile | 理由・補完統制 |
    |---|---|---|
    | RFC 7591 §3: 認可なしの登録を許すべき（SHOULD） | initial access token を必須にする | §4 の 2 つの理由。補完統制は consumer 台帳との結び付けと sandbox 限定 [D] |
    | RFC 7591 §2: token_endpoint_auth_method の既定は client_secret_basic | 項目を必須にし、共有秘密の方式を拒否する | ADR-009 D09-18。既定値の上書きではなく、省略の拒否であり、RFC 7591 の AS が要求値を拒否してよい（MAY）規定の範囲内である [N][^1][D] |
    | RFC 7592 §5: registration access token の回転は任意（MAY） | 読取り・更新のたびに回転を必須にする | bearer で長期の資格情報なので、漏えい時の悪用期間を短くする [D] |

    ## 8. 未決

    info.x-open-issues に一覧化した。主なものは、本番の登録手段の正式な区分と承認者（未決（ADR-022）、ONB-R2）、本番での動的登録の採否（ARC-02 AR-3）、§4A の API の実装と暫定手順の解消（G-141(c) の workload）、selector の型の一覧の確定（ARC-04 W55-08・DL-71）、拡張項目の名前空間（未決（ADR-021））、Back-Channel Logout の登録項目（未決（ADR-006 L6-2））、redirect ホストの再検証の周期・猶予期間・移行期間と共有ホスティングの suffix の扱い（§5A、版 0.5.0）である [D]。

