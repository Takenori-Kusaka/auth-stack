  /v1/client-registration-requests:
    servers:
      - url: https://onboarding.id-domain.example
        description: 本番の登録申請 API。本番の AS とは別の窓口で、本番の AS の動的登録は無効（ホスト名は仮置き）
    post:
      operationId: submitClientRegistrationRequest
      tags: [production-registration-request]
      summary: 本番の client・workload・交換可能な組の登録・変更・廃止を申請する
      x-freeze-class: preview
      description: |
        `subject` で対象を選ぶ（`client` が既定。`workload`・`exchange_pair` は版 0.2.0 で追加。§4A.4）。workload には AR-6、exchange_pair には AR-7 の承認が要る。
        client_credentials の client には AR-4（CP-1）が要る。`platform_owning_tenant` が顧客テナントで、app-only の権限か低リスクでない scope を要求する申請には、そのテナントの管理者の同意記録 `tenant_consent` が要り、検査に通るまで払い出さない（AR-8、CR22。版 0.3.0）。AR-8 に当てはまる申請には `data_processing`（受領者・利用目的・データ区分・処理地域・保持期間）が要り、同意の本体と一致しなければ CR22、処理地域が所有テナントの所在地群の外か受領法人が別法人で DL-34 の判定記録がなければ CR24（AR-9。版 0.4.0）。
        申請を受け付け、必要な承認（x-approval-rules）を `required_approvals` に入れて 202 を返す。ClientMetadata の規則に反する申請は、受付の時点で 400 を返す（理由コードは CR01〜CR13 と同じ。同意記録の不備は CR22。所有テナントの値の不備（未知、主状態が A でない、別環境のテナント）は CR23。版 0.3.1、PoC/R7反映）。
        sandbox と同じ ClientMetadata を使えるが、`client_id` は本番で別の値が払い出される（ADR-021 D21-22）。
        redirect_uris に https のホストがある create と、redirect_uris を変える update には、ホストごとのドメイン検証の ID（`redirect_host_verifications`。`createRedirectHostVerification` で作る）が要る。検証がない・流用・未確認は CR25、public suffix と共有ホスティングの suffix とその直下は CR26、CNAME の宛先が解決できないか未割当ては CR27（AR-10、§5A。版 0.5.0、凍結前是正 FZ-027）。
      security:
        - workforceOidc: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientRegistrationRequest'
            examples:
              createFapiClient:
                summary: 正例。C3 第三者サーバー型、層 F（AR-1・AR-2・AR-3 の承認と、redirect ホストのドメイン検証 AR-10 が要る。AR-10 は版 0.5.0）
                value:
                  kind: create
                  justification: 顧客テナント管理の外部連携（F3 の write）
                  redirect_host_verifications: [hv3qk7mz2xr9tn4bw6pd8ce5ya]
                  metadata:
                    platform_client_category: C3
                    platform_owner: { consumer_id: c9f3k2m7qx4tz8rb5wn6pda2ve, secondary_contact: partner-oncall@partner-team.example }
                    platform_owning_tenant: t5wq2hzr7nmc4ka3vd6pxe2bfy
                    platform_risk_layer: F
                    client_name: Partner Sync
                    redirect_uris: [https://sync.partner-apps.example/oauth/callback]
                    grant_types: [authorization_code, refresh_token]
                    response_types: [code]
                    token_endpoint_auth_method: private_key_jwt
                    token_endpoint_auth_signing_alg: ES256
                    jwks_uri: https://sync.partner-apps.example/.well-known/jwks.json
                    tls_client_certificate_bound_access_tokens: true
                    require_pushed_authorization_requests: true
                    scope: tenant.config.write
              createTenantAppOnlyClient:
                summary: 正例。C5 で単一テナントの app-only（AR-1・AR-4・AR-8 の承認が要る。版 0.3.0。処理地域が所有テナントの所在地群の内で受領法人が基盤運営法人と同じなので AR-9 は不要。版 0.4.0）
                value:
                  kind: create
                  justification: 顧客テナントの夜間の集計バッチ（利用者を介さない読取り）
                  tenant_consent: { consent_ref: tc-8kq4m2zr7xw3nv6p, tenant_id: t5wq2hzr7nmc4ka3vd6pxe2bfy, form: tenant_admin_api }
                  data_processing:
                    recipient: { legal_entity_id: le7xk2m4qz9tr3nb5wd6pha2fc, business_domain: reporting }
                    purpose: 顧客テナントの月次の利用状況レポートの作成
                    data_categories: [CUS]
                    processing_regions: [jp]
                    retention: P30D
                  metadata:
                    platform_client_category: C5
                    platform_owner: { consumer_id: c9f3k2m7qx4tz8rb5wn6pda2ve, secondary_contact: batch-oncall@partner-team.example }
                    platform_owning_tenant: t5wq2hzr7nmc4ka3vd6pxe2bfy
                    platform_risk_layer: B
                    client_name: Tenant Nightly Report
                    grant_types: [client_credentials]
                    token_endpoint_auth_method: private_key_jwt
                    token_endpoint_auth_signing_alg: ES256
                    jwks_uri: https://batch.partner-apps.example/.well-known/jwks.json
                    tls_client_certificate_bound_access_tokens: true
                    scope: tenant.reports.read
      responses:
        '202':
          description: 受付。承認待ち（retire は承認不要で、払出しの完了まで pending_provisioning）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationRequestStatus'
              examples:
                pending:
                  summary: 承認待ち
                  value:
                    request_id: r7pz3kx9mq2tn6vb4hc8wde5ya
                    kind: create
                    status: pending_review
                    submitted_at: "2026-10-15T09:00:00Z"
                    required_approvals:
                      - { rule: AR-1, role: authn-idp-reviewer }
                      - { rule: AR-2, role: authn-idp-reviewer }
                      - { rule: AR-3, role: ciso-security-reviewer }
                      - { rule: AR-10, role: redirect-host-verification, decision: approve, verification_ids: [hv3qk7mz2xr9tn4bw6pd8ce5ya] }
        '400':
          $ref: '#/components/responses/ProblemBadRequest'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '#/components/responses/ProblemForbidden'
  /v1/client-registration-requests/{request_id}:
