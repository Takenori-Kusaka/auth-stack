      text: 層 B の client の id_token_signed_response_alg の既定。本契約は明示を必須にし、ES256・PS256 に限る。KP-1 で RS256 を許す場合は enum に加える（互換な追加）
    - id: ADR-005 D7-7（device grant）
      text: device authorization grant の例外登録（受容票付き）を本番の申請 API で受けるか。v0.1 は受け付けない
    - id: initial access token と上限
      text: initial access token の寿命・発行窓口、consumer ごとの登録数の上限。所有者 プラットフォームチーム長、期限 DEC-8 前、決め方 パイロットの利用記録
    - id: RFC 7592 の Experimental
      text: RFC 7592 が Experimental のままなので、管理操作を GA にしない。ベンダー製品が RFC 7592 を実装しない場合は、本契約の申請 API と同じ形の sandbox 管理 API に置き換える（preview の改版）
  x-approval-rules:
    description: 本番の登録申請に必要な承認（案）。条件に当てはまる規則の承認者をすべて required_approvals に入れる。承認者は有資格者名簿（operating-model §5.5）の者に限り、申請者は承認できない。確定は ONB-R2・ADR-022 の改版（未決）
    rules:
      - { id: AR-1, applies: "kind が create か update の全申請", approver: "認証・IdP チームの有資格者（作成者≠承認者）", basis: "operating-model §7.2 CP-2、ADR-022 D-7-1", checks: "種別ごとの規則の自動検査の結果、scope の最小化、所有者・副所有者の有無" }
      - { id: AR-2, applies: "platform_client_category が C3・C4・C6、または外部の発行者のソフトウェア", approver: "認証・IdP チームの有資格者（発行者確認の記録を付ける）", basis: "ADR-005 D7-1", checks: "発行者の確認、redirect URI のホストの所有" }
      - { id: AR-3, applies: "platform_risk_layer が F、または privileged の scope（F1・F2）を含む", approver: "CISO 組織のセキュリティレビュアー（非同期）を AR-1 に加える", basis: "ADR-020 D20-03、ARC-02 §8", checks: "PAR・mTLS・alg の固定値、操作の分類登録（DL-67）との整合" }
      - { id: AR-4, applies: "client_credentials で、複数テナントにまたがる権限（app-only）を要求する", approver: "別報告系統の二者（CP-1 相当）", basis: "ADR-008 D8-54、operating-model §7.2 CP-1", checks: "テナント横断の必要性、権限の上限" }
      - { id: AR-5, applies: "C3 で tls_client_certificate_bound_access_tokens の代わりに dpop_bound_access_tokens を使う", approver: "AR-1 に加え、受容票（platform_acceptance_ref）の参照が必須", basis: "ADR-005 K-3", checks: "受容票の有効期限" }
      - { id: AR-0, applies: "kind が retire", approver: "不要（所有者だけで成立）", basis: "権限を減らす変更", checks: "払出し後、その client の grant と token を無効化する（RFC 7592 §2.3 の SHOULD を本番にも適用）" }
  x-reason-codes:
    CR01: { error: invalid_client_metadata, http: 400, meaning: token_endpoint_auth_method がない、または共有秘密の方式（client_secret_basic・client_secret_post・client_secret_jwt）、または種別と合わない方式 }
    CR02: { error: invalid_client_metadata, http: 400, meaning: 許されない grant_types・response_types（implicit、password、token、device_code、jwt-bearer など）、または種別と合わない組合せ }
    CR03: { error: invalid_redirect_uri, http: 400, meaning: redirect URI に wildcard・fragment がある、loopback 以外の http、または種別で許されない形式 }
    CR04: { error: invalid_redirect_uri, http: 400, meaning: sandbox の登録で、本番のホストを redirect URI に含む }
    CR05: { error: invalid_client_metadata, http: 400, meaning: jwks_uri と jwks の両方がある、または private_key_jwt なのに鍵がない }
    CR06: { error: invalid_client_metadata, http: 400, meaning: 種別が求める束縛の metadata（dpop_bound_access_tokens・tls_client_certificate_bound_access_tokens）や PAR の指定がない }
    CR07: { error: invalid_client_metadata, http: 400, meaning: 登録者が client_id・client_secret を指定した }
    CR08: { error: invalid_client_metadata, http: 400, meaning: tls_client_auth なのに証明書の主体を表す metadata が 0 個か 2 個以上 }
    CR09: { error: invalid_client_metadata, http: 400, meaning: 種別で許されない層（C2 の F、C4 の H・F）、または platform_owner・platform_client_category がない }
    CR10: { error: invalid_token, http: 401, meaning: initial access token がない、無効、他の consumer のもの、または sandbox 以外で発行されたもの }
    CR11: { error: unapproved_software_statement, http: 400, meaning: software statement を提示した（v0.1 は受け付けない） }
    CR12: { error: invalid_client_metadata, http: 400, meaning: 別の consumer_id が同じ software_id と software_version で登録済み（RFC 7591 §5） }
    CR13: { error: invalid_client_metadata, http: 400, meaning: 本番の client に登録済みの公開鍵と同じ鍵（JWK thumbprint が一致） }
    CR14: { error: rate_limited, http: 429, meaning: consumer_id ごとの登録数か要求頻度の上限を超えた。Retry-After を返す }
  x-negative-examples:
    description: 登録族の負例。期待結果はすべて拒否（または払出し 0 件）と、理由コード付きの記録。CON-11 §6.3 に「登録族」として追加する（申し送り H-3）。TC-ID は 12_poc（DL-22）で採番する。2026-10-15 時点で未実施
    items:
      - { ref: CRN-01, op: registerSandboxClient, case: "本番のホスト（例 https://app.<本番 id-domain>/cb）を redirect_uris に含む sandbox 登録", expect: "400 invalid_redirect_uri / CR04" }
      - { ref: CRN-02, op: registerSandboxClient, case: "token_endpoint_auth_method=client_secret_basic", expect: "400 invalid_client_metadata / CR01" }
      - { ref: CRN-03, op: registerSandboxClient, case: "token_endpoint_auth_method を省略（既定値 client_secret_basic に頼る）", expect: "400 invalid_client_metadata / CR01" }
      - { ref: CRN-04, op: registerSandboxClient, case: "grant_types に implicit、response_types に token", expect: "400 invalid_client_metadata / CR02" }
      - { ref: CRN-05, op: registerSandboxClient, case: "redirect URI に wildcard（https://*.partner.example/cb）", expect: "400 invalid_redirect_uri / CR03" }
      - { ref: CRN-06, op: registerSandboxClient, case: "loopback 以外の http の redirect URI", expect: "400 invalid_redirect_uri / CR03" }
      - { ref: CRN-07, op: registerSandboxClient, case: "jwks_uri と jwks の両方", expect: "400 invalid_client_metadata / CR05" }
      - { ref: CRN-08, op: registerSandboxClient, case: "C2 で dpop_bound_access_tokens を省略", expect: "400 invalid_client_metadata / CR06" }
      - { ref: CRN-09, op: registerSandboxClient, case: "client_id を指定（例 acme-billing-sandbox）", expect: "400 invalid_client_metadata / CR07" }
      - { ref: CRN-10, op: registerSandboxClient, case: "initial access token なし", expect: "401 invalid_token / CR10" }
      - { ref: CRN-11, op: registerSandboxClient, case: "他の consumer の initial access token", expect: "401 invalid_token / CR10（登録は他 consumer に結び付かない）" }
      - { ref: CRN-12, op: "（本番 AS の token endpoint）", case: "sandbox で払い出した client_id で本番の AS に token 要求", expect: "401 invalid_client（CON-11 CV-011 の資格情報版）" }
      - { ref: CRN-13, op: registerSandboxClient, case: "本番の client に登録済みの公開鍵を jwks に入れる", expect: "400 invalid_client_metadata / CR13" }
      - { ref: CRN-14, op: readSandboxClient, case: "回転前の registration access token で読取り", expect: "401（RFC 6750 の invalid_token）" }
      - { ref: CRN-15, op: readSandboxClient, case: "削除後の registration access token で読取り、削除した client の access token を sandbox の RS に提示", expect: "401。access token も拒否" }
      - { ref: CRN-16, op: updateSandboxClient, case: "PUT で client_secret を指定", expect: "400 invalid_client_metadata / CR07" }
      - { ref: CRN-17, op: decideClientRegistrationRequest, case: "申請者自身が承認", expect: "403。払出し 0 件" }
      - { ref: CRN-18, op: submitClientRegistrationRequest, case: "platform_risk_layer=F で AR-3 の承認がそろわない", expect: "status は pending_review のまま。払出し 0 件" }
      - { ref: CRN-19, op: submitClientRegistrationRequest, case: "C4 で platform_risk_layer=F", expect: "400 Problem（code=invalid_client_metadata、reason_code=CR09）" }
      - { ref: CRN-20, op: registerSandboxClient, case: "C5 で grant_types に refresh_token を含む", expect: "400 invalid_client_metadata / CR02" }
  x-mock:
    description: CON-11 の MK-01（開発用 AS・IdP）への追加案（申し送り H-3）。CON-11 の作成者が取り込むまでは本節を仕様とする
    MK-01:
      - issuer B（sandbox 役）に registerSandboxClient・readSandboxClient・updateSandboxClient・deleteSandboxClient を実装し、ClientMetadata の規則と CR01〜CR14 の判定を返す
      - issuer A（本番役）には登録 endpoint を置かない。issuer B で払い出した client_id は issuer A で invalid_client になる（CRN-12）
      - 本番役の redirect URI のホストと公開鍵の一覧を制御 API（POST /__kit/fixtures）で登録し、CR04・CR13 の判定に使う
      - 本番の登録申請 API は examples から起動する example 駆動のモックにする。承認は制御 API の inject で模し、required_approvals がそろうまで provisioned にしない
servers:
  - url: https://sandbox-as.id-domain.example
    description: sandbox の AS（issuer B）。ホスト名は仮置きで凍結しない。consumer は AS metadata の registration_endpoint から URL を得る
tags:
  - name: sandbox-registration
    description: sandbox の client セルフ登録（RFC 7591/7592 profile）。preview
  - name: production-registration-request
    description: 本番の client 登録・変更・廃止の申請と承認。preview
paths:
  /v1/register:
    post:
      operationId: registerSandboxClient
      tags: [sandbox-registration]
      summary: sandbox の client を登録する（RFC 7591 §3.1）
      x-freeze-class: preview
      description: |
        sandbox の AS に client を登録する。承認は不要である（G-141(c)）。要求本文は ClientMetadata で、`application/json` で送る（RFC 7591 §3 の MUST）。
        成功すると 201 と、払い出した `client_id`、登録された metadata のすべて、RFC 7592 の `registration_client_uri` と `registration_access_token` を返す。
        `client_secret` は返さない（共有秘密の方式を登録できないため）。
      security:
        - sandboxInitialAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientMetadata'
            examples:
              bffClient:
                summary: 正例。C1 第一者 BFF（private_key_jwt、PAR 必須）
                value:
                  platform_client_category: C1
                  platform_owner: { consumer_id: c9f3k2m7qx4tz8rb5wn6pda2ve, secondary_contact: orders-oncall@partner-team.example }
                  platform_risk_layer: B
                  client_name: Orders BFF (sandbox)
                  redirect_uris: [https://orders-bff.sandbox-apps.example/callback]
                  grant_types: [authorization_code, refresh_token]
                  response_types: [code]
                  token_endpoint_auth_method: private_key_jwt
                  token_endpoint_auth_signing_alg: ES256
                  jwks_uri: https://orders-bff.sandbox-apps.example/.well-known/jwks.json
                  require_pushed_authorization_requests: true
                  scope: orders.read orders.write
              m2mClient:
                summary: 正例。C5 外部 M2M（tls_client_auth、証明書束縛）
                value:
                  platform_client_category: C5
                  platform_owner: { consumer_id: c9f3k2m7qx4tz8rb5wn6pda2ve, secondary_contact: billing-oncall@partner-team.example }
                  platform_owning_tenant: t5wq2hzr7nmc4ka3vd6pxe2bfy
                  platform_risk_layer: B
                  client_name: Billing batch (sandbox)
                  grant_types: [client_credentials]
                  token_endpoint_auth_method: tls_client_auth
                  tls_client_auth_subject_dn: CN=billing-batch,O=Partner Team,C=JP
                  tls_client_certificate_bound_access_tokens: true
                  scope: invoice.read
      responses:
        '201':
          description: 登録成功（RFC 7591 §3.2.1、RFC 7592 §3）
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxClientInformation'
              examples:
                registered:
                  summary: 正例。C1 の登録結果
                  value:
                    client_id: s4hb8xq2kz7mn3vc6tr9pwe5ya
                    client_id_issued_at: 1792022400
                    registration_client_uri: https://sandbox-as.id-domain.example/v1/register/s4hb8xq2kz7mn3vc6tr9pwe5ya
                    registration_access_token: rat_Q2x9Lm4Zp7Tn1Vb8Kc3Rf6Wd0Hs5Jy
                    platform_client_category: C1
                    platform_owner: { consumer_id: c9f3k2m7qx4tz8rb5wn6pda2ve, secondary_contact: orders-oncall@partner-team.example }
                    platform_risk_layer: B
                    platform_environment: sandbox
                    client_name: Orders BFF (sandbox)
                    redirect_uris: [https://orders-bff.sandbox-apps.example/callback]
                    grant_types: [authorization_code, refresh_token]
                    response_types: [code]
                    token_endpoint_auth_method: private_key_jwt
                    token_endpoint_auth_signing_alg: ES256
                    jwks_uri: https://orders-bff.sandbox-apps.example/.well-known/jwks.json
                    require_pushed_authorization_requests: true
                    scope: orders.read orders.write
        '400':
          $ref: '#/components/responses/RegistrationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/register/{client_id}:
    parameters:
      - $ref: '#/components/parameters/ClientIdPath'
    get:
      operationId: readSandboxClient
      tags: [sandbox-registration]
      summary: sandbox の client の登録内容を読む（RFC 7592 §2.1）
      x-freeze-class: preview
      description: |
        登録内容を返す。応答の `registration_access_token` は新しい値に回転しており、要求に使った token は以後拒否される（本 profile の必須。RFC 7592 §5 の MAY を強めた）。
        client が存在しない場合は 401 を返し、使われた token を無効にする（RFC 7592 §2.1 の MUST・SHOULD）。
      security:
        - registrationAccessToken: []
      responses:
        '200':
          description: 登録内容（registration_access_token は回転後の値）
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxClientInformation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      operationId: updateSandboxClient
      tags: [sandbox-registration]
      summary: sandbox の client の登録内容を置き換える（RFC 7592 §2.2）
      x-freeze-class: preview
      description: |
        以前に返された metadata をすべて含めて送る。省略した項目は削除の要求として扱われる（RFC 7592 §2.2 の MUST）。部分更新ではない。
        `client_id` を本文に含め、現在の値と一致させる（MUST）。`registration_access_token`・`registration_client_uri`・`client_id_issued_at` は含めない（MUST NOT）。`client_secret` は指定できない（CR07）。
        検査規則は registerSandboxClient と同じである。
      security:
        - registrationAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SandboxClientUpdate'
      responses:
        '200':
          description: 更新後の登録内容（registration_access_token は回転後の値）
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxClientInformation'
        '400':
          $ref: '#/components/responses/RegistrationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      operationId: deleteSandboxClient
      tags: [sandbox-registration]
      summary: sandbox の client を削除する（RFC 7592 §2.3）
      x-freeze-class: preview
      description: |
        `client_id` と registration access token を無効にし、その client の grant・access token・refresh token をすぐに無効にする（RFC 7592 §2.3 の SHOULD を本 profile で必須化）。
        削除した `client_id` は墓石として保持し、再発番しない（ADR-021 D21-13）。
      security:
        - registrationAccessToken: []
      responses:
        '204':
          description: 削除成功（RFC 7592 §2.3 の MUST）
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/client-registration-requests:
    servers:
      - url: https://onboarding.id-domain.example
        description: 本番の登録申請 API。本番の AS とは別の窓口で、本番の AS の動的登録は無効（ホスト名は仮置き）
    post:
      operationId: submitClientRegistrationRequest
      tags: [production-registration-request]
      summary: 本番の client の登録・変更・廃止を申請する
      x-freeze-class: preview
      description: |
        申請を受け付け、必要な承認（x-approval-rules）を `required_approvals` に入れて 202 を返す。ClientMetadata の規則に反する申請は、受付の時点で 400 を返す（理由コードは CR01〜CR13 と同じ）。
        sandbox と同じ ClientMetadata を使えるが、`client_id` は本番で別の値が払い出される（ADR-021 D21-22）。
      security:
        - workforceOidc: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientRegistrationRequest'
            examples:
              createFapiClient:
                summary: 正例。C3 第三者サーバー型、層 F（AR-1・AR-2・AR-3 の承認が要る）
                value:
                  kind: create
                  justification: 顧客テナント管理の外部連携（F3 の write）
                  metadata:
                    platform_client_category: C3
                    platform_owner: { consumer_id: c9f3k2m7qx4tz8rb5wn6pda2ve, secondary_contact: partner-oncall@partner-team.example }
                    platform_owning_tenant: t5wq2hzr7nmc4ka3vd6pxe2bfy
                    platform_risk_layer: F
                    client_name: Partner Sync
                    redirect_uris: [https://sync.partner-apps.example/oauth/callback]
                    grant_types: [authorization_code, refresh_token]
                    response_types: [code]
                    token_endpoint_auth_method: private_key_jwt
                    token_endpoint_auth_signing_alg: ES256
                    jwks_uri: https://sync.partner-apps.example/.well-known/jwks.json
                    tls_client_certificate_bound_access_tokens: true
                    require_pushed_authorization_requests: true
                    scope: tenant.config.write
      responses:
        '202':
          description: 受付。承認待ち（retire は承認不要で、払出しの完了まで pending_provisioning）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationRequestStatus'
              examples:
                pending:
                  summary: 承認待ち
                  value:
                    request_id: r7pz3kx9mq2tn6vb4hc8wde5ya
                    kind: create
                    status: pending_review
                    submitted_at: "2026-10-15T09:00:00Z"
                    required_approvals:
                      - { rule: AR-1, role: authn-idp-reviewer }
                      - { rule: AR-2, role: authn-idp-reviewer }
                      - { rule: AR-3, role: ciso-security-reviewer }
        '400':
          $ref: '#/components/responses/ProblemBadRequest'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '#/components/responses/ProblemForbidden'
  /v1/client-registration-requests/{request_id}:
    servers:
      - url: https://onboarding.id-domain.example
        description: 本番の登録申請 API（仮置き）
    parameters:
      - $ref: '#/components/parameters/RequestIdPath'
    get:
      operationId: getClientRegistrationRequest
      tags: [production-registration-request]
      summary: 申請の状態と払出し結果を読む
      x-freeze-class: preview
      description: 払出しが済むと `status=provisioned` と、払い出した `client_id`・登録された metadata を返す。申請者と所有チーム、承認者だけが読める。
      security:
        - workforceOidc: []
      responses:
        '200':
          description: 申請の状態
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationRequestStatus'
              examples:
                provisioned:
                  summary: 払出し済み
                  value:
                    request_id: r7pz3kx9mq2tn6vb4hc8wde5ya
                    kind: create
                    status: provisioned
                    submitted_at: "2026-10-15T09:00:00Z"
                    required_approvals:
                      - { rule: AR-1, role: authn-idp-reviewer, decision: approve, decided_at: "2026-10-15T10:00:00Z" }
                    client_id: p2nd6vq9hx4kz7mc3tr8bwe5ya
                    client_id_issued_at: 1792026000
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
  /v1/client-registration-requests/{request_id}/decisions:
    servers:
      - url: https://onboarding.id-domain.example
        description: 本番の登録申請 API（仮置き）
    parameters:
      - $ref: '#/components/parameters/RequestIdPath'
    post:
      operationId: decideClientRegistrationRequest
      tags: [production-registration-request]
      summary: 申請を承認または却下する
      x-freeze-class: preview
      description: |
        承認者が、required_approvals の 1 つの規則について判断を記録する。申請者自身、または有資格者名簿にない者が送ると 403 を返す（CRN-17）。
        すべての規則が approve になると払出しを行う。1 つでも reject なら status は rejected になる。
      security:
        - workforceOidc: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecision'
            examples:
              approve:
                summary: AR-1 の承認
                value: { rule: AR-1, decision: approve, comment: 規則の自動検査に合格、scope は最小 }
      responses:
        '200':
          description: 判断を記録した後の申請の状態
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationRequestStatus'
        '400':
          $ref: '#/components/responses/ProblemBadRequest'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '#/components/responses/ProblemForbidden'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
components:
  securitySchemes:
    sandboxInitialAccessToken:
      type: http
      scheme: bearer
      description: RFC 7591 §3 の initial access token。consumer 台帳に登録済みのチームにだけ、オンボーディング窓口から発行する。sandbox の AS でしか受理しない
    registrationAccessToken:
      type: http
      scheme: bearer
      description: RFC 7592 の registration access token。読取り・更新のたびに回転する（本 profile の必須）
    workforceOidc:
      type: openIdConnect
      openIdConnectUrl: https://workforce-idp.id-domain.example/.well-known/openid-configuration
      description: 社内の workforce IdP（MFA 必須。ADR-008 D8-53）。ホスト名は仮置き
  parameters:
    ClientIdPath:
      name: client_id
      in: path
      required: true
      description: 払い出された client_id（不透明値。ADR-021 D21-22）
      schema:
        $ref: '#/components/schemas/ClientId'
    RequestIdPath:
      name: request_id
      in: path
      required: true
      description: 申請 ID（不透明値）
      schema:
        $ref: '#/components/schemas/OpaqueId'
  headers:
    CacheControlNoStore:
      description: 資格情報を含む応答をキャッシュさせない
      schema:
        type: string
        const: no-store
  responses:
    RegistrationError:
      description: 登録エラー（RFC 7591 §3.2.2）。reason_code は info.x-reason-codes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RegistrationErrorBody'
          examples:
            prodRedirect:
              summary: 負例 CRN-01。sandbox に本番のホストを登録しようとした
              value: { error: invalid_redirect_uri, reason_code: CR04 }
    Unauthorized:
      description: initial access token または registration access token が無効（RFC 6750）
      headers:
        WWW-Authenticate:
          schema:
            type: string
    Forbidden:
      description: この client を読む・変える・消す権限がない（RFC 7592 §2.1〜§2.3 の 403）
    TooManyRequests:
      description: 登録数か要求頻度の上限を超えた（CR14）
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RegistrationErrorBody'
    ProblemBadRequest:
      description: 申請の内容が規則に反する（RFC 9457。code と reason_code を持つ）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            layerF:
              summary: 負例 CRN-19。C4 で層 F
              value: { type: "about:blank", title: Bad Request, status: 400, code: invalid_client_metadata, reason_code: CR09 }
    ProblemUnauthorized:
      description: 認証されていない
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ProblemForbidden:
      description: 権限がない（申請者自身による承認、有資格者名簿にない承認者、consumer 台帳にないチームの申請）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ProblemNotFound:
      description: 申請がない、または読む権限がない（存在の有無を区別しない）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    OpaqueId:
      description: 基盤が払い出す不透明値（CON-02 OpaqueId と同じ形にする。凍結前に $ref へ寄せる。CON-00 §4.9 D-7）
      type: string
      pattern: '^[a-z0-9]{26}$'
    ClientId:
      description: OAuth client_id。受信側は形式を解析しない（ADR-021 D21-22・D21-23）
      $ref: '#/components/schemas/OpaqueId'
    RedirectUri:
      description: |
        redirect URI。wildcard と fragment を含まない。https、loopback の IP リテラルの http、または private-use scheme（`<id-domain>` を逆順にした名前。ADR-021 D21-24）に限る。
        照合は exact string matching（RFC 9700 §2.1 の MUST）。例外は native app の loopback の port だけ。
      type: string
      maxLength: 2048
      pattern: '^(https://[^*#\s]+|http://127\.0\.0\.1(:[0-9]{1,5})?/[^*#\s]*|http://\[::1\](:[0-9]{1,5})?/[^*#\s]*|[a-z][a-z0-9+-]*(\.[a-z0-9+-]+)+:/[^*#\s]*)$'
    HttpsRedirectUri:
      type: string
      maxLength: 2048
      pattern: '^https://[^*#\s]+$'
    NativeRedirectUri:
      type: string
      maxLength: 2048
      pattern: '^(http://127\.0\.0\.1(:[0-9]{1,5})?/[^*#\s]*|http://\[::1\](:[0-9]{1,5})?/[^*#\s]*|[a-z][a-z0-9+-]*(\.[a-z0-9+-]+)+:/[^*#\s]*)$'
    Owner:
      type: object
      required: [consumer_id, secondary_contact]
      properties:
        consumer_id:
          description: consumer 台帳の ID（CON-01 §6.1）
          $ref: '#/components/schemas/OpaqueId'
        secondary_contact:
          description: 副所有者の連絡先（チームの共有アドレス。個人のアドレスを避ける）
          type: string
          format: email
    ClientMetadata:
      description: |
        登録内容。RFC 7591 §2 の項目名と意味をそのまま使い、`platform_` で始まる 5 項目だけを本契約で加えた（名前は案。ADR-021）。
        AS は理解しない項目を無視しなければならない（RFC 7591 §2 の MUST）ので、未知の項目を送ってもエラーにはならないが、登録されない。
        種別ごとの規則は oneOf の各分岐（x-constraint を含む）で表す。
      type: object
      additionalProperties: true
      required: [platform_client_category, platform_owner, platform_risk_layer, client_name, grant_types, token_endpoint_auth_method]
      properties:
        platform_client_category:
          description: ARC-02 §6 の client 種別。C7（内部 workload）と C9（本基盤が RP）は範囲外
          type: string
          enum: [C1, C2, C3, C4, C5, C6, C8]
        platform_owner:
          $ref: '#/components/schemas/Owner'
        platform_owning_tenant:
          description: 所有テナント（第三者・顧客の client）。第一者の client では省略する（ADR-021 D21-22）
          $ref: '#/components/schemas/OpaqueId'
        platform_risk_layer:
          description: ARC-02 §8 の層（B・H・F）。層の判定は client 登録の profile 属性と操作の分類登録の組で行う（ADR-020 D20-03）
          type: string
          enum: [B, H, F]
        platform_acceptance_ref:
          description: 例外の受容票の参照（AR-5 など）
          type: string
          maxLength: 128
        client_name:
          type: string
          maxLength: 200
        redirect_uris:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RedirectUri'
        grant_types:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [authorization_code, refresh_token, client_credentials]
        response_types:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [code]
        token_endpoint_auth_method:
          description: 必須。省略時の既定値（client_secret_basic）に頼らせない
          type: string
          enum: [private_key_jwt, tls_client_auth, none]
        token_endpoint_auth_signing_alg:
          type: string
          enum: [ES256, PS256]
        jwks_uri:
          type: string
          format: uri
          pattern: '^https://'
        jwks:
          type: object
          required: [keys]
          properties:
            keys:
              type: array
              minItems: 1
              items:
                type: object
                required: [kty]
                properties:
                  kty:
                    type: string
                    enum: [EC, RSA]
                  d:
                    description: 秘密鍵の成分を登録しない
                    not: {}
        tls_client_auth_subject_dn:
          type: string
          maxLength: 1024
        tls_client_auth_san_dns:
          type: string
          maxLength: 253
        tls_client_auth_san_uri:
          type: string
          format: uri
        tls_client_certificate_bound_access_tokens:
          type: boolean
        dpop_bound_access_tokens:
          type: boolean
        require_pushed_authorization_requests:
          type: boolean
        id_token_signed_response_alg:
          type: string
          enum: [ES256, PS256]
        scope:
          type: string
          maxLength: 2048
        software_id:
          type: string
          maxLength: 128
        software_version:
          type: string
          maxLength: 64
        contacts:
          type: array
          items:
            type: string
            format: email
        client_id:
          description: 登録者は指定できない（CR07、ADR-021 D21-22）
          not: {}
        client_secret:
          description: 登録者は指定できない（CR07）
          not: {}
        software_statement:
          description: v0.1 では受け付けない（CR11）
          not: {}
      not:
        description: jwks_uri と jwks を両方入れない（RFC 7591 §2 の MUST NOT、CR05）
        properties:
          jwks_uri: {}
          jwks: {}
        required: [jwks_uri, jwks]
      allOf:
        - $ref: '#/components/schemas/AuthMethodRules'
        - oneOf:
            - $ref: '#/components/schemas/RulesC1'
            - $ref: '#/components/schemas/RulesC2'
            - $ref: '#/components/schemas/RulesC3'
            - $ref: '#/components/schemas/RulesC4'
            - $ref: '#/components/schemas/RulesC5C8'
            - $ref: '#/components/schemas/RulesC6'
      x-constraint:
        - "sandbox: redirect_uris のホストと jwks の鍵が、本番の一覧に含まれない（CR04・CR13。設定に依存するためスキーマでは表せない）"
        - "C3 で dpop_bound_access_tokens=true とする場合は platform_acceptance_ref が必須（AR-5）"
        - "software_id・software_version の組が別の consumer_id で登録済みでない（CR12）"
    AuthMethodRules:
      additionalProperties: true
      description: 認証方式ごとの必須項目（CR05・CR08）
      anyOf:
        - properties:
            token_endpoint_auth_method: { const: private_key_jwt }
          required: [token_endpoint_auth_signing_alg]
          anyOf:
            - required: [jwks_uri]
            - required: [jwks]
        - properties:
            token_endpoint_auth_method: { const: tls_client_auth }
          oneOf:
            - required: [tls_client_auth_subject_dn]
            - required: [tls_client_auth_san_dns]
            - required: [tls_client_auth_san_uri]
        - properties:
            token_endpoint_auth_method: { const: none }
    ConfidentialAuth:
      additionalProperties: true
      properties:
        token_endpoint_auth_method:
          enum: [private_key_jwt, tls_client_auth]
    CodeFlowGrants:
      additionalProperties: true
      required: [redirect_uris, response_types]
      properties:
        grant_types:
          contains: { const: authorization_code }
          items:
            enum: [authorization_code, refresh_token]
        response_types:
          const: [code]
    RulesC1:
      additionalProperties: true
      allOf:
        - $ref: '#/components/schemas/ConfidentialAuth'
        - $ref: '#/components/schemas/CodeFlowGrants'
      required: [require_pushed_authorization_requests]
      properties:
        platform_client_category: { const: C1 }
        require_pushed_authorization_requests: { const: true }
        redirect_uris:
          items:
            $ref: '#/components/schemas/HttpsRedirectUri'
    RulesC2:
      additionalProperties: true
      allOf:
        - $ref: '#/components/schemas/CodeFlowGrants'
      required: [dpop_bound_access_tokens]
      properties:
        platform_client_category: { const: C2 }
        token_endpoint_auth_method: { const: none }
        dpop_bound_access_tokens: { const: true }
        platform_risk_layer: { enum: [B, H] }
        redirect_uris:
          items:
            $ref: '#/components/schemas/NativeRedirectUri'
    RulesC3:
      additionalProperties: true
      allOf:
        - $ref: '#/components/schemas/ConfidentialAuth'
        - $ref: '#/components/schemas/CodeFlowGrants'
        - anyOf:
            - required: [tls_client_certificate_bound_access_tokens]
              properties:
                tls_client_certificate_bound_access_tokens: { const: true }
            - required: [dpop_bound_access_tokens, platform_acceptance_ref]
              properties:
                dpop_bound_access_tokens: { const: true }
        - anyOf:
            - properties:
                platform_risk_layer: { enum: [B, H] }
            - required: [require_pushed_authorization_requests]
              properties:
                require_pushed_authorization_requests: { const: true }
      properties:
        platform_client_category: { const: C3 }
        redirect_uris:
          items:
            $ref: '#/components/schemas/HttpsRedirectUri'
    RulesC4:
      additionalProperties: true
      allOf:
        - $ref: '#/components/schemas/CodeFlowGrants'
      required: [dpop_bound_access_tokens]
      properties:
        platform_client_category: { const: C4 }
        token_endpoint_auth_method: { const: none }
        dpop_bound_access_tokens: { const: true }
        platform_risk_layer: { const: B }
        redirect_uris:
          items:
            $ref: '#/components/schemas/HttpsRedirectUri'
    RulesC5C8:
      additionalProperties: true
      allOf:
        - $ref: '#/components/schemas/ConfidentialAuth'
      required: [tls_client_certificate_bound_access_tokens]
      properties:
        platform_client_category: { enum: [C5, C8] }
        grant_types: { const: [client_credentials] }
        response_types: { maxItems: 0 }
        redirect_uris: { maxItems: 0 }
        tls_client_certificate_bound_access_tokens: { const: true }
        platform_risk_layer: { enum: [B, F] }
    RulesC6:
      additionalProperties: true
      allOf:
        - $ref: '#/components/schemas/ConfidentialAuth'
        - $ref: '#/components/schemas/CodeFlowGrants'
        - anyOf:
            - properties:
                platform_risk_layer: { enum: [B, H] }
            - required: [require_pushed_authorization_requests]
              properties:
                platform_risk_layer: { const: F }
                require_pushed_authorization_requests: { const: true }
                id_token_signed_response_alg: { const: ES256 }
      required: [id_token_signed_response_alg]
      properties:
        platform_client_category: { const: C6 }
        redirect_uris:
          items:
            $ref: '#/components/schemas/HttpsRedirectUri'
    SandboxClientInformation:
      description: RFC 7591 §3.2.1 と RFC 7592 §3 の client information response。登録された metadata をすべて含む
      allOf:
        - $ref: '#/components/schemas/IssuedMetadata'
        - type: object
          required: [registration_client_uri, registration_access_token]
          properties:
            registration_client_uri:
              type: string
              format: uri
            registration_access_token:
              description: 資格情報。ログに残さない
              type: string
              minLength: 32
    IssuedMetadata:
      description: 払い出し後の登録内容。client_id と client_id_issued_at を基盤が付ける。client_secret は含まない
      type: object
      required: [client_id, platform_environment]
      properties:
        client_id:
          $ref: '#/components/schemas/ClientId'
        client_id_issued_at:
          type: integer
          minimum: 0
        platform_environment:
          description: 払い出した環境。sandbox の client_id は本番で未知（CRN-12）
          type: string
          enum: [sandbox, production]
        platform_client_category: { type: string }
        platform_owner: { $ref: '#/components/schemas/Owner' }
        platform_owning_tenant: { $ref: '#/components/schemas/OpaqueId' }
        platform_risk_layer: { type: string }
        client_name: { type: string }
        redirect_uris: { type: array, items: { type: string } }
        grant_types: { type: array, items: { type: string } }
        response_types: { type: array, items: { type: string } }
        token_endpoint_auth_method: { type: string }
        token_endpoint_auth_signing_alg: { type: string }
        jwks_uri: { type: string }
        jwks: { type: object }
        tls_client_auth_subject_dn: { type: string }
        tls_client_auth_san_dns: { type: string }
        tls_client_auth_san_uri: { type: string }
        tls_client_certificate_bound_access_tokens: { type: boolean }
        dpop_bound_access_tokens: { type: boolean }
        require_pushed_authorization_requests: { type: boolean }
        id_token_signed_response_alg: { type: string }
        scope: { type: string }
        client_secret:
          description: 返さない
          not: {}
    SandboxClientUpdate:
      description: RFC 7592 §2.2 の更新要求。ClientMetadata に現在の client_id を加えたもの（client_id 以外の規則は ClientMetadata と同じ。検査は AS が行う）
      type: object
      required: [client_id]
      properties:
        client_id:
          $ref: '#/components/schemas/ClientId'
        registration_access_token: { not: {} }
        registration_client_uri: { not: {} }
        client_id_issued_at: { not: {} }
        client_secret: { not: {} }
      x-constraint:
        - "client_id を除いた本文は ClientMetadata に適合する（スキーマの client_id 禁止と両立させるため、AS が client_id を除いて検査する）"
    ClientRegistrationRequest:
      type: object
      required: [kind, justification]
      properties:
        kind:
          type: string
          enum: [create, update, retire]
        target_client_id:
          description: update・retire で必須
          $ref: '#/components/schemas/ClientId'
        justification:
          type: string
          maxLength: 1000
        metadata:
          description: create・update で必須
          $ref: '#/components/schemas/ClientMetadata'
      anyOf:
        - properties: { kind: { const: create } }
          required: [metadata]
        - properties: { kind: { const: update } }
          required: [metadata, target_client_id]
        - properties: { kind: { const: retire } }
          required: [target_client_id]
    ApprovalItem:
      type: object
      required: [rule, role]
      properties:
        rule:
          type: string
          enum: [AR-1, AR-2, AR-3, AR-4, AR-5]
        role:
          type: string
          enum: [authn-idp-reviewer, ciso-security-reviewer, cp1-dual-control]
        decision:
          type: string
          enum: [approve, reject]
        decided_at:
          type: string
          format: date-time
    RegistrationRequestStatus:
      type: object
      required: [request_id, kind, status, submitted_at, required_approvals]
      properties:
        request_id:
          $ref: '#/components/schemas/OpaqueId'
        kind:
          type: string
          enum: [create, update, retire]
        status:
          type: string
          enum: [pending_review, pending_provisioning, provisioned, rejected, withdrawn, expired]
        submitted_at:
          type: string
          format: date-time
        required_approvals:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalItem'
        client_id:
          description: status が provisioned のときだけ
          $ref: '#/components/schemas/ClientId'
        client_id_issued_at:
          type: integer
          minimum: 0
        issued_metadata:
          $ref: '#/components/schemas/IssuedMetadata'
        reason_code:
          description: 却下・受付拒否の理由コード（CR01〜CR13）
          type: string
          pattern: '^CR[0-9]{2}$'
    ApprovalDecision:
      type: object
      required: [rule, decision]
      properties:
        rule:
          type: string
          enum: [AR-1, AR-2, AR-3, AR-4, AR-5]
        decision:
          type: string
          enum: [approve, reject]
        comment:
          type: string
          maxLength: 1000
    RegistrationErrorBody:
      description: RFC 7591 §3.2.2 のエラー。error は REQUIRED、error_description は OPTIONAL。reason_code は本 profile の追加メンバで、受信側は理解しないメンバを無視しなければならない（RFC 7591 §3.2.2 の MUST）
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [invalid_redirect_uri, invalid_client_metadata, invalid_software_statement, unapproved_software_statement, rate_limited]
        error_description:
          type: string
        reason_code:
          type: string
          pattern: '^CR[0-9]{2}$'
    Problem:
      description: RFC 9457 の problem details（CON-02 Problem と同じ形にする。凍結前に $ref へ寄せる。CON-00 §4.9 D-7）
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
        reason_code: { type: string }
