  x-open-issues:
    - id: ADR-022（本番の登録手段）
      text: ADR-022 D-2 は非本番の動的登録を preview に置くだけで、本番の登録手段を契約に含めるかを決めていない。本契約は申請 API を preview として置いた。区分と承認者 AR-1〜AR-9 の確定は ADR-022 の改版と ONB-R2。決める人 CTO（契約管理）、CISO 協議。期限 DEC-8 前
    - id: platform_owning_tenant の検証と実行時の束縛（版 0.3.1、PoC/R7反映）
      text: 受付時の CR23（REQ-05 の主状態 A に限る）、変更時の再同意、token の tid を登録記録に固定する発行規則、同意の撤回とテナントの終了での無効化（§5）。発行規則の正本は ARC-02・ADR-005 に置く（§9 H-22）。撤回から無効化までの SLI は TBD（§9 H-21）。所有者 認証・IdP チーム、期限 DEC-8 前
    - id: 同意の束縛項目と AR-9（版 0.4.0、ラウンド 9 legal）
      text: 管理者の同意と DL-34 の判定記録の組で移転・第三者提供の要件を満たすかは L-04・L-13・OI-P02（非机上）で決める。REQ-06 の責任分界条項（条項 14）と CTL-02 §3.5 の行は宛先に未適用で、POA&M の起票を §9 H-30 で申し送った（ラウンド 10）。受領者の運用法人を検証する法人台帳の置き場所、scope と REQ-04 の区分の対応表（§9 H-28）、申告された処理地域と実際の稼働地域の照合（§9 H-27）は未定。所有者 認証・IdP チーム（法務責任者と協議）、期限 DEC-8 前
    - id: redirect ホストのドメイン検証（版 0.5.0、凍結前是正 FZ-027）
      text: §5A の再検証の周期、猶予期間、版 0.5.0 より前の client の移行期間、登録データ（NS・登録者）の取得方法と監視の周期、CNAME の宛先の未割当ての判定方法、PSL の版の固定と更新、検証用 TXT record のラベル名は TBD。PSL の private division の suffix の直下を一律に拒否する案が既存の連携を妨げる場合の例外（受容票の要否）も未定。所有者 CISO（周期・検知）と認証・IdP チーム（猶予・移行）、期限 G3（周期・検知）と DEC-8 前（猶予・移行）。ADR-004 の HRD の domain verification との部品の共用は §9 H-39
    - id: ARC-02 AR-3
      text: 本番の AS で RFC 7591 の動的登録を許すか。本契約は無効を前提とする。許す場合は発行者確認（ADR-005 D7-1）を経た client に限る
    - id: G-141(c) の workload
      text: 版 0.2.0 で、workload（SVID 登録エントリ）と交換可能な組の登録手段を preview で契約にした（§4A）。未了は API とモックの実装（DL-120）、INT-02 §5.1 への I-16・I-17 の追加と G-138 の判定（§9 H-9）、ADR-022 D-2 での区分（H-11）。実装までは §4A.5 の暫定手順による。所有者 PEP SDK・開発者支援チーム（ARC-04 の所有者と協議）、期限 DEC-8 第 1 段の前
    - id: selector の型（ARC-04 W55-08）
      text: 受け付ける型を k8s:ns・k8s:sa・image:digest の 3 つに置いた。実行基盤の選定（W55-07、ADR-001 の評価枠）で型の名前と組が変わり得る。確定は ARC-04 の所有者、期限 G3（§9 H-15）
    - id: sandbox の参照サービス
      text: 基盤が sandbox に置く参照サービス（呼出し先として誰でも組を作れるもの）の一覧は未定。決める人 プラットフォームチーム長、期限 DEC-8 第 1 段の前
    - id: ADR-021 D21-28（拡張項目名）
      text: platform_client_category・platform_owner・platform_owning_tenant・platform_risk_layer・platform_acceptance_ref の名前。外部に出す名前は自社所有ドメインで修飾する規則との関係。DEC-8 前
    - id: ADR-021 D21-23（client_id の値域）
      text: client_id を sub と別の発番空間にするか区別子を持たせるか（TC-021-05、G3）。本契約は不透明値としてだけ扱い、形式に依存しない
    - id: ADR-006 L6-2
      text: backchannel_logout_uri の登録を本契約に含めるか。位置が決まるまで登録できない
    - id: ADR-017 L17-5
      text: authorization_details_types の登録。v1 では受け付けない
    - id: ARC-02 KP-1
      text: 層 B の client の id_token_signed_response_alg の既定。本契約は明示を必須にし、ES256・PS256 に限る。KP-1 で RS256 を許す場合は enum に加える（互換な追加）
    - id: ADR-005 D7-7（device grant）
      text: device authorization grant の例外登録（受容票付き）を本番の申請 API で受けるか。v0.1 は受け付けない
    - id: initial access token と上限
      text: initial access token の寿命・発行窓口、consumer ごとの登録数の上限。所有者 プラットフォームチーム長、期限 DEC-8 前、決め方 パイロットの利用記録
    - id: RFC 7592 の Experimental
      text: RFC 7592 が Experimental のままなので、管理操作を GA にしない。ベンダー製品が RFC 7592 を実装しない場合は、本契約の申請 API と同じ形の sandbox 管理 API に置き換える（preview の改版）
  x-approval-rules:
    description: 本番の登録申請に必要な承認（案）。条件に当てはまる規則の承認者をすべて required_approvals に入れる。承認者は有資格者名簿（operating-model §5.5）の者に限り、申請者は承認できない。確定は ONB-R2・ADR-022 の改版（未決）
