        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
components:
  securitySchemes:
    sandboxInitialAccessToken:
      type: http
      scheme: bearer
      description: RFC 7591 §3 の initial access token。consumer 台帳に登録済みのチームにだけ、オンボーディング窓口から発行する。sandbox の AS と sandbox の workload 登録窓口でしか受理しない。consumer_id に結び付き、§4A の操作ではこの consumer_id を所有者・承認者の判定に使う（版 0.2.0）
    registrationAccessToken:
      type: http
      scheme: bearer
      description: RFC 7592 の registration access token。読取り・更新のたびに回転する（本 profile の必須）
    workforceOidc:
      type: openIdConnect
      openIdConnectUrl: https://workforce-idp.id-domain.example/.well-known/openid-configuration
      description: 社内の workforce IdP（MFA 必須。ADR-008 D8-53）。ホスト名は仮置き
  parameters:
    ClientIdPath:
      name: client_id
      in: path
      required: true
      description: 払い出された client_id（不透明値。ADR-021 D21-22）
      schema:
        $ref: '#/components/schemas/ClientId'
    WorkloadEntryIdPath:
      name: workload_entry_id
      in: path
      required: true
      description: 登録エントリの ID（不透明値）
      schema:
        $ref: '#/components/schemas/OpaqueId'
    PairIdPath:
      name: pair_id
      in: path
      required: true
      description: 交換可能な組の ID（不透明値）
      schema:
        $ref: '#/components/schemas/OpaqueId'
    RequestIdPath:
      name: request_id
      in: path
      required: true
      description: 申請 ID（不透明値）
      schema:
        $ref: '#/components/schemas/OpaqueId'
    VerificationIdPath:
      name: verification_id
      in: path
      required: true
      description: redirect ホストの検証 ID（不透明値。版 0.5.0）
      schema:
        $ref: '#/components/schemas/OpaqueId'
  headers:
    CacheControlNoStore:
      description: 資格情報を含む応答をキャッシュさせない
      schema:
        type: string
        const: no-store
  responses:
    RegistrationError:
      description: 登録エラー（RFC 7591 §3.2.2）。reason_code は info.x-reason-codes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RegistrationErrorBody'
          examples:
            prodRedirect:
              summary: 負例 CRN-01。sandbox に本番のホストを登録しようとした
              value: { error: invalid_redirect_uri, reason_code: CR04 }
    Unauthorized:
      description: initial access token または registration access token が無効（RFC 6750）
      headers:
        WWW-Authenticate:
          schema:
            type: string
    Forbidden:
      description: この client を読む・変える・消す権限がない（RFC 7592 §2.1〜§2.3 の 403）
    TooManyRequests:
      description: 登録数か要求頻度の上限を超えた（CR14）
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RegistrationErrorBody'
    ProblemBadRequest:
      description: 申請の内容が規則に反する（RFC 9457。code と reason_code を持つ）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            layerF:
              summary: 負例 CRN-19。C4 で層 F
              value: { type: "about:blank", title: Bad Request, status: 400, code: invalid_client_metadata, reason_code: CR09 }
    ProblemUnauthorized:
      description: 認証されていない
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ProblemForbidden:
      description: 権限がない（申請者自身による承認、有資格者名簿にない承認者、consumer 台帳にないチームの申請）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ProblemNotFound:
      description: 申請がない、または読む権限がない（存在の有無を区別しない）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    OpaqueId:
      description: 基盤が払い出す不透明値（CON-02 OpaqueId と同じ形にする。凍結前に $ref へ寄せる。CON-00 §4.9 D-7）
      type: string
      pattern: '^[a-z0-9]{26}$'
    ClientId:
      description: OAuth client_id。受信側は形式を解析しない（ADR-021 D21-22・D21-23）
      $ref: '#/components/schemas/OpaqueId'
    RedirectUri:
      description: |
        redirect URI。wildcard と fragment を含まない。https、loopback の IP リテラルの http、または private-use scheme（`<id-domain>` を逆順にした名前。ADR-021 D21-24）に限る。
        照合は exact string matching（RFC 9700 §2.1 の MUST）。例外は native app の loopback の port だけ。
      type: string
      maxLength: 2048
      pattern: '^(https://[^*#\s]+|http://127\.0\.0\.1(:[0-9]{1,5})?/[^*#\s]*|http://\[::1\](:[0-9]{1,5})?/[^*#\s]*|[a-z][a-z0-9+-]*(\.[a-z0-9+-]+)+:/[^*#\s]*)$'
    HttpsRedirectUri:
      type: string
      maxLength: 2048
      pattern: '^https://[^*#\s]+$'
    NativeRedirectUri:
      type: string
      maxLength: 2048
      pattern: '^(http://127\.0\.0\.1(:[0-9]{1,5})?/[^*#\s]*|http://\[::1\](:[0-9]{1,5})?/[^*#\s]*|[a-z][a-z0-9+-]*(\.[a-z0-9+-]+)+:/[^*#\s]*)$'
    Owner:
      type: object
      required: [consumer_id, secondary_contact]
      properties:
        consumer_id:
          description: consumer 台帳の ID（CON-01 §6.1）
          $ref: '#/components/schemas/OpaqueId'
        secondary_contact:
          description: 副所有者の連絡先（チームの共有アドレス。個人のアドレスを避ける）
          type: string
          format: email
    ClientMetadata:
      description: |
        登録内容。RFC 7591 §2 の項目名と意味をそのまま使い、`platform_` で始まる 5 項目だけを本契約で加えた（名前は案。ADR-021）。
        AS は理解しない項目を無視しなければならない（RFC 7591 §2 の MUST）ので、未知の項目を送ってもエラーにはならないが、登録されない。
        種別ごとの規則は oneOf の各分岐（x-constraint を含む）で表す。
      type: object
      additionalProperties: true
      required: [platform_client_category, platform_owner, platform_risk_layer, client_name, grant_types, token_endpoint_auth_method]
      properties:
        platform_client_category:
          description: ARC-02 §6 の client 種別。C7（内部 workload）と C9（本基盤が RP）は範囲外
          type: string
          enum: [C1, C2, C3, C4, C5, C6, C8]
        platform_owner:
          $ref: '#/components/schemas/Owner'
        platform_owning_tenant:
          description: 所有テナント（第三者・顧客の client）。第一者の client では省略する（ADR-021 D21-22）
          $ref: '#/components/schemas/OpaqueId'
        platform_risk_layer:
          description: ARC-02 §8 の層（B・H・F）。層の判定は client 登録の profile 属性と操作の分類登録の組で行う（ADR-020 D20-03）
          type: string
          enum: [B, H, F]
        platform_acceptance_ref:
          description: 例外の受容票の参照（AR-5 など）
          type: string
          maxLength: 128
        client_name:
          type: string
          maxLength: 200
        redirect_uris:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RedirectUri'
        grant_types:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [authorization_code, refresh_token, client_credentials]
        response_types:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [code]
        token_endpoint_auth_method:
          description: 必須。省略時の既定値（client_secret_basic）に頼らせない
          type: string
          enum: [private_key_jwt, tls_client_auth, none]
        token_endpoint_auth_signing_alg:
          type: string
          enum: [ES256, PS256]
        jwks_uri:
          type: string
          format: uri
          pattern: '^https://'
        jwks:
          type: object
          required: [keys]
          properties:
            keys:
              type: array
              minItems: 1
              items:
                type: object
                required: [kty]
                properties:
                  kty:
                    type: string
                    enum: [EC, RSA]
                  d:
                    description: 秘密鍵の成分を登録しない
                    not: {}
        tls_client_auth_subject_dn:
          type: string
          maxLength: 1024
        tls_client_auth_san_dns:
          type: string
          maxLength: 253
        tls_client_auth_san_uri:
          type: string
          format: uri
        tls_client_certificate_bound_access_tokens:
          type: boolean
        dpop_bound_access_tokens:
          type: boolean
        require_pushed_authorization_requests:
          type: boolean
        id_token_signed_response_alg:
          type: string
          enum: [ES256, PS256]
        scope:
          type: string
          maxLength: 2048
        software_id:
          type: string
          maxLength: 128
        software_version:
          type: string
          maxLength: 64
        contacts:
          type: array
          items:
            type: string
            format: email
        client_id:
          description: 登録者は指定できない（CR07、ADR-021 D21-22）
          not: {}
        client_secret:
          description: 登録者は指定できない（CR07）
          not: {}
        software_statement:
          description: v0.1 では受け付けない（CR11）
          not: {}
      not:
        description: jwks_uri と jwks を両方入れない（RFC 7591 §2 の MUST NOT、CR05）
        properties:
          jwks_uri: {}
          jwks: {}
        required: [jwks_uri, jwks]
      allOf:
        - $ref: '#/components/schemas/AuthMethodRules'
        - oneOf:
            - $ref: '#/components/schemas/RulesC1'
            - $ref: '#/components/schemas/RulesC2'
            - $ref: '#/components/schemas/RulesC3'
            - $ref: '#/components/schemas/RulesC4'
            - $ref: '#/components/schemas/RulesC5C8'
            - $ref: '#/components/schemas/RulesC6'
      x-constraint:
        - "sandbox: redirect_uris のホストと jwks の鍵が、本番の一覧に含まれない（CR04・CR13。設定に依存するためスキーマでは表せない）"
        - "C3 で dpop_bound_access_tokens=true とする場合は platform_acceptance_ref が必須（AR-5）"
        - "software_id・software_version の組が別の consumer_id で登録済みでない（CR12）"
        - "本番: redirect_uris の https のホストごとに、ホスト・所有テナント・申請に束縛した verified のドメイン検証があり、ホストが public suffix・共有ホスティングの suffix とその直下でなく、CNAME の宛先が解決できる（AR-10、CR25〜CR27。DNS と台帳に依存するためスキーマでは表せない。版 0.5.0）"
    AuthMethodRules:
      additionalProperties: true
      description: 認証方式ごとの必須項目（CR05・CR08）
      anyOf:
        - properties:
            token_endpoint_auth_method: { const: private_key_jwt }
          required: [token_endpoint_auth_signing_alg]
          anyOf:
            - required: [jwks_uri]
            - required: [jwks]
        - properties:
            token_endpoint_auth_method: { const: tls_client_auth }
          oneOf:
            - required: [tls_client_auth_subject_dn]
            - required: [tls_client_auth_san_dns]
            - required: [tls_client_auth_san_uri]
        - properties:
            token_endpoint_auth_method: { const: none }
    ConfidentialAuth:
      additionalProperties: true
      properties:
        token_endpoint_auth_method:
          enum: [private_key_jwt, tls_client_auth]
    CodeFlowGrants:
      additionalProperties: true
      required: [redirect_uris, response_types]
      properties:
        grant_types:
          contains: { const: authorization_code }
          items:
            enum: [authorization_code, refresh_token]
        response_types:
          const: [code]
    RulesC1:
      additionalProperties: true
      allOf:
        - $ref: '#/components/schemas/ConfidentialAuth'
        - $ref: '#/components/schemas/CodeFlowGrants'
      required: [require_pushed_authorization_requests]
      properties:
        platform_client_category: { const: C1 }
        require_pushed_authorization_requests: { const: true }
        redirect_uris:
          items:
            $ref: '#/components/schemas/HttpsRedirectUri'
    RulesC2:
      additionalProperties: true
      allOf:
        - $ref: '#/components/schemas/CodeFlowGrants'
      required: [dpop_bound_access_tokens]
      properties:
        platform_client_category: { const: C2 }
        token_endpoint_auth_method: { const: none }
        dpop_bound_access_tokens: { const: true }
        platform_risk_layer: { enum: [B, H] }
        redirect_uris:
          items:
            $ref: '#/components/schemas/NativeRedirectUri'
    RulesC3:
      additionalProperties: true
      allOf:
        - $ref: '#/components/schemas/ConfidentialAuth'
        - $ref: '#/components/schemas/CodeFlowGrants'
        - anyOf:
            - required: [tls_client_certificate_bound_access_tokens]
              properties:
                tls_client_certificate_bound_access_tokens: { const: true }
            - required: [dpop_bound_access_tokens, platform_acceptance_ref]
              properties:
                dpop_bound_access_tokens: { const: true }
        - anyOf:
            - properties:
                platform_risk_layer: { enum: [B, H] }
            - required: [require_pushed_authorization_requests]
              properties:
                require_pushed_authorization_requests: { const: true }
      properties:
        platform_client_category: { const: C3 }
        redirect_uris:
          items:
            $ref: '#/components/schemas/HttpsRedirectUri'
    RulesC4:
      additionalProperties: true
      allOf:
        - $ref: '#/components/schemas/CodeFlowGrants'
      required: [dpop_bound_access_tokens]
      properties:
        platform_client_category: { const: C4 }
        token_endpoint_auth_method: { const: none }
        dpop_bound_access_tokens: { const: true }
        platform_risk_layer: { const: B }
        redirect_uris:
          items:
            $ref: '#/components/schemas/HttpsRedirectUri'
    RulesC5C8:
      additionalProperties: true
      allOf:
        - $ref: '#/components/schemas/ConfidentialAuth'
      required: [tls_client_certificate_bound_access_tokens]
      properties:
        platform_client_category: { enum: [C5, C8] }
        grant_types: { const: [client_credentials] }
        response_types: { maxItems: 0 }
        redirect_uris: { maxItems: 0 }
        tls_client_certificate_bound_access_tokens: { const: true }
        platform_risk_layer: { enum: [B, F] }
    RulesC6:
      additionalProperties: true
      allOf:
        - $ref: '#/components/schemas/ConfidentialAuth'
        - $ref: '#/components/schemas/CodeFlowGrants'
        - anyOf:
            - properties:
                platform_risk_layer: { enum: [B, H] }
            - required: [require_pushed_authorization_requests]
              properties:
                platform_risk_layer: { const: F }
                require_pushed_authorization_requests: { const: true }
                id_token_signed_response_alg: { const: ES256 }
      required: [id_token_signed_response_alg]
      properties:
        platform_client_category: { const: C6 }
        redirect_uris:
          items:
            $ref: '#/components/schemas/HttpsRedirectUri'
    SandboxClientInformation:
      description: RFC 7591 §3.2.1 と RFC 7592 §3 の client information response。登録された metadata をすべて含む
      allOf:
        - $ref: '#/components/schemas/IssuedMetadata'
        - type: object
          required: [registration_client_uri, registration_access_token]
          properties:
            registration_client_uri:
              type: string
              format: uri
            registration_access_token:
              description: 資格情報。ログに残さない
              type: string
              minLength: 32
    IssuedMetadata:
      description: 払い出し後の登録内容。client_id と client_id_issued_at を基盤が付ける。client_secret は含まない
      type: object
      required: [client_id, platform_environment]
      properties:
        client_id:
          $ref: '#/components/schemas/ClientId'
        client_id_issued_at:
          type: integer
          minimum: 0
        platform_environment:
          description: 払い出した環境。sandbox の client_id は本番で未知（CRN-12）
          type: string
          enum: [sandbox, production]
        platform_client_state:
          description: 払出し後の client の状態（版 0.5.0、§5A.4）。suspended の間は token の発行と refresh を拒否する（DL-24 の P-K1）
          type: string
          enum: [active, suspended]
        suspension_reason_code:
          description: platform_client_state が suspended のときだけ。停止の理由コード（CR28 など。版 0.5.0）
          type: string
          pattern: '^CR[0-9]{2}$'
        platform_client_category: { type: string }
        platform_owner: { $ref: '#/components/schemas/Owner' }
        platform_owning_tenant: { $ref: '#/components/schemas/OpaqueId' }
        platform_risk_layer: { type: string }
        client_name: { type: string }
        redirect_uris: { type: array, items: { type: string } }
        grant_types: { type: array, items: { type: string } }
        response_types: { type: array, items: { type: string } }
        token_endpoint_auth_method: { type: string }
        token_endpoint_auth_signing_alg: { type: string }
        jwks_uri: { type: string }
        jwks: { type: object }
        tls_client_auth_subject_dn: { type: string }
        tls_client_auth_san_dns: { type: string }
        tls_client_auth_san_uri: { type: string }
        tls_client_certificate_bound_access_tokens: { type: boolean }
        dpop_bound_access_tokens: { type: boolean }
        require_pushed_authorization_requests: { type: boolean }
        id_token_signed_response_alg: { type: string }
        scope: { type: string }
        client_secret:
          description: 返さない
          not: {}
    SandboxClientUpdate:
      description: RFC 7592 §2.2 の更新要求。ClientMetadata に現在の client_id を加えたもの（client_id 以外の規則は ClientMetadata と同じ。検査は AS が行う）
      type: object
      required: [client_id]
      properties:
        client_id:
          $ref: '#/components/schemas/ClientId'
        registration_access_token: { not: {} }
        registration_client_uri: { not: {} }
        client_id_issued_at: { not: {} }
        client_secret: { not: {} }
      x-constraint:
        - "client_id を除いた本文は ClientMetadata に適合する（スキーマの client_id 禁止と両立させるため、AS が client_id を除いて検査する）"
    ClientRegistrationRequest:
      type: object
      required: [kind, justification]
      properties:
        subject:
          description: 申請の対象。省略時は client（版 0.2.0 で追加。§4A.4）
          type: string
          enum: [client, workload, exchange_pair]
          default: client
        kind:
          type: string
          enum: [create, update, retire]
        target_client_id:
          description: subject が client の update・retire で必須
          $ref: '#/components/schemas/ClientId'
        target_id:
          description: subject が workload（workload_entry_id）か exchange_pair（pair_id）の update・retire で必須
          $ref: '#/components/schemas/OpaqueId'
        justification:
          type: string
          maxLength: 1000
        metadata:
          description: subject が client の create・update で必須
          $ref: '#/components/schemas/ClientMetadata'
        workload:
          description: subject が workload の create・update で必須。本番は image:digest の selector も必須（CR16）
          $ref: '#/components/schemas/WorkloadEntry'
        exchange_pair:
          description: subject が exchange_pair の create・update で必須
          $ref: '#/components/schemas/ExchangePair'
        tenant_consent:
          description: 所有テナントの管理者の同意記録の参照。AR-8 に当てはまる申請で必須（ないと pending_review のまま払い出さない。CRN-31）。版 0.3.0
          $ref: '#/components/schemas/TenantConsentRef'
        data_processing:
          description: 受領者・利用目的・データ区分・処理地域・保持期間の申告。AR-8 に当てはまる申請で必須で、同意の本体と一致しなければ CR22（CRN-43）。AR-9 の判定にも使う（版 0.4.0）。必須とする条件は scope の分類（DL-67）に依存するのでスキーマでは表さない
          $ref: '#/components/schemas/DataProcessingDeclaration'
        redirect_host_verifications:
          description: redirect_uris の https のホストごとの検証 ID（createRedirectHostVerification で作る）。subject が client の create と、redirect_uris を変える update で必須で、ホストの集合と検証の集合が一致しなければ CR25（AR-10、§5A。版 0.5.0）。必須とする条件は redirect_uris の値に依存するのでスキーマでは表さない
          type: array
          uniqueItems: true
          maxItems: 20
          items:
            $ref: '#/components/schemas/OpaqueId'
      anyOf:
        - properties: { subject: { const: client }, kind: { const: create } }
          required: [metadata]
        - properties: { subject: { const: client }, kind: { const: update } }
          required: [metadata, target_client_id]
        - properties: { subject: { const: client }, kind: { const: retire } }
          required: [target_client_id]
        - properties: { subject: { const: workload }, kind: { const: create } }
          required: [subject, workload]
        - properties: { subject: { const: workload }, kind: { const: update } }
          required: [subject, workload, target_id]
        - properties: { subject: { const: exchange_pair }, kind: { const: create } }
          required: [subject, exchange_pair]
        - properties: { subject: { const: exchange_pair }, kind: { const: update } }
          required: [subject, exchange_pair, target_id]
        - properties: { subject: { enum: [workload, exchange_pair] }, kind: { const: retire } }
          required: [subject, target_id]
    TenantConsentRef:
      description: 所有テナントの管理者の同意記録の参照（AR-8、ADR-005 D7-2。版 0.3.0、preview）。同意の本体（同意者、同意の時点の役割、申請 ID、scope の集合、期限。版 0.4.0 から受領者・利用目的・データ区分・処理地域・保持期間も）は基盤が consent_ref から引いて検査し、本文の値を信用して判定しない（CR22）
      type: object
      additionalProperties: false
      required: [consent_ref, tenant_id, form]
      properties:
        consent_ref:
          description: テナント管理画面の承認 API の記録 ID か、署名付き同意票の参照
          type: string
          maxLength: 128
        tenant_id:
          description: 同意したテナント。platform_owning_tenant と一致しなければ CR22（CRN-32）
          $ref: '#/components/schemas/OpaqueId'
        form:
          type: string
          enum: [tenant_admin_api, signed_consent_form]
    DataProcessingDeclaration:
      description: AR-8 の同意の本体が束縛し、同意画面に表示する (i)〜(v) の申告と、AR-9 の判定記録の参照（版 0.4.0、ラウンド 9 legal、preview）。受領者の表示名は基盤が法人台帳から引いて表示し、申請者の自己申告を表示しない（RFC 7591 §5）
      type: object
      additionalProperties: false
      required: [recipient, purpose, data_categories, processing_regions, retention]
      properties:
        recipient:
          description: (i) client を運用し、取得したデータを受け取る法人と事業ドメイン
          type: object
          additionalProperties: false
          required: [legal_entity_id]
          properties:
            legal_entity_id:
              description: 基盤の法人台帳の識別子。表示名はこの値から基盤が引く。未登録なら CR24 の判定では別法人とみなす
              $ref: '#/components/schemas/OpaqueId'
            business_domain:
              description: 事業ドメイン（A-051）の識別名
              type: string
              maxLength: 64
        purpose:
          description: (ii) 同意画面に表示する利用目的（1 文）
          type: string
          minLength: 1
          maxLength: 200
        data_categories:
          description: (iii) REQ-04 §3.2 の区分コードの集合。scope から基盤が導く区分を下限とする
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [PUB, INT, CUS, PII, SPI, PCI, MED, SEC, AUD, AZD]
        processing_regions:
          description: (iv) 処理・保存の所在地群（ADR-013。値の集合は relationship-model-registry の destination_region と同じ）
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 2
            maxLength: 16
        retention:
          description: (v) 受領者が取得したデータを保持する期間の上限（ISO 8601 の期間）
          type: string
          pattern: '^P(?!$)([0-9]+Y)?([0-9]+M)?([0-9]+W)?([0-9]+D)?$'
        transfer_assessment_ref:
          description: AR-9 に当てはまる申請で必須の、DL-34（CTL-02）の判定記録の参照。ないか、本申請を覆わなければ CR24
          type: string
          maxLength: 128
    SpiffeId:
      description: SPIFFE ID（trust domain を含む完全な形で扱い、path だけで比べない。§4A.2）。値は基盤が払い出す
      type: string
      maxLength: 2048
      pattern: '^spiffe://[a-z0-9.-]+/[^#?\s]+$'
    WorkloadSelector:
      description: 登録エントリの selector。基盤が管理し workload が書き換えられない属性に限る（ARC-04 W55-08）。受け付けない型は CR15
      type: object
      required: [type, value]
      properties:
        type:
          type: string
          enum: ["k8s:ns", "k8s:sa", "image:digest"]
        value:
          type: string
          maxLength: 256
      if:
        properties: { type: { const: "image:digest" } }
      then:
        properties:
          value: { pattern: '^sha256:[0-9a-f]{64}$' }
    WorkloadEntry:
      description: workload の SVID 登録エントリの要求（§4A.2。版 0.2.0、preview）
      type: object
      additionalProperties: false
      required: [platform_owner, workload_name, selectors]
      properties:
        platform_owner:
          $ref: '#/components/schemas/Owner'
        workload_name:
          description: 表示名。SPIFFE ID には入らない（W55-03）
          type: string
          maxLength: 128
        selectors:
          type: array
          minItems: 2
          maxItems: 8
          uniqueItems: true
          items:
            $ref: '#/components/schemas/WorkloadSelector'
          allOf:
            - contains: { properties: { type: { const: "k8s:ns" } }, required: [type] }
            - contains: { properties: { type: { const: "k8s:sa" } }, required: [type] }
        expose_as_service:
          description: 呼出し先として exchange を受けるなら true。service_id が払い出される
          type: boolean
          default: false
      x-constraint:
        - "spiffe_id・service_id を要求に含めない（CR17。additionalProperties false で拒否）"
        - "本番の申請では image:digest の selector が必須（CR16）"
        - "k8s:ns が申請者の consumer_id に割り当て済みで、同じ selector の組を別の登録エントリが持たない（CR21。状態に依存するためスキーマでは表せない）"
        - "sandbox の登録で本番の trust domain の SPIFFE ID を含まない（CR20）"
    WorkloadEntryInfo:
      description: 払い出し後の登録エントリ
      type: object
      required: [workload_entry_id, spiffe_id, platform_environment, status, platform_owner, selectors]
      properties:
        workload_entry_id:
          $ref: '#/components/schemas/OpaqueId'
        spiffe_id:
          $ref: '#/components/schemas/SpiffeId'
        service_id:
          description: expose_as_service が true のときだけ。exchange の resource に使う不透明値（ADR-009 D09-11）
          $ref: '#/components/schemas/OpaqueId'
        platform_environment:
          type: string
          enum: [sandbox, production]
        status:
          type: string
          enum: [active, retired]
        platform_owner:
          $ref: '#/components/schemas/Owner'
        workload_name:
          type: string
        selectors:
          type: array
          items:
            $ref: '#/components/schemas/WorkloadSelector'
    ExchangePair:
      description: 交換可能な組の要求（§4A.3、ADR-009 D09-13。版 0.2.0、preview）
      type: object
      additionalProperties: false
      required: [caller_spiffe_id, callee_service_id, max_scope, justification]
      properties:
        caller_spiffe_id:
          description: 同じ環境の登録済みエントリの SPIFFE ID（CR19・CR20）
          $ref: '#/components/schemas/SpiffeId'
        callee_service_id:
          description: 呼出し先サービスの正規識別子（WorkloadEntryInfo の service_id か参照サービス）
          $ref: '#/components/schemas/OpaqueId'
        max_scope:
          description: scope の上限（空白区切り）。空と wildcard を許さない（CR19）。STS は subject_token の scope との共通部分以下で発行する（ADR-009 D09-15）
          type: string
          minLength: 1
          maxLength: 1024
          pattern: '^[^*\s]+( [^*\s]+)*$'
        justification:
          type: string
          maxLength: 1000
    ExchangePairInfo:
      type: object
      required: [pair_id, status, platform_environment, caller_spiffe_id, callee_service_id, max_scope]
      properties:
        pair_id:
          $ref: '#/components/schemas/OpaqueId'
        status:
          type: string
          enum: [active, pending_callee_approval, rejected, retired]
        platform_environment:
          type: string
          enum: [sandbox, production]
        caller_spiffe_id:
          $ref: '#/components/schemas/SpiffeId'
        callee_service_id:
          $ref: '#/components/schemas/OpaqueId'
        max_scope:
          type: string
        justification:
          type: string
    PairDecision:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, reject]
        comment:
          type: string
          maxLength: 1000
    ApprovalItem:
      type: object
      required: [rule, role]
      properties:
        rule:
          type: string
          enum: [AR-1, AR-2, AR-3, AR-4, AR-5, AR-6, AR-7, AR-8, AR-9, AR-10]
        role:
          type: string
          enum: [authn-idp-reviewer, ciso-security-reviewer, cp1-dual-control, platform-workload-reviewer, callee-owner, tenant-admin, transfer-assessment, redirect-host-verification]
        decision:
          type: string
          enum: [approve, reject]
        decided_at:
          type: string
          format: date-time
        consent_ref:
          description: rule が AR-8 のときだけ。検査に通った同意記録の参照（版 0.3.0）
          type: string
          maxLength: 128
        transfer_assessment_ref:
          description: rule が AR-9 のときだけ。検査に通った DL-34 の判定記録の参照（版 0.4.0）
          type: string
          maxLength: 128
        verification_ids:
          description: rule が AR-10 のときだけ。基盤の自動検査に通った redirect ホストの検証 ID（版 0.5.0）
          type: array
          items:
            $ref: '#/components/schemas/OpaqueId'
    RegistrationRequestStatus:
      type: object
      required: [request_id, kind, status, submitted_at, required_approvals]
      properties:
        request_id:
          $ref: '#/components/schemas/OpaqueId'
        subject:
          type: string
          enum: [client, workload, exchange_pair]
          default: client
        kind:
          type: string
          enum: [create, update, retire]
        status:
          type: string
          enum: [pending_review, pending_provisioning, provisioned, rejected, withdrawn, expired]
        submitted_at:
          type: string
          format: date-time
        required_approvals:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalItem'
        client_id:
          description: status が provisioned のときだけ
          $ref: '#/components/schemas/ClientId'
        client_id_issued_at:
          type: integer
          minimum: 0
        issued_metadata:
          $ref: '#/components/schemas/IssuedMetadata'
        issued_workload:
          description: subject が workload で status が provisioned のときだけ
          $ref: '#/components/schemas/WorkloadEntryInfo'
        issued_exchange_pair:
          description: subject が exchange_pair で status が provisioned のときだけ
          $ref: '#/components/schemas/ExchangePairInfo'
        reason_code:
          description: 却下・受付拒否の理由コード（CR01〜CR13、CR15〜CR28。CR23 は版 0.3.1、CR24 は版 0.4.0、CR25〜CR28 は版 0.5.0）
          type: string
          pattern: '^CR[0-9]{2}$'
    ApprovalDecision:
      description: 基盤側の承認者の判断。AR-8 はテナント側の同意記録、AR-9 は DL-34 の判定記録、AR-10 は redirect ホストのドメイン検証の自動検査で満たし、本操作では記録できない（403。CRN-34・CRN-46・CRN-54。版 0.3.0・0.4.0・0.5.0）
      type: object
      required: [rule, decision]
      properties:
        rule:
          type: string
          enum: [AR-1, AR-2, AR-3, AR-4, AR-5, AR-6, AR-7, AR-8, AR-9, AR-10]
        decision:
          type: string
          enum: [approve, reject]
        comment:
          type: string
          maxLength: 1000
    RedirectHostVerificationCreate:
      description: redirect ホストのドメイン検証の作成要求（版 0.5.0、§5A.3、preview）。TXT の値は基盤が生成し、要求には含めない
      type: object
      additionalProperties: false
      required: [host, platform_owner_consumer_id]
      properties:
        host:
          description: redirect_uris のホスト（完全一致。小文字の FQDN。IP リテラル・wildcard は不可）
          type: string
          maxLength: 253
          pattern: '^(?=.{1,253}$)([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]([a-z0-9-]{0,61}[a-z0-9])?$'
        platform_owner_consumer_id:
          description: 検証を束縛する consumer（申請の platform_owner.consumer_id と一致しなければ CR25）
          $ref: '#/components/schemas/OpaqueId'
        platform_owning_tenant:
          description: 検証を束縛する所有テナント（申請の platform_owning_tenant と一致しなければ CR25。所有テナントのない client では省略）
          $ref: '#/components/schemas/OpaqueId'
        target_client_id:
          description: 払出し済みの client の update・再開のための検証で指定する（その client に束縛する）
          $ref: '#/components/schemas/ClientId'
    RedirectHostVerification:
      description: redirect ホストのドメイン検証の記録（版 0.5.0、§5A、preview）。束縛先（ホスト・consumer・所有テナント・申請か client）が申請と一致しない検証は使えない（CR25）
      type: object
      required: [verification_id, host, platform_owner_consumer_id, txt_name, status, created_at]
      properties:
        verification_id:
          $ref: '#/components/schemas/OpaqueId'
        host:
          type: string
          maxLength: 253
        platform_owner_consumer_id:
          $ref: '#/components/schemas/OpaqueId'
        platform_owning_tenant:
          $ref: '#/components/schemas/OpaqueId'
        bound_request_id:
          description: 検証を最初に使った申請（受付時に束縛する）
          $ref: '#/components/schemas/OpaqueId'
        bound_client_id:
          description: 払出し後に束縛した client
          $ref: '#/components/schemas/ClientId'
        txt_name:
          description: TXT record を置く名前（ラベル名は凍結しない）
          type: string
        txt_value:
          description: 置くべき値。基盤が生成する一度きりの値で、作成の応答でだけ返す。失効・置換の後は二度と受け付けない（CRN-52）
          type: string
        status:
          type: string
          enum: [pending, verified, failing, lapsed, superseded]
        created_at:
          type: string
          format: date-time
        last_verified_at:
          description: 最後に照合に通った時刻。失効時の P-REV の起点（§5A.4 (c)）
          type: string
          format: date-time
        lapse_reason:
          description: status が failing か lapsed のときだけ
          type: string
          enum: [txt_missing, txt_mismatch, ns_changed, registrant_changed, ns_and_registrant_changed, cname_target_unassigned, cname_target_changed, migration_deadline_passed]
    RegistrationErrorBody:
      description: RFC 7591 §3.2.2 のエラー。error は REQUIRED、error_description は OPTIONAL。reason_code は本 profile の追加メンバで、受信側は理解しないメンバを無視しなければならない（RFC 7591 §3.2.2 の MUST）
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [invalid_redirect_uri, invalid_client_metadata, invalid_software_statement, unapproved_software_statement, rate_limited]
        error_description:
          type: string
        reason_code:
          type: string
          pattern: '^CR[0-9]{2}$'
    Problem:
      description: RFC 9457 の problem details（CON-02 Problem と同じ形にする。凍結前に $ref へ寄せる。CON-00 §4.9 D-7）
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
        reason_code: { type: string }
