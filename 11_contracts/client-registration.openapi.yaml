    | FZ-027 | High | THR-03 T-098（登録済み redirect URI のホストのドメイン失効・dangling DNS による乗っ取り）の予防がない。拒否するのは wildcard・http・sandbox のホストだけで、redirect_uris のホストの所有確認も定期的な再検証もない。THR-03 申し送り T98-1 が未適用（ラウンド 10 redteam、MP-6-16） | **対応（本ファイル分）。他文書は申し送り**。指摘の事実を 2026-10-15 の作業ツリーで確かめた（版 0.4.1 に redirect ホストの所有確認・再検証の規則は 0 件。THR-03 版 0.6 の T-098 と T98-1、CTL-01 の C-027 の対象脅威は T-067 だけ）[D]。(1) §5A を新設し、本番の client の create と redirect_uris を変える update で、`https` の各ホストのドメイン検証を必須にした（AR-10、CR25）。方式は C-027 の DNS TXT を流用し、検証をホスト（完全一致）・所有テナント（ないときは consumer）・申請か client_id に束縛し、TXT の値は基盤が生成する。ICANN division の public suffix と、PSL の private division の suffix とその直下のホストは拒否し（CR26）、CNAME の連鎖の末端が解決できないか未割当てなら拒否する（CR27）。DNS の照合は DNSSEC 検証リゾルバと複数リゾルバによる。根拠は DNSOP の草案 §3・§9.7・§9.9（Internet-Draft。RS-14#24・#26。脚注 17）。(2) 定期の再検証と、NS・登録者・CNAME の宛先の変更の検知を置いた。NS か登録者が変わったら TXT が残っていても失効させ、旧い値を受け付けず、別の利用者の再検証を再有効化として扱わない（草案 §6.3・§9.11・§9.13。RS-14#25・#27）。周期は TBD（所有者 CISO、期限 G3）。(3) 失効したら、その redirect URI への自動の redirect を即時に止め（RFC 6749 §4.1.2.1 の MUST NOT。脚注 11 に参照箇所を追記し原典で確認）、猶予の後に client を停止する（DL-24 の P-K1。NS と登録者の同時変更か CNAME の宛先の未割当てなら即時。最後に成功した再検証の時刻から後の grant・token は P-REV で失効）。払出し後の `platform_client_state` と `suspension_reason_code` を加え、再開は所有者の新しい検証と update の承認に限った（CR28）。(4) 理由コード CR25〜CR28、負例 CRN-47〜CRN-54、検証の 2 操作（`createRedirectHostVerification`・`getRedirectHostVerification`）、申請の `redirect_host_verifications`、スキーマ RedirectHostVerification・RedirectHostVerificationCreate、ApprovalItem・ApprovalDecision の AR-10、x-mock の追加案、x-open-issues の行を加えた。(5) THR-03 の T-098・T98-1 の状態（H-32）、CTL-01 C-027 の対象脅威（H-33）、OPS-01 の P-K1 の起動条件（H-34）、CON-11・DL-22（H-35）、DL-20 の周期・猶予（H-36）、DCS-05 の残余（H-37）、INT-04 の手順と取消の案内（H-38）、POA&M・ADR-004・ARC-02（H-39）は担当外のため申し送った。版は操作・申請の項目・承認規則・理由コードの追加なので 0.5.0 に上げた（CON-01 CP-60 の通知の対象）[D] | info（version、x-depends-on、x-freeze-classes、x-open-issues、x-approval-rules、x-reason-codes、x-negative-examples、x-mock、x-lint-notes）、description 冒頭・§0 の 7・§5A・§6・§8・§9 H-32〜H-39・§10・脚注 11・17、paths（検証の 2 操作、申請 API の説明）、components（ClientRegistrationRequest の redirect_host_verifications、IssuedMetadata の platform_client_state・suspension_reason_code、RedirectHostVerification、RedirectHostVerificationCreate、ApprovalItem、ApprovalDecision、RegistrationRequestStatus、VerificationIdPath） |

    - 本是正で閉じられなかったもの [D]: 再検証の周期・猶予期間・移行期間の値（H-36）、CNAME の宛先の未割当ての判定方法、登録データの取得方法、PSL の版の固定、§5A の実装と CRN-47〜CRN-54 の実行（TH-TC-098。H-35）、THR-03・CTL-01・OPS-01 ほかへの反映（H-32〜H-39）、作成者以外による照合。Redocly lint とスキーマ検査は版 0.5.0 で再実行し、エラー 0・警告 0 だった（x-lint-notes）。
