  /v1/redirect-host-verifications:
    servers:
      - url: https://onboarding.id-domain.example
        description: 本番の登録申請 API（仮置き）
    post:
      operationId: createRedirectHostVerification
      tags: [production-registration-request]
      summary: 本番の redirect URI のホストのドメイン検証を作り、置くべき TXT record を受け取る（版 0.5.0、§5A）
      x-freeze-class: preview
      description: |
        申請の前に、redirect_uris の https のホストごとに 1 回呼ぶ。基盤はホスト（完全一致）・所有テナント（ないときは consumer_id）・申請か client に束縛した一度きりの値を生成し、`txt_name` と `txt_value` を返す。申請者はこの TXT record をホストの DNS に置く。
        基盤は DNSSEC 検証リゾルバ（AD bit がなければ複数のリゾルバ）で照合し、照合に通ると status=verified にする。ホストが public suffix か共有ホスティングの suffix とその直下なら 400（CR26）、CNAME の宛先が解決できないか未割当てなら 400（CR27）。CTL-01 C-027 の方式の流用（§5A.3。凍結前是正 FZ-027）。
      security:
        - workforceOidc: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedirectHostVerificationCreate'
            examples:
              forPartnerSync:
                summary: 正例。createFapiClient の redirect ホストの検証
                value:
                  host: sync.partner-apps.example
                  platform_owner_consumer_id: c9f3k2m7qx4tz8rb5wn6pda2ve
                  platform_owning_tenant: t5wq2hzr7nmc4ka3vd6pxe2bfy
      responses:
        '201':
          description: 検証を作った（status=pending。TXT record を置いた後に基盤が照合する）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedirectHostVerification'
              examples:
                pending:
                  summary: TXT 待ち
                  value:
                    verification_id: hv3qk7mz2xr9tn4bw6pd8ce5ya
                    host: sync.partner-apps.example
                    platform_owner_consumer_id: c9f3k2m7qx4tz8rb5wn6pda2ve
                    platform_owning_tenant: t5wq2hzr7nmc4ka3vd6pxe2bfy
                    txt_name: _platform-redirect-verification.sync.partner-apps.example
                    txt_value: rhv1-7Qm2Xk9pZr4Tn6Vb8Hc3We5Ya
                    status: pending
                    created_at: "2026-10-15T08:30:00Z"
        '400':
          $ref: '#/components/responses/ProblemBadRequest'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '#/components/responses/ProblemForbidden'
  /v1/redirect-host-verifications/{verification_id}:
    servers:
      - url: https://onboarding.id-domain.example
        description: 本番の登録申請 API（仮置き）
    parameters:
      - $ref: '#/components/parameters/VerificationIdPath'
    get:
      operationId: getRedirectHostVerification
      tags: [production-registration-request]
      summary: redirect ホストの検証の状態を読む（版 0.5.0、§5A）
