      - { id: AR-6, applies: "subject が workload で、kind が create か update", approver: "プラットフォームチームの有資格者（作成者≠承認者）", basis: "INT-04 OB-2(b)、ARC-04 W55-08、operating-model §7.2 CP-2", checks: "selector が基盤管理の属性だけで、image:digest を含むこと。namespace が申請者の consumer に割り当て済みであること。所有者・副所有者の有無（W55-11）" }
      - { id: AR-7, applies: "subject が exchange_pair で、kind が create か update", approver: "呼出し先の所有者", basis: "ADR-009 D09-13、INT-04 OB-2(c)", checks: "呼出しの必要性、max_scope の最小化" }
      - { id: AR-8, applies: "subject が client の create・update で、platform_owning_tenant が顧客テナントであり、scope に app-only の権限（grant_types に client_credentials を含む client の scope すべて）か、操作の分類登録（DL-67）で低リスクに分類されていない scope（未分類を含む）がある。update では scope・grant_types・platform_owning_tenant を変えるとき（版 0.3.0）", approver: "所有テナント（platform_owning_tenant）の管理者。基盤側の承認者は記録できない（CRN-34）。同意画面には data_processing の (i) 受領者（検証済みの運用法人・事業ドメイン）、(ii) 利用目的、(iii) データ区分、(iv) 処理・保存の所在地群、(v) 保持期間を表示する（版 0.4.0）", basis: "ADR-005 D7-2、ARC-02 §6（テナント管理者の同意は privileged、F2）、RFC 6749 §1.3.4・§4.4、先行例 RS-17#63", checks: "tenant_consent（consent_ref）があり、tenant_id が platform_owning_tenant と一致し、同意が本申請（request_id か target_client_id）と要求する scope の集合を覆い、期限内で、同意の時点で同意者がそのテナントの管理者であること。同意の本体が data_processing の (i)〜(v) と一致すること（版 0.4.0）。満たさなければ CR22。検査に通るまで status は pending_review のままで払い出さない" }
      - { id: AR-9, applies: "AR-8 に当てはまる申請のうち、(a) data_processing.processing_regions に所有テナントの所在地群（A-062、テナント配置表）にない所在地群がある、または (b) data_processing.recipient の運用法人が基盤運営法人と別法人（不明を含む）であるもの。update では data_processing か platform_owning_tenant を変えるとき（版 0.4.0）", approver: "承認者なし。DL-34（CTL-02、法務責任者）の判定記録の参照（data_processing.transfer_assessment_ref）で満たす。基盤側の承認者は decide で記録できない（403）", basis: "個人情報保護法 28 条、GDPR 44 条・46 条 1 項、DORA 30 条 2 項 (b)（CTL-02 §3.5）、CTL-02 §1.4 (β)・L-04・L-13、relationship-model-registry の export の destination_region（ADR-018 D18-12(d)）", checks: "判定記録があり、本申請の受領法人・処理地域・データ区分・利用目的を覆い、有効であること。満たさなければ CR24。法的十分性の判断は L-04・L-13・OI-P02" }
      - { id: AR-10, applies: "subject が client の create と、redirect_uris を変える update で、redirect_uris に https のホストがあるもの（本番だけ。版 0.5.0、凍結前是正 FZ-027）", approver: "承認者なし。基盤の自動検査（redirect_host_verifications の各検証の照合）で満たす。基盤側の承認者は decide で記録できない（403。CRN-54）", basis: "THR-03 T-098・T98-1、CTL-01 C-027、DNSOP 草案 §3・§6.3・§9.7・§9.9・§9.11・§9.13（Internet-Draft。RS-14#24〜#27）", checks: "redirect_uris の https のホストの集合と検証の集合が一致し、各検証が status=verified で、ホスト（完全一致）・platform_owning_tenant（ないときは consumer_id）・本申請（request_id か target_client_id）に束縛され、受付時と払出しの直前の TXT の照合に通ること（CR25）。ホストが public suffix か PSL の private division の suffix とその直下でないこと（CR26）。CNAME の連鎖の末端が解決でき、未割当てでないこと（CR27）。払出し後は定期の再検証と NS・登録者・CNAME の宛先の変更の検知を続け、失効したら CR28（§5A.4）" }
      - { id: AR-0, applies: "kind が retire", approver: "不要（所有者だけで成立）", basis: "権限を減らす変更", checks: "払出し後、その client の grant と token を無効化する（RFC 7592 §2.3 の SHOULD を本番にも適用）" }
