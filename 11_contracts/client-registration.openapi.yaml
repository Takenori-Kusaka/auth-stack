      - { ref: CRN-42, op: submitClientRegistrationRequest, case: "所在地群が EU だけのテナント T（所在地指定）を所有テナントとする C5 の申請で、data_processing.processing_regions=[us]、T の管理者の同意は (i)〜(v) を含めて形式上そろう。transfer_assessment_ref なし", expect: "400 Problem（code=transfer_assessment_required、reason_code=CR24）。払出し 0 件。relationship-model-registry の「所在地群外への送付先」と同じ判定（版 0.4.0、ラウンド 9 legal）" }
      - { ref: CRN-43, op: submitClientRegistrationRequest, case: "T の管理者の同意の本体が受領者 X 社・利用目的「月次集計」・区分 [CUS]・地域 [jp]・保持 P30D を束縛し、申請の data_processing は受領者 Y 社、区分 [CUS, PII]、保持 P1Y を申告する。または data_processing を省略する", expect: "400 / CR22。払出し 0 件（版 0.4.0）" }
      - { ref: CRN-44, op: submitClientRegistrationRequest, case: "払出し済みの client（T の同意あり、地域 [jp]）の update で processing_regions を [jp, eu] に、または recipient を別法人に変え、旧い consent_ref と旧い判定記録を再使用する", expect: "400 / CR22（新しい同意がない）。新しい同意がそろっても判定記録が新しい地域・受領者を覆わなければ CR24。払出し 0 件（版 0.4.0）" }
      - { ref: CRN-45, op: submitClientRegistrationRequest, case: "処理地域は T の所在地群の内だが、recipient の運用法人がグループ内の別法人（または法人台帳で判定できない）。同意はそろい、transfer_assessment_ref なし", expect: "400 / CR24。払出し 0 件（CTL-02 §1.4 (β)、L-13。版 0.4.0）" }
      - { ref: CRN-46, op: decideClientRegistrationRequest, case: "認証・IdP チームの有資格者が rule=AR-9 の approve を記録して判定記録の代わりにする", expect: "403。AR-9 は未充足のまま。払出し 0 件（版 0.4.0）" }
      - { ref: CRN-47, op: submitClientRegistrationRequest, case: "C3 の create で redirect_uris=[https://sync.partner-apps.example/oauth/callback]、redirect_host_verifications を省略する（または TXT を置く前の status=pending の検証 ID を入れる）", expect: "400 Problem（code=invalid_redirect_uri、reason_code=CR25）。払出し 0 件（版 0.5.0、凍結前是正 FZ-027）" }
      - { ref: CRN-48, op: submitClientRegistrationRequest, case: "platform_owning_tenant=T の申請に、同じホストについてテナント U（または別の consumer・別の client）に束縛して作られた verified の検証 ID を入れる。親ドメイン partner-apps.example の検証で子のホストを覆おうとする場合も含む", expect: "400 / CR25。検証の流用と親ドメインによる被覆は認めない。払出し 0 件（版 0.5.0）" }
      - { ref: CRN-49, op: submitClientRegistrationRequest, case: "redirect_uris のホストが ICANN division の public suffix そのもの、または PSL の private division の suffix の直下（例 https://partner-sync.<共有ホスティングの suffix>/cb）", expect: "400 / CR26。createRedirectHostVerification も同じホストでは 400 / CR26（版 0.5.0）" }
      - { ref: CRN-50, op: submitClientRegistrationRequest, case: "ホスト login.partner-apps.example の TXT は verified だが、CNAME の宛先（クラウドの静的サイトの名前）が解放されて NXDOMAIN を返す", expect: "400 / CR27。払出し 0 件（dangling DNS。版 0.5.0）" }
      - { ref: CRN-51, op: "（本番 AS の authorization endpoint、定期の再検証）", case: "払出し済みの C3 の client で、redirect ホストの TXT record が消えて再検証に失敗した後、正規の client_id とその redirect_uri で認可要求を送る。猶予期間が過ぎても再検証されない", expect: "失効の直後から、AS はエラーを利用者に示し、その URI へ自動で redirect しない（RFC 6749 §4.1.2.1）。所有者と所有テナントの管理者に通知。猶予の後、client は platform_client_state=suspended（suspension_reason_code=CR28）になり、token の発行と refresh を拒否する（P-K1）（版 0.5.0）" }
      - { ref: CRN-52, op: "（定期の再検証、変更の検知）", case: "redirect ホストの登録可能ドメインの NS と登録者が変わり、新しい所有者が旧い TXT の値を再投入したので TXT の照合だけは通る", expect: "検証は lapsed になり、猶予なしで client を停止する（CR28）。最後に成功した再検証の時刻から後に発行した grant・token は失効する（P-REV）。旧い値での再検証は受け付けず、新しい値の検証を求める（草案 §9.11。版 0.5.0）" }
      - { ref: CRN-53, op: submitClientRegistrationRequest, case: "CR28 で停止した client（所有テナント T）について、ドメインを取得した別の consumer が同じホストの新しい検証を作り、停止した client の再開を申請する。または停止した client の所有者が、新しい検証なしで kind=update を送る", expect: "前者は 403（target_client_id の所有者でない）で、停止した client は再開しない（草案 §9.13 の再有効化の禁止）。後者は 400 / CR28。再開は所有者の新しい検証と AR-1・AR-10 を通した update に限る（版 0.5.0）" }
      - { ref: CRN-54, op: decideClientRegistrationRequest, case: "認証・IdP チームの有資格者が rule=AR-10 の approve を記録して、ドメイン検証の代わりにする", expect: "403。AR-10 は未充足のまま。払出し 0 件（版 0.5.0）" }
  x-mock:
    description: CON-11 の MK-01（開発用 AS・IdP）への追加案（申し送り H-3）。CON-11 の作成者が取り込むまでは本節を仕様とする
    MK-01:
      - issuer B（sandbox 役）に registerSandboxClient・readSandboxClient・updateSandboxClient・deleteSandboxClient を実装し、ClientMetadata の規則と CR01〜CR14 の判定を返す
      - issuer A（本番役）には登録 endpoint を置かない。issuer B で払い出した client_id は issuer A で invalid_client になる（CRN-12）
      - 本番役の redirect URI のホストと公開鍵の一覧を制御 API（POST /__kit/fixtures）で登録し、CR04・CR13 の判定に使う
      - 本番の登録申請 API は examples から起動する example 駆動のモックにする。承認は制御 API の inject で模し、required_approvals がそろうまで provisioned にしない
    MK-02:
      - （版 0.2.0 の追加案。申し送り H-12）STS 役に registerSandboxWorkload・deleteSandboxWorkload・registerExchangePair・decideSandboxExchangePair・deleteExchangePair を実装し、CR15〜CR21 の判定を返す
      - 登録エントリに対して sandbox の trust domain の SVID を発行し、有効な組（status=active）だけを exchange の登録簿として使う（CRN-28・CRN-30）
      - （版 0.3.0 の追加案。申し送り H-19）本番の申請 API のモックは、AR-4 を client_credentials の申請に、AR-8 を platform_owning_tenant のある app-only・低リスクでない scope の申請に付け、tenant_consent の検査（CR22）を example 駆動で返す（CRN-31〜CRN-37）
      - （版 0.3.1 の追加案。PoC/R7反映）本番の申請 API のモックは、テナントの主状態を制御 API（POST /__kit/fixtures）で登録し、CR23 を返す（CRN-38・CRN-39）。MK-01 の issuer A（本番役）は、platform_owning_tenant を持つ client の token の tid を登録値に固定する（CRN-40）。同意の撤回とテナントの状態遷移は制御 API の inject で模す（CRN-41）
      - （版 0.4.0 の追加案。申し送り H-26）本番の申請 API のモックは、テナントの所在地群・法人台帳・DL-34 の判定記録を制御 API（POST /__kit/fixtures）で登録し、同意の本体と data_processing の照合（CR22。CRN-43・CRN-44）と AR-9（CR24。CRN-42・CRN-45）を返す。decide での AR-9 の記録は 403（CRN-46）
      - 割り当て済みの namespace と参照サービスの一覧を制御 API（POST /__kit/fixtures）で登録し、CR21 と即時有効の判定に使う
      - （版 0.5.0 の追加案。凍結前是正 FZ-027、申し送り H-35）本番の申請 API のモックに createRedirectHostVerification・getRedirectHostVerification を置き、ホストごとの TXT record・NS・登録者・CNAME の宛先の解決結果と PSL の抜粋を制御 API（POST /__kit/fixtures）で登録して、AR-10 と CR25〜CR27 を返す（CRN-47〜CRN-50・CRN-54）。再検証の失敗と NS・登録者の変更は制御 API の inject で模し、MK-01 の issuer A（本番役）は失効した redirect URI へ redirect せず、猶予の後（条件により即時）に client を停止して CR28 を記録する（CRN-51〜CRN-53）
servers:
  - url: https://sandbox-as.id-domain.example
    description: sandbox の AS（issuer B）。ホスト名は仮置きで凍結しない。consumer は AS metadata の registration_endpoint から URL を得る
tags:
  - name: sandbox-registration
    description: sandbox の client セルフ登録（RFC 7591/7592 profile）。preview
  - name: production-registration-request
    description: 本番の client・workload・交換可能な組の登録・変更・廃止の申請と承認。preview
  - name: sandbox-workload-registration
    description: sandbox の workload（SVID 登録エントリ）と交換可能な組のセルフ登録（版 0.2.0 で追加、§4A）。preview
paths:
  /v1/register:
    post:
      operationId: registerSandboxClient
      tags: [sandbox-registration]
      summary: sandbox の client を登録する（RFC 7591 §3.1）
      x-freeze-class: preview
      description: |
        sandbox の AS に client を登録する。承認は不要である（G-141(c)）。要求本文は ClientMetadata で、`application/json` で送る（RFC 7591 §3 の MUST）。
        成功すると 201 と、払い出した `client_id`、登録された metadata のすべて、RFC 7592 の `registration_client_uri` と `registration_access_token` を返す。
        `client_secret` は返さない（共有秘密の方式を登録できないため）。
      security:
        - sandboxInitialAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientMetadata'
            examples:
              bffClient:
                summary: 正例。C1 第一者 BFF（private_key_jwt、PAR 必須）
                value:
                  platform_client_category: C1
                  platform_owner: { consumer_id: c9f3k2m7qx4tz8rb5wn6pda2ve, secondary_contact: orders-oncall@partner-team.example }
                  platform_risk_layer: B
                  client_name: Orders BFF (sandbox)
                  redirect_uris: [https://orders-bff.sandbox-apps.example/callback]
                  grant_types: [authorization_code, refresh_token]
                  response_types: [code]
                  token_endpoint_auth_method: private_key_jwt
                  token_endpoint_auth_signing_alg: ES256
                  jwks_uri: https://orders-bff.sandbox-apps.example/.well-known/jwks.json
                  require_pushed_authorization_requests: true
                  scope: orders.read orders.write
              m2mClient:
                summary: 正例。C5 外部 M2M（tls_client_auth、証明書束縛）
                value:
                  platform_client_category: C5
                  platform_owner: { consumer_id: c9f3k2m7qx4tz8rb5wn6pda2ve, secondary_contact: billing-oncall@partner-team.example }
                  platform_owning_tenant: t5wq2hzr7nmc4ka3vd6pxe2bfy
                  platform_risk_layer: B
                  client_name: Billing batch (sandbox)
                  grant_types: [client_credentials]
                  token_endpoint_auth_method: tls_client_auth
                  tls_client_auth_subject_dn: CN=billing-batch,O=Partner Team,C=JP
                  tls_client_certificate_bound_access_tokens: true
                  scope: invoice.read
      responses:
        '201':
          description: 登録成功（RFC 7591 §3.2.1、RFC 7592 §3）
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxClientInformation'
              examples:
                registered:
                  summary: 正例。C1 の登録結果
                  value:
                    client_id: s4hb8xq2kz7mn3vc6tr9pwe5ya
                    client_id_issued_at: 1792022400
                    registration_client_uri: https://sandbox-as.id-domain.example/v1/register/s4hb8xq2kz7mn3vc6tr9pwe5ya
                    registration_access_token: rat_Q2x9Lm4Zp7Tn1Vb8Kc3Rf6Wd0Hs5Jy
                    platform_client_category: C1
                    platform_owner: { consumer_id: c9f3k2m7qx4tz8rb5wn6pda2ve, secondary_contact: orders-oncall@partner-team.example }
                    platform_risk_layer: B
                    platform_environment: sandbox
                    client_name: Orders BFF (sandbox)
                    redirect_uris: [https://orders-bff.sandbox-apps.example/callback]
                    grant_types: [authorization_code, refresh_token]
                    response_types: [code]
                    token_endpoint_auth_method: private_key_jwt
                    token_endpoint_auth_signing_alg: ES256
                    jwks_uri: https://orders-bff.sandbox-apps.example/.well-known/jwks.json
                    require_pushed_authorization_requests: true
                    scope: orders.read orders.write
        '400':
          $ref: '#/components/responses/RegistrationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/register/{client_id}:
    parameters:
      - $ref: '#/components/parameters/ClientIdPath'
    get:
      operationId: readSandboxClient
      tags: [sandbox-registration]
      summary: sandbox の client の登録内容を読む（RFC 7592 §2.1）
      x-freeze-class: preview
      description: |
        登録内容を返す。応答の `registration_access_token` は新しい値に回転しており、要求に使った token は以後拒否される（本 profile の必須。RFC 7592 §5 の MAY を強めた）。
        client が存在しない場合は 401 を返し、使われた token を無効にする（RFC 7592 §2.1 の MUST・SHOULD）。
      security:
        - registrationAccessToken: []
      responses:
        '200':
          description: 登録内容（registration_access_token は回転後の値）
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxClientInformation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      operationId: updateSandboxClient
      tags: [sandbox-registration]
      summary: sandbox の client の登録内容を置き換える（RFC 7592 §2.2）
      x-freeze-class: preview
      description: |
        以前に返された metadata をすべて含めて送る。省略した項目は削除の要求として扱われる（RFC 7592 §2.2 の MUST）。部分更新ではない。
        `client_id` を本文に含め、現在の値と一致させる（MUST）。`registration_access_token`・`registration_client_uri`・`client_id_issued_at` は含めない（MUST NOT）。`client_secret` は指定できない（CR07）。
        検査規則は registerSandboxClient と同じである。
      security:
        - registrationAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SandboxClientUpdate'
      responses:
        '200':
          description: 更新後の登録内容（registration_access_token は回転後の値）
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxClientInformation'
        '400':
          $ref: '#/components/responses/RegistrationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      operationId: deleteSandboxClient
      tags: [sandbox-registration]
      summary: sandbox の client を削除する（RFC 7592 §2.3）
      x-freeze-class: preview
      description: |
        `client_id` と registration access token を無効にし、その client の grant・access token・refresh token をすぐに無効にする（RFC 7592 §2.3 の SHOULD を本 profile で必須化）。
        削除した `client_id` は墓石として保持し、再発番しない（ADR-021 D21-13）。
      security:
        - registrationAccessToken: []
      responses:
        '204':
          description: 削除成功（RFC 7592 §2.3 の MUST）
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/sandbox/workloads:
    servers:
      - url: https://sandbox-workload.id-domain.example
        description: sandbox の workload 登録窓口（sandbox の trust domain の SVID 発行系と STS の登録簿の前段。ホスト名は仮置きで凍結しない）
    post:
      operationId: registerSandboxWorkload
      tags: [sandbox-workload-registration]
      summary: sandbox の workload の SVID 登録エントリを作る（§4A.2）
      x-freeze-class: preview
      description: |
        sandbox の trust domain に workload の登録エントリを作り、基盤が払い出した SPIFFE ID を返す。承認は不要である（G-141(c)）。
        selector は k8s:ns・k8s:sa（必須）と image:digest（任意）だけを受け付ける（ARC-04 W55-08、CR15・CR16）。SPIFFE ID と service_id は指定できない（CR17）。
        expose_as_service が true なら、exchange の resource に使うサービスの正規識別子（service_id）も払い出す（ADR-009 D09-11）。
      security:
        - sandboxInitialAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkloadEntry'
            examples:
              ordersApi:
                summary: 正例。注文サービス（呼出し先としても exchange を受ける）
                value:
                  platform_owner: { consumer_id: c9f3k2m7qx4tz8rb5wn6pda2ve, secondary_contact: orders-oncall@partner-team.example }
                  workload_name: orders-api
                  selectors:
                    - { type: "k8s:ns", value: orders-sbx }
                    - { type: "k8s:sa", value: orders-api }
                  expose_as_service: true
      responses:
        '201':
          description: 登録成功。SVID は selector に一致したインスタンスに発行される
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkloadEntryInfo'
              examples:
                registered:
                  summary: 正例の登録結果
                  value:
                    workload_entry_id: w3kq8zm2xh7tn4vc6pr9bde5ya
                    spiffe_id: spiffe://sandbox.id-domain.example/w/w3kq8zm2xh7tn4vc6pr9bde5ya
                    service_id: v6pt2kq9mz4xh7nc3rb8wde5ya
                    platform_environment: sandbox
                    status: active
                    platform_owner: { consumer_id: c9f3k2m7qx4tz8rb5wn6pda2ve, secondary_contact: orders-oncall@partner-team.example }
                    workload_name: orders-api
                    selectors:
                      - { type: "k8s:ns", value: orders-sbx }
                      - { type: "k8s:sa", value: orders-api }
        '400':
          $ref: '#/components/responses/ProblemBadRequest'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/sandbox/workloads/{workload_entry_id}:
    servers:
      - url: https://sandbox-workload.id-domain.example
        description: sandbox の workload 登録窓口（仮置き）
    parameters:
      - $ref: '#/components/parameters/WorkloadEntryIdPath'
    delete:
      operationId: deleteSandboxWorkload
      tags: [sandbox-workload-registration]
      summary: sandbox の workload の登録エントリを削除する（§4A.2）
      x-freeze-class: preview
      description: |
        SVID の新規発行を止める。発行済みの SVID は寿命で切れる（ARC-04 W55-09）。SPIFFE ID と service_id は墓石として保持し再発番しない（W55-04、ADR-021 D21-13）。
        この workload を呼出し元か呼出し先に持つ交換可能な組は同時に無効になる（CRN-30）。登録した consumer だけが削除できる。
      security:
        - sandboxInitialAccessToken: []
      responses:
        '204':
          description: 削除成功
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '#/components/responses/ProblemForbidden'
        '404':
