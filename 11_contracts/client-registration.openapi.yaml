                    platform_owning_tenant: t5wq2hzr7nmc4ka3vd6pxe2bfy
                    bound_client_id: p2nd6vq9hx4kz7mc3tr8bwe5ya
                    txt_name: _platform-redirect-verification.sync.partner-apps.example
                    status: lapsed
                    created_at: "2026-10-15T08:30:00Z"
                    last_verified_at: "2026-10-15T09:00:00Z"
