          schema:
            $ref: '#/components/schemas/TypeName'
        - name: anchor_id
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ObjectId'
        - name: state
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/GrantState'
        - name: page_token
          in: query
          required: false
          schema:
            type: string
            maxLength: 1024
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: 付与の一覧
          headers:
