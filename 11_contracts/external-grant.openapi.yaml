      - { ref: XGN-15, op: acceptExternalGrantInvitation, case: "依存サービスの workload が受諾を呼ぶ", expect: "403 caller_not_declared" }
      - { ref: XGN-16, op: acceptExternalGrantInvitation, case: "受諾者の確認済み連絡先が宛先と異なる（転送された招待）", expect: "200 state=held。grantee の tuple は書かれない" }
      - { ref: XGN-17, op: revokeExternalGrant, case: "取消しの 200 の後、同じゲストの token（期限内）で起点の資源を読む", expect: "依存サービスの PEP で拒否（404）。read-sensitive は応答の consistency_token か剥奪フェンスの新しい方で評価する" }
      - { ref: XGN-18, op: revokeExternalGrantsByAnchor, case: "予約を取り消した後、そのゲストが予約を読む", expect: "拒否。revoked_count は取り消した付与の数" }
      - { ref: XGN-19, op: getExternalGrant, case: "他の名前空間の起点に付いた付与の grant_id を指定する", expect: "404 not_found（存在の有無を区別しない）" }
      - { ref: XGN-20, op: createExternalGrant, case: "invitee.address を含む要求の後、依存サービスと façade のログ・監査・tuple に email が残っていないか調べる", expect: "残っていない（XGC-4、XGS-11）" }
