  - url: https://authz-registry.{cell}.example.invalid
    description: 資源の cell の façade（CON-04 と同じ配備。実ホスト名は ADR-021 の `<id-domain>` 確定後に置換する仮置き）。呼ぶ側は設定 EXTERNAL_GRANT_API_URL（§12 V12-XG-7）から得る
    variables:
      cell:
        default: jp-canary-1
        description: cell の識別名（ADR-013。値は仮置き）
security:
