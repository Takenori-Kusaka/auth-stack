                    issued_at: '2026-10-15T10:11:30Z'
                    attestation_ref: hoa_9k2m4vx7qd3ta6pnr2bw
                  consent:
                    disclosure_version: dv_2026_10
                    accepted_at: '2026-10-15T10:12:00Z'
      responses:
