  /v1/tenants/{tenant_id}/external-grants/{grant_id}/revoke:
    post:
      operationId: revokeExternalGrant
      tags: [grants]
      summary: 外部付与を 1 件取り消す（剥奪書込を先に確定する）
      description: |
        剥奪書込を確定し、剥奪フェンスを進めてから 200 を返す（XGS-9、§6）。冪等。既に終端の付与は 409 state_conflict（呼ぶ側は成功として扱う。XGC-11）。
        越境を狭める変更なので事前承認を要しない（ADR-024 D24-19）。Txn-Token（利用者の要求起点）か、内部開始の Txn-Token（ジョブ起点）でテナント結合を示す。
      x-freeze-class: preview
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/GrantId'
        - $ref: '#/components/parameters/TxnTokenRequired'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeRequest'
            examples:
              byGranter:
                value:
                  reason_class: granter_revoked
                  authorizing_permission: invite_guest
      responses:
        '200':
          description: 取り消した（剥奪を確定した）
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalGrantWriteResult'
              examples:
