paths:
  /v1/tenants/{tenant_id}/external-grants:
    post:
      operationId: createExternalGrant
      tags: [grants]
      summary: 外部付与を招待として発行する（付与者の代わりに依存サービスが呼ぶ）
      description: |
        付与記録と起点の tuple を原子的に作り、承認が要らなければ招待を送る（§2 XGF-3〜XGF-5、§5 XGS-1〜XGS-7）。
        応答の 201 は招待を作ったことを示すだけで、アクセスは受諾（state=active）まで生じない（XGC-5）。
      x-freeze-class: preview
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/TxnTokenRequired'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExternalGrantRequest'
            examples:
              bookingGuest:
                summary: 会議室予約に他テナントの利用者をゲストとして招く
                value:
                  anchor:
                    resource: { type: rsv/booking, id: b3k7q2mx9vd4ta6pnr2hw7cyz5 }
                    relation: guest
                  authorizing_permission: invite_guest
                  invitee:
                    channel: email
                    address: guest@partner.example
                  expires_at: '2026-10-31T09:00:00Z'
                  invitation_expires_at: '2026-10-22T09:00:00Z'
                  landing_uri: https://rooms.example.invalid/t/t5wq2hzr7nmc4ka3vd6pxe2bfy/bookings/b3k7q2mx9vd4ta6pnr2hw7cyz5
      responses:
        '201':
          description: 付与記録と起点の tuple を作った。state は invited か pending_approval
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalGrantWriteResult'
              examples:
                invited:
                  value:
                    grant:
                      grant_id: g7k2m4vx9qd3ta6pnr2bw7cyh5
                      tenant_id: t5wq2hzr7nmc4ka3vd6pxe2bfy
                      state: invited
                      anchor:
                        resource: { type: rsv/booking, id: b3k7q2mx9vd4ta6pnr2hw7cyz5 }
                        relation: guest
                      granter: { sub: u8m3kq7vx2hd4ta6pnr9bw5cyz }
                      created_at: '2026-10-15T09:00:00Z'
                      expires_at: '2026-10-31T09:00:00Z'
                      invitation_expires_at: '2026-10-22T09:00:00Z'
                      jurisdictions: { resource: jp }
                      policy_versions: { resource_inbound: pv_inb_0007 }
                    consistency_token: ct1.AQ.ZmFjYWRlLXdyaXRlLTAwMDE.k3J9xQ
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
    get:
      operationId: listExternalGrants
      tags: [grants]
      summary: 外部付与を起点の資源・状態で一覧する（棚卸し・ゲスト一覧の表示用）
      description: |
        呼出し元の名前空間の起点に付いた付与だけを返す（XGS-2）。利用者に見せる前に自サービスの PEP で判定する（XGC-13）。
