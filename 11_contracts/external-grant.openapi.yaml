                      grantee: { sub: u2c5wq8kx3hd7ta4pnr6bv9myz, home_tenant_id: h3np6kq2wz7ta4vd5mxe2bcy7r, display_name: Partner Guest }
                      created_at: '2026-10-15T09:00:00Z'
                      accepted_at: '2026-10-15T10:12:00Z'
                      expires_at: '2026-10-31T09:00:00Z'
                      invitation_expires_at: '2026-10-22T09:00:00Z'
                      jurisdictions: { resource: jp, home: jp }
                      policy_versions: { resource_inbound: pv_inb_0007, home_outbound: pv_outb_0003 }
                    consistency_token: ct1.AQ.ZmFjYWRlLWFjY2VwdC0wMDAx.m4Kp7d
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    workloadMtls:
      type: mutualTLS
      description: workload ID（ADR-009）の X.509 SVID による mTLS。全 operation で必須 [D]
  parameters:
    TenantId:
      name: tenant_id
      in: path
      required: true
      description: 資源側テナントの不透明 ID。値は Txn-Token の `tctx.tid` と同一の文字列（変換しない）。形は CON-02 `TenantIdSegment` と同じ
      schema:
        $ref: '#/components/schemas/ObjectId'
    GrantId:
      name: grant_id
      in: path
      required: true
      description: 付与 ID（`core/external_grant` の object ID と同じ値）
      schema:
        $ref: '#/components/schemas/ObjectId'
    TxnTokenRequired:
      name: Txn-Token
      in: header
      required: true
      description: 起点要求の Txn-Token を無改変で渡す（XGS-1）。照合は CON-04 の `TxnToken` と同じ。全文をログに残さない
      schema:
        $ref: '#/components/schemas/Jws'
    TxnTokenOptional:
      name: Txn-Token
      in: header
      required: false
      description: 起点要求の Txn-Token。読取りでは Txn-Token か Subject-Access-Token のどちらかが要る（XGS-1）
      schema:
        $ref: '#/components/schemas/Jws'
    SubjectAccessToken:
      name: Subject-Access-Token
      in: header
      required: false
      description: 呼出し元が検証済みの、起点要求の内部 access token（CON-04 の `SubjectAccessToken` と同じ扱い）
      schema:
        $ref: '#/components/schemas/Jws'
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: 呼出し側が採番する要求 ID。応答で同じ値を返す
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 再送の識別。同じ鍵の再送には最初の応答を返す。同じ鍵で内容が違えば 409 idempotency_conflict。保持期間は TBD
      schema:
        type: string
        minLength: 16
        maxLength: 64
        pattern: '^[A-Za-z0-9_-]+$'
  headers:
    XRequestId:
      description: 要求の X-Request-ID をそのまま返す
      schema:
        type: string
    RetryAfter:
      description: 再試行までの秒数
      schema:
        type: integer
        minimum: 0
  responses:
    BadRequest:
      description: 要求の形式の誤り
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            expiryRequired:
              value:
                type: https://problems.authz-registry.example.invalid/expiry-required
                title: 外部付与には期限が必要
                status: 400
                code: expiry_required
    Unauthenticated:
      description: 認証の失敗、または Txn-Token の欠落
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            txnTokenRequired:
              value:
                type: https://problems.authz-registry.example.invalid/txn-token-required
                title: Txn-Token が必要
                status: 401
                code: txn_token_required
    Forbidden:
      description: テナント結合・名前空間・付与者・ポリシーの検査に外れた
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            relationNotExternalGrantable:
              value:
                type: https://problems.authz-registry.example.invalid/relation-not-external-grantable
                title: 起点の relation は外部付与可でない
                status: 403
                code: relation_not_external_grantable
            homeOutboundUnverifiable:
              value:
                type: https://problems.authz-registry.example.invalid/home-outbound-unverifiable
                title: home 側の outbound の許可を確かめられない
                status: 403
                code: home_outbound_unverifiable
    NotFound:
      description: 対象がない、または呼出し元の範囲外（区別しない）。受諾では受諾 token が無効
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invitationInvalid:
              value:
                type: https://problems.authz-registry.example.invalid/invitation-invalid
                title: 招待が無効
                status: 404
                code: invitation_invalid
    Conflict:
      description: 状態の不整合、または Idempotency-Key の衝突
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            stateConflict:
              value:
                type: https://problems.authz-registry.example.invalid/state-conflict
                title: 付与は既に終端の状態
                status: 409
                code: state_conflict
    TooManyRequests:
      description: 発行数の上限・レート制限
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            rateLimited:
              value:
                type: https://problems.authz-registry.example.invalid/rate-limited
                title: 招待の発行数の上限に達した
                status: 429
                code: rate_limited
    Unavailable:
      description: 判定・書込みができない。作成は作られていない。取消しは再試行する
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unavailable:
              value:
                type: https://problems.authz-registry.example.invalid/unavailable
                title: 一時的に処理できない
                status: 503
                code: unavailable
  schemas:
    Jws:
      description: JWS compact serialization。最大長は CON-04 と同じ暫定値
      type: string
      minLength: 1
      maxLength: 6144
      pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
    ObjectId:
      description: 不透明 ID（CON-04 `ObjectId` と同じ形）
      type: string
      pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$'
    PrincipalSub:
      description: 主体の sub（CON-02 `PrincipalId`。全類型共通の単一名前空間の不透明 ID）
      type: string
      minLength: 1
      maxLength: 255
    TypeName:
      description: CAM の型名 `<名前空間コード>/<型名>`（CON-04 `TypeName` と同じ形）
      type: string
      pattern: '^[a-z][a-z0-9_]{1,61}[a-z0-9]/[a-z][a-z0-9_]{1,62}[a-z0-9]$'
    RelationName:
      type: string
      pattern: '^[a-z][a-z0-9_]{1,62}[a-z0-9]$'
    PermissionName:
      description: CAM の permission 名（動詞）
      type: string
      pattern: '^[a-z][a-z0-9_]{1,62}[a-z0-9]$'
    Timestamp:
      type: string
      format: date-time
    JurisdictionPartition:
      description: 法域パーティション（ADR-013。値は仮置きの短い符号。例 jp、eu、us）
      type: string
      pattern: '^[a-z]{2,8}$'
    PolicyVersion:
      description: 適用したポリシーの版（不透明値）
      type: string
      pattern: '^[A-Za-z0-9_-]{1,64}$'
    ConsistencyToken:
      description: façade が発行する整合性トークン（CON-04 `ConsistencyToken` と同じ）。業務の記録と同じトランザクションで保存する（XGC-6）
      type: string
      minLength: 1
      maxLength: 1024
    ResourceRef:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          $ref: '#/components/schemas/TypeName'
        id:
          $ref: '#/components/schemas/ObjectId'
    Anchor:
      description: 起点の資源と relation。façade が `<type>:<id>#<relation>@core/external_grant:<grant_id>#grantee` の tuple を書く（XGS-6）
      type: object
      additionalProperties: false
      required: [resource, relation]
      properties:
        resource:
          $ref: '#/components/schemas/ResourceRef'
        relation:
          $ref: '#/components/schemas/RelationName'
    GrantState:
      description: 付与の状態（§3）。開いた列挙として扱い、未知の値は「有効でない」とする（XGC-9）
      type: string
      enum: [pending_approval, invited, held, active, suspended, revoked, expired, declined, invitation_expired, rejected]
    ReasonClass:
      description: 終端・凍結の理由の区分（§6）。開いた列挙として扱う
      type: string
      enum: [granter_revoked, admin_revoked, anchor_deleted, expired, policy_narrowed, home_policy_narrowed, home_principal_removed, home_tenant_suspended, compromise_response, approval_rejected, acceptance_policy_failed, declined, invitation_expired]
    Invitee:
      description: 招待の宛先。配送にだけ使い、識別子・認可に使わない（INV-2、XGC-4）。応答には返さない
      type: object
      additionalProperties: false
      required: [channel, address]
      properties:
        channel:
          type: string
          enum: [email]
        address:
          type: string
          format: email
          maxLength: 254
    CreateExternalGrantRequest:
      type: object
      additionalProperties: false
      required: [anchor, authorizing_permission, invitee, expires_at, invitation_expires_at, landing_uri]
      properties:
        anchor:
          $ref: '#/components/schemas/Anchor'
        authorizing_permission:
          allOf:
            - $ref: '#/components/schemas/PermissionName'
          description: 付与者が起点の資源について持つべき「外部付与の作成」の permission（例 invite_guest、share_external）。façade が再評価する（XGS-3、§11 XG-L3）
        invitee:
          $ref: '#/components/schemas/Invitee'
        expires_at:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: 付与の期限（必須。D24-18）。上限は K24-2（TBD）
        invitation_expires_at:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: 招待の期限。expires_at 以下
        landing_uri:
          type: string
          format: uri
          maxLength: 2048
          description: 受諾後に資源側 AS がゲストを戻す先。呼出し元の client に登録された origin（CON-14）に限る。秘密・email を含めない
        reshare_of:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
          description: 付与者が外部主体の場合の元の付与 ID（XGS-5）
    RevokeRequest:
      type: object
      additionalProperties: false
      required: [reason_class]
      properties:
        reason_class:
          type: string
          enum: [granter_revoked, admin_revoked, anchor_deleted]
        authorizing_permission:
          allOf:
            - $ref: '#/components/schemas/PermissionName'
          description: 利用者の操作による取消しで、依存サービスの PEP が判定した permission（監査用）。ジョブ起点では省く
    RevokeByAnchorRequest:
      type: object
      additionalProperties: false
      required: [anchor_resource, reason_class]
      properties:
        anchor_resource:
          $ref: '#/components/schemas/ResourceRef'
        reason_class:
          type: string
          enum: [anchor_deleted, granter_revoked, admin_revoked]
    RevokeByAnchorResult:
      type: object
      additionalProperties: false
      required: [revoked_count, revoked_grant_ids, remaining, consistency_token]
      properties:
        revoked_count:
          type: integer
          minimum: 0
        revoked_grant_ids:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/ObjectId'
        remaining:
          type: boolean
          description: true なら上限で打ち切った。同じ要求を繰り返す
        consistency_token:
          $ref: '#/components/schemas/ConsistencyToken'
    Grantee:
      description: 受諾した主体。受諾前の状態では返さない。email は持たない（XGS-11）
      type: object
      additionalProperties: false
      required: [sub, home_tenant_id]
      properties:
        sub:
          $ref: '#/components/schemas/PrincipalSub'
        home_tenant_id:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
          description: home テナント ID（PC-09(b) は外部共同作業者 realm の ID）
        display_name:
          type: string
          maxLength: 256
          description: home 側のポリシーが許す場合だけ（D24-23）
    ExternalGrant:
      type: object
      additionalProperties: false
      required: [grant_id, tenant_id, state, anchor, granter, created_at, expires_at, invitation_expires_at, jurisdictions, policy_versions]
      properties:
        grant_id:
          $ref: '#/components/schemas/ObjectId'
        tenant_id:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
          description: 資源側テナント
        state:
          $ref: '#/components/schemas/GrantState'
        anchor:
          $ref: '#/components/schemas/Anchor'
        granter:
          type: object
          additionalProperties: false
          required: [sub]
          properties:
            sub:
              $ref: '#/components/schemas/PrincipalSub'
        approver:
          type: object
          additionalProperties: false
          required: [sub]
          properties:
            sub:
              $ref: '#/components/schemas/PrincipalSub'
        grantee:
          $ref: '#/components/schemas/Grantee'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        accepted_at:
          $ref: '#/components/schemas/Timestamp'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        invitation_expires_at:
          $ref: '#/components/schemas/Timestamp'
        ended:
          type: object
          additionalProperties: false
          required: [at, reason_class]
          description: 終端・凍結の時刻と理由
          properties:
            at:
              $ref: '#/components/schemas/Timestamp'
            reason_class:
              $ref: '#/components/schemas/ReasonClass'
        reshare_of:
          $ref: '#/components/schemas/ObjectId'
        jurisdictions:
          type: object
          additionalProperties: false
          required: [resource]
          description: 双方の法域パーティション（D24-23）。home は受諾後に入る
          properties:
            resource:
              $ref: '#/components/schemas/JurisdictionPartition'
            home:
              $ref: '#/components/schemas/JurisdictionPartition'
        policy_versions:
          type: object
          additionalProperties: false
          required: [resource_inbound]
          description: 作成・受諾時に適用した双方のポリシーの版（D24-01 の 3）
          properties:
            resource_inbound:
              $ref: '#/components/schemas/PolicyVersion'
            home_outbound:
              $ref: '#/components/schemas/PolicyVersion'
    ExternalGrantWriteResult:
      type: object
      additionalProperties: false
      required: [grant, consistency_token]
      properties:
        grant:
          $ref: '#/components/schemas/ExternalGrant'
        consistency_token:
          $ref: '#/components/schemas/ConsistencyToken'
    ExternalGrantList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ExternalGrant'
        next_page_token:
          type: string
          maxLength: 1024
    ExternalGrantChange:
      type: object
      additionalProperties: false
      required: [sequence, grant_id, anchor_resource, to_state, occurred_at]
      properties:
        sequence:
          type: string
          pattern: '^[0-9]{20}$'
          description: テナント内で単調増加する順序番号
        grant_id:
          $ref: '#/components/schemas/ObjectId'
        anchor_resource:
          $ref: '#/components/schemas/ResourceRef'
        from_state:
          $ref: '#/components/schemas/GrantState'
        to_state:
          $ref: '#/components/schemas/GrantState'
        reason_class:
          $ref: '#/components/schemas/ReasonClass'
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
    ExternalGrantChangeList:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/ExternalGrantChange'
        next_cursor:
          type: string
          maxLength: 1024
    AcceptInvitationRequest:
      type: object
      additionalProperties: false
      required: [invitation_token, decision]
      description: decision=accept では grantee・home_outbound・consent が必須（XGS-8）。decision=decline では invitation_token だけでよい
      properties:
        invitation_token:
          type: string
          minLength: 22
          maxLength: 256
          pattern: '^[A-Za-z0-9_-]+$'
          description: 受諾 token（128 bit 以上の乱数の base64url。XGS-7）。ログに残さない
        decision:
          type: string
          enum: [accept, decline]
        grantee:
          type: object
          additionalProperties: false
          required: [sub, principal_type, home_tenant_id, home_jurisdiction, auth_time, acr, verified_contact_matches_invitee]
          properties:
            sub:
              $ref: '#/components/schemas/PrincipalSub'
            principal_type:
              type: string
              description: CON-02 の主体種別。human 以外は 403 principal_type_not_allowed（D24-02）
              enum: [human, workload, service_account, ai_agent, client]
            home_tenant_id:
              $ref: '#/components/schemas/ObjectId'
            home_jurisdiction:
              $ref: '#/components/schemas/JurisdictionPartition'
            auth_time:
              $ref: '#/components/schemas/Timestamp'
            acr:
              type: string
              maxLength: 256
            verified_contact_matches_invitee:
              type: boolean
              description: 資源側 AS が、受諾者の確認済み連絡先と招待の宛先を比べた結果。false なら held（I-05）。結合の根拠には使わない
            display_name:
              type: string
              maxLength: 256
              description: home 側のポリシーが許す場合だけ
        home_outbound:
          type: object
          additionalProperties: false
          required: [allowed, policy_version, issued_at, attestation_ref]
          description: home 側 outbound の証跡（§11 XG-L1）。資源側 AS が home 側の署名を検証済みのもの
          properties:
            allowed:
              type: boolean
            policy_version:
              $ref: '#/components/schemas/PolicyVersion'
            issued_at:
              $ref: '#/components/schemas/Timestamp'
            attestation_ref:
              type: string
              pattern: '^[A-Za-z0-9_-]{1,128}$'
        consent:
          type: object
          additionalProperties: false
          required: [disclosure_version, accepted_at]
          description: ゲスト本人の同意（XGF-7）。表示した開示文の版と時刻
          properties:
            disclosure_version:
              type: string
              pattern: '^[A-Za-z0-9_-]{1,64}$'
            accepted_at:
              $ref: '#/components/schemas/Timestamp'
    ProblemCode:
      description: 本契約の閉じた列挙（§8）。追加は minor、意味の変更は major（ADR-016）
      type: string
      enum:
        - invalid_request
        - expiry_required
        - txn_token_required
        - unauthenticated
        - tenant_binding_violation
        - caller_not_declared
        - granter_not_allowed
        - relation_not_external_grantable
        - inbound_disabled
        - expiry_exceeds_max
        - reshare_not_allowed
        - principal_type_not_allowed
        - home_outbound_unverifiable
        - home_outbound_denied
        - home_tenant_not_trusted
        - jurisdiction_not_allowed
        - not_found
        - invitation_invalid
        - state_conflict
        - idempotency_conflict
        - rate_limited
        - unavailable
    Problem:
      description: RFC 9457 Problem Details。`code` と `request_id` は本契約の拡張メンバ（CON-04 と同じ形）
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          $ref: '#/components/schemas/ProblemCode'
        request_id:
          type: string
      additionalProperties: true
