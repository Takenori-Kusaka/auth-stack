  /v1/tenants/{tenant_id}/hierarchy/move:
    post:
      operationId: moveHierarchyNode
      summary: unit または葉ノードの親を付け替える（循環・深さ・型の検査付き）
      tags: [hierarchy]
      x-stability: preview
