                    rollout_id: rol_g2hj3k4mnpqrstvwxyz2345abc
                    model_revision: mr_000043
                    stage: canary_cell
                    cell_ids: [jp-canary-1]
                    state: baking
                    started_at: "2026-10-16T04:00:00Z"
                    bake_until: "2026-10-17T04:00:00Z"
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/tenants/{tenant_id}/model-pin:
    get:
      operationId: getTenantModelPin
      summary: テナントの現行固定 revision と指示子の版を返す
      tags: [model-rollout]
      x-stability: preview
      x-requirements:
        R: [R-147]
        G: [G-112]
      description: |
        DL-72 の要求に `model.pin` がない場合、façade はこの現行固定 revision で評価し、最新 revision にはしない（ADR-011 D6-1、ADR-016 D16-30）[D]。
        OpenFGA は、モデル ID を渡さなければ最後に作られたモデルが使われるとし、本番でモデル ID を渡すことを強く推奨している [V][^3]（RS-07#18）。
        SpiceDB は schema を版で管理しないため、テナント別の固定は façade と registry で補う。方式は未決（authorization-model.md §16 K05-5）[D]。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 現行固定
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            ETag:
              description: 指示子の版（`pointer_version`）を表す強い ETag
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelPin'
              examples:
                pin:
                  $ref: '#/components/examples/ModelPinExample'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateTenantModelPin
      summary: テナントの現行固定 revision を進める（段 6）
      tags: [model-rollout]
      x-stability: preview
      x-requirements:
        R: [R-147, R-149]
        G: [G-112]
      security:
        - workloadMtls: []
          operatorAccessToken: []
      description: |
        ADR-016 D16-31 の段 6 である。テナントの属する cell に対象 revision の展開（段 5）が完了していることを前提にする [D]。
        - `If-Match` に現行の ETag を必須とする条件付き更新である。指示子の版（`pointer_version`）は単調に増える（ADR-016 D16-03・D16-34）[D]。
        - 現行より古い sequence の revision へ進める指定は本 operation では受け付けない。既知良好版への復帰は `rollbackModelPins` を使う [D]（T-027）。
        - 旧 revision の滞留上限（NA-016-5）を超えたテナントは、基盤が段 6 を代行し得る（ADR-016）[D]。
      x-negative-examples:
        - name: If-Match なし
          request: If-Match ヘッダを付けない
          expected: 428 `precondition_required`
        - name: 古い ETag
          request: 他の操作で指示子が進んだ後の ETag
          expected: 412 `pin_pointer_conflict`
        - name: 未展開 cell
          request: テナントの cell に展開されていない revision を指定
          expected: 409 `stage_gate_not_met`
        - name: 後退
          request: 現行より古い revision を指定
          expected: 409 `use_rollback_operation`
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/RequestId'
        - name: If-Match
          in: header
          required: true
          description: '`getTenantModelPin` の ETag'
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelPinUpdateRequest'
            examples:
              advance:
                value:
                  model_revision: mr_000043
                  approvals:
                    - {approval_id: apr-20261020-0001, approver_role: tenant_admin}
                    - {approval_id: apr-20261020-0002, approver_role: platform_operator}
      responses:
        '200':
          description: 更新した
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            ETag:
              description: 新しい指示子の版
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelPin'
              examples:
                advanced:
                  value:
                    tenant_id: t6xk2wq4mz7rb3nd5vh2pc7jfa
                    model_revision: mr_000043
                    pointer_version: 18
                    known_good_revision: mr_000042
                    ring: standard
                    cell_id: jp-std-1
                    updated_at: "2026-10-20T00:00:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /v1/model-pins/rollback:
    post:
      operationId: rollbackModelPins
      summary: 範囲内のテナントの固定を既知良好 revision へ戻す
      tags: [model-rollout]
      x-stability: preview
      x-requirements:
        R: [R-147, R-149, R-194]
        G: [G-112]
      security:
        - workloadMtls: []
          operatorAccessToken: []
      description: |
        既知良好版への復帰である（ADR-016 D16-34）[D]。
        - 旧い指示子を戻すのではなく、既知良好 revision を指す新しい指示子の版で上書きする。版番号は単調に増える（ADR-016 D16-03、T-027）[D]。
        - 二者承認を必須とする（DL-46、ADR-016 D16-03）[D]。
        - 通常の配布 pipeline を最大速度で使い、別系統の緊急手段を作らない（ADR-013 D13-34、ADR-027 D27-30）[D]。1 回の要求が触れる cell は 1 つに限る（ADR-013 D13-38）[D]。
        - 緊急 freeze 中も受け付ける（ADR-016 D16-36）[D]。
        - モデルを戻しても剥奪済みの関係は復活しない。剥奪は tuple の状態であり model の版と切り離している（ADR-010 D-20、ADR-016 D16-35）[D]。
        - 要求から全対象への反映完了までの時間を R-194.3（rollback 時間）として記録する（ADR-016 D16-34）[D]。
      x-negative-examples:
        - name: 既知良好でない revision
          request: target_revision に known_good=false の revision
          expected: 409 `not_known_good`
        - name: 複数 cell
          request: scope.cell_id を省略して全 cell を対象
          expected: 400 `scope_violation`
        - name: 承認 1 名
          request: approvals が 1 件
          expected: 403 `approval_required`
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RollbackRequest'
            examples:
              rollbackCell:
                value:
                  scope:
                    cell_id: jp-std-1
                  target_revision: mr_000042
                  reason: canary で deny 急増（R4 相当）を検知
                  approvals:
                    - {approval_id: apr-20261016-0101, approver_role: sre_lead}
                    - {approval_id: apr-20261016-0102, approver_role: platform_reviewer}
      responses:
        '202':
          description: 復帰を開始した
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RollbackStatus'
              examples:
                started:
                  value:
                    rollback_id: rbk_h3jk4m5npqrstvwxyz2345abcd
                    target_revision: mr_000042
                    scope: {cell_id: jp-std-1}
                    state: in_progress
                    requested_at: "2026-10-16T05:00:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/freeze-status:
    get:
      operationId: getFreezeStatus
      summary: 緊急 freeze の状態を返す（照会のみ）
      tags: [model-rollout]
      x-stability: preview
      x-requirements:
        R: [R-149]
        G: [G-112]
      description: |
        freeze の発動と解除は停止権限の経路（DL-46、GOV-06）で行い、本契約では照会だけを提供する [D]。
        freeze 中に止めないもの（剥奪・失効の配布、既知良好版への復帰、承認済みの緊急修正）と止めるもの（新 revision の展開）は ADR-016 D16-36 に従う [D]。
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: cell_id
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/CellId'
      responses:
        '200':
          description: freeze の状態
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FreezeStatus'
              examples:
                none:
                  value:
                    frozen: false
                    cells: []
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /v1/namespaces:
    get:
      operationId: listNamespaces
      summary: 名前空間コードと所有ドメイン・状態の一覧を返す
      tags: [namespaces]
      x-stability: preview
      x-requirements:
        R: [R-109, R-208]
        G: [G-116]
      description: |
        名前空間台帳の正本は DL-71 の付表である（ADR-021 D21-25）。本 operation は台帳の内容を照会する口であり、台帳に記録された払出しを反映する [D]。
        コードは組織名・チーム名・製品名を含まない事業能力のカタログ ID とし、再利用しない（ADR-021 D21-25）[D]。廃止は deprecated の印で表し、削除した名前は墓石化する（ADR-021 D21-27）[D]。
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/NamespaceStatus'
      responses:
        '200':
          description: 名前空間の一覧
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
