  /v1/model-validations:
    post:
      operationId: validateModel
      summary: CAM の変更案を登録せずに検証する
      tags: [models]
      x-stability: preview
      x-requirements:
        R: [R-148, R-208, R-109]
        G: [G-107, G-112, G-116]
      description: |
        ADR-016 D16-31 の段 2（CI 検査）を登録前に試す dry-run である [D]。ドメインチームの CI から呼ぶことを想定する。
        検査の項目は `ValidationReport.checks` の列挙のとおりとし、次を含む [D]。
        - JSON Schema による CAM の構造検証、CAM 式 v0 の構文検査（§9、`lint_expression_syntax`）、予約 relation（`ancestor` など。X-13）の定義・書込宣言の拒否（`lint_reserved_relation`）、ドメイン拡張規則 X-1〜X-13 の lint（authorization-model.md §3.3）
        - 外部付与可でない permission に `core/external_grant#grantee` が到達しないことの静的解析（同 §3.2）
        - 肯定・否定テスト、テナント越えの否定テスト（ADR-011 D2-5、ADR-010 D-42）。入力は `ModelChangeRequest.tests`。試験のない relation・permission が 1 件でもあれば不合格（`test_summary.uncovered_relations`）[D]
        - 破壊的変更の拒否。データがある relation の削除・改名を拒否する（X-10、ADR-021 D21-27）。SpiceDB もデータがある relation の削除を拒否し、移行に多段手順を示す [V][^9]（RS-17#88）
        - 権限が広がる差分の検出（追加承認の要否を返す）、2 エンジンの判定差分、OpenFGA DSL→CAM→SpiceDB schema の往復試験（ADR-011 D2-3）
        - 深度・fanout の宣言値の検査（authorization-model.md §3.4）
        全件を記号的に解析できる保証はないため、shadow（段 3）で補う（authorization-model.md §12.1）[D]。
        応答の `change_class` は §9.4 の規則で判定した変更区分（M0〜M3）で、登録前に承認経路（GOV-05 §6.4）を知るために使う [D]。
      x-negative-examples:
        - name: 演算子の混在
          request: expression に `viewer | editor & member`（括弧なし）
          expected: 200、report.result=fail、check `lint_expression_syntax` が fail（E-2）
        - name: tupleset に permission を使う
          request: expression に `read->view`（`read` は permission）
          expected: 200、report.result=fail、check `lint_expression_syntax` が fail（E-3）
        - name: ancestor の定義
          request: ドメインのモジュールが `ancestor` relation を書込宣言に含める
          expected: 200、report.result=fail、check `lint_reserved_relation` が fail（X-13）
        - name: 試験のない permission
          request: 新しい permission に check がない
          expected: 200、report.result=fail、check `positive_negative_tests` が fail、uncovered_relations に当該 permission
        - name: 意味の変更の申告
          request: semantic_change.declared=true
          expected: 200、change_class=M2
        - name: core 型への管理権限の追加
          request: ドメインのモジュールが `core/tenant` に relation を追加
          expected: 200、report.result=fail、check `lint_extension_scope` が fail（X-3）
        - name: ドメイン独自の exclusion
          request: permission 式に but not を自前の relation で書く
          expected: 200、report.result=fail、check `lint_no_domain_deny` が fail（X-5）
        - name: データがある relation の削除
          request: base で使用中の relation を削除
          expected: 200、report.result=fail、check `breaking_change` が fail
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelChangeRequest'
            examples:
              addFolderViewer:
                $ref: '#/components/examples/ModelChangeExample'
      responses:
        '200':
          description: 検証結果（不合格も 200 で返す）
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationReport'
              examples:
                pass:
                  $ref: '#/components/examples/ValidationPassExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/models:
    post:
      operationId: registerModel
      summary: CAM の新しい不変 revision を登録する
      tags: [models]
      x-stability: preview
      x-requirements:
        R: [R-147, R-148, R-109, R-208]
        G: [G-112, G-116]
      description: |
        ADR-016 D16-31 の段 1（登録）と段 2（CI 検査）である。本番には適用しない [D]。
        - 登録されると registry が不変の `model_revision` と単調増加の `sequence` を採番する（ADR-011 D2-7、ADR-016 D16-03・D16-30）[D]。
          OpenFGA も認可モデルを不変とし、書込みのたびに新しい版を作る [V][^3]（RS-07#18）。
        - 検証に 1 件でも不合格のある変更は登録しない（authorization-model.md §12.1「無効なモデルの拒否」、CL-0104）[D]。
        - `base_revision` は直近の登録済み revision と一致しなければならない（条件付き登録。一致しなければ 409 `base_revision_conflict`）[D]。
        - v1.1（I-14、P-21）`base_revision` の値の決め方 [D]:
          - 「直近の登録済み revision」は、registry 全体（全名前空間で 1 本の系列）で `sequence` が最大の revision で、`state` を問わない。名前空間ごとの系列はない。
            このため、名前空間の最初のモジュールを登録する場合（新規サービスの初回登録）も、`base_revision` は「自分の名前空間の前の版」ではなく registry 全体の直近の revision である。
          - 取得方法: `listModels`（`state` を指定しない）の応答の `revisions[0].model_revision`。`listModels` は `sequence` の降順で返す。
            CI は登録の直前に取得し、同じ値で `validateModel` と `registerModel` を呼ぶ。409 のときは応答の `latest_revision`（拡張メンバ。ヒントであり、無い場合は `listModels` で取り直す）を使い、`validateModel` からやり直す。自動の再試行は 1 回までとし、2 回続けて 409 なら人の判断に回すことを推奨する。
          - registry の初期化時に基盤チームが `core` モジュールだけの revision（`sequence`=1、`base_revision` なし）を登録する。依存サービスが登録を始める時点で revision は必ず 1 件以上あり、`base_revision` を省略・空にする初回登録の形はない。
          - revision ID の値は不透明で、`mr_000001` のような連番を仮定して組み立ててはならない（`ModelRevisionId`）。
          - モック（Prism）は `base_revision` を照合しないので、409 の経路は CON-11 の状態付きスタブで試す。自前スタブでは初期 revision を 1 件持ち、その ID を `listModels` で返す（模擬連携では `mr_TRIALBASE` を固定値で書いていた。P-21）。
          - withdrawn・shadow_failed の revision も系列に残り、次の登録はその内容を引き継ぐ。取り消すには、取り消す内容の変更を新しい revision として登録する（取り消し専用の操作の要否は §8 の未決）。
        - 権限が広がる差分を含む変更は、`approvals` に追加承認を含めないと登録しない（ADR-016 D16-31 段 2）[D]。
        - `change_class`（§9.4）に応じた承認記録を `approvals` に求める。M0 はドメイン内 peer review、M1 は加えてプラットフォームチームのセキュリティレビュアー、M2 は移行手順の確認、M3 は 2 名以上の合意と CISO 同意（GOV-05 §6.4）。不足は 403 `approval_required` [D]。
        - モジュール単位で所有ドメインを確かめる。他ドメインの名前空間のモジュールは変更できない（X-1、X-4）。`core` は基盤チームだけが変更できる（authorization-model.md §3.1）[D]。
          OpenFGA の modular models は、チームが増えるとモデルの所有境界が不明確になる課題に対し、モジュール分割と code owners による所有の表現を提供している [V][^10]（RS-17#85）。
        - 中央の審査は互換性・安全性の確認に限る（G-116）。審査状態は `review_status` に出す。審査待ち時間は K-31 で監視する [D]。
      x-negative-examples:
        - name: base_revision の競合
          request: 他チームの登録後に古い base_revision で登録
          expected: 409 `base_revision_conflict`（`latest_revision` に直近の revision）
        - name: base_revision の省略（v1.1（I-14、P-21））
          request: 名前空間の初回登録だからとして base_revision を省略する
          expected: 400 `invalid_request`（`base_revision` は必須。初回登録でも registry 全体の直近の revision を入れる）
        - name: 自分の名前空間の前の版を base にする（v1.1（I-14、P-21））
          request: 自分の名前空間の最後の revision（registry 全体では直近でない）を base_revision にする
          expected: 409 `base_revision_conflict`
        - name: 存在しない revision（v1.1（I-14、P-21））
          request: base_revision に採番されていない値（例 mr_TRIALBASE）を入れる
          expected: 409 `base_revision_conflict`（pattern には合うため 400 ではない）
        - name: 他ドメインのモジュール変更
          request: namespace `hrm` の所有チームが `dms` のモジュールを含めて登録
          expected: 403 `namespace_not_owned`
        - name: 検証不合格
          request: X-6 違反（型ワイルドカードの直接型）を含む
          expected: 422 `model_validation_failed`（ValidationReport を同梱）
        - name: 権限拡大の無承認
          request: 権限拡大差分があり approvals が空
          expected: 403 `approval_required`
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelChangeRequest'
            examples:
              addFolderViewer:
                $ref: '#/components/examples/ModelChangeExample'
      responses:
        '201':
          description: 登録した
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelRevision'
              examples:
                registered:
                  $ref: '#/components/examples/ModelRevisionExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 状態の競合。`base_revision` が直近の登録済み revision と一致しない（`base_revision_conflict`）など
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                baseRevisionConflict:
                  $ref: '#/components/examples/BaseRevisionConflictExample'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    get:
      operationId: listModels
      summary: 登録済み revision の一覧を新しい順に返す
      tags: [models]
      x-stability: preview
      x-requirements:
        R: [R-147, R-109]
        G: [G-112]
      description: |
        revision は削除しない。判定記録が参照する revision は、その判定記録の保持期間が終わるまで残す（ADR-016 D16-04）[D]。
        v1.1（I-14、P-21）: `sequence` の降順で返す。`state` を指定しない応答の `revisions[0].model_revision` が、`registerModel`・`validateModel` の `base_revision` に入れる値（registry 全体の直近の revision）である。
        registry の初期化で登録される `core` だけの revision（`sequence`=1）があるため、空の一覧は返らない [D]。
      parameters:
