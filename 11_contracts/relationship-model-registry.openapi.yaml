    ## 9. CAM 式 v0（permission 式の文法。preview）
    `CamPermission.expression` の文法を次に定める。ARC-05 §8.1・INT-03 §1.2 の擬似表記と同じ記号を使い、CAM・設計文書・例で表記を 1 つにする [D]。

    ### 9.1 EBNF（ISO/IEC 14977 の記法）
    ```
    expression   = operand
                 | operand , { ws , "|" , ws , operand }-        (* 和 *)
                 | operand , { ws , "&" , ws , operand }-        (* 積 *)
                 | operand , ws , "-" , ws , operand ;           (* exclusion。core モジュールに限る *)
    operand      = name | arrow | "(" , ws , expression , ws , ")" ;
    arrow        = tupleset , "->" , name ;
    tupleset     = name ;                                         (* 同じ型の relation（permission は不可） *)
    name         = letter , { letter | digit | "_" } ;            (* 長さと末尾は RelationName の pattern *)
    letter       = "a" | ... | "z" ;  digit = "0" | ... | "9" ;
    ws           = { " " } ;
    ```

    ### 9.2 意味と制約
    | # | 規則 | 理由・根拠 |
    |---|---|---|
    | E-1 | `name` は同じ型の relation か permission を指す。`tupleset->name` は、`tupleset` の tuple が指す object の `name` を指す（tuple-to-userset）[D] | Zanzibar の userset rewrite（union・intersection・exclusion・tuple-to-userset）で表せる範囲に限る（ADR-011 D2-1、RS-07#12）[D] |
    | E-2 | 異なる演算子を括弧なしで同じ段に並べない（`a \| b & c` は構文誤り。`(a \| b) & c` と書く）。exclusion は 2 項に限る [D] | SpiceDB は歴史的理由で `+`（和）を `&`・`-` より優先し、`a + b & c` を `(a + b) & c` と評価する [V][^18]。優先順位をエンジンに依存させないため、CAM は優先順位を定義せず括弧を必須にする [D] |
    | E-3 | `tupleset` は直接型だけを持つ relation に限り、permission と userset（`#relation` 付きの直接型）を持つ relation を指せない [D] | OpenFGA は `from` の後の relation（tupleset）が他の relation を参照することを許さない [V][^17]。両エンジンの共通部分に収める（ADR-011 D2-2）[D] |
    | E-4 | `tupleset` に使える relation は `parent`（X-7・X-11）、`ancestor`（X-13。階層サービスの生成物で参照だけ可）、他ドメインの公開 relation を指す relation（X-4）、core 型の relation に限る。再帰（同じ型への `parent->`）は `parent` だけ [D] | authorization-model.md §3.3 X-7・X-11・X-13 [D] |
    | E-5 | arrow の右辺は permission を推奨し、他ドメイン・core の型では公開 permission だけを指せる（INT-03 INT03-K4 の決裁で必須化を判断）[D] | SpiceDB は arrow の右辺に relation でなく permission を置くことを推奨している [V][^18]。X-4 [D] |
    | E-6 | `-`（exclusion）は `core` モジュールだけが使える。ドメインのモジュールでは `lint_no_domain_deny` が不合格にする [D] | ADR-011 D3-4、X-5 [D] |
    | E-7 | 式に条件・ワイルドカード・リテラルを書かない。条件は `CamRelation.conditions`（カタログ ID）で relation に付ける [D] | X-6、authorization-model.md §3.5 [D] |
    | E-8 | 括弧の入れ子は 4 段以下、`expression` は 2,048 文字以下（JSON Schema の maxLength）[D] | 生成器と人のレビューの負荷を抑える初期案。根拠となる実測はなく、TC-ARC05-10 で見直す [D] |

    ### 9.3 写像
    | CAM 式 v0 | OpenFGA DSL [V][^17] | SpiceDB schema [V][^18] |
    |---|---|---|
    | `a \| b` | `a or b` | `a + b` |
    | `a & b` | `a and b` | `a & b` |
    | `a - b` | `a but not b` | `a - b` |
    | `x->r` | `r from x` | `x->r` |
    | `(…)` | `(…)` | `(…)` |
    - 生成器はこの表のとおりに写す。人が DSL を直接編集した結果は本番に配布しない（ADR-011 D2-3）[D]。OpenFGA DSL→CAM の逆変換も同じ表を逆に引く（D2-3 の往復試験）[D]。
    - 構文の検査は `validateModel` の check `lint_expression_syntax` が行う。JSON Schema の `pattern` は使える文字種だけを縛る [D]。

    ### 9.4 変更区分（M0〜M3）の判定
    `ValidationReport.change_class` は GOV-05 §6.4 の区分表を次の規則で機械判定した値である。複数に当たれば番号の大きい方を返す [D]。
    | 区分 | 判定規則 |
    |---|---|
    | M3 | `core` モジュールの変更、または自動ゲート規則・条件カタログの変更 |
    | M2 | check `breaking_change` の検出、公開 relation の取りやめ、他ドメイン型の拡張、`semantic_change.declared=true` |
    | M1 | check `permission_expansion_diff` の検出、または `tier` が `privileged/T`・`privileged/P`・`break-glass/B`・`break-glass/P` の permission（REQ-03。高リスク階層の範囲は DL-09 の確定に従う。v1.1（I-7）で表記を CON-02 `OperationTier` に統一）の追加・式の変更、`marks` への `external_grantable` の追加 |
    | M0 | 上のいずれにも当たらない追加的変更 |
    - 意味の変更（スキーマ差分で検出できない変更）は検査で見つけられないため、申告（`semantic_change`）を必須欄にし、申告があれば M2 に回す（ADR-016 D16-08）[D]。申告の真偽は審査と shadow で確かめる [D]。

    ## 10. 階層サービス API（preview。K05-6・K05-8 の決裁待ち）
    - 置き場所: 本契約に置く [D]。理由は、(1) `parent`・`ancestor` は relation tuple であり、整合性トークン（§4）と書込宣言（X-8）を本契約と共有する、(2) 祖先閉包の書換えは剥奪先行と差分照合（authorization-model.md §11 K-1・K-4）に従い、tuple の書込みと同じ façade の順序規則に乗る、(3) 別契約にすると DL 番号の追加と契約間の整合性トークンの受渡しが要る、の 3 点である [D]。
    - 範囲: unit の作成（`createUnit`）、葉ノードの木への接続（`attachToHierarchy`）、移動（`moveHierarchyNode`）、unit の照会（`getUnit`）、祖先閉包の読取り（`readAncestors`）[D]。unit の廃止、テナント統合・分割の接ぎ木（ADR-021 D21-29・D21-30）は v0.2.0 では定義しない（未決）[D]。
    - 検査: 移動・接続の要求ごとに、(1) 移動先が自分の部分木に含まれない（循環）、(2) 移動後の深さが上限以内（unit の深さ上限 5 は NA-ARC05-1 の初期案）、(3) 移動先の型が `parent` の直接型の宣言に合う、を親の付け替えと同じ DB トランザクションで検査し、満たさなければ拒否する（authorization-model.md §3.6.3）[D]。
    - 祖先閉包: 旧祖先の `ancestor` tuple の削除は要求の中で同期に確定させ、新祖先の追加は outbox で後から反映する。中間状態は deny 側に倒れる（authorization-model.md §3.6.4）[D]。
    - 書込権限: `ancestor`（全型）と、直接型に `core/unit`・`core/tenant` を持つ `parent` は、階層サービスの workload だけを書込宣言に持ち、他の workload の `writeRelationships` は既存の `relation_not_writable` で拒否する（X-8・X-13）[D]。GA の operation の形は変えない [D]。
    - 認可: 移動は移動元と移動先の両方の `manage` を要する（authorization-model.md §3.6.6）。要求は操作者の access token（`operatorAccessToken`）を伴い、階層サービスが DL-72 で `manage` を判定してから適用する [D]。
    - テナント結合: `operatorAccessToken` の `tid` は path の `tenant_id` と一致しなければならず、不一致は `manage` の判定に進まず 403 `tenant_binding_violation` とする（§6.1）。`getUnit`・`readAncestors` も §6.1 の (a) または (b) で同じ照合を行う [D]。

