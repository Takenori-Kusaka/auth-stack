  /v1/models/{model_revision}/rollouts:
    post:
      operationId: startRollout
      summary: revision を cell 単位の段階（canary cell → wave）で展開する
      tags: [model-rollout]
      x-stability: preview
      x-requirements:
        R: [R-149, R-194]
