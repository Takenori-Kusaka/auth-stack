    ## 12. レビュー記録
    > 模擬パネルは AI エージェントによる自己レビューであり、実在の CTO/CISO の決裁ではない（CONVENTIONS §8）[D]。ラウンド1 の記録は INT-03 §16.1 にある。

    ### ラウンド2（2026-10-15、模擬パネル redteam 役）
    | 重大度 | 指摘 | 対応 | 箇所 |
    |---|---|---|---|
    | High | tuple 操作は path の `tenant_id` を必須にするが、呼出し元は workload の mTLS と資源型単位の書込宣言（X-8）だけで認可され、起点要求の token のテナントと path を結ぶ規則がない。侵害された依存サービス（ATK-06）や誤実装のサービスが、自分の名前空間について同じ cell の任意テナントの tuple を (a) 一括削除（全テナント横断の剥奪によるサービス拒否）、(b) 協力者・ゲストへの付与の書込み（`tenant_boundary_violation` は主体と path の不一致しか見ない）、(c) `readRelationships` による関係 graph の読取り（T-034）ができる。hierarchy の `operatorAccessToken` も `tid` と path の一致を要件にしていない。CON-03 §10 M-4 の申し送りが未反映。relationships は GA 候補で、rc 固定後の必須化は破壊的変更になる | (1) §6.1 に G 段規則 `tenant_binding` を追加（`Txn-Token` の `tctx.tid` または検証済み内部 access token の `tid` と path の照合、不一致は 403 `tenant_binding_violation`）。(2) §6.2 にテナント横断の実行者（別宣言、二者承認、対象テナント集合の明示、1 cell、件数上限、dry-run。ADR-027 D27-10）を追加。(3) §6.3 で書込宣言・読取宣言・横断宣言を SPIFFE ID の全体で照合（WIMSE mutual-tls §5 の MUST NOT [^21]）。(4) §10 と hierarchy の各 operation に `operatorAccessToken` の `tid` 照合を明記し、`moveHierarchyNode` に負例を追加。(5) 負例 3 件（write・delete・read。別テナントの token で path だけ被害テナント）と、実行記録の対象外テナントの負例 1 件を追加。(6) §6.4 で照合規則・3 ヘッダの欄・エラーコードを GA 候補として rc 固定の範囲に入れ、必須化は宣言属性 `tenant_evidence` で切り替える形にした（CON-03 §4.3・§9 と同じ方式）。(7) ADR-011・threat-catalog T-033／T-034 ほかへの申し送りを §11 HO-R2-1〜HO-R2-9 に記載。新たな事実の根拠は RS-06 の検証済み原典（Transaction Tokens 草案 [^20]、WIMSE mutual-tls 草案 [^21]）と RFC 9457 [^11] | info.version、§2、§6〜§6.4、§8、§10、§11、§12、tuple 3 operation と hierarchy 5 operation の parameters・description・x-negative-examples・403 応答、components（parameters `TxnToken`・`SubjectAccessToken`・`CrossTenantExecutionId`、securitySchemes `operatorAccessToken`、`Forbidden` の例、`ProblemCode`）、x-references [^20]・[^21]、x-depends-on |
