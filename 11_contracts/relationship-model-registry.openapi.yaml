        authorization-model.md §3.6.3・§3.6.4・§3.6.6 の手順を 1 要求で行う [D]。
        - `expected_parent` が現在の親と一致しなければ 409 `parent_mismatch`（楽観的並行制御）[D]。
        - 移動先が自分の部分木に含まれれば 422 `hierarchy_cycle`、移動後の深さが上限を超えれば 422 `hierarchy_depth_exceeded`、型が合わなければ 422 `parent_type_not_allowed` [D]。
