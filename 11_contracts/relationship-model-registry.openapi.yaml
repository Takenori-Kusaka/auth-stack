        - shadow と復帰の試験には、剥奪済みの関係が deny のままであることを含める（ADR-016 D16-35）[D]。
        - 新旧モデルの shadow check の考え方は OpenFGA の文書にも記述がある [V][^3]（RS-07#18）。shadow を必須の段にするのは本基盤の設計判断である（DS-16）[D]。
