  /v1/relationship-exports:
    post:
      operationId: createRelationshipExport
      summary: tuple と CAM を正規形式（EIF）で全件 export するジョブを作る
      tags: [bulk]
      x-stability: preview
      x-requirements:
        R: [R-091, R-090, R-208]
        G: [G-070, G-066]
      security:
        - workloadMtls: []
          operatorAccessToken: []
      description: |
        cell 全体またはテナント単位の全件 export である（ADR-010 D-26 M-3、D-47）[D]。
        - 出力は ADR-018 D18-4 の EIF（JSON Lines＋署名付き manifest。manifest は schema 版、件数、順序に依存しない digest、model_revision、整合性 snapshot、変更の watermark、テナント範囲を持つ）[D]。
        - 型名・関係名は CAM の名前空間で表し、エンジン内部 ID を含めない（ADR-018 D18-4 の tuple 行、ADR-011 D10-1 C-2）[D]。
        - 単一のスナップショットで書き出す。SpiceDB の ExportBulkRelationships は途中から再開でき Consistency を指定できる [V][^8]（RS-07#36）。
          OpenFGA の `fga store export` は既定で tuple を 100 件までしか書き出さない [V][^7]（RS-07#24）ため、façade は CLI を経路に使わず、全件取得の経路を PoC で確かめる（ADR-010 D-47）[D]。
        - export は保護操作とする。受領者の公開鍵で暗号化し、平文を中間ストレージに置かない。出力・転送・受領・削除を全件監査する（ADR-018 D18-12、ADR-018 D18-13、T-077、T-079）[D]。
        - 法域をまたぐ送り先は DL-34 の判定を前提にする（ADR-018 D18-12(d)、A-062）[D]。
      x-negative-examples:
        - name: 暗号化鍵なし
          request: recipient_public_key を省略
          expected: 400 `invalid_request`（平文 export は提供しない）
        - name: 所在地群外への送付先
          request: EU 所在地テナントの export を destination_region=us で要求し、DL-34 の判定記録がない
          expected: 403 `export_not_permitted`
        - name: 承認不足
          request: approvals が 1 件
          expected: 403 `approval_required`
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportJobRequest'
            examples:
              tenantExit:
                value:
                  scope:
                    cell_id: jp-std-1
                    tenant_ids: [t6xk2wq4mz7rb3nd5vh2pc7jfa]
                  include_model: true
                  purpose: tenant_exit
                  destination_region: jp
                  recipient_public_key:
                    kty: EC
                    crv: P-256
                    x: f83OJ3D2xF1Bg8vub9tLe1gHMzV76e8Tus9uPHvRVEU
                    y: x_FEzRu9m36HLN_tue659LNpXW6pCyStikYjKIWI5a0
                    use: enc
