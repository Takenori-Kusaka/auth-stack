        - 旧親の削除と新親の追加は 1 回の書込にまとめる（I-6）。旧祖先の `ancestor` 削除は応答前に確定し、新祖先の追加は outbox で反映する（`ancestor_additions`）。中間状態は deny 側に倒れる [D]。
        - 直接付与は保持し、継承分は再評価する（authorization-model.md §3.6.6）。外部付与のある部分木への出入りは write＋XT の操作として扱う（ADR-024 D24-13）[D]。
