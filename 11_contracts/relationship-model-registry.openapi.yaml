        ADR-016 D16-31 の段 4（canary cell）と段 5（wave）である [D]。
        - 前の段の合否が出るまで次の段へ進めない。canary cell の前提は shadow の合格である [D]。
        - wave の順序は canary cell → 日本の標準 cell 1 つ → 所在地群ごとに 1 cell → 残り。規制スコープ cell と専用 cell は最後とする（ADR-013 §2.6、ADR-016 D16-31）[D]。
        - 1 回の展開が触れる cell 集合を明示し、全域へ一斉に配る指定は受け付けない（ADR-010 D-23・D-42、ADR-013 D13-38）[D]。
        - 緊急 freeze 中は新 revision の展開を 409 `frozen` で拒否する（ADR-016 D16-36）[D]。
        - bake 期間の値は操作階層ごとに BIA と PoC で決める（ADR-016 D16-33。TBD）[D]。
