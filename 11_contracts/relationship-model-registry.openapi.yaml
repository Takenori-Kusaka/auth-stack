  /v1/tenants/{tenant_id}/relationships/read:
    post:
      operationId: readRelationships
      summary: filter に合う tuple を指定した整合性で読む
      tags: [relationships]
      x-stability: ga
      x-requirements:
        R: [R-145, R-142]
        G: [G-066, G-120]
      description: |
        filter と整合性指定を body で受けるため POST とする（token が最大 1,024 バイトになり得るため）[D]。読取りに副作用はない [D]。
        - `consistency.mode` を省略した場合は `fully_consistent` とする（本契約の既定。DL-17 で操作階層別の既定が決まった場合はそれに従う）[D]。
        - `at_least_as_fresh` は `consistency.token` を必須とする。検証できない token は `fully_consistent` に格上げする（info §4）[D]。
        - 応答の `consistency.mode` は実際に評価したモード（実効モード）を示す。要求より弱いモードにはならない（ADR-011 D6-3）[D]。項目名は DL-72 の応答 `consistency.mode` と揃える [D]。
        - 関係の存在自体が機微になり得る（T-034）。呼出し元が読める resource type は書込宣言と同じ単位でレジストリに宣言し、宣言外は 403 とする [D]。
        - `resource.type` の指定を必須とし、テナント内の全 tuple を一度に列挙する filter は受け付けない（T-034 の大量読取の抑止）[D]。
        - ページは cursor（`page_token`）で辿る。cursor は主体・テナント・filter に束縛した不透明値とする（ADR-025 D25-15 と同じ扱い）[D]。ページ間の原子的スナップショットは保証しない。
          スナップショットが要る場合は bulk export を使う [D]。
      x-negative-examples:
        - name: resource.type なし
          request: filter に subject だけを指定
          expected: 400 `invalid_request`
        - name: token なしの at_least_as_fresh
          request: consistency.mode=at_least_as_fresh、token 省略
          expected: 400 `invalid_request`
        - name: 他テナントの cursor
          request: 別テナントの要求で得た page_token を提示
          expected: 400 `invalid_page_token`
        - name: 解釈できない token
          request: エンジン差替え後に旧形式の token を提示
          expected: 200（consistency.mode=fully_consistent。エラーにしない）
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadRelationshipsRequest'
            examples:
              viewersOfFolder:
                value:
                  filter:
                    resource_type: dms/folder
                    resource_id: r4nwx3yz7ab2c6dkh5mp9qtsve
                    relation: viewer
                  consistency:
                    mode: at_least_as_fresh
                    token: ct1.AQ.ZmFjYWRlLXdyaXRlLTAwMDE.k3J9xQ
                  page_size: 100
      responses:
        '200':
          description: 該当 tuple のページ
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadRelationshipsResponse'
              examples:
                page:
                  value:
                    tuples:
                      - resource: {type: dms/folder, id: r4nwx3yz7ab2c6dkh5mp9qtsve}
                        relation: viewer
                        subject: {type: core/group, id: a2bc3d4e5f6g7hjk2mnpqrstvw, relation: member}
                        condition:
                          name: c.not_expired
                          context: {expires_at: "2026-12-31T00:00:00Z"}
                    consistency:
                      mode: at_least_as_fresh
                      token: ct1.AQ.ZmFjYWRlLXJlYWQtMDAwMw.Zx81aa
                    next_page_token: pt1.eyJjIjoiMTAwIn0.9fQx
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
