  description: |
    文書ID: CON-04 / 版: 0.4.1 / 状態: draft / 最終更新: 2026-10-15
    改版: v0.4.1（v1.1 の同期。AI エージェントによる同期で、独立レビューは未実施）で、他文書の v1.1 改訂が本書に宛てた申し送りのうち決裁を要する 2 件（INT-03 §16.4 HO-V11-1 の所属の読取り、CON-16 IE-4 の core 型の公開宣言）を §8 に未決として加えた。operation・スキーマ・例は変えていない [D]。
    改版: v0.4.0（v1.1 改訂。13_integration-trial/report.md の P-09・P-21 への対応。I-7 と I-14 の base_revision 部分）で、(1) tid と操作階層の表記を CON-02 に一本化して参照に替え（`TenantId` を CON-02 `TenantIdSegment` へ、`CamPermission.tier` を CON-02 `OperationTier` へ、shadow の `sampling` のキーと `ShadowStratum.tier` を CON-02 `OperationTierClass` へ。値の表記は `read_sensitive`→`read-sensitive`、`privileged`→`privileged/T`・`privileged/P`、`break_glass`→`break-glass/B`・`break-glass/P`）、(2) `base_revision` の初回値と取得方法（`registerModel`・`listModels`・`ModelChangeRequest`・`ModelRevision`）、409 `base_revision_conflict` の応答例と `latest_revision` 拡張メンバを定めた。変更はモデル管理（preview）の要素と、GA の path 変数 `tenant_id` の参照先の付け替え（受理する値の集合は v0.3.1 と同じ）に限る [D]。改訂は AI エージェント（Claude）が行い、独立レビュー・人による照合は未実施（CONVENTIONS §8）。他文書への申し送りは §11 の「他文書への申し送り（v1.1）」。
    改版: v0.3.1（PoC/R7反映）で、§3 のテナント境界の判定を userset の主体（role・group の object 側）にも明示し、`writeRelationships` に負例 1 件を加えた（POC-02 §6.2 X-D。§11 の HO-P-1〜HO-P-3）。POC-02 の値は立会人なしの自己実行で、Gate 4 の証拠ではない。
    改版: v0.3.0（模擬パネル ラウンド2 の High 指摘 1 件（redteam: tuple 操作・階層操作のテナント結合の欠落）への対応）で、§6.1〜§6.4（G 段規則 `tenant_binding`、
    テナント横断の実行者、宣言の SPIFFE ID 全体照合、必須化の切替え）、`Txn-Token`・`Subject-Access-Token`・`Cross-Tenant-Execution-Id` ヘッダの欄の予約、
    `ProblemCode` の `tenant_binding_violation`（追加は minor）、負例 5 件を加えた。模擬パネルは AI による自己レビューで、実在の CTO/CISO の決裁ではない（CONVENTIONS §8）[D]。
    改版: v0.2.0（模擬パネル ラウンド1 の指摘 1 件への対応。模擬パネルは AI による自己レビューで、実在の CTO/CISO の決裁ではない（CONVENTIONS §8））で、
    CAM 式の文法（§9）、`ModelChangeRequest.tests`・`semantic_change`、`ValidationReport.change_class`、条件カタログの列挙（`ConditionCatalog.$defs`）、
    階層サービス API（§10、tag `hierarchy`、preview）を加えた。追加はすべて preview の範囲で、GA の要素（tuple の書込み・削除・読取り）の形は変えていない [D]。
    対応成果物: DL-73（traceability/deliverables.md）。R・G の一覧は `info.x-requirements`、脅威は `info.x-threats`、
    原典は `info.x-references`（本文の `[^n]` に対応）に置く。

    ## 1. 位置付け
    - AuthZEN Authorization API 1.0（OIDF Final、standards-status SS-C13、確認日 2026-10-03）は PDP の状態管理を範囲外としている [N][^1]（RS-07#61）。
      このため relation tuple の書込み・削除・読取り、変更購読、正規モデル（CAM）の版管理は、基盤所有の本契約に別に定める（ADR-011 D7-1）[D]。
    - 本契約に準拠標準はない（ADR-022 D-2 の DL-73 行「標準なし（D-1-1(b)）」）[D]。標準の項目名を流用していないため、標準の意味を変える箇所はない [D]。
      主体・資源の `type`/`id` の組は AuthZEN の Subject/Resource と同じ値の体系（ADR-021 D21-26）で揃える [D]。
    - 依存サービスは本契約と DL-72 だけを呼ぶ。エンジン（OpenFGA・SpiceDB など）の書込 API・SDK・ヘッダを直接使うことは CI で拒否する（ADR-011 D7-3・D10-1 C-1、G-072）[D]。
    - 本契約の応答には、エンジン固有の識別子（OpenFGA の store_id・モデル ID の ULID など）を一切含めない（ADR-010 D-12、ADR-011 D2-7・D10-1 C-2）[D]。
    - 記述言語は OpenAPI 3.1.0 と JSON Schema 2020-12（OAS 3.1 base dialect を `jsonSchemaDialect` で明示）とする。ADR-022 D-2 の記述形式行は OpenAPI 3.1.2 を挙げている。
      `openapi` 欄の値は、契約群の検証ツールの互換のため 3.1.0 で揃え、3.1.2 との差の扱いは DL-69 で確認する（未決（ADR-022））[D]。

    ## 2. 安定度区分（ADR-022 D-2・D-2-1）
    各 operation の `x-stability` に記す [D]。
    | 区分 | 対象 |
    |---|---|
    | ga | tuple の書込み・削除・読取り、テナント指定の必須化、テナント結合（§6.1 `tenant_binding`。照合規則・ヘッダの欄・`tenant_binding_violation` は GA 候補として rc 固定。裏付けの必須化は §6.4 の宣言属性で切り替える）、不透明な consistency token、エラー形式 |
    | preview | 変更購読、bulk import/export、モデル管理（検証・登録・pin・shadow・段階展開・rollback）、名前空間の申請と審査状態 |
    preview の期限は ADR-022 D-1-2 の TBD（所有者 CTO、期限 DEC-8 前）に従う [D]。GA の契約から preview の要素へ必須依存を作らない（ADR-022 D-1-1）[D]。
    G-120 の「変わり得る箇所」は、モデル DSL、consistency token の内部形式、search のページングの挙動の 3 点に限る（ADR-022 D-2-1）[D]。

    ## 3. テナントと識別子
    - tuple 操作は path の `tenant_id` でテナントを必須指定する（ADR-022 D-2 の GA 範囲）[D]。資源 ID にテナント ID を埋め込まない（ADR-010 D-12、ADR-021 D21-14、X-9）[D]。
      tuple がどのテナントに属するかは façade が付ける区画キーで表し、区画キーは契約に出さない（ADR-010 D-12）[D]。
    - 主体と資源が異なるテナントに属する tuple は、`core/external_grant`（越境共有、ADR-024）を façade が書く場合を除き拒否する（ADR-010 D-28、X-8）[D]。
    - 主体が userset（例 `core/role:<id>#assignee`、`core/group:<id>#member`）の場合は、userset の object（role・group）の所属テナントで上の判定を行う。object 側（資源）の所属だけを見て subject 側を見ない実装は、この規則に反する（PoC/R7反映）[D]。POC-02 §6.2 X-D では、PoC の façade の関係書込 API が他テナントの role の userset を自テナントの folder の viewer として受理した（TC-021。立会人なしの自己実行で Gate 4 の証拠ではなく、原因区分は PoC 実装か設計かが未確定）[D]。見直しトリガー: 立会い下の再実行で X-D が再現し、原因が本契約の規則の欠落と分類された場合は、本節を GA 候補の照合規則（§6.4）に移す [D]。
    - tuple と条件 context に個人データ・業務上の識別名を置かない（ADR-028 D28-55、X-9。前提 NA-028-3）[D]。

    ## 4. 整合性
    - 書込み・削除の応答は `consistency_token` を返す。依存サービスは内容と同じ DB トランザクションでこれを保存し、後続の判定（DL-72 の `consistency.token`）に渡す（ADR-011 D7-2、
      authorization-model.md §9.2 CT-1〜CT-4）[D]。これは Zanzibar の zookie 方式 [V][^2]（RS-07#5）と、SpiceDB が示す ZedToken の保存方式 [V][^6]（RS-07#27）をエンジンから独立させた形である [D]。
    - OpenFGA は zookie 相当の機能を「将来のリリースで検討中」としており、内容の版と結び付く整合性トークンを公式機能として提供していない [V][^12]（RS-07#14）。
      このため token は façade が発行する自社形式（版‖エンジン識別‖エンジン固有値または書込時刻‖MAC）とする（ADR-010 D-14）[D]。
    - token は不透明文字列で、利用側は解釈しない（ADR-011 D10-1 C-3）。契約上の最大長は 1,024 バイトの初期案で、DL-72 凍結前に候補エンジンの実測で確定する（ADR-010 D-14、ADR-011 D6-4。NA-010-2、前提台帳へ追加要）[D]。
    - 検証できない token（版不明、エンジン識別の不一致、MAC 不一致）はエラーにせず `fully_consistent` に格上げして扱う（ADR-010 D-15、ADR-011 D6-3・D10-1 C-10）[D]。要求より弱いモードで黙って評価しない（ADR-011 D6-3）[D]。
    - 剥奪（tuple の削除）の書込み応答の token は、テナント剥奪フェンス（ADR-010 D-18。PoC 合格を有効化の条件とする採用候補）を前進させ得る。フェンスは façade 内部の値で、本契約には出さない [D]。
    - 内容 DB と relationship store の間の分散トランザクションは提供しない。因果順序は剥奪先行・付与の非同期可・content-change check・差分照合（authorization-model.md §11.1 K-1〜K-4）で保つ。
      規約の採否は未決（authorization-model.md §16 K05-1。決める人 CTO、期限 G3）[D]。

    ## 5. 上限
    - 1 回の書込み要求（`writes`＋`deletes`）の tuple 数は 100 以下とする [D]。OpenFGA の `maxTuplesPerWrite` 既定 100 [V][^4]（RS-07#19）と、SpiceDB の WriteRelationships の既定 1,000 [V][^5]（RS-07#35）のうち小さい方である（authorization-model.md §3.4）[D]。
      超える変更は bulk import（原子性なし、狭める変更を先に並べる順序規則。authorization-model.md §11.3）で行う [D]。
    - 条件 context は要求時 4,096 バイト以下とする（ADR-010 D-31）。SpiceDB の caveat context 既定上限 4,096 バイト [V][^5]（RS-07#32）に揃えた値である [D]。バイト長は JSON Schema で表せないため façade が検査する [D]。

    ## 6. 認証と承認
    - 全 operation で workload ID の mTLS（ADR-009）を必須とする（`workloadMtls`）[D]。
    - 人の判断を伴う操作（モデルの rollout・pin 更新・rollback、import の apply、export、名前空間の申請）は、加えて人の access token（RFC 9068 系、DL-75。`operatorAccessToken`）と、
      二者承認の記録（`approvals`。申請者≠承認者、DL-46・REQ-03 §6.5 の privileged/P）を要求する [D]。
    - 書込める relation はサービスごとに CAM の書込宣言（X-8）で決め、宣言外の書込みは façade が拒否する（T-033）[D]。
    - mTLS と書込宣言（X-8）は「どの workload が、どの relation を書けるか」を決めるだけで、「どのテナントについて書けるか」を決めない。v0.2.0 までは、
      侵害された依存サービス（ATK-06）や誤実装のサービスが、自分の宣言の範囲で同じ cell の任意テナントの tuple を書込み・削除・読取りできた（ラウンド2 指摘）。
      `tenant_boundary_violation`（§3）は tuple の主体と資源の所属の不一致を見るだけで、path の `tenant_id` が起点要求のテナントであることは確かめない [D]。
      これを §6.1〜§6.4 で塞ぐ [D]。

    ### 6.1 G 段規則 `tenant_binding`（テナント結合。GA 候補）
    - 対象: `writeRelationships`・`deleteRelationships`・`readRelationships` と、hierarchy の全 operation（`createUnit`・`getUnit`・`attachToHierarchy`・`moveHierarchyNode`・`readAncestors`）[D]。
    - façade は、起点要求のテナントを次のいずれかの検証済み token から取り、path の `tenant_id` と一致することを確かめる。不一致は engine に渡さず 403 `tenant_binding_violation` とし、何も書かず何も返さない [D]。
      - (a) `Txn-Token` ヘッダの `tctx.tid`。下流呼出しに受信した Txn-Token を無改変で含めることと、HTTP で `Txn-Token` ヘッダを使うことは草案の MUST である [N][^20]（RS-06#35）。
        façade は署名・`aud`（trust domain）・有効期限を検証する（受信者の検証義務は草案の MUST）[N][^20]（RS-06#35）。`tctx` は草案で RECOMMENDED の claim で [N][^20]（RS-06#31）、テナントの項目は草案に定義がないため、`tctx.tid` は社内 profile `txn-v1` の項目である（ARC-15、CON-03 §4.3 と同じ扱い）[D]。
        Txn-Token は write 以上の経路で運ばれる（ARC-06 §2・§3.1、CON-03 §4.3）ので、tuple の書込み・削除では (a) を基本とする [D]。
      - (b) 検証済み内部 access token（`typ=at+jwt`）の `tid`。tuple 操作と hierarchy の読取りでは `Subject-Access-Token` ヘッダ（名前は暫定。未決（ADR-011））で、hierarchy の書込み系では `operatorAccessToken`（Authorization ヘッダ）で受ける。
        façade は署名・`exp` を検証し、`aud` が呼出し元 workload に当たることを確かめる（CON-03 §4.3 (b) と同じ規則）[D]。Txn-Token のない read 系（`readRelationships`・`getUnit`・`readAncestors`）で使う [D]。
      - (a) と (b) の両方があれば、両方の `tid` が path の `tenant_id` と一致しなければならない [D]。
    - hierarchy の operation の `operatorAccessToken` は、§10 の `manage` 判定の主体であると同時に、その `tid` が path の `tenant_id` と一致しなければならない。一致しない token で他テナントの木を操作する要求は、`manage` の判定に進む前に 403 `tenant_binding_violation` とする [D]。
    - 越境共有（ADR-024）の tuple は資源側テナントの path で書き、起点要求のテナントも資源側テナントである（ゲストには資源側テナントの token を発行する。ADR-024 D24-01・D24-07、CON-03 §5）。このため本規則に越境共有の例外は置かない [D]。
    - Txn-Token は workload の認証資格情報として使ってはならない（草案 §13.12 の MUST NOT）[N][^20]（RS-06#36）。façade は呼出し元の認証に mTLS だけを使い、(a)・(b) はテナントの裏付けにだけ使う [D]。
      Txn-Token の全体をログに残してはならない（草案 §15.2 の MUST NOT）[N][^20]（RS-06#41）。façade は (a)・(b) とも token の全文を監査イベント（DL-77）・ログに残さず、`txn`、内部 access token の (`iss`, `jti`)、照合結果、裏付けの有無（`tenant_evidence=present|absent`）だけを残す [D]。
    - 残余リスク: (1) 正規に多数テナントの要求を処理するサービスが侵害されると、処理中の要求の token が有効な間は、当該テナントについて宣言の範囲で操作され得る。Txn-Token は replay 耐性がなく、寿命を短くする MUST がある [N][^20]（RS-06#36）ので、窓は token の寿命に限られる [D]。
      (2) 必須化（§6.4）までの `tenant_evidence=absent` の要求。いずれも、呼出し元ごとの一定時間内の操作テナント数と `absent` の比率を検知規則の候補とし、kri.md の所有者に申し送る（§11 HO-R2-6）[D]。

    ### 6.2 テナント横断の実行者（利用者の要求を起点としない書込み・読取り）
    - 移行工具（初期投入・複製・逆複製・突合。ADR-027 D27-10）、外部 ACL の反映、テナントの統合・分割（ADR-021 D21-29・D21-30）、テナント削除（ADR-028）のように、起点となる利用者の要求がない操作は §6.1 の (a)・(b) を持たない。
      これらを通常の書込宣言（X-8）で扱わず、「テナント横断の実行者」としてレジストリに別に登録する [D]。
    - 登録と実行の要件 [D]:
      - 宣言: 呼出し元の SPIFFE ID（§6.3）、書ける・読める resource type と relation、目的の区分（移行・ACL 反映・統合分割・削除）、有効期限。登録は二者承認（申請者≠承認者、DL-46・REQ-03 §6.5 の privileged/P）を要する。
      - 実行記録: 1 回の実行ごとに、対象テナントの集合（明示列挙。ワイルドカードや「全テナント」の指定は受け付けない）、対象 cell（1 実行で 1 cell。ADR-027 D27-10・ADR-013 D13-38）、件数の上限、dry-run の結果 ID、二者承認の記録を登録する。初期投入と大量の再同期は二者承認で実行し、件数の上限と dry-run の結果を承認に添える、とする ADR-027 D27-10 に合わせた。
      - 要求: tuple 操作に `Cross-Tenant-Execution-Id` ヘッダで実行記録を示す。façade は、呼出し元がその実行記録の宣言者であること、記録が有効期限内であること、path の `tenant_id` が対象テナントの集合に含まれること、累計件数が上限以内であることを確かめ、外れれば 403 `tenant_binding_violation` とする。
    - 大量の投入・削除は、既に対象テナント（`scope.tenant_ids`）・dry-run・二者承認を持つ bulk import（`createRelationshipImport`）を優先する。本節の経路は継続的な同期（逆複製、ACL 反映）のための増分書込みに限る [D]。
    - 実行記録を登録する operation は v0.3.0 では定義しない（未決。§8）。定義までの間、`Cross-Tenant-Execution-Id` を付けた要求はすべて拒否し、テナント横断の実行者は bulk import だけを使う [D]。

    ### 6.3 宣言の照合鍵（SPIFFE ID の全体）
    - 書込宣言（X-8）、§6.2 の宣言、`readRelationships` の読取宣言（T-034）は、mTLS で認証した呼出し元の SPIFFE ID の全体（trust domain を含む）を鍵に引く。path 部分だけでは照合しない [D]。
      認可ポリシーが trust domain と検証に使った trust anchor を考慮せずに識別子の path 部分だけを評価してはならない（WIMSE mutual-tls 草案 §5 の MUST NOT）[N][^21]（RS-06#25）。CON-03 §4.2（判定宣言 `caller_scope`）と同じ形である [D]。
    - 宣言のない呼出し元は、どの tuple も書けず読めない（既定拒否。ADR-011 D3-1）[D]。

    ### 6.4 必須化の切替え（rc 固定の範囲）
    - DEC-8 第1段で rc 固定するのは、§6.1 の照合規則、3 つのヘッダの欄（`Txn-Token`・`Subject-Access-Token`・`Cross-Tenant-Execution-Id`）、`tenant_binding_violation` の 3 点である。これらを GA 候補（`x-stability: ga-candidate`）に予約し、固定後に追加しない [D]。
      client は認識できない拡張メンバを無視しなければならない（MUST）[N][^11]（RS-16#12）ので、制約を強める変更を後から足しても既存の client は気付かない。照合を固定後に契約の変更として必須化すると制約を強める破壊的変更になるため、契約の形を先に固定し、必須化は宣言の属性で行う [D]。
    - 裏付けの要否は、書込宣言・読取宣言の属性 `tenant_evidence: required | optional` で呼出し元ごとに切り替える。契約の形（operation・ヘッダ・エラー）は変えないので major 改版を要しない（CON-03 §4.3・§9 と同じ方式）[D]。
      - 裏付けがあって不一致なら、属性によらず 403 `tenant_binding_violation` とする [D]。
      - `required` で裏付けがなければ 403 `tenant_binding_violation`（detail で「裏付けなし」を示す）とする [D]。
      - `optional` で裏付けがなければ従来どおり処理し、監査イベントに `tenant_evidence=absent` を記録する [D]。
      - 新規登録の宣言の既定は `required` とする。`optional` は所有者と期限を付けた例外として登録し、期限の上限は GA 前とする初期案である [D]。全体の必須化の時期は未決（ADR-011。§8）[D]。
    - SDK は受信した `Txn-Token` ヘッダを無改変で下流へ渡す（ARC-15 DEV-5）ので、書込み系の `required` への切替えに依存サービスのコード改修は原則として要らない [D]。read 系の `Subject-Access-Token` の付与は SDK の版上げで行う（ARC-15 DEV-5 の「内部 access token を素通ししない」との関係は §11 HO-R2-7 で申し送る）[D]。

    ## 7. エラー形式
    エラーは RFC 9457 の Problem Details（`application/problem+json`）で返す（ADR-022 D-2 の GA 範囲、standards-status SS-A47）[D]。
    client は認識できない拡張メンバを無視しなければならない（MUST）[N][^11]（RS-16#12）。このため、制約を強める変更を拡張メンバの追加で表さない（ADR-016、ADR-011 D6-2）[D]。
    `code` 拡張メンバは本契約の閉じた列挙（`ProblemCode`）とし、追加は minor、意味の変更は major とする [D]。

