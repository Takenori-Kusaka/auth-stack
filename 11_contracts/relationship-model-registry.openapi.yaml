  /v1/namespace-requests:
    post:
      operationId: createNamespaceRequest
      summary: 名前空間の払出し・所有移管・廃止を申請する
      tags: [namespaces]
      x-stability: preview
      x-requirements:
        R: [R-109]
        G: [G-116, G-144]
      security:
        - workloadMtls: []
          operatorAccessToken: []
      description: |
        ドメインチームが自ドメインの名前空間を申請する入口である（G-116）[D]。
        - 自動検査（命名規則 X-2、組織名・製品名の不使用、既存・墓石化済みコードとの重複）を先に行い、合格したものだけを人の審査に回す [D]。
        - 審査の所有者は名前空間台帳の所有者とする。所有者は未決（ADR-021 K21-5。推奨はプラットフォームのプロダクト責任者）。台帳の変更は二者承認とする（K21-5 の推奨）[D]。
        - 審査の待ち時間は G-116 の審査 SLA と G-144 のリードタイムの対象で、K-31 で監視する（authorization-model.md §14）[D]。目標値は TBD（ADR-021 RR21-08）。
        - M&A で取り込んだ組織の型には新しいコードを払い出す（ADR-021 D21-27）[D]。
      x-negative-examples:
        - name: 組織名を含むコード
          request: proposed_code に `vendor_x_billing`
          expected: 201、review_status=automated_checks_failed、理由 `org_or_product_name`
        - name: 墓石化済みコードの再利用
          request: 過去に廃止した `legacy_ord` を proposed_code に指定
          expected: 201、review_status=automated_checks_failed、理由 `code_tombstoned`
        - name: core の申請
          request: proposed_code に `core`
          expected: 400 `reserved_namespace`
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NamespaceRequestInput'
            examples:
              allocate:
                value:
                  kind: allocate
                  capability_id: CAP-DOC-MGMT
                  proposed_code: dms
                  owning_domain: document_management
                  justification: 文書管理の資源型（folder, document）を登録するため
      responses:
        '201':
          description: 申請を受け付けた（自動検査の結果を含む）
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NamespaceRequest'
              examples:
                submitted:
                  $ref: '#/components/examples/NamespaceRequestExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/namespace-requests/{request_id}:
    get:
      operationId: getNamespaceRequest
      summary: 名前空間申請の審査状態を返す
      tags: [namespaces]
      x-stability: preview
      x-requirements:
        R: [R-109]
        G: [G-116, G-144]
      parameters:
