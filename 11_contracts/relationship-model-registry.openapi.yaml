    post:
      operationId: startShadowRun
      summary: 新 revision を本番要求で並行評価し差分を記録する shadow を開始する
      tags: [model-rollout]
      x-stability: preview
      x-requirements:
        R: [R-148, R-178, R-194]
        G: [G-112]
