  /v1/models/{model_revision}/shadow-runs:
    post:
      operationId: startShadowRun
      summary: 新 revision を本番要求で並行評価し差分を記録する shadow を開始する
      tags: [model-rollout]
      x-stability: preview
      x-requirements:
        R: [R-148, R-178, R-194]
        G: [G-112]
      security:
        - workloadMtls: []
          operatorAccessToken: []
      description: |
        ADR-016 D16-31 の段 3 である。本番の要求を現行固定 revision で判定しつつ、新 revision でも評価して差分を記録する。新 revision の結果は判定に使わない [D]。
        - shadow の評価は要求の同期経路の外で行い、副作用（書込、通知、課金、rate limit の消費）を持たない（ADR-027 D27-12 と同じ扱い）[D]。
        - 差分は ADR-027 D27-17 の 4 種（X: allow 拡大、N: deny 拡大、E: 評価不能・不達、T: 時間差）で分類する（ADR-016 D16-39 の申し送り）[D]。
        - 合格条件は、承認済みの変更で説明できない X が 0 件、N は業務影響の確認済み（ADR-016 D16-32、R-178）。許容条件の値は R-194.2（DL-20）で決める [D]。
        - 対象量は操作階層ごとに `sampling` で指定する。privileged・write は全件を既定とし、read-sensitive の抽出率は TBD（ADR-027 D27-13、authorization-model.md §16 K05-3）[D]。
        - shadow と復帰の試験には、剥奪済みの関係が deny のままであることを含める（ADR-016 D16-35）[D]。
        - 新旧モデルの shadow check の考え方は OpenFGA の文書にも記述がある [V][^3]（RS-07#18）。shadow を必須の段にするのは本基盤の設計判断である（DS-16）[D]。
      x-negative-examples:
        - name: 審査未承認の revision
          request: review_status=under_review（段 2 の追加承認が未了）の revision で開始。検証不合格の変更は登録されないため、state で表す CI 未合格の revision は存在しない
          expected: 409 `stage_gate_not_met`
        - name: shadow による判定の変更
          request: shadow 中の新 revision の deny を PEP が使うことを期待する
          expected: 該当なし（shadow の結果は DL-72 の判定応答に現れない。契約試験 DL-80 で確認）
      parameters:
        - $ref: '#/components/parameters/ModelRevisionPath'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShadowRunRequest'
            examples:
              canaryShadow:
                value:
                  cell_ids: [jp-canary-1]
                  sampling:
                    privileged: 1.0
                    write: 1.0
                    read_sensitive: 0.05
                  min_duration_seconds: 86400
                  min_evaluations_per_stratum: 30000
                  approvals:
                    - {approval_id: apr-20261015-0101, approver_role: domain_owner}
                    - {approval_id: apr-20261015-0102, approver_role: platform_reviewer}
      responses:
        '202':
          description: shadow を開始した
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
