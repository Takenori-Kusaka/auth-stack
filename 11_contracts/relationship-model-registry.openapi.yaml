    description: CAM の検証・登録・照会（preview。ADR-011 D2-1〜D2-7、ADR-016 D16-30〜D16-31）
  - name: model-rollout
    description: shadow 比較・段階展開・pin・既知良好版への rollback・freeze 状態（preview。ADR-016 D16-31〜D16-36）
  - name: namespaces
    description: ドメイン名前空間の所有と審査状態（preview。ADR-021 D21-25〜D21-27、G-116）
  - name: hierarchy
    description: 階層サービス（core/unit の作成・移動、循環・深さ検査、祖先閉包の読取り）。preview。authorization-model.md §3.6・K05-6・K05-8 の決裁待ちで、不採用なら削除する
paths:
  /v1/tenants/{tenant_id}/relationships/write:
    post:
      operationId: writeRelationships
      summary: tuple を原子的に追加・削除し consistency token を返す
      tags: [relationships]
      x-stability: ga
      x-requirements:
        R: [R-145, R-091, R-208]
        G: [G-066, G-120]
      description: |
        `writes` と `deletes` を 1 要求の中で全体成功または全体失敗として適用する [D]。親の付け替え（旧親の削除と新親の追加）を 1 要求にまとめる用途を想定する
        （authorization-model.md §11.2 例 A）[D]。OpenFGA は同じ要求内の書込みと削除が全体で成功または失敗するとしている [V][^13]。
        SpiceDB の WriteRelationships は書込みと削除を原子的に適用する [V][^14]。
        - 合計件数は 100 以下（info §5）[D]。
        - `preconditions`（preview 項目）は、指定した filter に合う tuple の有無を同じ原子的単位で確かめる条件付き書込みである [D]。不成立は 409 `precondition_failed` で返す。
          412 は要求ヘッダの条件が偽と評価された場合の状態コードであり [N][^15]、body の条件には使わない [D]。SpiceDB は WriteRelationships に任意の前提条件を付けられ、
          不成立なら全体を取り消す [V][^14]。OpenFGA 側の同等機能は未確認であり、PoC で確かめる（info §8）[D]。
        - `on_duplicate`・`on_missing` は、既に存在する tuple の追加と存在しない tuple の削除を、エラーにするか無視するかを決める [D]。既定は `error`。
        - `idempotency_key` が同じ要求の再送には、最初の応答（同じ `consistency_token`）を返す。保持期間は TBD（所有者 認可・PDP チーム、期限 G3）[D]。
        - 削除を含む書込みは剥奪として扱い、緊急 freeze 中も受け付ける（ADR-016 D16-36、ADR-027 D27-09）[D]。
        - 書込みごとに管理操作の監査イベント（DL-77）を出す [D]。
        - path の `tenant_id` は、起点要求の `Txn-Token` の `tctx.tid`（または `Subject-Access-Token` の `tid`）と一致しなければならない。利用者の要求を起点としない書込みは `Cross-Tenant-Execution-Id` で実行記録を示す。外れれば 403 `tenant_binding_violation`（info §6.1・§6.2、ラウンド2 是正）[D]。
      x-negative-examples:
        - name: 宣言外 relation の書込み
          request: 書込宣言（X-8）にない `core/tenant#admin` を一般サービスが書く
          expected: 403 `relation_not_writable`
        - name: テナント越えの tuple
          request: 主体が別テナントの `core/user` で、`core/external_grant` を介さない直接付与
          expected: 403 `tenant_boundary_violation`
        - name: テナント越えの userset 主体（PoC/R7反映。POC-02 X-D）
          request: テナント A の folder の viewer に、テナント B で作られた role の userset（`core/role:<B の role>#assignee`）を主体として書く。呼出し元は A の書込宣言の範囲内で、`Txn-Token` の `tctx.tid` も A に一致する
          expected: 403 `tenant_boundary_violation`（engine に渡さず何も書かない。userset の object の所属で判定する。§3）
        - name: 件数超過
          request: writes 80 件と deletes 30 件
          expected: 400 `batch_too_large`（bulk import を使う）
        - name: 資源 ID への個人データ・テナント ID の埋込み
          request: resource.id に `tenantA-yamada-taro-report` のような識別名を入れる（`.` を含む `...report.pdf` は ObjectId の pattern で先に 400 `invalid_request` になる）
          expected: 400 `identifier_policy_violation`（検出できるのは書込時検査の規則に合うものに限る。残りは CI と ADR-028 D28-55 の検査）
        - name: 条件カタログ外の条件
          request: condition.name に `c.custom_script`
          expected: 400 `condition_not_in_catalog`
        - name: テナント結合の不一致（書込み。ラウンド2 是正）
          request: テナント A の利用者の要求を処理中のサービスが、受信した `Txn-Token`（`tctx.tid`=A）を付けたまま path の tenant_id を被害テナント B にし、B の文書に協力者アカウントの viewer を書く（書込宣言の範囲内の relation で、主体・資源とも B に属する）
          expected: 403 `tenant_binding_violation`（engine に渡さず何も書かない。info §6.1）
        - name: 前提条件の不成立
          request: preconditions に must_not_exist を指定し、該当 tuple が既にある
          expected: 409 `precondition_failed`（何も書かれない。412 は要求ヘッダの条件に限るため使わない。RFC 9110 §15.5.13 [N][^15]）
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/TxnToken'
        - $ref: '#/components/parameters/SubjectAccessToken'
        - $ref: '#/components/parameters/CrossTenantExecutionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WriteRelationshipsRequest'
            examples:
              moveDocument:
                summary: 文書の親フォルダを付け替える（旧親の削除と新親の追加を 1 要求で）
                value:
                  writes:
                    - resource: {type: dms/document, id: q7mvwxyzab3kd2f6gh4nrtp5se}
                      relation: parent
                      subject: {type: dms/folder, id: r4nwx3yz7ab2c6dkh5mp9qtsve}
                  deletes:
                    - resource: {type: dms/document, id: q7mvwxyzab3kd2f6gh4nrtp5se}
                      relation: parent
                      subject: {type: dms/folder, id: s5px4z6ab8c2d3ekf7gh2mnqrt}
                  idempotency_key: 6f1c2b7e-2d1a-4c55-9a7e-0b5d3f1e9a21
              conditionalGrant:
                summary: 期限条件付きの付与（tuple に小さな属性だけを付ける）
                value:
                  writes:
                    - resource: {type: dms/folder, id: r4nwx3yz7ab2c6dkh5mp9qtsve}
                      relation: viewer
                      subject: {type: core/group, id: a2bc3d4e5f6g7hjk2mnpqrstvw, relation: member}
                      condition:
                        name: c.not_expired
                        context: {expires_at: "2026-12-31T00:00:00Z"}
                  on_duplicate: ignore
      responses:
        '200':
          description: 全件を適用した
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WriteRelationshipsResponse'
              examples:
                ok:
                  value:
                    consistency_token: ct1.AQ.ZmFjYWRlLXdyaXRlLTAwMDE.k3J9xQ
                    written_count: 1
                    deleted_count: 1
                    ignored_count: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/tenants/{tenant_id}/relationships/delete:
    post:
      operationId: deleteRelationships
      summary: tuple を原子的に削除し consistency token を返す
      tags: [relationships]
      x-stability: ga
      x-requirements:
        R: [R-145, R-142]
        G: [G-066]
      description: |
        削除専用の操作である。剥奪を他の変更より先に同期で確定させる手順（authorization-model.md §11.1 K-1）で使う [D]。
        応答の token を受け取ってから内容を変更すること（例 B: 剥奪後の追記）[D]。削除は緊急 freeze 中も止めない（ADR-016 D16-36）[D]。
        filter による一括削除は v1 では提供しない。テナント単位の削除は ADR-028 の手順で行う [D]。
        削除にも `writeRelationships` と同じテナント結合（info §6.1・§6.2）を課す。剥奪は freeze 中も止めないが、他テナントの tuple を消す経路にはしない [D]。
      x-negative-examples:
        - name: 存在しない tuple の削除（既定）
          request: on_missing を省略して、存在しない tuple を指定
          expected: 409 `missing_tuple`（何も削除されない）
        - name: ワイルドカード指定
          request: subject.id に `*`
          expected: 400 `invalid_request`（filter による一括削除は提供しない）
        - name: テナント結合の不一致（削除。ラウンド2 是正）
          request: テナント A の `Txn-Token`（`tctx.tid`=A）を付けたまま、path の tenant_id を被害テナント B にして B の owner tuple を削除する
          expected: 403 `tenant_binding_violation`（何も削除しない。剥奪の経路でも照合は省かない。info §6.1）
        - name: 実行記録の対象外テナント（ラウンド2 是正）
          request: テナント横断の実行者が `Cross-Tenant-Execution-Id` を付け、実行記録の対象テナント集合にないテナントの tuple を削除する
          expected: 403 `tenant_binding_violation`（info §6.2）
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/TxnToken'
        - $ref: '#/components/parameters/SubjectAccessToken'
        - $ref: '#/components/parameters/CrossTenantExecutionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteRelationshipsRequest'
            examples:
              removeMember:
                summary: グループからメンバーを外す（剥奪）
                value:
                  deletes:
                    - resource: {type: core/group, id: a2bc3d4e5f6g7hjk2mnpqrstvw}
                      relation: member
                      subject: {type: core/user, id: b3cd4e5f6g7hjk2mnpqrstvwxy}
      responses:
        '200':
          description: 全件を削除した
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WriteRelationshipsResponse'
              examples:
                ok:
                  value:
                    consistency_token: ct1.AQ.ZmFjYWRlLXdyaXRlLTAwMDI.p8Lm2Q
                    written_count: 0
                    deleted_count: 1
                    ignored_count: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/tenants/{tenant_id}/relationships/read:
    post:
      operationId: readRelationships
      summary: filter に合う tuple を指定した整合性で読む
      tags: [relationships]
      x-stability: ga
      x-requirements:
        R: [R-145, R-142]
        G: [G-066, G-120]
      description: |
        filter と整合性指定を body で受けるため POST とする（token が最大 1,024 バイトになり得るため）[D]。読取りに副作用はない [D]。
        - `consistency.mode` を省略した場合は `fully_consistent` とする（本契約の既定。DL-17 で操作階層別の既定が決まった場合はそれに従う）[D]。
        - `at_least_as_fresh` は `consistency.token` を必須とする。検証できない token は `fully_consistent` に格上げする（info §4）[D]。
        - 応答の `consistency.mode` は実際に評価したモード（実効モード）を示す。要求より弱いモードにはならない（ADR-011 D6-3）[D]。項目名は DL-72 の応答 `consistency.mode` と揃える [D]。
        - 関係の存在自体が機微になり得る（T-034）。呼出し元が読める resource type は書込宣言と同じ単位でレジストリに宣言し、宣言外は 403 とする [D]。宣言は SPIFFE ID の全体で照合する（info §6.3）[D]。
        - path の `tenant_id` は、`Subject-Access-Token` の `tid`（または `Txn-Token` の `tctx.tid`）と一致しなければならず、不一致は 403 `tenant_binding_violation`（info §6.1、ラウンド2 是正）[D]。
        - `resource.type` の指定を必須とし、テナント内の全 tuple を一度に列挙する filter は受け付けない（T-034 の大量読取の抑止）[D]。
        - ページは cursor（`page_token`）で辿る。cursor は主体・テナント・filter に束縛した不透明値とする（ADR-025 D25-15 と同じ扱い）[D]。ページ間の原子的スナップショットは保証しない。
          スナップショットが要る場合は bulk export を使う [D]。
      x-negative-examples:
        - name: resource.type なし
          request: filter に subject だけを指定
          expected: 400 `invalid_request`
        - name: token なしの at_least_as_fresh
          request: consistency.mode=at_least_as_fresh、token 省略
          expected: 400 `invalid_request`
        - name: 他テナントの cursor
          request: 別テナントの要求で得た page_token を提示
          expected: 400 `invalid_page_token`
        - name: テナント結合の不一致（読取り。ラウンド2 是正）
          request: テナント A の利用者の `Subject-Access-Token`（`tid`=A）を付けたまま、path の tenant_id を被害テナント B にし、resource_type を指定して B の関係を読む（読取宣言の範囲内の型）
          expected: 403 `tenant_binding_violation`（tuple を返さない。T-034。info §6.1）
        - name: 解釈できない token
          request: エンジン差替え後に旧形式の token を提示
          expected: 200（consistency.mode=fully_consistent。エラーにしない）
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/TxnToken'
        - $ref: '#/components/parameters/SubjectAccessToken'
        - $ref: '#/components/parameters/CrossTenantExecutionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadRelationshipsRequest'
            examples:
              viewersOfFolder:
                value:
                  filter:
                    resource_type: dms/folder
                    resource_id: r4nwx3yz7ab2c6dkh5mp9qtsve
                    relation: viewer
                  consistency:
                    mode: at_least_as_fresh
                    token: ct1.AQ.ZmFjYWRlLXdyaXRlLTAwMDE.k3J9xQ
                  page_size: 100
      responses:
        '200':
          description: 該当 tuple のページ
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadRelationshipsResponse'
              examples:
                page:
                  value:
                    tuples:
                      - resource: {type: dms/folder, id: r4nwx3yz7ab2c6dkh5mp9qtsve}
                        relation: viewer
                        subject: {type: core/group, id: a2bc3d4e5f6g7hjk2mnpqrstvw, relation: member}
                        condition:
                          name: c.not_expired
                          context: {expires_at: "2026-12-31T00:00:00Z"}
                    consistency:
                      mode: at_least_as_fresh
                      token: ct1.AQ.ZmFjYWRlLXJlYWQtMDAwMw.Zx81aa
                    next_page_token: pt1.eyJjIjoiMTAwIn0.9fQx
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/tenants/{tenant_id}/relationship-changes:
    get:
      operationId: listRelationshipChanges
      summary: テナントの tuple 変更を watermark 以降から順に取り出す
      tags: [relationship-changes]
      x-stability: preview
      x-requirements:
        R: [R-177, R-091]
        G: [G-070]
      description: |
        変更購読である。ACL 反映索引（ADR-025 D25-11・D25-12）と、移行時の複製・逆複製（ADR-027 D27-06）の唯一の入力とし、エンジンの store・DB を直接読む同期は認めない [D]。
        - 呼び出せるのはレジストリに購読者として登録した workload に限る（T-034、T-077）[D]。
        - `after` に前回応答の `watermark` を渡す。watermark は不透明値で、consistency token と同じ規則（版付き・MAC 付き）で façade が発行する [D]。
        - 変更は watermark の順に返す。同じ watermark を再提示すると同じ変更列を返す（再送に冪等）[D]。
        - 保持期間を過ぎた watermark は 410 `watermark_expired` を返す。購読者は bulk export から再構築する（ADR-025 D25-12）[D]。保持期間は TBD（所有者 認可・PDP チーム、期限 G3）。
        - 本 operation が preview である理由は、SpiceDB からの変更取出し経路（Watch API）が research で未検証であるため（ADR-010 §4.1 M-8 が △）[D]。
      x-negative-examples:
        - name: 未登録 workload からの購読
          request: 購読者登録のない workload が呼ぶ
          expected: 403 `subscriber_not_registered`
        - name: 期限切れ watermark
          request: 保持期間より古い watermark を after に指定
          expected: 410 `watermark_expired`
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/RequestId'
        - name: after
          in: query
          required: false
          description: 前回応答の `watermark`。省略時は購読者登録時点から
          schema:
            $ref: '#/components/schemas/OpaqueToken'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        '200':
          description: 変更のページ
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationshipChangesResponse'
              examples:
                changes:
                  value:
                    changes:
                      - operation: delete
                        tuple:
                          resource: {type: core/group, id: a2bc3d4e5f6g7hjk2mnpqrstvw}
                          relation: member
                          subject: {type: core/user, id: b3cd4e5f6g7hjk2mnpqrstvwxy}
                        committed_at: "2026-10-15T01:02:03Z"
                        revocation: true
                    watermark: wm1.AQ.Y2hhbmdlLTAwMDk.Qm4tZw
                    has_more: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '410':
          $ref: '#/components/responses/Gone'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/relationship-imports:
    post:
      operationId: createRelationshipImport
      summary: 正規形式（EIF の tuple ファイル）の bulk import ジョブを作る
      tags: [bulk]
      x-stability: preview
      x-requirements:
        R: [R-091, R-177, R-090]
        G: [G-070]
      security:
        - workloadMtls: []
          operatorAccessToken: []
      description: |
        初期投入・移行・cell 間移動（ADR-028）のための非同期 import である [D]。
        - 入力は ADR-018 D18-4 の EIF の tuple ファイル（版付き JSON Schema で検証する JSON Lines）と署名付き manifest に限る。エンジン固有の形式は受け付けない（ADR-018 D18-9、ADR-028 D28-10）[D]。
        - 1 ジョブが触れるのは 1 cell、かつ `scope.tenant_ids` に挙げたテナントだけとする（ADR-027 D27-10、ADR-013 D13-38）[D]。
        - `mode=dry_run` で件数・検証結果・差分を出し、`mode=apply` はその dry-run の結果 ID と件数上限と二者承認を必須にする（ADR-027 D27-10）[D]。
        - import は原子的ではない。狭める変更（削除）を先に全て確定し、その後に広げる変更（追加）を適用する（authorization-model.md §11.3）[D]。
        - manifest の件数・digest・署名が一致しないファイルは apply しない（ADR-018 D18-10 E1）[D]。
        - 投入速度の設計条件は最大テナントで 1 人 20 tuple を 2 時間で投入すること [A-032]。通常書込と別レーンにする（ADR-010 D-29）[D][A-032]。
      x-negative-examples:
        - name: dry-run なしの apply
          request: mode=apply で dry_run_id を省略
          expected: 400 `invalid_request`
