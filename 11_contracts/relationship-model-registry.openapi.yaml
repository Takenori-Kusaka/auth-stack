              $ref: '#/components/schemas/MoveRequest'
            examples:
              moveProject:
                value:
                  node: {type: proj/project, id: pj3k8m2q7w4x9z1r5t6v2y8b0c}
                  expected_parent: {type: core/unit, id: un7q2m4k9x3p5r8s2t6v4w1y0z}
                  new_parent: {type: core/unit, id: un2b5c8d1f4g7h0j3k6m9n2p5q}
      responses:
        '200':
          description: 親を付け替え、旧祖先の閉包を削除した
