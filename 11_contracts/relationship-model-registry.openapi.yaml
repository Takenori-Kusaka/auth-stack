components:
  securitySchemes:
    workloadMtls:
      type: mutualTLS
      description: workload ID（ADR-009）の X.509 SVID による mTLS。全 operation で必須 [D]
    operatorAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 人の操作者の access token（DL-75 の claim profile。typ は at+jwt）。人の判断を伴う操作で mTLS に加えて必須 [D]。path に `tenant_id` を持つ operation では、token の `tid` が path の `tenant_id` と一致しなければならず、不一致は 403 `tenant_binding_violation`（info §6.1、ラウンド2 是正）[D]
  parameters:
    TxnToken:
      name: Txn-Token
      in: header
      required: false
      x-stability: ga-candidate
      description: |
        起点要求の Txn-Token を無改変で渡す（テナント結合の裏付け。info §6.1 (a)、G 段規則 `tenant_binding`）。下流呼出しへの無改変の転送と `Txn-Token` ヘッダの使用は Transaction Tokens 草案の MUST、`Authorization` ヘッダの使用は MUST NOT [N][^20]（RS-06#35）。
        façade は署名・`aud`・有効期限を検証し、`tctx.tid`（社内 profile `txn-v1`）を path の `tenant_id` と照合する。不一致は 403 `tenant_binding_violation` [D]。
        呼出し元の認証には使わない（草案 §13.12 の MUST NOT）。全文をログに残さない（草案 §15.2 の MUST NOT）[N][^20]（RS-06#36, #41）。
        欄は GA 候補として rc 固定する。欠けた要求の扱いは宣言属性 `tenant_evidence` による（info §6.4）[D]。Transaction Tokens は Internet-Draft（-11）である [D]。
      schema:
        type: string
        minLength: 1
        maxLength: 6144
        pattern: "^[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+$"
        description: JWS compact serialization。最大長は CON-03 の TxnToken と同じ暫定値（ADR-015 D15-40 の初期案 6,144 byte）[D]。
    SubjectAccessToken:
      name: Subject-Access-Token
      in: header
      required: false
      x-stability: ga-candidate
      description: |
        呼出し元が検証済みの、起点要求の内部 access token（`typ=at+jwt`）。Txn-Token のない read 系でテナント結合の裏付けに使う（info §6.1 (b)）[D]。
        façade は署名・`exp` を検証し、`aud` が呼出し元 workload に当たることを確かめ、`tid` を path の `tenant_id` と照合する。不一致は 403 `tenant_binding_violation` [D]。
        全文をログに残さず、(`iss`, `jti`) と照合結果だけを残す [D]。ヘッダ名と渡し方（CON-03 の本文方式との統一）は未決（ADR-011。info §8）[D]。
      schema:
        type: string
        minLength: 1
        maxLength: 6144
        pattern: "^[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+$"
    CrossTenantExecutionId:
      name: Cross-Tenant-Execution-Id
      in: header
      required: false
      x-stability: ga-candidate
      description: |
        テナント横断の実行者（info §6.2）が、二者承認・対象テナント集合・dry-run の結果 ID・件数上限を持つ実行記録を示す。
        façade は宣言者・有効期限・path の `tenant_id` の集合への所属・累計件数を確かめ、外れれば 403 `tenant_binding_violation` [D]。
        実行記録を登録する operation は v0.3.0 では未定義で、定義までは本ヘッダを付けた要求をすべて拒否する（欄の予約）[D]。
      schema:
        type: string
        pattern: '^cte_[A-Za-z0-9]{10,40}$'
    TenantId:
      name: tenant_id
      in: path
      required: true
      description: テナントの不透明 ID（ADR-021）。値は token の `tid`・`tctx.tid` と同一の文字列（変換しない）。形は CON-02 `TenantIdSegment`（v1.1（I-7）で共通定義へ置換）
      schema:
        $ref: '#/components/schemas/TenantId'
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: 呼出し側が採番する要求 ID。指定された場合、応答で同じ値を返す（DL-72 と同じ扱い。ADR-011 D5-5）[D]
      schema:
        type: string
        minLength: 1
        maxLength: 128
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^(imp|exp)_[A-Za-z0-9]{10,40}$'
    ModelRevisionPath:
      name: model_revision
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ModelRevisionId'
  headers:
    XRequestId:
      description: 要求の X-Request-ID をそのまま返す
      schema:
        type: string
  responses:
    BadRequest:
      description: 要求の形式・上限・識別子規則の違反
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            batchTooLarge:
              value:
                type: https://problems.authz-registry.example.invalid/batch-too-large
                title: 1 要求の tuple 数が上限を超えている
                status: 400
                code: batch_too_large
                detail: writes と deletes の合計は 100 以下。超える変更は bulk import を使う
    Unauthenticated:
      description: mTLS または access token の検証に失敗
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: 宣言外の書込み、テナント境界、所有外の名前空間、承認不足など
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            notWritable:
              value:
                type: https://problems.authz-registry.example.invalid/relation-not-writable
                title: この workload は当該 relation を書けない
                status: 403
                code: relation_not_writable
            tenantBindingViolation:
              summary: 起点要求の token のテナントと path の tenant_id が一致しない（info §6.1）
              value:
                type: https://problems.authz-registry.example.invalid/tenant-binding-violation
                title: 要求のテナントと起点要求の token のテナントが一致しない
                status: 403
                code: tenant_binding_violation
    NotFound:
      description: 対象がない、または呼出し元に見えない（存在と権限なしを区別しない）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 状態の競合（重複・欠落 tuple、書込みの preconditions 不成立、base_revision、段の前提、freeze）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Gone:
      description: watermark の保持期間切れ
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: If-Match が成立しない（要求ヘッダの条件に限る。RFC 9110 §15.5.13）。body の preconditions の不成立は 409
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: If-Match が必要
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: CAM の検証に不合格（登録しない）
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  validation_report:
                    $ref: '#/components/schemas/ValidationReport'
    HierarchyRejected:
      description: 階層の検査に不合格（hierarchy_cycle、hierarchy_depth_exceeded、parent_type_not_allowed）。何も書いていない
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: テナント・client 単位のクォータ超過（ADR-010 D-29）
      headers:
        Retry-After:
          description: 再試行までの秒数
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unavailable:
      description: |
        store・engine に届かない。書込みは適用されていない（部分適用はない）。他 cell・primary への迂回はしない（ADR-010 D-40）[D]
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  examples:
    ModelChangeExample:
      summary: dms モジュールに folder の viewer を追加する変更案
      value:
        base_revision: mr_000042
        modules:
          - namespace_code: dms
            content:
              types:
                - name: dms/folder
                  relations:
                    - name: parent
                      directly_related: [dms/folder]
                      max_depth: 5
                    - name: viewer
                      directly_related: [core/user, core/group#member]
                      max_direct: 1000
                  permissions:
                    - name: read
                      expression: viewer | parent->read
                      tier: read-sensitive
                      marks: [tenant_delegable]
                  list_method: L3
              write_declarations:
                - workload: spiffe://prod.id.example.invalid/svc/dms-api
                  relations: [dms/folder#parent, dms/folder#viewer]
        change_request_ref: CR-2026-1015-0007
        tests:
          - name: viewer は子フォルダを読める
            tuples:
              - {resource: {type: dms/folder, id: f1}, relation: viewer, subject: {type: core/user, id: u1}}
              - {resource: {type: dms/folder, id: f2}, relation: parent, subject: {type: dms/folder, id: f1}}
              - {resource: {type: dms/folder, id: f1}, relation: viewer, subject: {type: core/group, id: g1, relation: member}}
              - {resource: {type: core/group, id: g1}, relation: member, subject: {type: core/user, id: u3}}
            check:
              - {subject: {type: core/user, id: u1}, resource: {type: dms/folder, id: f2}, expected: {read: true, viewer: false}}
              - {subject: {type: core/user, id: u3}, resource: {type: dms/folder, id: f2}, expected: {read: true}}
              - {subject: {type: core/user, id: u2}, resource: {type: dms/folder, id: f2}, expected: {read: false}}
            list_objects:
