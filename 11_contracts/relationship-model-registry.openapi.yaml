        - workloadMtls: []
          operatorAccessToken: []
      description: |
        ADR-016 D16-31 の段 3 である。本番の要求を現行固定 revision で判定しつつ、新 revision でも評価して差分を記録する。新 revision の結果は判定に使わない [D]。
        - shadow の評価は要求の同期経路の外で行い、副作用（書込、通知、課金、rate limit の消費）を持たない（ADR-027 D27-12 と同じ扱い）[D]。
        - 差分は ADR-027 D27-17 の 4 種（X: allow 拡大、N: deny 拡大、E: 評価不能・不達、T: 時間差）で分類する（ADR-016 D16-39 の申し送り）[D]。
        - 合格条件は、承認済みの変更で説明できない X が 0 件、N は業務影響の確認済み（ADR-016 D16-32、R-178）。許容条件の値は R-194.2（DL-20）で決める [D]。
