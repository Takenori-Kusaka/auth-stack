  schemas:
    NamespaceCode:
      description: |
        中央台帳が払い出す名前空間コード（ADR-021 D21-25）。`core` は基盤の予約。
        長さは 3〜63 文字とする。X-2 案（authorization-model.md §3.3）は各 3〜64 文字だが、SpiceDB の object_type の接頭辞部分は 3〜63 文字、object_type 全体は 128 バイト以下である [V][^16] ため、
        型名（接頭辞＋`/`＋最大 64 文字）が SpiceDB に写せる長さに収める [D]。X-2 の確定（DL-73 凍結前）で見直す（未決、authorization-model.md §3.3 X-2）
      type: string
      pattern: '^[a-z][a-z0-9_]{1,61}[a-z0-9]$'
    TypeName:
      description: '`<名前空間コード>/<型名>`（ADR-021 D21-26）。AuthZEN の Subject.type・Resource.type と同じ値を使う'
      type: string
      pattern: '^[a-z][a-z0-9_]{1,61}[a-z0-9]/[a-z][a-z0-9_]{1,62}[a-z0-9]$'
      examples: [core/user, dms/document]
    RelationName:
      type: string
      pattern: '^[a-z][a-z0-9_]{1,62}[a-z0-9]$'
    ObjectId:
      description: |
        不透明 ID（ADR-021 D21-14）。業務上の識別名・個人データ・テナント ID・時刻を含めない（X-9、ADR-028 D28-55）。
        最大長 128 は CON-02 `ResourceId`（受信側の形、DL-73 凍結前に確定）と揃えた仮置き [D]。本契約は relationship store への書込み経路なので、受信側の形（印字可能 ASCII）より狭い文字種を課す。
        文字種は英数字・`_`・`-` に限る。SpiceDB の object_id の文字種（`[a-zA-Z0-9/_|\-=+]`）[V][^16] との共通部分であり、`.`・`~` を含む ID はエンジン差替え時に書けなくなるため [D]。
        `/`・`|`・`=`・`+` は SpiceDB では使えるが、OpenFGA 側の識別子規則が未確認（authorization-model.md §3.3 X-2）のため含めない [D]。
      type: string
      pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$'
    TenantId:
      description: |
        テナントの不透明 ID（ADR-021 D21-12。D21-09 と同じ規則で払い出し、64 文字以下の ASCII、大文字小文字を区別して比較、払い出す値は小文字英数字、時刻を含めない）。
        `core/tenant` の object ID としても tuple に現れるため、文字種は ObjectId と揃える [D]。符号化の候補（小文字 base32 26 文字か UUIDv4 36 文字）は DL-71 で確定する（未決（ADR-021 D21-09））。
        v1.1（I-7、P-09）: 表記の正本を CON-02 に一本化し、pattern の写しをやめて CON-02 `TenantIdSegment`（v0.3.1 の本定義と同じ pattern）を参照する。受理する値の集合は変わらない。
        基盤が払い出す tid（CON-02 `IssuedTenantId`）は、CON-02 `TenantId`（CON-03 などの受信側の形）と本定義の両方で受理される [D]
      $ref: './schemas/common.schema.json#/$defs/TenantIdSegment'
    CellId:
      description: cell の識別名（ADR-013。仮置き）
      type: string
      pattern: '^[a-z0-9][a-z0-9-]{1,62}$'
    OpaqueToken:
      description: façade が発行する不透明値。利用側は解釈しない（ADR-011 D10-1 C-3）
      type: string
      minLength: 1
      maxLength: 1024
    ConsistencyToken:
      description: |
        書込み応答の整合性トークン。内容と同じ DB トランザクションで保存する（CT-1）。最大長 1,024 は初期案（ADR-010 D-14、NA-010-2）
      type: string
      minLength: 1
      maxLength: 1024
    ModelRevisionId:
      description: registry が採番する不変の model revision。不透明文字列として扱う（ADR-011 D2-7・D10-1 C-3）
      type: string
      pattern: '^mr_[A-Za-z0-9]{1,40}$'
    ResourceRef:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          $ref: '#/components/schemas/TypeName'
        id:
          $ref: '#/components/schemas/ObjectId'
    SubjectRef:
      description: 主体または userset。`relation` があれば `type:id#relation` の userset を表す
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          $ref: '#/components/schemas/TypeName'
        id:
          $ref: '#/components/schemas/ObjectId'
        relation:
          $ref: '#/components/schemas/RelationName'
    Condition:
      description: |
        条件カタログに登録済みの CEL 条件の参照（ADR-010 D-30・D-31、authorization-model.md §3.5）。context は 4,096 バイト以下（façade が検査）。
        `name` は CAM 上の条件 ID（`c.` 接頭辞）であり、エンジンの識別子ではない。SpiceDB の caveat 名は `.` を許さない [V][^16] ため、生成器が X-2 に合う識別子（例 `c_not_expired`）に写す（authorization-model.md §3.5）[D]
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          pattern: '^c\.[a-z][a-z0-9_]{1,62}[a-z0-9]$'
        context:
          type: object
          maxProperties: 16
    ConditionId:
      description: |
        条件カタログの ID（preview。authorization-model.md §3.5 の案の写し）。追加は条件カタログの変更（M3）で、本列挙の追加は minor [D]。
        各 ID の引数は `ConditionCatalog.$defs` に置く
      type: string
      enum: [c.not_expired, c.time_window, c.network_zone, c.min_acr, c.device_managed, c.purpose_in]
    ConditionCatalog:
      description: |
        条件カタログ（preview、案）。各定義の `tuple_context` は tuple に付ける引数（`Condition.context`）、`request_context` は判定要求の context（DL-72）で渡す入力である。
        入力の区分は authorization-model.md §3.5 の表の「入力」列の写しで、型・既定・CEL 式は認可・PDP チームが DL-73 凍結前に確定する（未決）[D]。
        tuple に個人データ・業務上の識別名を置かない（X-9）。request_context の属性は属性辞書（ADR-011 D9-4）の出所メタデータを持つものに限る [D]
      type: object
      $defs:
        c.not_expired:
          description: now < expires_at。外部付与・型付き例外・期限付き付与
          type: object
          properties:
            tuple_context:
              type: object
              additionalProperties: false
              required: [expires_at]
              properties:
                expires_at: {type: string, format: date-time}
            request_context:
              type: object
              additionalProperties: false
              required: [now]
              properties:
                now: {type: string, format: date-time}
        c.time_window:
          description: 曜日・時間帯の範囲内
          type: object
          properties:
            tuple_context:
              type: object
              additionalProperties: false
              required: [days_of_week, start_time, end_time, time_zone]
              properties:
                days_of_week:
                  type: array
                  minItems: 1
                  maxItems: 7
                  items: {type: string, enum: [mon, tue, wed, thu, fri, sat, sun]}
                start_time: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
                end_time: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
                time_zone: {type: string, maxLength: 64}
            request_context:
              type: object
              additionalProperties: false
              required: [now]
              properties:
                now: {type: string, format: date-time}
        c.network_zone:
          description: 接続元が許可ゾーンに含まれる。ゾーンは edge が付与する
          type: object
          properties:
            tuple_context:
              type: object
              additionalProperties: false
              required: [allowed_zones]
              properties:
                allowed_zones:
                  type: array
                  minItems: 1
                  maxItems: 16
                  items: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,62}$'}
            request_context:
              type: object
              additionalProperties: false
              required: [network_zone]
              properties:
                network_zone: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,62}$'}
        c.min_acr:
          description: 認証強度が下限以上。G 段規則 4 と重複しない資源個別の要件に限る
          type: object
          properties:
            tuple_context:
              type: object
              additionalProperties: false
              required: [min_acr]
              properties:
                min_acr: {type: string, maxLength: 128}
            request_context:
              type: object
              additionalProperties: false
              required: [acr]
              properties:
                acr: {type: string, maxLength: 128}
        c.device_managed:
          description: 管理端末である（端末状態は属性辞書の出所付き）
          type: object
          properties:
            request_context:
              type: object
              additionalProperties: false
              required: [device_managed]
              properties:
                device_managed: {type: boolean}
        c.purpose_in:
          description: 利用目的が許可された集合に含まれる
          type: object
          properties:
            tuple_context:
              type: object
              additionalProperties: false
              required: [allowed_purposes]
              properties:
                allowed_purposes:
                  type: array
                  minItems: 1
                  maxItems: 16
                  items: {type: string, pattern: '^[a-z][a-z0-9_]{0,62}$'}
            request_context:
              type: object
              additionalProperties: false
              required: [purpose]
              properties:
                purpose: {type: string, pattern: '^[a-z][a-z0-9_]{0,62}$'}
    Tuple:
      type: object
      additionalProperties: false
      required: [resource, relation, subject]
      properties:
        resource:
          $ref: '#/components/schemas/ResourceRef'
        relation:
          $ref: '#/components/schemas/RelationName'
        subject:
          $ref: '#/components/schemas/SubjectRef'
        condition:
          $ref: '#/components/schemas/Condition'
    TupleFilter:
      type: object
      additionalProperties: false
      required: [resource_type]
      properties:
        resource_type:
          $ref: '#/components/schemas/TypeName'
        resource_id:
          $ref: '#/components/schemas/ObjectId'
        relation:
          $ref: '#/components/schemas/RelationName'
        subject_type:
          $ref: '#/components/schemas/TypeName'
        subject_id:
          $ref: '#/components/schemas/ObjectId'
        subject_relation:
          $ref: '#/components/schemas/RelationName'
    Precondition:
      description: preview 項目。OpenFGA 上の原子的実現は未確認（info §8）
      type: object
      additionalProperties: false
      required: [operation, filter]
      properties:
        operation:
          type: string
          enum: [must_exist, must_not_exist]
        filter:
          $ref: '#/components/schemas/TupleFilter'
    WriteRelationshipsRequest:
      description: writes と deletes の合計は 100 以下（façade が検査）
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        writes:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Tuple'
        deletes:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Tuple'
        preconditions:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/Precondition'
        on_duplicate:
          type: string
          enum: [error, ignore]
          default: error
        on_missing:
          type: string
          enum: [error, ignore]
          default: error
        idempotency_key:
          type: string
          minLength: 8
          maxLength: 128
      anyOf:
        - required: [writes]
        - required: [deletes]
    DeleteRelationshipsRequest:
      type: object
      additionalProperties: false
      required: [deletes]
      properties:
        deletes:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/Tuple'
        on_missing:
          type: string
          enum: [error, ignore]
          default: error
        idempotency_key:
          type: string
          minLength: 8
          maxLength: 128
    WriteRelationshipsResponse:
      type: object
      additionalProperties: false
      required: [consistency_token, written_count, deleted_count]
      properties:
        consistency_token:
          $ref: '#/components/schemas/ConsistencyToken'
        written_count:
          type: integer
          minimum: 0
        deleted_count:
          type: integer
          minimum: 0
        ignored_count:
          type: integer
          minimum: 0
    ConsistencyRequest:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          enum: [minimize_latency, at_least_as_fresh, fully_consistent]
        token:
          $ref: '#/components/schemas/ConsistencyToken'
      anyOf:
        - properties:
            mode:
              enum: [minimize_latency, fully_consistent]
        - required: [token]
    ReadRelationshipsRequest:
      type: object
      additionalProperties: false
      required: [filter]
      properties:
        filter:
          $ref: '#/components/schemas/TupleFilter'
        consistency:
          $ref: '#/components/schemas/ConsistencyRequest'
        page_size:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
        page_token:
          $ref: '#/components/schemas/OpaqueToken'
    ReadRelationshipsResponse:
      type: object
      additionalProperties: false
      required: [tuples, consistency]
      properties:
        tuples:
          type: array
          items:
            $ref: '#/components/schemas/Tuple'
        consistency:
          type: object
          additionalProperties: false
          required: [mode]
          properties:
            mode:
              description: 実効モード（DL-72 の応答 `consistency.mode` と同じ項目名・値）
              type: string
              enum: [minimize_latency, at_least_as_fresh, fully_consistent]
            token:
              $ref: '#/components/schemas/ConsistencyToken'
        next_page_token:
          $ref: '#/components/schemas/OpaqueToken'
    RelationshipChange:
      type: object
      additionalProperties: false
      required: [operation, tuple, committed_at]
      properties:
        operation:
          type: string
          enum: [write, delete]
        tuple:
          $ref: '#/components/schemas/Tuple'
        committed_at:
          type: string
          format: date-time
        revocation:
          description: 剥奪として扱った変更（削除）。索引・逆複製は優先経路で処理する（ADR-027 D27-09）
          type: boolean
    RelationshipChangesResponse:
      type: object
      additionalProperties: false
      required: [changes, watermark, has_more]
      properties:
        changes:
          type: array
          items:
            $ref: '#/components/schemas/RelationshipChange'
        watermark:
          $ref: '#/components/schemas/OpaqueToken'
        has_more:
          type: boolean
    Approval:
      description: 承認記録の参照（DL-46・REQ-03 §6.5）。approver は要求者と異なることを façade が検査する
      type: object
      additionalProperties: false
      required: [approval_id, approver_role]
      properties:
        approval_id:
          type: string
          minLength: 1
          maxLength: 128
        approver_role:
          type: string
          minLength: 1
          maxLength: 64
    TwoPersonApprovals:
      type: array
      minItems: 2
      maxItems: 5
      items:
        $ref: '#/components/schemas/Approval'
    BulkScope:
      type: object
      additionalProperties: false
      required: [cell_id]
      properties:
        cell_id:
          $ref: '#/components/schemas/CellId'
        tenant_ids:
          description: 省略時は cell 内の全テナント（export のみ。import では必須）
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TenantId'
    ImportJobRequest:
      type: object
      additionalProperties: false
      required: [mode, scope, source, max_tuples, purpose]
      properties:
        mode:
          type: string
          enum: [dry_run, apply]
        scope:
          allOf:
            - $ref: '#/components/schemas/BulkScope'
            - required: [tenant_ids]
        source:
          type: object
          additionalProperties: false
          required: [manifest_uri, files]
          properties:
            manifest_uri:
              type: string
              format: uri
            files:
              type: array
              minItems: 1
              items:
                type: string
                format: uri
        max_tuples:
          description: 件数の上限。dry-run の件数を超えた場合は適用しない（ADR-027 D27-10）
          type: integer
          minimum: 1
        dry_run_id:
          type: string
          pattern: '^imp_[A-Za-z0-9]{10,40}$'
        purpose:
          type: string
          enum: [initial_load, migration, cell_move, restore_drill, exit_drill]
        approvals:
          $ref: '#/components/schemas/TwoPersonApprovals'
      anyOf:
        - properties:
            mode:
              const: dry_run
        - required: [dry_run_id, approvals]
    Jwk:
      description: 受領者の暗号化用公開鍵（JWK）。alg の許容集合は ADR-015 に従う
      type: object
      required: [kty]
      properties:
        kty:
          type: string
      additionalProperties: true
    ExportJobRequest:
      type: object
      additionalProperties: false
      required: [scope, purpose, recipient_public_key, destination_region, approvals]
      properties:
        scope:
          $ref: '#/components/schemas/BulkScope'
        include_model:
          description: CAM（型・relation・permission・条件・例外台帳）と model_revision を同梱する（ADR-018 D18-4 の model・policy 行）
          type: boolean
          default: true
        consistency:
          $ref: '#/components/schemas/ConsistencyRequest'
        purpose:
          type: string
          enum: [tenant_exit, engine_migration, exit_drill, backup_verification]
        destination_region:
          description: 送付先の所在地群（A-062。値の集合は ADR-013 の所在地群に従う）
          type: string
          minLength: 2
          maxLength: 16
        recipient_public_key:
          $ref: '#/components/schemas/Jwk'
        approvals:
          $ref: '#/components/schemas/TwoPersonApprovals'
    EifManifest:
      description: ADR-018 D18-4 の manifest。署名鍵の用途族は ADR-007 の所有者が決める（TBD）
      type: object
      additionalProperties: false
      required: [eif_schema_version, record_count, digest, snapshot_token, produced_at, signature]
      properties:
        eif_schema_version:
          type: string
          pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
        record_count:
          type: integer
          minimum: 0
        digest:
          description: 件数と順序に依存しない digest
          type: string
          pattern: '^sha-256:[0-9a-f]{64}$'
        model_revision:
          $ref: '#/components/schemas/ModelRevisionId'
        snapshot_token:
          $ref: '#/components/schemas/ConsistencyToken'
        watermark:
          $ref: '#/components/schemas/OpaqueToken'
        tenant_ids:
          type: array
          items:
            $ref: '#/components/schemas/TenantId'
        produced_at:
          type: string
          format: date-time
        signature:
          description: manifest に対する JWS（compact、detached payload）
          type: string
          minLength: 1
    BulkJob:
      type: object
      additionalProperties: false
      required: [job_id, kind, state, created_at]
      properties:
        job_id:
          type: string
          pattern: '^(imp|exp)_[A-Za-z0-9]{10,40}$'
        kind:
          type: string
          enum: [import, export]
        state:
          type: string
          enum: [queued, running, succeeded, failed, cancelled]
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        counts:
          type: object
          additionalProperties: false
          properties:
            total:
              type: integer
              minimum: 0
            written:
              type: integer
              minimum: 0
            deleted:
              type: integer
              minimum: 0
            rejected:
              type: integer
              minimum: 0
        failure_reason:
          type: string
          enum: [manifest_mismatch, schema_invalid, scope_violation, identifier_policy_violation, tenant_boundary_violation, limit_exceeded, internal_error]
        consistency_token:
          $ref: '#/components/schemas/ConsistencyToken'
        manifest:
          $ref: '#/components/schemas/EifManifest'
        download_uris:
          description: 暗号化済みの出力（短い有効期限付き）
          type: array
          items:
            type: string
            format: uri
    CamRelation:
      type: object
      additionalProperties: false
      required: [name, directly_related]
      properties:
        name:
          $ref: '#/components/schemas/RelationName'
        directly_related:
          description: 直接型（`<型>` または `<型>#<relation>`）。型ワイルドカードは不可（X-6）
          type: array
          minItems: 1
          items:
            type: string
            pattern: '^[a-z][a-z0-9_]{1,61}[a-z0-9]/[a-z][a-z0-9_]{1,62}[a-z0-9](#[a-z][a-z0-9_]{1,62}[a-z0-9])?$'
        conditions:
          description: 直接型に付ける条件（条件カタログの ID。v0.2.0 で列挙に変更、preview）
          type: array
          items:
            $ref: '#/components/schemas/ConditionId'
        max_depth:
          description: 再帰 relation の最大深度の宣言（X-7）。宣言値の合計は設計値 8 以下 [A-036]
          type: integer
          minimum: 1
        max_direct:
          description: fanout の宣言（authorization-model.md §3.4）
          type: integer
          minimum: 1
        public:
          description: 他ドメインから参照してよい relation か（X-4）
          type: boolean
          default: false
    CamPermission:
      type: object
      additionalProperties: false
      required: [name, expression, tier]
      properties:
        name:
          $ref: '#/components/schemas/RelationName'
        expression:
          description: |
            CAM 式 v0（info.description §9 の EBNF）。和 `|`、積 `&`、exclusion `-`（core のみ。X-5・E-6）、tuple-to-userset `x->r`、括弧。
            異なる演算子は括弧なしで並べない（E-2）。pattern は文字種だけを縛り、構文は check `lint_expression_syntax` が判定する [D]
          type: string
          minLength: 1
          maxLength: 2048
          pattern: '^[a-z0-9_ ()|&>-]+$'
          examples: ['viewer | parent->read', '(member | ancestor->manage) & parent->view']
        tier:
          description: |
            操作階層（REQ-03 の 5 分類と副区分。operation-risk-tiers-assurance.md が正本）。CON-03 の `operation_tier`（facade が registry から引く値）と同じ値を使う。
            v1.1（I-7、P-09）: v0.3.1 の `[public, read_sensitive, write, privileged, break_glass]` をやめ、表記の正本 CON-02 `OperationTier`（`read-sensitive`、`privileged/T`・`privileged/P`、`break-glass/B`・`break-glass/P`）を参照する（preview の範囲の変更）[D]
          $ref: './schemas/common.schema.json#/$defs/OperationTier'
        marks:
          description: permission catalog の印（authorization-model.md §3.2）
          type: array
          items:
            type: string
            enum: [tenant_delegable, external_grantable]
    CamType:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: '#/components/schemas/TypeName'
        extends_core:
          description: core 型の type extension である場合 true（X-3）
          type: boolean
          default: false
        relations:
          type: array
          items:
            $ref: '#/components/schemas/CamRelation'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/CamPermission'
        list_method:
          description: 一覧方式の宣言（ADR-025 D25-05）
          type: string
          enum: [L1, L2, L3]
    WriteDeclaration:
      description: workload が書ける relation の宣言（X-8）
      type: object
      additionalProperties: false
      required: [workload, relations]
      properties:
        workload:
          description: workload ID（SPIFFE ID。ADR-009。trust domain 名は仮置き）
          type: string
          format: uri
        relations:
          type: array
          minItems: 1
          items:
            type: string
            pattern: '^[a-z][a-z0-9_]{1,61}[a-z0-9]/[a-z][a-z0-9_]{1,62}[a-z0-9]#[a-z][a-z0-9_]{1,62}[a-z0-9]$'
    CamModule:
      description: 1 名前空間分の CAM。JSON Schema の検証対象（ADR-011 D2-1）
      type: object
      additionalProperties: false
      required: [types]
      properties:
        types:
          type: array
          items:
            $ref: '#/components/schemas/CamType'
        write_declarations:
          type: array
          items:
            $ref: '#/components/schemas/WriteDeclaration'
    ModelChangeRequest:
      description: |
        v0.2.0 で `tests`（試験ケース）と `semantic_change`（意味の変更の申告。ADR-016 D16-08 により必須）を加えた（preview の範囲の変更）[D]
      type: object
      additionalProperties: false
      required: [base_revision, modules, change_request_ref, tests, semantic_change]
      properties:
        base_revision:
          description: |
            v1.1（I-14、P-21）: registry 全体で直近の登録済み revision（`listModels` を `state` なしで呼んだ応答の `revisions[0].model_revision`）。
            名前空間の初回登録でも省略しない。registry の初期化で `core` だけの revision が登録されるため、値は常に存在する（`registerModel` の description）[D]
          allOf:
            - $ref: '#/components/schemas/ModelRevisionId'
        modules:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [namespace_code, content]
            properties:
              namespace_code:
                $ref: '#/components/schemas/NamespaceCode'
              content:
                $ref: '#/components/schemas/CamModule'
        change_request_ref:
          description: 変更審査の記録 ID（PR・変更票）
          type: string
          minLength: 1
          maxLength: 128
        tests:
          description: |
            check `positive_negative_tests`・`cross_tenant_negative_tests` の入力。変更後のモデル（base＋modules）に対して流す。
            要素は OpenFGA の `.fga.yaml`（tuples・check・list_objects）[V][^19] と同じ構成にし、生成器が `.fga.yaml` と zed の validation file に写す [D]
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ModelTestCase'
        semantic_change:
          $ref: '#/components/schemas/SemanticChangeDeclaration'
        approvals:
          type: array
          items:
            $ref: '#/components/schemas/Approval'
    SemanticChangeDeclaration:
      description: |
        スキーマ差分で検出できない変更（同じ名前の permission の意味の変更、継承の向きの変更など）の申告（ADR-016 D16-08）。
        `declared=true` は変更区分を M2 以上にする（info.description §9.4）[D]
      type: object
      additionalProperties: false
      required: [declared]
      properties:
        declared:
          type: boolean
        description:
          type: string
          minLength: 1
          maxLength: 2000
        affected:
          description: 意味が変わる permission・relation（`<型>#<名前>`）
          type: array
          items:
            type: string
            pattern: '^[a-z][a-z0-9_]{1,61}[a-z0-9]/[a-z][a-z0-9_]{1,62}[a-z0-9]#[a-z][a-z0-9_]{1,62}[a-z0-9]$'
      if:
        properties:
          declared:
            const: true
      then:
        required: [description, affected]
    TestTuple:
      description: 試験用の tuple。本番の tuple 規則（X-9、テナント境界）と同じ形 [D]
      type: object
      additionalProperties: false
      required: [resource, relation, subject]
      properties:
        resource:
          $ref: '#/components/schemas/ResourceRef'
        relation:
          $ref: '#/components/schemas/RelationName'
        subject:
          $ref: '#/components/schemas/SubjectRef'
        condition:
          $ref: '#/components/schemas/Condition'
    ModelTestCase:
      description: |
        越境の否定試験（`kind=cross_tenant_negative`）は、他テナントの主体に tuple がない限り deny であることを R 段で確かめる。
        他テナントの主体を書く tuple は façade が書込を拒否する（§3）ため、その拒否は契約試験キット（DL-80）で確かめる [D]
      type: object
      additionalProperties: false
      required: [name, tuples]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        kind:
          description: 試験の種類。`cross_tenant_negative` は全 check が deny を期待するものに限る（ADR-011 D2-5）[D]
          type: string
          enum: [positive_negative, cross_tenant_negative]
          default: positive_negative
        tuples:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/TestTuple'
        check:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [subject, resource, expected]
            properties:
              subject:
                $ref: '#/components/schemas/SubjectRef'
              resource:
                $ref: '#/components/schemas/ResourceRef'
              context:
                description: 条件の request_context（ConditionCatalog）
                type: object
                maxProperties: 16
              expected:
                description: permission・relation 名から期待値（true=allow）への対応
                type: object
                minProperties: 1
                propertyNames:
                  $ref: '#/components/schemas/RelationName'
                additionalProperties:
                  type: boolean
        list_objects:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [subject, resource_type, expected]
            properties:
              subject:
                $ref: '#/components/schemas/SubjectRef'
              resource_type:
                $ref: '#/components/schemas/TypeName'
              context:
                type: object
                maxProperties: 16
              expected:
                description: permission 名から、期待する object ID の集合への対応（順序は問わない）
                type: object
                minProperties: 1
                propertyNames:
                  $ref: '#/components/schemas/RelationName'
                additionalProperties:
                  type: array
                  items:
                    $ref: '#/components/schemas/ObjectId'
      anyOf:
        - required: [check]
        - required: [list_objects]
    CheckResult:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name:
          type: string
          enum:
            - cam_schema
            - lint_expression_syntax
            - lint_reserved_relation
            - lint_namespace
            - lint_naming
            - lint_extension_scope
            - lint_cross_domain_reference
            - lint_no_domain_deny
            - lint_no_wildcard
            - lint_recursion_depth
            - lint_write_declaration
            - lint_identifier_policy
            - external_grant_reachability
            - positive_negative_tests
            - cross_tenant_negative_tests
            - breaking_change
            - permission_expansion_diff
            - engine_differential
            - dsl_roundtrip
            - depth_fanout_budget
        status:
          type: string
          enum: [pass, fail, not_run]
        findings:
          type: array
          items:
            type: string
    ValidationReport:
      type: object
      additionalProperties: false
      required: [result, checks]
      properties:
        result:
          type: string
          enum: [pass, fail]
        permission_expansion:
          description: 権限が広がる差分を含むか（ADR-016 D16-31 段 2）
          type: boolean
        additional_approval_required:
          type: boolean
        change_class:
          $ref: '#/components/schemas/ChangeClass'
        change_class_reasons:
          description: 'change_class を決めた規則と対象（例 `M1: permission_expansion_diff dms/folder#read`）'
          type: array
          items:
            type: string
            maxLength: 512
        test_summary:
          type: object
          additionalProperties: false
          required: [cases, assertions, failed]
          properties:
            cases: {type: integer, minimum: 0}
            assertions: {type: integer, minimum: 0}
            failed: {type: integer, minimum: 0}
            uncovered_relations:
              description: 肯定・否定の試験がない relation・permission（`<型>#<名前>`）。1 件でもあれば positive_negative_tests は fail
              type: array
              items:
                type: string
        checks:
          type: array
          items:
            $ref: '#/components/schemas/CheckResult'
    ChangeClass:
      description: |
        変更区分（GOV-05 §6.4。M0 追加的、M1 権限拡大・高リスク階層、M2 破壊的・意味の変更・他ドメイン型の拡張、M3 横断・ガードレール）。
        判定規則は info.description §9.4。承認経路（INT-03 §8.1）を決める。検証が不合格でも判定できた範囲で返す [D]
      type: string
      enum: [M0, M1, M2, M3]
    ModelRevisionState:
      type: string
      enum: [validated, shadowing, shadow_passed, shadow_failed, rolling_out, deployed, superseded, withdrawn]
    ModelRevision:
      type: object
      additionalProperties: false
      required: [model_revision, sequence, state, known_good, review_status, registered_at]
      properties:
        model_revision:
          $ref: '#/components/schemas/ModelRevisionId'
        sequence:
          description: 単調増加の版番号（ADR-016 D16-03）。PDP・façade は保持中より古い番号の配布物を拒否する
          type: integer
          minimum: 1
        base_revision:
          description: 登録時に基にした revision。v1.1（I-14、P-21）registry の初期化で登録される `sequence`=1 の revision（`core` だけ）にだけ無く、それ以外の revision には必ずある [D]
          allOf:
            - $ref: '#/components/schemas/ModelRevisionId'
        state:
          $ref: '#/components/schemas/ModelRevisionState'
        known_good:
          description: 既知良好版として復帰先に使えるか。全 wave の bake 合格で true にする [D]
          type: boolean
        review_status:
          $ref: '#/components/schemas/ReviewStatus'
        registered_at:
          type: string
          format: date-time
        change_request_ref:
          type: string
        module_digests:
          type: object
          additionalProperties:
            type: string
            pattern: '^sha-256:[0-9a-f]{64}$'
        cam:
          description: CAM 本体（getModel のみ）
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CamModule'
        change_class:
          $ref: '#/components/schemas/ChangeClass'
        validation_report:
          $ref: '#/components/schemas/ValidationReport'
    ShadowRunRequest:
      type: object
      additionalProperties: false
      required: [cell_ids, sampling, approvals]
      properties:
        cell_ids:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CellId'
        sampling:
          type: object
          additionalProperties: false
          description: |
            操作階層ごとの抽出率。キーは CON-02 `OperationTierClass` の値（副区分なし）。v1.1（I-7、P-09）で `read_sensitive` を `read-sensitive` に改めた（preview の範囲の変更）[D]
          required: [privileged, write, read-sensitive]
          properties:
            privileged:
              type: number
              minimum: 0
              maximum: 1
            write:
              type: number
              minimum: 0
              maximum: 1
            read-sensitive:
              type: number
              minimum: 0
              maximum: 1
        min_duration_seconds:
          type: integer
          minimum: 1
        min_evaluations_per_stratum:
          description: n ≥ 3/p（ADR-027 D27-15）。p は TBD
          type: integer
          minimum: 1
        approvals:
          $ref: '#/components/schemas/TwoPersonApprovals'
    ShadowStratum:
      type: object
      additionalProperties: false
      required: [tier, evaluated, agreed, allow_expansion_unexplained, deny_expansion, indeterminate_or_unavailable]
      properties:
        tier:
          description: 層の操作階層。CON-02 `OperationTierClass` のうち shadow の対象の 3 値（v1.1（I-7、P-09）で表記を統一）
          allOf:
            - $ref: './schemas/common.schema.json#/$defs/OperationTierClass'
          enum: [read-sensitive, write, privileged]
        evaluated:
          type: integer
          minimum: 0
        agreed:
          type: integer
          minimum: 0
        allow_expansion_unexplained:
          description: X のうち承認済みの変更で説明できないもの。合格条件は 0（ADR-016 D16-32）
          type: integer
          minimum: 0
        allow_expansion_explained:
          type: integer
          minimum: 0
        deny_expansion:
          type: integer
          minimum: 0
        indeterminate_or_unavailable:
          type: integer
          minimum: 0
        temporal:
          type: integer
          minimum: 0
    ShadowRun:
      type: object
      additionalProperties: false
      required: [shadow_run_id, model_revision, baseline, cell_ids, state, started_at]
      properties:
        shadow_run_id:
          type: string
          pattern: '^shd_[A-Za-z0-9]{10,40}$'
        model_revision:
          $ref: '#/components/schemas/ModelRevisionId'
        baseline:
          description: 比較の基準。各テナントの現行固定 revision
          type: string
          enum: [tenant_pinned]
        cell_ids:
          type: array
          items:
            $ref: '#/components/schemas/CellId'
        state:
          type: string
          enum: [running, passed, failed, cancelled]
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        strata:
          type: array
          items:
            $ref: '#/components/schemas/ShadowStratum'
        permission_path_coverage:
          description: type×relation×permission の経路のうち評価された割合（ADR-027 D27-15）
          type: number
          minimum: 0
          maximum: 1
        revoked_relations_still_denied:
          description: 剥奪済みの関係が新 revision でも deny のままか（ADR-016 D16-35）
          type: boolean
        gate_result:
          type: string
          enum: [pass, fail, pending]
    RolloutRequest:
      type: object
      additionalProperties: false
      required: [stage, cell_ids, approvals]
      properties:
        stage:
          type: string
          enum: [canary_cell, wave]
        wave_number:
          type: integer
          minimum: 1
        cell_ids:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CellId'
        shadow_run_id:
          type: string
          pattern: '^shd_[A-Za-z0-9]{10,40}$'
        approvals:
          $ref: '#/components/schemas/TwoPersonApprovals'
      anyOf:
        - properties:
            stage:
              const: wave
          required: [wave_number]
        - properties:
            stage:
              const: canary_cell
          required: [shadow_run_id]
    Rollout:
      type: object
      additionalProperties: false
      required: [rollout_id, model_revision, stage, cell_ids, state, started_at]
      properties:
        rollout_id:
          type: string
          pattern: '^rol_[A-Za-z0-9]{10,40}$'
        model_revision:
          $ref: '#/components/schemas/ModelRevisionId'
        stage:
          type: string
          enum: [canary_cell, wave]
        wave_number:
          type: integer
          minimum: 1
        cell_ids:
          type: array
          items:
            $ref: '#/components/schemas/CellId'
        state:
          type: string
          enum: [deploying, baking, passed, halted, rolled_back]
        started_at:
          type: string
          format: date-time
        bake_until:
          type: string
          format: date-time
    ModelPin:
      type: object
      additionalProperties: false
      required: [tenant_id, model_revision, pointer_version, cell_id, updated_at]
      properties:
        tenant_id:
          $ref: '#/components/schemas/TenantId'
        model_revision:
          $ref: '#/components/schemas/ModelRevisionId'
        pointer_version:
          description: 指示子の版。単調増加（ADR-016 D16-34）
          type: integer
          minimum: 1
        known_good_revision:
          $ref: '#/components/schemas/ModelRevisionId'
        ring:
          description: テナントが選ぶ展開 ring（ADR-013 D13-36。値の集合は未決）
          type: string
          maxLength: 32
        cell_id:
          $ref: '#/components/schemas/CellId'
        updated_at:
          type: string
          format: date-time
    ModelPinUpdateRequest:
      type: object
      additionalProperties: false
      required: [model_revision, approvals]
      properties:
        model_revision:
          $ref: '#/components/schemas/ModelRevisionId'
        approvals:
          $ref: '#/components/schemas/TwoPersonApprovals'
    RollbackRequest:
      type: object
      additionalProperties: false
      required: [scope, target_revision, reason, approvals]
      properties:
        scope:
          type: object
          additionalProperties: false
          required: [cell_id]
          properties:
            cell_id:
              $ref: '#/components/schemas/CellId'
            tenant_ids:
              description: 省略時は cell 内で対象 revision より新しい固定を持つ全テナント
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/TenantId'
        target_revision:
          $ref: '#/components/schemas/ModelRevisionId'
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        approvals:
          $ref: '#/components/schemas/TwoPersonApprovals'
    RollbackStatus:
      type: object
      additionalProperties: false
      required: [rollback_id, target_revision, scope, state, requested_at]
      properties:
        rollback_id:
          type: string
          pattern: '^rbk_[A-Za-z0-9]{10,40}$'
        target_revision:
          $ref: '#/components/schemas/ModelRevisionId'
        scope:
          type: object
          additionalProperties: false
          required: [cell_id]
          properties:
            cell_id:
              $ref: '#/components/schemas/CellId'
            tenant_ids:
              type: array
              items:
                $ref: '#/components/schemas/TenantId'
        state:
          type: string
          enum: [in_progress, completed, failed]
        requested_at:
          type: string
          format: date-time
        completed_at:
          description: 全対象への反映完了時刻。requested_at との差を R-194.3 として記録する
          type: string
          format: date-time
    FreezeStatus:
      type: object
      additionalProperties: false
      required: [frozen, cells]
      properties:
        frozen:
          type: boolean
        cells:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [cell_id, since]
            properties:
              cell_id:
                $ref: '#/components/schemas/CellId'
              since:
                type: string
                format: date-time
              authority_ref:
                description: 発動記録の参照（DL-46）
                type: string
    NamespaceStatus:
      description: deprecated は新規利用不可・既存は移行期間中、tombstoned は削除済みで再利用しない（ADR-021 D21-27）
      type: string
      enum: [active, deprecated, tombstoned]
    ReviewStatus:
      description: 審査状態。中央審査は互換性・安全性の確認に限る（G-116）
      type: string
      enum: [submitted, automated_checks_running, automated_checks_failed, under_review, approved, rejected, withdrawn]
    Namespace:
      type: object
      additionalProperties: false
      required: [code, capability_id, owning_domain, status]
      properties:
        code:
          $ref: '#/components/schemas/NamespaceCode'
        capability_id:
          description: 事業能力のカタログ ID（ADR-021 D21-25）
          type: string
          minLength: 1
          maxLength: 64
        owning_domain:
          type: string
          minLength: 1
          maxLength: 64
        status:
          $ref: '#/components/schemas/NamespaceStatus'
        public_relations:
          type: array
          items:
            type: string
        write_declarations:
          type: array
          items:
            $ref: '#/components/schemas/WriteDeclaration'
        allocated_at:
          type: string
          format: date-time
        deprecated_at:
          type: string
          format: date-time
    NamespaceRequestInput:
      type: object
      additionalProperties: false
      required: [kind, capability_id, justification]
      properties:
        kind:
          type: string
          enum: [allocate, transfer_ownership, deprecate]
        capability_id:
          type: string
          minLength: 1
          maxLength: 64
        proposed_code:
          $ref: '#/components/schemas/NamespaceCode'
        target_code:
          $ref: '#/components/schemas/NamespaceCode'
        owning_domain:
          type: string
          minLength: 1
          maxLength: 64
        justification:
          type: string
          minLength: 1
          maxLength: 2000
      anyOf:
        - properties:
            kind:
              const: allocate
          required: [proposed_code, owning_domain]
        - properties:
            kind:
              enum: [transfer_ownership, deprecate]
          required: [target_code]
    NamespaceRequest:
      type: object
      additionalProperties: false
      required: [request_id, kind, capability_id, review_status, submitted_at]
      properties:
        request_id:
          type: string
          pattern: '^nsr_[A-Za-z0-9]{10,40}$'
        kind:
          type: string
          enum: [allocate, transfer_ownership, deprecate]
        proposed_code:
          $ref: '#/components/schemas/NamespaceCode'
        target_code:
          $ref: '#/components/schemas/NamespaceCode'
        capability_id:
          type: string
        review_status:
          $ref: '#/components/schemas/ReviewStatus'
        automated_checks:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, status]
            properties:
              name:
                type: string
                enum: [naming_rule, no_org_or_product_name, not_reserved_or_tombstoned]
              status:
                type: string
                enum: [pass, fail]
              reason:
                type: string
                enum: [org_or_product_name, code_tombstoned, code_in_use, naming_rule_violation]
        reviewer_decisions:
          type: array
          items:
            $ref: '#/components/schemas/Approval'
        submitted_at:
          type: string
          format: date-time
        decided_at:
          type: string
          format: date-time
    HierarchyNodeRef:
      description: 木のノード（`core/unit`、`core/tenant`、または `parent` を宣言した葉ノードの型）
      $ref: '#/components/schemas/ResourceRef'
    CreateUnitRequest:
      type: object
      additionalProperties: false
      required: [parent, kind]
      properties:
        parent:
          $ref: '#/components/schemas/HierarchyNodeRef'
        kind:
          description: テナントが定義する表示属性の語彙（division、department、subsidiary など）。認可判定に使わない
          type: string
          pattern: '^[a-z][a-z0-9_]{0,62}$'
    AttachRequest:
      type: object
      additionalProperties: false
      required: [node, parent]
      properties:
        node:
          $ref: '#/components/schemas/HierarchyNodeRef'
        parent:
          $ref: '#/components/schemas/HierarchyNodeRef'
    MoveRequest:
      type: object
      additionalProperties: false
      required: [node, expected_parent, new_parent]
      properties:
        node:
          $ref: '#/components/schemas/HierarchyNodeRef'
        expected_parent:
          $ref: '#/components/schemas/HierarchyNodeRef'
        new_parent:
          $ref: '#/components/schemas/HierarchyNodeRef'
    Unit:
      type: object
      additionalProperties: false
      required: [unit, parent, depth, kind]
      properties:
        unit:
          $ref: '#/components/schemas/ResourceRef'
        parent:
          $ref: '#/components/schemas/HierarchyNodeRef'
        depth:
          description: テナント直下を 1 とする unit の深さ
          type: integer
          minimum: 1
        kind:
          type: string
    HierarchyWriteResult:
      type: object
      additionalProperties: false
      required: [node, parent, consistency_token, ancestor_additions]
      properties:
        node:
          $ref: '#/components/schemas/HierarchyNodeRef'
        parent:
          $ref: '#/components/schemas/HierarchyNodeRef'
        consistency_token:
          description: 親の付け替えと旧祖先の削除を含む整合性トークン（CT-1 と同じ扱い）
          $ref: '#/components/schemas/ConsistencyToken'
        ancestor_additions:
          type: object
          additionalProperties: false
          required: [state]
          properties:
            state:
              description: 新祖先の `ancestor` tuple の反映状態。pending の間は継承分が deny 側に倒れる
              type: string
              enum: [pending, applied]
            tuples:
              type: integer
              minimum: 0
    AncestorClosure:
      type: object
      additionalProperties: false
      required: [node, ancestors, ancestor_sync]
      properties:
        node:
          $ref: '#/components/schemas/HierarchyNodeRef'
        ancestors:
          description: 根（core/tenant）から直近の親までの順
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/HierarchyNodeRef'
        ancestor_sync:
          type: string
          enum: [synced, pending]
    ProblemCode:
      description: 本契約の閉じた列挙。追加は minor、意味の変更は major（ADR-016）
      type: string
      enum:
        - invalid_request
        - batch_too_large
        - unknown_type_or_relation
        - identifier_policy_violation
        - condition_not_in_catalog
        - condition_context_too_large
        - depth_budget_exceeded
        - invalid_page_token
        - scope_violation
        - reserved_namespace
        - unauthenticated
        - relation_not_writable
        - tenant_boundary_violation
        - tenant_binding_violation
        - namespace_not_owned
        - subscriber_not_registered
        - approval_required
        - export_not_permitted
        - not_found
        - duplicate_tuple
        - missing_tuple
        - base_revision_conflict
        - stage_gate_not_met
        - frozen
        - not_known_good
        - use_rollback_operation
        - watermark_expired
        - precondition_failed
        - pin_pointer_conflict
        - precondition_required
        - model_validation_failed
        - hierarchy_cycle
        - hierarchy_depth_exceeded
        - parent_type_not_allowed
        - parent_mismatch
        - quota_exceeded
        - unavailable
    Problem:
      description: RFC 9457 Problem Details。`code` と `request_id` は本契約の拡張メンバ [N][^11]
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          $ref: '#/components/schemas/ProblemCode'
        request_id:
          type: string
      additionalProperties: true
