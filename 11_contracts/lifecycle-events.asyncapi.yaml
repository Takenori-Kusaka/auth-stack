    - {id: 'LC-CV-04', name: '未知の type', input: '既知の前置で未定義の type（例 tenant.future_event）を配送する', expected: '受理して ack し、dead letter に送らない（RO-5）'}
    - {id: 'LC-CV-05', name: '未知の data 欄・未知の列挙値', input: '既知の type に未知の欄と reason_class の未知の値を加える', expected: '受理し、未知の値を other と同じに扱う（RO-5）'}
    - {id: 'LC-CV-06', name: '削除要求と報告', input: 'tenant.deletion.requested と user.deletion.requested を配送する', expected: '期限内に CON-13 DeletionReport に適合する報告を送る。データがなければ not_applicable（RO-7）'}
    - {id: 'LC-CV-07', name: '処理失敗', input: '受信側の処理を失敗させる（注入）', expected: '自サービスの dead letter に移し、削除要求なら期限内に outcome=failed・failure_reason=processing_error を報告する（RO-8）'}
    - {id: 'LC-CV-08', name: '停止と独自 session', input: 'membership.suspended を配送した後に独自 session で要求する', expected: '独自 session が無効になっている。T_user_susp 以内（値は TBD）（RO-6、ONB-R9）'}
    - {id: 'LC-CV-09', name: '送信者の偽装', input: 'publisher 以外の workload から事象を送る。broker 経由（broker に書き込める別 workload が署名なしで書く）と直接の両方', expected: '処理しない（RO-1、RO-11）。broker 経由でも mTLS の成功を真正性の根拠にしない'}
    - {id: 'LC-CV-10', name: '他の鍵による署名', input: '非本番の鍵、別 cell の鍵、別の用途族の鍵（例 内部 token）で署名した tenant.deletion.requested を配送する', expected: '処理せず隔離し警報する。sequence の処理済みに数えず、replay で真正な事象を取り直す（RO-11）'}
    - {id: 'LC-CV-11', name: '署名なし・封筒の改変', input: '(a) lcsig のない事象、(b) alg none の JWS、(c) 署名は正しいが封筒の source または type を書き換えた事象を配送する', expected: 'いずれも処理せず隔離し警報する（RO-11）'}
    - {id: 'LC-CV-12', name: '正本と食い違う削除要求', input: '正しく署名されているが、照会 API（モック）では request_id が存在しない、または対象テナントが削除要求の状態にない tenant.deletion.requested を配送する', expected: '削除を実行せず、outcome=failed（正本不一致）で報告し警報する（RO-12）'}
    - {id: 'LC-CV-13', name: '猶予中の撤回', input: 'tenant.deletion.requested の後、G_del の満了前に tenant.deletion.withdrawn を配送する。別の試行では撤回事象を落とし、照会 API だけが撤回を返す', expected: 'どちらも不可逆な削除を実行せず、outcome=withdrawn で報告する（RO-13、RO-12）'}
    - {id: 'LC-CV-14', name: '保全中の解除事象', input: '照会 API では保全が継続している hold_ref について、署名済みの tenant.legal_hold.released を配送する', expected: '削除を再開せず、正本不一致として報告し警報する（RO-12）'}
    - {id: 'LC-CV-16', name: '照会不能と古い読取り', input: '署名済みで正本とも一致する tenant.deletion.requested の猶予満了後に、照会 API（モック）が (a) 503 と Retry-After、(b) timeout、(c) 200 do_not_proceed / LQ11、(d) verdict 欄のない 200 を返す', expected: 'いずれも削除を実行せず保留し、(a) は Retry-After の後に再照会する。deadline までに proceed を得られなければ outcome=failed（照会不能）で報告する（RO-12、CON-15 QC-2〜QC-4）'}
    - {id: 'LC-CV-15', name: '破壊的事象の量の上限', input: '正しく署名され、照会 API（モック）でも有効な tenant.deletion.requested を、窓 W_burst の間に N_burst を超えるテナント分配送する', expected: 'N_burst を超えた分の不可逆な削除を実行せず保留し、SOC へ警報する。保留中も期限の管理を続ける（RO-14）'}
    - {id: 'LC-CV-17', name: '正例の署名（v1.1（I-11））', input: '(a) CON-13 の正例をそのまま配送する。(b) x-test-signing-vectors の 2 件を、その公開鍵を鍵マニフェストに登録し、期待する env を test にして配送する。(c) 同じ公開鍵の登録のまま、(b) の事象の sequence だけを書き換えて配送する', expected: '(a) 処理せず隔離し警報する（ダミーの署名。RO-11）。(b) 署名を検証して処理する（tenant.suspended は停止を反映、user.deletion.requested は可逆な準備だけで不可逆な削除はしない。RO-13）。(c) 処理せず隔離する（RO-11 (c)。§8.1 S-7）'}
    - {id: 'LC-CV-18', name: '照会 API の不適合応答・4xx・3xx（v1.1（I-10））', input: '署名済みで正本とも一致する削除要求の猶予満了後に、照会 API（モック）が (a) 400、(b) 403、(c) 404、(d) 302、(e) 500、(f) text/html の 200、(g) 要求と別の tid の proceed、(h) 未知の reason_code の do_not_proceed を返す', expected: 'いずれも削除を実行しない。区分と報告は CON-15 QC-9 のとおり。(a) RC-5・processing_error、(b) RC-6・state_query_unavailable と SOC 警報、(c) RC-7・source_of_truth_mismatch、(d) RC-4・Location を辿らない、(e) RC-3・再試行、(f)(g) RC-8・SOC 警報と再試行、(h) RC-9・source_of_truth_mismatch'}
  x-lint-notes: '版 0.6.0（v1.1）の検査: 2026-10-15 に本書の作成者が、@asyncapi/cli 4.1.1 の validate でエラー 0（valid、governance issues なし）、Redocly CLI 2.64.0 の lint（recommended、設定ファイルなし）でエラー 0・警告 1（info-license-strict。下記の版 0.1.0 の記録と同じ理由）、PyYAML の構文解析で成功を確かめた。改訂前の版 0.5.0 は @asyncapi/cli 4.1.1 の validate で invalid-ref のエラー 28 件を出していた（拡張 x-state-query-api の中の OpenAPI の $ref を AsyncAPI 文書のルートから解決するため）。v1.1（I-10）の切出しで解消した [M]。x-test-signing-vectors の 2 件は、CON-13 版 0.2.2 の正例と組み合わせて Node.js 22 の crypto.verify で署名・(iss, typ, kid, alg)・env・封筒の 9 欄との一致を検証して合格し、CON-13 の正例のダミーの lcsig はこの鍵で検証できないこと、sequence だけを書き換えると payload との不一致になることも確かめた（LC-CV-17 の (a)〜(c) の形）[M]。生データは作成者の一時作業領域にだけ置いた。 版 0.5.0（ラウンド 9）の検査: 本書の作成者が 2026-10-15 に Redocly lint 2.63.0（recommended、設定ファイルなし）でエラー 0・警告 1（info-license-strict。下記の版 0.1.0 の記録と同じ理由）、PyYAML の構文解析で成功を確かめた。規則 L-4 の一致検査（CON-11 §9.1 P-7）を CON-13 版 0.2.1 と行い、CloudEventEnvelope と CON-13 $defs/Envelope の required は一致し、const 3 件（specversion・datacontenttype・dataschema）も一致し、CON-13 のルートの examples 5 件はすべて要約に適合した。要約が受理した CON-13 の負例は LC-NE-03・05・06・07・10 の 5 件（data の形と source・partitionkey の pattern が要約にない、P-7 (4) の緩い点）。ReportEnvelope の required には CON-13 DeletionReport の datacontenttype・dataschema・partitionkey がない不一致が残る（CON-11 §14.2 の申し送り (1)、未対応）[M]。版 0.4.0 で追加した x-state-query-api（CON-15）の検査結果は同契約の x-lint-notes にある。版 0.4.0 の本ファイル全体の検査は §11 のラウンド 5（devlead）の記録にある。版 0.3.0 と版 0.2.0 は YAML としての構文解析（PyYAML）だけを確認し、Redocly lint と @asyncapi/parser は再実行していない。以下は版 0.1.0 の結果。Redocly lint 2.63.0（recommended）の警告 info-license-strict 1 件: License Object に url を置いていない。社内限定で公開 URL がないため（README §4.7 P-1）。AsyncAPI の構文は @asyncapi/parser で検証する（README §2.3 への記録は申し送り）。payload は封筒の要約スキーマを置き、正本の JSON Schema 2020-12（CON-13）は x-dataschema で参照する。CON-13 は CON-02 を絶対 URI の $ref で参照しており、parser の解決対象にすると未決の <id-domain> を取得しにいくためである。'
channels:
  tenantLifecycle:
    address: lifecycle.v1.tenants
    description: 'テナント・所属の事象。source=https://lifecycle.<id-domain>/tenants/<tid>、partitionkey=tenant:<tid>。順序キーは tid [D]。 address は論理名で、broker 上の名前は配備で決める（凍結しない）[D]。'
    messages:
      TenantCreated:
        $ref: '#/components/messages/TenantCreated'
      TenantSuspended:
        $ref: '#/components/messages/TenantSuspended'
      TenantResumed:
        $ref: '#/components/messages/TenantResumed'
      TenantTerminationEffective:
        $ref: '#/components/messages/TenantTerminationEffective'
      TenantDeletionRequested:
        $ref: '#/components/messages/TenantDeletionRequested'
      TenantDeletionWithdrawn:
        $ref: '#/components/messages/TenantDeletionWithdrawn'
      TenantDeleted:
        $ref: '#/components/messages/TenantDeleted'
      TenantMergeCutover:
        $ref: '#/components/messages/TenantMergeCutover'
      TenantSplitCutover:
        $ref: '#/components/messages/TenantSplitCutover'
      TenantCellMoveScheduled:
        $ref: '#/components/messages/TenantCellMoveScheduled'
      TenantCellMoveCutover:
        $ref: '#/components/messages/TenantCellMoveCutover'
      TenantLegalHoldSet:
        $ref: '#/components/messages/TenantLegalHoldSet'
      TenantLegalHoldReleased:
        $ref: '#/components/messages/TenantLegalHoldReleased'
      MembershipAdded:
        $ref: '#/components/messages/MembershipAdded'
      MembershipChanged:
        $ref: '#/components/messages/MembershipChanged'
      MembershipSuspended:
        $ref: '#/components/messages/MembershipSuspended'
      MembershipResumed:
