            description: 現在状態の一覧の 1 ページ
            headers:
              Cache-Control:
                $ref: '#/components/headers/CacheControlNoStore'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/SnapshotPage'
                examples:
                  tenants:
                    value:
                      kind: tenant
                      snapshot_at: '2026-10-15T03:00:05Z'
                      items:
                        - { tid: t5wq2hzr7nmc4ka3vd6pxe2bfy, state: A, cell: jp-east-1, legal_hold: false, hold_refs: [], open_requests: [], partition_last_sequence: '00000000000000000042', authoritative_as_of: '2026-10-15T03:00:05Z' }
                      next_cursor: 'c1q8w2e4r6t'
          '400':
            $ref: '#/components/responses/ProblemBadRequest'
          '403':
            $ref: '#/components/responses/ProblemForbidden'
          '429':
            $ref: '#/components/responses/ProblemTooManyRequests'
          '503':
            $ref: '#/components/responses/ProblemUnavailable'
  components:
    securitySchemes:
      workloadMtls:
        type: mutualTLS
        description: 呼出し元の依存サービスの workload ID（X.509 SVID など。ADR-009、DL-55）による相互 TLS。broker を経ず publisher 側の本 API と直接結ぶ（CON-12 RO-12、QC-5）。OpenAPI 3.1.2 は Security Scheme の type の有効な値に mutualTLS を含む [N][^oas]
    parameters:
      TidPath:
        name: tid
        in: path
        required: true
        description: テナント ID（CON-02 TenantId。不透明値）
        schema:
          $ref: '#/components/schemas/OpaqueId'
      SubPath:
        name: sub
        in: path
        required: true
        description: 主体 ID（CON-02 PrincipalId。不透明値）
        schema:
          $ref: '#/components/schemas/OpaqueId'
    headers:
      CacheControlNoStore:
        description: 照会結果を保存させない（QC-6）
        required: true
        schema: { type: string, const: no-store }
      RetryAfter:
        description: 再試行までの秒数（RFC 9110 §10.2.3 の delay-seconds の形だけを使う）
        required: false
        schema: { type: string, pattern: '^[0-9]+$' }
    responses:
      ProblemBadRequest:
        description: 要求の形が不正（LQ20）
        content:
          application/problem+json:
            schema:
              $ref: '#/components/schemas/Problem'
            example: { type: 'about:blank', title: Bad Request, status: 400, reason_code: LQ20 }
      ProblemForbidden:
        description: 呼出し元が登録簿にない、または対象が購読範囲外（LQ21）
        content:
          application/problem+json:
            schema:
              $ref: '#/components/schemas/Problem'
            example: { type: 'about:blank', title: Forbidden, status: 403, reason_code: LQ21 }
      ProblemNotFound:
        description: 対象が正本に存在しない（LQ22）。呼ぶ側は正本不一致として扱う
        content:
          application/problem+json:
            schema:
              $ref: '#/components/schemas/Problem'
            example: { type: 'about:blank', title: Not Found, status: 404, reason_code: LQ22 }
      ProblemTooManyRequests:
        description: レート制限（LQ23）。呼ぶ側は照会不能として保留する（QC-4）
        headers:
          Retry-After:
            $ref: '#/components/headers/RetryAfter'
        content:
          application/problem+json:
            schema:
              $ref: '#/components/schemas/Problem'
            example: { type: 'about:blank', title: Too Many Requests, status: 429, reason_code: LQ23 }
      ProblemUnavailable:
        description: 一時的に応答できない（LQ24）。呼ぶ側は照会不能として保留する（QC-4）
        headers:
          Retry-After:
            $ref: '#/components/headers/RetryAfter'
        content:
          application/problem+json:
            schema:
              $ref: '#/components/schemas/Problem'
            example: { type: 'about:blank', title: Service Unavailable, status: 503, reason_code: LQ24 }
    schemas:
      OpaqueId:
        description: 基盤が払い出す不透明識別子（CON-02 OpaqueId の写し。凍結前に $ref へ寄せる。CON-00 §4.9 D-7）。解析・正規化・大小同一視をしない
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^[\x21-\x7E]{1,64}$'
      Sequence:
        description: CON-13 の Sequence と同じ。20 桁 0 埋めの 10 進数
        type: string
        pattern: '^[0-9]{20}$'
      Timestamp:
        type: string
        format: date-time
      EventRef:
        description: 根拠にした事象（CON-13 Envelope の id・source・type・sequence）。QC-7
        type: object
        required: [id, source, type, sequence]
        properties:
          id: { type: string, minLength: 1, maxLength: 64 }
          source: { type: string, format: uri-reference, minLength: 1 }
          type: { type: string, minLength: 1, maxLength: 256 }
          sequence: { $ref: '#/components/schemas/Sequence' }
      VerificationRequest:
        description: 実行しようとする不可逆な処理（CON-12 RO-12 の列挙）ごとに必須項目が違う。action は閉じた列挙（delete_tenant_data・delete_principal_data・resume_deletion_after_hold_release・retarget_tenant_references・remove_membership_data）
        oneOf:
          - $ref: '#/components/schemas/VerifyDeleteTenantData'
          - $ref: '#/components/schemas/VerifyDeletePrincipalData'
          - $ref: '#/components/schemas/VerifyResumeDeletionAfterHoldRelease'
          - $ref: '#/components/schemas/VerifyRetargetTenantReferences'
          - $ref: '#/components/schemas/VerifyRemoveMembershipData'
      VerifyDeleteTenantData:
        type: object
        description: tenant.deletion.requested による削除の実行（RO-12、RO-13）
        required: [action, event, tid, request_id]
        properties:
          action: { type: string, const: delete_tenant_data }
          event: { $ref: '#/components/schemas/EventRef' }
          tid: { $ref: '#/components/schemas/OpaqueId' }
          request_id: { $ref: '#/components/schemas/OpaqueId' }
      VerifyDeletePrincipalData:
        type: object
        description: user.deletion.requested による削除の実行（RO-12、RO-13）
        required: [action, event, sub, request_id]
        properties:
          action: { type: string, const: delete_principal_data }
          event: { $ref: '#/components/schemas/EventRef' }
          sub: { $ref: '#/components/schemas/OpaqueId' }
          request_id: { $ref: '#/components/schemas/OpaqueId' }
      VerifyResumeDeletionAfterHoldRelease:
        type: object
        description: tenant/user.legal_hold.released による削除の再開（RO-12）。tid か sub の一方を必ず入れる（DL-49・DL-08 の保全の対象）
        required: [action, event, hold_ref]
        properties:
          action: { type: string, const: resume_deletion_after_hold_release }
          event: { $ref: '#/components/schemas/EventRef' }
          hold_ref: { $ref: '#/components/schemas/OpaqueId' }
          tid: { $ref: '#/components/schemas/OpaqueId' }
          sub: { $ref: '#/components/schemas/OpaqueId' }
        anyOf:
          - { required: [tid], properties: { tid: { $ref: '#/components/schemas/OpaqueId' } } }
          - { required: [sub], properties: { sub: { $ref: '#/components/schemas/OpaqueId' } } }
      VerifyRetargetTenantReferences:
        type: object
        description: tenant.merge.cutover・tenant.split.cutover による付け替え（RO-12）
        required: [action, event, tid, mapping_ref, request_id, role]
        properties:
          action: { type: string, const: retarget_tenant_references }
          event: { $ref: '#/components/schemas/EventRef' }
          tid: { $ref: '#/components/schemas/OpaqueId' }
          mapping_ref: { $ref: '#/components/schemas/OpaqueId' }
          request_id: { $ref: '#/components/schemas/OpaqueId' }
          role: { type: string, enum: [source, target], description: 'CON-13 TenantRestructureData の role' }
      VerifyRemoveMembershipData:
        type: object
        description: membership.removed に伴うデータの削除・移管（RO-12）
        required: [action, event, tid, sub, request_id]
        properties:
          action: { type: string, const: remove_membership_data }
          event: { $ref: '#/components/schemas/EventRef' }
          tid: { $ref: '#/components/schemas/OpaqueId' }
          sub: { $ref: '#/components/schemas/OpaqueId' }
          request_id: { $ref: '#/components/schemas/OpaqueId' }
      VerificationResult:
        type: object
        description: verdict=proceed のときの reason_code は LQ00 だけ、reason_code=LQ08 のときは grace_until が必須である。この 2 つの組合せの規則に反する応答を、呼ぶ側は不適合として扱い実行しない（QC-2、LQN-17）。組合せの規則は if/then で書くと lint の例検査が誤検知するため、本文と負例で定める
        required: [verification_id, verdict, reason_code, checked_at, authoritative_as_of, target, request_status, hold_status, mapping_status, partition_last_sequence]
        properties:
          verification_id: { $ref: '#/components/schemas/OpaqueId' }
          verdict:
            type: string
            enum: [proceed, do_not_proceed]
            description: 閉じた列挙。呼ぶ側は proceed 以外をすべて実行しない（QC-2）
          reason_code:
            type: string
            pattern: '^LQ[0-9]{2}$'
            description: 開いた列挙（§4）。呼ぶ側は未知の値を正本不一致として扱う（QC-3）
            x-enum-kind: open
            x-known-values: [LQ00, LQ01, LQ02, LQ03, LQ04, LQ05, LQ06, LQ07, LQ08, LQ09, LQ10, LQ11]
          checked_at: { $ref: '#/components/schemas/Timestamp' }
          authoritative_as_of: { $ref: '#/components/schemas/Timestamp' }
          target:
            type: object
            required: [kind, id, state]
            properties:
              kind: { type: string, enum: [tenant, principal, membership] }
              id: { type: string, minLength: 1, maxLength: 130, description: 'tenant は tid、principal は sub、membership は「tid/sub」' }
              state: { type: string, minLength: 1, maxLength: 32, description: 'TenantState・PrincipalState・MembershipState の state と同じ値' }
          request_status: { $ref: '#/components/schemas/RequestStatus' }
          hold_status: { type: string, enum: [active, released, unknown, not_applicable] }
          mapping_status: { type: string, enum: [valid, mismatch, unknown, not_applicable] }
          grace_until: { $ref: '#/components/schemas/Timestamp' }
          partition_last_sequence: { $ref: '#/components/schemas/Sequence' }
      RequestStatus:
        type: string
        enum: [in_grace, executable, withdrawn, completed, unknown, not_applicable]
        description: request_id の正本上の状態（CON-12 §4.1 Q-1 の「猶予中・撤回済み・実行可」に completed・unknown・not_applicable を加えた）。in_grace=猶予 G_del の満了前、executable=実行可、withdrawn=撤回済み、completed=基盤側で完了済み、unknown=最新の正本を読めない（LQ11）
      OpenRequest:
        type: object
        required: [request_id, request_type, status]
        properties:
          request_id: { $ref: '#/components/schemas/OpaqueId' }
          request_type: { type: string, minLength: 1, maxLength: 256, description: '要求を表す事象の type（CON-12 §2）' }
          status: { $ref: '#/components/schemas/RequestStatus' }
          grace_until: { $ref: '#/components/schemas/Timestamp' }
      TenantState:
        type: object
        required: [tid, state, cell, legal_hold, hold_refs, open_requests, partition_last_sequence, authoritative_as_of]
        properties:
          tid: { $ref: '#/components/schemas/OpaqueId' }
          state:
            type: string
            pattern: '^([A-Z][A-Z0-9]{0,3}|unknown)$'
            description: DL-49 §2.1 の主状態 ID（P・A・S1・S2・M・N・R・D・K・X・G）。開いた列挙。呼ぶ側は未知の値を「不可逆な処理の前提を満たさない」として扱う
            x-enum-kind: open
            x-known-values: [P, A, S1, S2, M, N, R, D, K, X, G, unknown]
          cell: { type: string, minLength: 1, maxLength: 64, description: '収容 cell の論理名（CON-12 §4.1 Q-1 (a)）。値の体系は凍結しない' }
          legal_hold: { type: boolean, description: 'DL-49 §2.1 の法的保全 H が掛かっているか' }
          hold_refs: { type: array, items: { $ref: '#/components/schemas/OpaqueId' }, description: '有効な保全の hold_ref（CON-13 LegalHoldData）。legal_hold=false なら空' }
          merged_into: { $ref: '#/components/schemas/OpaqueId', description: 'state=G のとき統合先の tid' }
          open_requests: { type: array, items: { $ref: '#/components/schemas/OpenRequest' } }
          partition_last_sequence: { $ref: '#/components/schemas/Sequence' }
          authoritative_as_of: { $ref: '#/components/schemas/Timestamp' }
      PrincipalState:
        type: object
        required: [sub, state, cell, legal_hold, hold_refs, open_requests, partition_last_sequence, authoritative_as_of]
        properties:
          sub: { $ref: '#/components/schemas/OpaqueId' }
          state:
            type: string
            pattern: '^[a-z][a-z_]{0,31}$'
            description: DL-08 §4 SM-P の状態（pending=未確認、active=有効、suspended=停止、pending_deletion=削除猶予、deleted=削除済）。開いた列挙。非人間主体の扱いは CON-12 LC-OI-2 で未決
            x-enum-kind: open
            x-known-values: [pending, active, suspended, pending_deletion, deleted, unknown]
          cell: { type: string, minLength: 1, maxLength: 64, description: '主体の正本を収容する cell の論理名（CON-12 §4.1 Q-1 (b)）' }
          legal_hold: { type: boolean }
          hold_refs: { type: array, items: { $ref: '#/components/schemas/OpaqueId' } }
          open_requests: { type: array, items: { $ref: '#/components/schemas/OpenRequest' } }
          partition_last_sequence: { $ref: '#/components/schemas/Sequence' }
          authoritative_as_of: { $ref: '#/components/schemas/Timestamp' }
      MembershipState:
        type: object
        required: [tid, sub, state, open_requests, partition_last_sequence, authoritative_as_of]
        properties:
          tid: { $ref: '#/components/schemas/OpaqueId' }
          sub: { $ref: '#/components/schemas/OpaqueId' }
          state:
            type: string
            pattern: '^[a-z][a-z_]{0,31}$'
            description: DL-08 §7.1 SM-M の状態（active=有効、suspended=停止、removed=除去）。開いた列挙
            x-enum-kind: open
            x-known-values: [active, suspended, removed, unknown]
          open_requests: { type: array, items: { $ref: '#/components/schemas/OpenRequest' } }
          partition_last_sequence: { $ref: '#/components/schemas/Sequence', description: '所属の事象はテナントのパーティション（tenant:<tid>）で送るので、その最終番号' }
          authoritative_as_of: { $ref: '#/components/schemas/Timestamp' }
      MappingState:
        type: object
        description: 統合・分割の対応表への参照の状態。対応表の中身（件ごとの写像）は返さず、digest だけを返す。受信側は付け替えに使う対応表の digest を照合する [D]
        required: [mapping_ref, status, kind, request_id, source_tid, target_tid, mapping_digest, authoritative_as_of]
        properties:
          mapping_ref: { $ref: '#/components/schemas/OpaqueId' }
          status: { type: string, enum: [valid, revoked, unknown], description: 'unknown は最新の正本を読めない場合（QS-1）' }
          kind: { type: string, enum: [merge, split] }
          request_id: { $ref: '#/components/schemas/OpaqueId' }
          source_tid: { $ref: '#/components/schemas/OpaqueId' }
          target_tid: { $ref: '#/components/schemas/OpaqueId' }
          mapping_digest: { type: string, pattern: '^sha-256:[0-9a-f]{64}$', description: '対応表の正準形の SHA-256（正準形の定義は DL-49 §8 の所有者が決める。未決）' }
          authoritative_as_of: { $ref: '#/components/schemas/Timestamp' }
      SnapshotPage:
        type: object
        required: [kind, snapshot_at, items]
        properties:
          kind: { type: string, enum: [tenant, principal, membership] }
          snapshot_at: { $ref: '#/components/schemas/Timestamp' }
          items:
            type: array
            items:
              oneOf:
                - $ref: '#/components/schemas/TenantState'
                - $ref: '#/components/schemas/PrincipalState'
                - $ref: '#/components/schemas/MembershipState'
          next_cursor: { type: string, minLength: 1, maxLength: 512, description: '続きがなければ省く' }
      Problem:
        description: RFC 9457 の problem details（CON-02 Problem と同じ形にする。凍結前に $ref へ寄せる。CON-00 §4.9 D-7）
        type: object
        required: [type, title, status]
        properties:
          type: { type: string }
          title: { type: string }
          status: { type: integer }
          detail: { type: string }
          reason_code: { type: string, pattern: '^LQ[0-9]{2}$' }
