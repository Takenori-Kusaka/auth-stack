asyncapi: 3.1.0
info:
  title: Lifecycle events for dependent services
  version: 0.5.0
  description: |
    文書ID: CON-12 / 成果物: DL-117 / 版: 0.5.0 / 状態: draft / 最終更新: 2026-10-15（0.5.0: 模擬パネル ラウンド 9 の devlead 指摘により、CON-13 版 0.2.0（現行 0.2.1）で適用済みの §10 H2-3 を本書の記述に揃えた。§2 の表と x-dataschema-note・CloudEventEnvelope.lcsig の「CON-13 への追加は申し送り」を外し、RO-8・RO-12・RO-14 と LC-CV-07 に CON-13 DeletionReport の failure_reason（outcome=failed のとき必須）の値を書き込んだ。failure_reason の必須化は CON-13 版 0.2.0 で既に生じている義務で、本書はその写しである。事象・配送の保証・受信側の義務の中身は変えていない。0.4.0: 模擬パネル ラウンド 5 の devlead 指摘により、照会 API の契約本体（OpenAPI 3.1.2、preview）を CON-15（案）・DL-121（案）として本ファイルの拡張 `x-state-query-api` に起草し、RO-9・RO-12・§4.1・§6〜§8・§10・LC-OI-3 をそれに結び付け、LC-CV-16 を加えた。文書ID と DL は traceability/deliverables.md §4.5 で確定済みのため「案」を外した（CON-00 §9 申し送り 12）。0.3.0: 模擬パネル ラウンド 5 の redteam 指摘により、照会 API の契約を CON-15（案）として起票し、RO-12 に照会 API の publisher からの分離、RO-14（破壊的処理の量の上限）、LC-CV-15 を加えた。模擬パネルは自己レビューであり、実在の CTO/CISO の決裁ではない）

    本契約は、基盤が組織内の依存サービス（約 300 [A-050]）へ配るライフサイクル事象（テナント・利用者・所属・大規模な権限剥奪）と、
    受信側が返す完了報告を定める（G-137）[D]。ADR-022 D-2 の「イベント配送」行（CloudEvents 1.0.2・AsyncAPI 3.x）を具体化したものである [D]。
    事象の意味と受信側の義務の正本は DL-49 §7（テナント）と DL-08 §16.3（利用者・所属）で、本書はそれを機械可読の契約に写し、
    両書が「11_contracts で決める」とした封筒・順序・冪等・replay・配送失敗・完了報告の形を決める [D]。
    封筒と data の形は 11_contracts/schemas/lifecycle-event.schema.json（CON-13）が正本である [D]。

    ## 1. 位置付け
    - 送信者は基盤のライフサイクル publisher（テナント状態・主体台帳の変更を outbox から送る部品）で、本書の `operations` の action は publisher から見た向きで書く。AsyncAPI 3.1.0 は、application が channel へ送る場合を `send`、受け取る場合を `receive` とする [N][^aa]。
    - 受信者は組織内の依存サービスである。組織外（顧客 IdP、外部 RP、外部連携アプリ）へは本契約を使わず、SSF/CAEP/RISC（CON-09・CON-10）を使う（§5）[D]。
    - 停止の効力は事象の受信に依存させない。停止は token 検証・introspection・PDP のテナント状態ガードで中央強制し、事象は非同期処理の停止、キャッシュと独自 session の破棄、データの削除に使う（DL-49 §7.1、DL-08 §16.3、ADR-006 D6-03）[D]。
    - broker 製品・配送経路・protocol binding は凍結しない（ADR-022 D-2）。このため `servers` を置かない。binding は publisher の配備で決め、本書の配送の保証を満たすことを DL-80 で試験する [D]。
    - 事象の真正性は broker と配送経路に依存させない。broker を経由すると、受信側の相互 TLS が認証するのは broker であって publisher ではないためである [D]。RFC 9967 は、SET の publisher が受信者と直接通信しない経路では第三者が事象を差し込み得るとし、受信者に JWS 署名で発信者を検証することを MUST とする [N][^9967]（RS-14#35）。本契約はこれをライフサイクル事象に準用し、メッセージ単位の署名（PO-13）と受信側の検証（RO-11）を GA の義務にする [D]。
    - 破壊的・不可逆な処理（削除、保全の解除による削除の再開、テナント参照の付け替え、所属除去に伴うデータ処理）は、署名を検証した事象であっても事象だけを根拠に実行しない。受信側は実行の直前に正本状態を照会 API（LC-OI-3。契約は CON-15 案で、本体は本ファイルの `x-state-query-api`。§4.1）で確かめる（RO-12）[D]。この攻撃経路（事象の注入・偽造・再送による付け替えと大量削除）は THR-03 T-093、残余リスクは DCS-05 RRG-073 である [D]。

    ## 2. 事象の一覧と受信側の義務（G-137 の列挙を全件）
    type はすべて `example.id-domain.lifecycle.` を前置する（<id-domain> の reverse-DNS。値は未決、LC-OI-1）。表では前置を省く [D]。
    期限欄の値はすべて TBD であり、DL-20（07_slo）で SLI を採番して決める（§7）[D]。

    | type | 順序キー | 区分 | 受信側の義務 | 期限（SLI） | 完了報告 | 受信できない場合 |
    |---|---|---|---|---|---|---|
    | tenant.created | tenant:<tid> | GA | 必要なサービスだけ区画を準備する | 義務なし | 不要 | replay で後追いする |
    | tenant.suspended（mode） | tenant:<tid> | GA | 当該テナントの非同期ジョブ、外部送信、キャッシュ済みデータの提供を止め、独自 session を無効にする | T_susp（TBD） | 不要 | 対話的アクセスは中央強制で止まる。非同期処理の停止漏れは KRI 候補 |
    | tenant.resumed | tenant:<tid> | GA | 止めた処理を再開する | 義務なし | 不要 | replay |
    | tenant.termination.effective | tenant:<tid> | GA | 新規処理を止め、エクスポートを支援する | 契約終了時刻 | 不要 | 中央強制で止まる |
    | tenant.deletion.requested | tenant:<tid> | GA | 当該テナントのデータを削除し、報告する。不可逆な削除は、猶予 G_del の経過後に正本照会で要求が有効であることを確かめてから行う（RO-12、RO-13） | T_del（法域別、TBD。G_del を含む） | 要 | 削除証明に「未報告」と記載し、サービス所有者へエスカレーション |
    | tenant.deletion.withdrawn | tenant:<tid> | GA | 猶予中の削除要求（request_id）を取り消し、準備した削除を実行しない | 猶予の満了前 | 要（outcome=withdrawn。CON-13 版 0.2.0 の DeletionReport で定義済み） | 猶予満了時の正本照会（RO-12）で撤回を検知する |
    | tenant.deleted | tenant:<tid> | GA | tid を再利用しない。残った参照を墓石として扱う | — | 不要 | — |
    | tenant.merge.cutover（role） | 統合元・統合先の両方 | GA | 保存しているテナント参照と所有属性を付け替える。付け替えの前に mapping_ref と request_id を正本照会で確かめる（RO-12） | 移行期間（TBD） | 要（件数） | 付け替えの完了まで統合元の墓石化を保留する |
    | tenant.split.cutover（role） | 分割元・分割先の両方 | GA | 同上 | 同上 | 要（件数） | 同上 |
    | tenant.cell_move.scheduled / cutover | tenant:<tid> | preview | cell を意識するサービス（routing、キャッシュ）だけ対応する | 切替前（予告で通知） | 不要 | 旧側からの転送で吸収する |
    | tenant.legal_hold.set / released | tenant:<tid> | GA | 削除を止める・再開する。set は受信後すぐ反映する（安全側）。released による削除の再開は、正本照会で保全の解除（hold_ref）を確かめてから行う（RO-12） | 受信後すぐ（TBD） | 要 | 未反映を法務へ報告する |
    | membership.added | tenant:<tid> | GA | 必要なサービスだけ区画を準備する | 義務なし | 不要 | replay |
    | membership.changed | tenant:<tid> | GA | キャッシュした権限・属性を破棄する | T_user_chg（TBD） | 不要 | 判定は中央。破棄漏れは KRI 候補 |
    | membership.suspended | tenant:<tid> | GA | 当該主体の当該テナント文脈の非同期ジョブ・外部送信・キャッシュ済みデータの提供を止め、独自 session を無効にする | T_user_susp（TBD） | 不要 | 中央強制で止まる。停止漏れは KRI 候補 |
    | membership.resumed | tenant:<tid> | GA | 止めた処理を再開する | 義務なし | 不要 | replay |
    | membership.removed | tenant:<tid> | GA | 当該テナント文脈の処理を止め、独自 session を無効にし、テナントの方針に従ってデータを扱う。処理の停止と session の無効化は受信後すぐ行い（安全側）、データの削除・移管は正本照会で除去を確かめてから行う（RO-12） | T_user_rm（TBD） | 要（件数） | 未報告を所有者へエスカレーション |
    | user.created | principal:<sub> | GA | 必要なサービスだけ準備する | 義務なし | 不要 | replay |
    | user.suspended | principal:<sub> | GA | 全テナント文脈で membership.suspended と同じ（テナント単位で購読するサービスは membership.suspended だけを受ければよい） | T_user_susp（TBD） | 不要 | 同上 |
    | user.resumed | principal:<sub> | GA | 止めた処理を再開する | 義務なし | 不要 | replay |
    | user.deletion.requested | principal:<sub> | GA | 主体の個人データを削除し、報告する。不可逆な削除は、猶予 G_del の経過後に正本照会で要求が有効であることを確かめてから行う（RO-12、RO-13） | T_user_del（法域別、TBD。G_del を含む） | 要 | 削除証明に「未報告」と記載し、エスカレーション |
    | user.deletion.withdrawn | principal:<sub> | GA | 猶予中の削除要求（request_id）を取り消す | 猶予の満了前 | 要（outcome=withdrawn） | 猶予満了時の正本照会で撤回を検知する |
    | user.deleted | principal:<sub> | GA | 主体の識別子を再利用しない | — | 不要 | — |
    | user.legal_hold.set / released | principal:<sub> | GA | 削除を止める・再開する（released は tenant の行と同じく正本照会の後） | 受信後すぐ（TBD） | 要 | 未反映を法務へ報告する |
    | revocation.bulk | 範囲の順序キー（platform を含む） | preview | not_before より前に確立した独自 session とキャッシュを無効にする | ARC-09 の R(t)（SLI-050〜SLI-052）の内数（TBD） | 不要 | 効力は基盤の強制点で生じる（ARC-09） |

    - tenant.deletion.withdrawn と user.deletion.withdrawn は G-137 の列挙にない。ラウンド2の指摘への是正として本書で追加した（猶予中の撤回、RO-13）。DL-49 §7・DL-08 §16.3 への追記は申し送る（§10）[D]。
    - user.suspended のとき、publisher は主体の有効な所属ごとに membership.suspended（reason_class=principal_suspended）を各テナントのパーティションへ出す。これにより「順序キーは tid」の購読だけで所属単位の停止を受け取れる [D]。
    - 停止の理由は区分（reason_class）だけを載せ、SEC の詳細は載せない（DL-08 §16.3）[D]。
    - 事象には主体 ID・テナント ID・種別だけを載せ、email などの属性を載せない [D]。SP 800-63C-4 は shared signal に対象アカウントの特定に必要な範囲を超える個人情報を含めないこと（SHALL NOT）を求めている [N][^63c]（RS-14#61）。本契約は組織内の事象だが、同じ最小化を準用する（DL-08 §16.3）[D]。

    ## 3. 配送の保証（publisher の義務 PO）
    | ID | 項目 | 規定 | 根拠 |
    |---|---|---|---|
    | PO-1 | 封筒 | CloudEvents 1.0.2 の JSON 形式（structured mode）。media type は `application/cloudevents+json`（JSON 形式の封筒はこの media type を使わなければならない（MUST））[N][^cejson]。REQUIRED 属性は id・source・specversion・type [N][^ce]（RS-16#9） | ADR-022 D-2 |
    | PO-2 | 配送 | at-least-once。状態の書込みと同じ取引で outbox に記録し、確定後に送る [D] | DL-49 §7.2 |
    | PO-3 | 冪等キー | (source, id)。producer は source＋id を事象ごとに一意にしなければならない（MUST）。再送時は同じ id でよく（MAY）、consumer は source と id が同じ事象を重複とみなしてよい（MAY）[N][^ce]。本契約は再送・replay で id を変えないことを MUST にする [D] | RS-16#9 |
    | PO-4 | 順序キー | source をパーティション（https://lifecycle.<id-domain>/tenants/<tid>、/principals/<sub>、/platform）にし、partitionkey に同じ値（tenant:<tid> など）を入れる。順序はパーティション内だけで保証し、パーティションをまたぐ順序は保証しない [D] | Sequence 拡張の順序は単一の event source の中の位置である [N][^ceseq]。Partitioning 拡張の partitionkey は REQUIRED で、中継で変わり得る [N][^cepart] |
    | PO-5 | 順序番号 | sequence 拡張属性。20 桁 0 埋めの 10 進数で、パーティションごとに 1 から 1 ずつ増やす（連続）。sequencetype は付けない [D] | 拡張は sequence を辞書順に並べられる空でない文字列（MUST）とし、単調増加・連続を RECOMMENDED とする。sequencetype がない場合の解釈は producer との帯域外の取決めに委ねる [N][^ceseq]。Integer 型は 2^31−1 で折り返すため使わない [N][^ceseq][D] |
    | PO-6 | 版 | dataschema に CON-13 の `$id`（major を含む）を入れる。data の非互換な変更は dataschema の major を上げ、type は変えない [D] | dataschema の非互換な変更は別の URI で表すべき（SHOULD）[N][^ce]（RS-16#10）、README I-1 |
    | PO-7 | 再送 | 確認応答がなければ、ランダム化した指数 backoff で再送し、回数に上限 N_retry（TBD）を置く [D] | SRE 本は再試行にランダム化した指数 backoff を必ず使い、request ごとの再試行回数を制限することを求める [V][^sre]（RS-09#38） |
    | PO-8 | 配送失敗 | N_retry を超えた事象は publisher 側の dead letter に移し、受信サービスの所有者と基盤チームへ警報する。dead letter の件数と最古の齢を KRI 候補にする（DL-49 §7.2）。dead letter に移しても、後続の事象の配送はそのパーティションで止める（順序を壊さないため）[D] | DL-49 §7.2 |
    | PO-9 | replay | 送った事象を W_replay（TBD）保持し、replayRequests channel の要求で同じ id・sequence のまま再配送する [D] | DL-49 §7.2・§13 |
    | PO-10 | 認証・broker の権限 | publisher と受信者は workload ID で相互に認証する（DL-55）。購読できるサービスは登録制にする [D]。broker の権限は次に限る [D]。(a) 事象の channel（tenantLifecycle・principalLifecycle・platformLifecycle）へ書き込めるのは環境・cell ごとのライフサイクル publisher の workload ID だけ。(b) 受信サービスは読取りだけ。(c) deletionReports・replayRequests は登録済みの受信サービスが書き、publisher だけが読む。broker の ACL の実構成と (a)〜(c) の差分を本番の日次走査（dfd-entry-points H6・AC-09 の対象に追加）で検出し、差分を警報にする [D]。broker を経由する経路では相互 TLS が認証するのは broker なので、本項は事象の真正性の根拠にならず、真正性は PO-13・RO-11 で担保する [D] | DL-49 §7.2、RFC 9967 §5 [N][^9967]（RS-14#35） |
    | PO-11 | 秘匿 | context attributes に機微情報を載せない。CloudEvents は context attributes に機微情報を載せるべきでない（SHOULD NOT）とし、producer・consumer・中継者がそれを検査・記録してよい（MAY）とする [N][^ce]（RS-17#32）。source と partitionkey には不透明 ID（tid・sub）だけを入れる [D] | ADR-022 D-8-7 |
    | PO-12 | 完了報告の追跡 | 完了報告が要る事象は、受信サービスの登録簿（データ保有の申告。DL-57 の経路台帳と照合）に載る全サービスから報告を集め、期限に未報告のサービスを削除証明に「未報告」と記載し、所有者へエスカレーションする [D] | DL-49 §7.1・§10.4 |
    | PO-13 | メッセージ単位の署名 | すべての事象（§2）に拡張属性 `lcsig` を付け、JWS Compact Serialization を入れる [D]。JWS の payload は、封筒の id・source・type・specversion・sequence・partitionkey・time・dataschema・data と、発行者 `iss`（環境・cell ごとの publisher を表す不透明 URI）・環境 `env` を持つ JSON object とする [D]。protected header には alg・kid・typ（`lifecycle-event+jws`）を置く [D]。署名鍵は ADR-007 の鍵階層の専用鍵（L2 の用途族「ライフサイクル事象の署名」、環境別・cell 別、1 鍵 1 alg）とし、他の用途族と共有しない [D]。受信側が処理に使う値は検証した JWS の payload の値であり、封筒の値は routing 用に限る。これにより中継で JSON の表現が変わっても正規化に依存せずに検証できる [D]。用途族と platform パーティションの鍵スコープは ADR-007 への申し送りで決める（§10、LC-OI-8）[D] | 属性名は小文字の英数字に限り（MUST）、20 文字以下が SHOULD [N][^ce]。CloudEvents は data の保護の方式を producer と consumer の取決めに委ねる [N][^ce]。JWS の alg は署名アルゴリズムを示し、kid は鍵の選択に使う [N][^7515]（RS-11#52）。種別の異なる JWT の検証規則は相互排他にする（MUST）、その手段に種別ごとの鍵の分離と明示的な typ がある [N][^8725]（RS-05#37）。本書はこれを JWS に準用する [D]。RFC 9967 §5 [N][^9967]（RS-14#35） |

    ## 4. 受信側の義務（RO）
    | ID | 義務 |
    |---|---|
    | RO-1 | 購読は workload ID で認証する（PO-10）。publisher 以外から届いた事象を処理しない。publisher が発行したかは broker との相互 TLS ではなく RO-11 の署名検証で判定する [D] |
    | RO-2 | 確認応答（ack）の前に事象を永続化する。RFC 9967 は SCIM の SET の受信側に、確認応答の前に自身の復旧要件を満たすよう event を永続化することを MUST とする [N][^9967]（RS-14#35）。本契約はこれを準用する [D] |
    | RO-3 | (source, id) で重複を除き、同じ事象を 2 回処理しない。重複判定の記録は W_replay 以上保持する [D] |
    | RO-4 | パーティションごとに sequence の順に処理する。処理済みの番号以下の事象は重複として ack だけ返す。欠番を検知したら後続を保留し、G_gap（TBD）以内に埋まらなければ replay を要求する [D] |
    | RO-5 | 未知の type、未知の data 欄、開いた列挙の未知の値は、受理して無視する（未知の type を dead letter に送らない）。type の追加を互換な追加（minor）にするためである [D]。RFC 9457 は client に認識できない拡張メンバを無視することを MUST とし [N][^9457]（RS-16#12）、JWT は理解できない claim を無視することを MUST とする [N][^7519]（RS-16#14）。同じ考え方を事象に写した [D] |
    | RO-6 | §2 の義務を期限内に果たす。独自 session を持つサービスは、tenant.suspended・membership.suspended・membership.removed・user.suspended・revocation.bulk で無効にする（ONB-R9）[D] |
    | RO-7 | 完了報告が要る事象（§2）は、deletionReports channel へ deletion.report を期限内に送る。データを持たない場合も outcome=not_applicable で報告する（未報告と区別するため）[D]。削除しなかったデータは exceptions に根拠と保持期限を書く（DL-49 §10.4 の削除証明に写す）[D] |
    | RO-8 | 処理に失敗した事象は自サービスの dead letter に移し、黙って ack しない。dead letter にある削除要求も期限は変わらず、期限までに outcome=failed・failure_reason=processing_error で報告する [D]。CON-13（版 0.2.0 以降）の DeletionReport は outcome=failed のとき failure_reason を必須とし、既知の値は source_of_truth_mismatch（正本不一致）・state_query_unavailable（照会不能）・processing_error（受信側の処理失敗）・other である。基盤は未知の値を other と同じに扱う [D] |
    | RO-9 | 受信できない期間が W_replay 以内なら、最後に処理した sequence から replay で復旧する。W_replay を超えたら、例外台帳（DL-05）に登録し、現在状態の照会（LC-OI-3。CON-15 の listReconciliationSnapshot で全件を取り、各項目の partition_last_sequence から replay を再開する）で全件を突き合わせてから処理を再開する。その間も停止は中央強制で効く [D] |
    | RO-10 | 事象を認可の根拠にしない。事象に基づく処理は、実行時に基盤の判定で再認可する（ADR-022 D-8-7）[D]。破壊的・不可逆な処理は再認可に加えて RO-12 の正本照会を要し、事象だけでは実行しない [D] |
    | RO-11 | 署名の検証。すべての事象について、処理の前に `lcsig` の JWS を検証する [D]。(a) 鍵は L1 署名付き鍵マニフェストから得て、(iss, typ, kid) → 許可鍵集合の表にない組合せを拒否する（ADR-007 D7-21）。(b) alg は鍵に固定した値だけを受け入れ、alg none を拒否する（ADR-007 D7-22）。(c) iss と env が自環境の publisher と一致し、source・type・id・sequence・partitionkey が JWS の payload と一致する [D]。署名がない、検証できない、または不一致の事象は処理せず、隔離領域に移し、所有者と SOC へ警報する [D]。この事象は sequence の処理済みに数えない。同じ番号の真正な事象は RO-4 の replay で取り直す [D]。RFC 9967 は publisher と直接通信しない受信者に JWS による発信者の検証を MUST とする [N][^9967]（RS-14#35）。RFC 8725 は鍵が issuer に属することの検証を MUST とする [N][^8725]（RS-05#36） |
    | RO-12 | 破壊的・不可逆な処理の前の正本照会。tenant.deletion.requested・user.deletion.requested（削除の実行）、tenant/user.legal_hold.released（削除の再開）、tenant.merge.cutover・tenant.split.cutover（付け替え）、membership.removed（データの削除・移管）は、実行の直前に照会 API（LC-OI-3。CON-15 の verifyLifecycleAction）で、対象の状態と request_id（保全は hold_ref、付け替えは mapping_ref）が事象と一致し、要求が撤回されていないことを確かめる [D]。実行してよいのは verdict=proceed の応答を得た場合だけで、理由コードから報告への写像は CON-15 の QC-2〜QC-4 による [D]。一致しなければ実行せず、outcome=failed・failure_reason=source_of_truth_mismatch（正本不一致）で報告し、SOC へ警報する [D]。照会 API（CON-15 案）は、テナント状態・主体台帳の正本を読む読取り専用の部品とし、publisher（outbox から送る部品）とは別の workload ID・別の配備にする。受信側は broker を経ずに相互 TLS で直接呼ぶ [D]。publisher だけを侵害した者が、事象と照会の結果を同時に偽れないようにするためである（THR-03 T-093 の攻撃経路 (d)。ラウンド 5 で追加）[D]。照会 API に届かない場合は実行を保留し、期限内に届かなければ outcome=failed・failure_reason=state_query_unavailable（照会不能）で報告する（削除の遅延を偽造の受理より優先する）[D] |
    | RO-13 | 削除の猶予。deletion.requested を受けたら、猶予 G_del（TBD）が満了するまで不可逆な削除を実行しない。猶予中は可逆な準備（処理の停止、削除予定の印）だけを行い、deletion.withdrawn を受けたら準備を戻して outcome=withdrawn で報告する [D]。猶予満了時は撤回事象の受信の有無にかかわらず RO-12 の照会を行い、その結果で実行の可否を決める（撤回事象の偽造で削除を止められても、正本照会で検知できる）[D] |
    | RO-14 | 破壊的処理の量の上限（案。ラウンド 5 で追加）。受信側は、窓 W_burst（TBD）の間に実行しようとする破壊的・不可逆な処理（RO-12 の対象）の対象テナント数・主体数が N_burst（TBD）を超えたら、超えた分の実行を保留し、SOC と所有者へ警報する。基盤の確認（照会 API の正本状態と、正本側の二者承認の記録）を得てから再開する [D]。保留中も可逆な準備は行い、期限は変えない。期限に間に合わなければ outcome=failed・failure_reason=other で報告する（量の上限による保留を表す既知の値は CON-13 にない。値の追加は §10 H9-1）[D]。署名も正本照会も通る事象（publisher と照会 API の同時侵害、正本への誤った要求の登録）による大量削除の範囲を限るためである（THR-03 T-093）[D] |

    ### 4.1 照会 API の契約 CON-15（案）の起票（ラウンド 5）
    LC-OI-3 の照会 API を、契約 CON-15（案）「ライフサイクル状態の照会 API」として起票する。本節は最小要件を定める [D]。契約本体（OpenAPI 3.1.2、版 0.1.0、preview）は、版 0.4.0 で本ファイルの拡張 `x-state-query-api` に起草した（ラウンド 5 の devlead 指摘）。並行作業の約束で新しいファイルを作れないためであり、単独ファイルへの切出しは §10 H5-1 で申し送る。最小要件と operation の対応は同契約の description §0 にある [D]。所有者は DL-49 の所有者＋プラットフォームチーム長、期限は DEC-8 第 1 段の付議前とする [D]。契約一覧（11_contracts/README.md）と成果物計画への登録は申し送る（§10 H3-3）[D]。
    
    | # | 最小要件 |
    |---|---|
    | Q-1 | 操作は読取りだけとする。(a) テナントの現在状態（状態、収容 cell、保全の有無と hold_ref、有効な削除要求の request_id と状態（猶予中・撤回済み・実行可））。(b) 主体の現在状態（(a) と同じ項目）。(c) mapping_ref の有効性と内容（統合・分割の対応表の digest、request_id、役割）。(d) RO-9 の全件突合のための一括照会（受信サービスが保持するテナント・主体の一覧に対する状態。ページング付き）[D] |
    | Q-2 | 配置は publisher と別の workload ID・別の配備とし、正本（テナント状態・主体台帳）を読む [D]。撤回・保全の判定は最新の書込みを反映した読取りで返す。古い読取りしか返せない場合は状態 `unknown` を返し、受信側は実行を保留する（RO-12 の「届かない場合」と同じ扱い）[D]。古い読取りで撤回を見落とすと、撤回済みの削除を実行してしまうためである [D] |
    | Q-3 | 認証は受信サービスの workload ID による相互 TLS とし、broker を経ない [D]。呼べるのは受信サービスの登録簿（LC-OI-4）に載るサービスだけとし、照会を監査記録に残す [D] |
    | Q-4 | 応答には不透明 ID（tid・sub）と状態だけを載せ、属性を載せない（PO-11 と同じ最小化）[D] |
    | Q-5 | 照会 API は GA の前提である（§6）。凍結区分は本契約と同じく、識別子と応答の状態の列挙値を irreversible、操作を GA とする案である [D] |

    ## 5. SSF/CAEP（セキュリティ事象）との役割分担
    | 観点 | SSF/CAEP/RISC（CON-09・CON-10） | 本契約（ライフサイクル事象） |
    |---|---|---|
    | 目的 | セキュリティ事象（session 失効、資格情報の変更、アカウント無効化など）の伝達 | 業務・データの所有と存続（作成、停止、統合、分割、移動、削除、所属変更）の伝達と、受信側の後始末の義務 |
    | 受信者 | 組織外（trust agreement を結んだ顧客の受信者、外部連携アプリ）。内部の約 300 サービスを SSF の受信者にしない（ADR-006 D6-25） | 組織内の依存サービス |
    | 形式 | SET（RFC 8417、secevent+jwt）、push/poll（RFC 8935・RFC 8936） | CloudEvents 1.0.2（JSON 形式） |
    | 完了報告 | なし | 削除・付け替え・保全の反映は deletion.report で報告する |
    | 同時に出す場合 | テナント強制停止（T06）では、SSF/CAEP でテナントを主体とする session 失効を、本契約で tenant.suspended（mode=forced）を出す（DL-49 §7.3）。SEC による主体の停止も両方に出す（DL-08 §16.3） | 同左 |
    | 効力 | どちらも配送の成否は強制に影響しない（ADR-006 D6-03） | 同左 |

    ## 6. 凍結区分（README §4.6）
    - irreversible: type の名前（deletion.withdrawn の 2 つを含む）、source の形、拡張属性名（sequence・partitionkey・lcsig）、順序キーの意味 [D]。
    - GA: 封筒、§3 の配送の保証（PO-13 の署名を含む）、§4 の受信側の義務の枠（RO-11〜RO-13 を含む）、GA の type の data、deletion.report [D]。
    - GA の前提: 照会 API（LC-OI-3。契約は CON-15 案。版 0.4.0 で本体を preview として起草したが、GA への昇格は未了）と署名鍵の用途族（LC-OI-8。ADR-007 版 0.2 で族 9 を案として追加、DEC-3 で決裁）が揃うまで、本契約の GA の凍結（DEC-8 第 1 段）を付議しない。DEC-8 第 1 段の前提条件としての明記は DCS-03 へ申し送る（§10 H3-2）。両者が揃わないまま第 1 段に進んだ場合は DCS-05 RRG-073 が失効する（ラウンド 5 で追加）。RO-11・RO-12 が実装できないためである [D]。
    - preview（x-preview-expires: 2027-10-15）: tenant.cell_move.*、revocation.bulk（意味の正本は DL-56）、replay.request [D]。
    - 期限・保持期間などの数値はすべて TBD で、値を決めることは制約を強める変更として扱う（README §6.1）[D]。

