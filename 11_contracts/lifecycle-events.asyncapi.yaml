    | 1 | 1 | Critical | G-137・I-11: 依存サービスへのライフサイクル事象の契約がない | 本契約を新規に作成した（版 0.1.0） | 本ファイル全体 |
    | 2 | 1 | High | 事象の真正性が workload ID の相互認証（PO-10）と RO-1 だけに依る。broker 経由では受信側の mTLS は broker を認証するので、broker の ACL の誤り・侵害、broker に書き込める workload の侵害で偽造を見分けられない。偽造した deletion.requested 1 件で全サービスに不可逆な削除を起動でき、legal_hold.released・merge/split.cutover も同様。RO-10 は削除を止めない。照会 API（LC-OI-3）は未作成で RO-9 にしか使われない。threat-catalog に該当 T がない（指摘者: redteam） | (1) PO-13（`lcsig` の JWS 署名。ADR-007 の専用鍵、環境別・cell 別）と RO-11（検証、不一致は処理せず隔離・警報）を加えた。根拠は RFC 9967 §5 の MUST の準用 [N][^9967]。(2) RO-12 として破壊的事象の実行前の正本照会を義務付け、LC-OI-3 を GA の前提（DEC-8 第 1 段の前）に格上げした。(3) RO-13 と G_del（§7）で削除の最短猶予を置き、deletion.withdrawn の 2 type を加えた。(4) PO-10 に broker の書込権限の限定と本番日次走査を明記した。(5) LC-CV-10〜LC-CV-14 を加え、LC-CV-09 を改めた。(6) threat-catalog への T の起票ほかを §10 で申し送った。RO-1・RO-10 を改め、§1・§2・§6 を更新した | §1、§2、§3 PO-10・PO-13、§4 RO-1・RO-10〜RO-13、§6、§7、§8、§10、x-open-issues、x-conformance-vectors、CloudEventEnvelope |

