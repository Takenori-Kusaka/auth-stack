    ## 8. 契約試験（CON-11 への写し）
    - モック MK-08（事象 publisher）: 正例の事象を出し、制御 API で重複・順序の逆転・欠番・未知 type・dead letter・replay を注入する。deletion.report を受けて CON-13 で検証する [D]。
    - MK-08 は環境別・cell 別の試験用署名鍵と、他の鍵・署名なし・封筒の改変・正本と食い違う事象を出す注入と、照会 API（LC-OI-3）のモックを持つ（CON-11 への申し送り）[D]。照会 API のモックは CON-15（11_contracts/state-query.openapi.yaml。v1.1（I-10）で切出し）の operation・examples・x-negative-examples（LQN-01〜LQN-29）から作る。MK-08 の暫定の path と形（CON-11 §4.11）はこれに置き換える（§10 H5-2）[D]。CON-15 の examples にない応答（timeout、500、3xx、不適合応答）は汎用モックでは作れないので、MK-08 の注入で作る（CON-15 §7）[D]。
    - 試験ベクタ LC-CV-01〜LC-CV-18（`x-conformance-vectors`。LC-CV-15・LC-CV-16 はラウンド 5 で追加した案、LC-CV-17・LC-CV-18 は v1.1 で追加した案）。CON-11 §6 の CV 番号への採番は CON-11 の所有者が行う [D]。

    ### 8.1 正例の lcsig の再署名手順（v1.1（I-11））
    CON-13 の examples（正例）の `lcsig` は形だけのダミーである。protected header と payload は PO-13 の形に従うが、署名の値は無作為で、対応する鍵はどこにも公開していない [D]。このため RO-11 に忠実な受信側は、CON-13 の正例をそのまま受けると「検証できない署名」として隔離する。これは期待どおりの動作であり、LC-CV-17 (a) で確かめる [D]。正例の処理（RO-3 以降）を試験するには、次の手順で試験用の鍵で署名し直す [D]。

    | 手順 | 内容 |
    |---|---|
    | S-1 鍵 | 試験専用の EC P-256 鍵対を受信側の試験の中で作る（alg は ES256。CON-13 の正例の protected header と同じ）。秘密鍵は試験の外へ出さない。この鍵を本番・共有の非本番環境の鍵マニフェストに登録しない（LC-CV-10 の「非本番の鍵」として拒否されるべき鍵である）[D] |
    | S-2 鍵マニフェスト | 受信側の試験の設定に、(iss, typ, kid) → {alg, 公開鍵} の 1 行を置く。iss は試験用の不透明 URI（例 `https://lifecycle-publisher.test.invalid/p/t1`）、typ は `lifecycle-event+jws`、kid は試験用の値（例 `lc-test-k1`）、alg は ES256。受信側の期待する env（RO-11 (c)）も試験用の値（例 `test`）にする。鍵マニフェストの正式な形式は ADR-007（LC-OI-8）で未決なので、受信側は差し替えられる形で持つ（§10.1 V11-L3）[D] |
    | S-3 payload | 封筒から id・source・type・specversion・sequence・partitionkey・time・dataschema・data の 9 つを値を変えずに写し、iss と env（S-2 の値）を加えた JSON object を作る（PO-13）。メンバの順序と空白は問わない。受信側は payload を復号して値を比べ、バイト列を再構成して比べないためである [D] |
    | S-4 protected header | `{"alg":"ES256","kid":"<S-2 の kid>","typ":"lifecycle-event+jws"}`（PO-13）[D] |
    | S-5 署名 | 署名入力は ASCII(BASE64URL(UTF8(protected header)) ‖ '.' ‖ BASE64URL(payload)) で、BASE64URL は末尾の '=' を付けない [N][^7515]（RS-11#52）。ES256 の署名値は、R と S をそれぞれ 32 オクテットの big-endian のオクテット列にして R、S の順に連結した 64 オクテットであり、先頭の 0 オクテットを省いてはならない（MUST NOT）[N][^7518]。暗号ライブラリの既定の出力が ASN.1 DER の場合は変換が要る（例 Node.js の crypto.sign では `dsaEncoding: 'ieee-p1363'` を指定する）[D] |
    | S-6 組立て | `lcsig` = 署名入力 '.' BASE64URL(署名値)。封筒の他の欄は変えない [D] |
    | S-7 封筒を変える場合 | sequence・id・source・type・partitionkey・time・dataschema・data のどれかを変えたら（例: 新しいパーティションの試験で sequence を 1 から振り直す、重複・順序の試験で id を変える）、S-3 から署名し直す。署名し直さずに封筒だけを変えた事象は、RO-11 (c) の不一致として隔離されるのが正しい（LC-CV-11 (c)、LC-CV-17 (c)）[D] |
    | S-8 負例 | 他の鍵・他の env・他の iss・alg none・payload の改ざんは、同じ手順で値だけを変えて作る（LC-CV-10・LC-CV-11）。負例の機械可読の配布形式は CON-11 の kit で統一する（§10.1 V11-L2）[D] |

    - 手順の確認用に、試験専用の公開鍵とそれで署名した正例 2 件（CON-13 の tenant.suspended と user.deletion.requested の正例の lcsig だけを置き換えたもの）を `x-test-signing-vectors` に置いた。受信側は S-2 の 1 行にこの公開鍵を登録すれば、自前の鍵を作らずに正例の検証（LC-CV-17 (b)）を確かめられる [D]。対応する秘密鍵は、本書の作成者が 2026-10-15 に署名した直後に破棄し、どこにも保存していない。このため、この公開鍵で検証できる新しい事象は誰も作れない。封筒を変える試験（S-7）には S-1 の自前の鍵を使う [D]。

    ## 9. 作成方法と誠実性
    AI エージェント（Claude）が DL-49 §7・DL-08 §16.3・ADR-022・ADR-021・ARC-09 を正本として起草した。模擬パネル（自己レビュー。実在の CTO/CISO の決裁ではない）のラウンド1の指摘（Critical、G-137・I-11）への対応である [D]。
    CloudEvents 1.0.2 本体（spec.md）、JSON 形式（formats/json-format.md）、Sequence 拡張、Partitioning 拡張は ce@v1.0.2 タグの原文を 2026-10-15 に取得して照合した。本体の id・dataschema・Privacy and Security は research の検証済み主張（RS-16#9, #10、RS-17#32）にもある。JSON 形式の media type と 2 つの拡張は research に収録がなく、本書の作成時に原典を確認した（人による照合は未実施）。
    AsyncAPI 3.1.0 の Operation Object の action の定義も同日に原文（asyncapi/spec の v3.1.0 タグ）を取得して確認した。作成者以外による独立レビューは未実施である [D]。
    ラウンド2（版 0.2.0）では、RFC 9967 §5（RS-14#35）、RFC 8725 §3.12（RS-05#37）、CloudEvents 1.0.2 の Attribute Naming Convention と Privacy and Security の原文を 2026-10-15 に再取得して照合した。RFC 7515 は research の検証済み主張（RS-11#52）だけに依拠した [D]。

