x-test-signing-vectors:
  description: '§8.1 の再署名手順の確認用の正例（v1.1（I-11））。CON-13 の examples のうち tenant.suspended（id e7kq3mz2vx5ha4td6rn2cwb7py）と user.deletion.requested（id e2mz7vq4hk3xa5rd6tn2pwe7bu）の lcsig だけを、試験専用の鍵で署名した値に置き換えたもの。封筒の他の欄は CON-13 の正例と同じ。payload の iss と env は試験用の値である。対応する秘密鍵は署名の直後に破棄した（§8.1）。この公開鍵は受信側の単体試験の鍵マニフェストにだけ登録し、本番・共有の非本番環境の鍵マニフェストに登録しない。2026-10-15 に本書の作成者が Node.js 22 の crypto.verify（dsaEncoding ieee-p1363）で 2 件とも検証できることを確かめた [M]。'
  manifest-entry:
    iss: 'https://lifecycle-publisher.test.invalid/p/t1'
    typ: lifecycle-event+jws
    kid: lc-test-k1
    alg: ES256
    expected-env: test
    jwk: { kty: EC, crv: P-256, x: 'NmXzeRYoU7VF88IC7-cYyc1Kp6BVtcjxn36Lag9FJg0', y: 'U5J6eGVyqYosh7_euDc3vAEGAr8bia__dsQvExLHhZs', kid: lc-test-k1, alg: ES256, use: sig }
  vectors:
