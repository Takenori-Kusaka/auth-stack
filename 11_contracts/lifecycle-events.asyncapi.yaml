    messages:
      UserCreated:
        $ref: '#/components/messages/UserCreated'
      UserSuspended:
        $ref: '#/components/messages/UserSuspended'
      UserResumed:
        $ref: '#/components/messages/UserResumed'
      UserDeletionRequested:
