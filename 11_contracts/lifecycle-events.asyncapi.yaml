operations:
  publishTenantLifecycle:
    action: send
    channel:
      $ref: '#/channels/tenantLifecycle'
    description: 'publisher がテナント・所属の事象を送る（PO-1〜PO-13）。'
    security:
      - $ref: '#/components/securitySchemes/workloadMtls'
  publishPrincipalLifecycle:
    action: send
    channel:
      $ref: '#/channels/principalLifecycle'
    description: 'publisher が主体の事象を送る。'
    security:
      - $ref: '#/components/securitySchemes/workloadMtls'
  publishPlatformLifecycle:
    action: send
    channel:
      $ref: '#/channels/platformLifecycle'
    description: 'publisher が platform 範囲の revocation.bulk を送る（preview）。'
    security:
      - $ref: '#/components/securitySchemes/workloadMtls'
  receiveDeletionReports:
    action: receive
    channel:
      $ref: '#/channels/deletionReports'
    description: 'publisher が受信側の完了報告を受ける（PO-12）。'
    security:
      - $ref: '#/components/securitySchemes/workloadMtls'
  receiveReplayRequests:
    action: receive
    channel:
      $ref: '#/channels/replayRequests'
