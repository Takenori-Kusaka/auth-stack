  x-conformance-vectors:
    - {id: 'LC-CV-01', name: '重複', input: '同じ (source, id) を 2 回配送する（sequence も同じ）', expected: '2 回目は ack だけ返し、副作用は 1 回（RO-3）'}
    - {id: 'LC-CV-02', name: '順序の逆転', input: '同じパーティションの sequence n+1 を n より先に配送する', expected: 'n+1 を保留し、n の処理後に n+1 を処理する（RO-4）'}
    - {id: 'LC-CV-03', name: '欠番', input: 'sequence n を落として n+1 以降を配送する', expected: 'G_gap 後に replay.request（from_sequence=n）を送る（RO-4）'}
    - {id: 'LC-CV-04', name: '未知の type', input: '既知の前置で未定義の type（例 tenant.future_event）を配送する', expected: '受理して ack し、dead letter に送らない（RO-5）'}
    - {id: 'LC-CV-05', name: '未知の data 欄・未知の列挙値', input: '既知の type に未知の欄と reason_class の未知の値を加える', expected: '受理し、未知の値を other と同じに扱う（RO-5）'}
    - {id: 'LC-CV-06', name: '削除要求と報告', input: 'tenant.deletion.requested と user.deletion.requested を配送する', expected: '期限内に CON-13 DeletionReport に適合する報告を送る。データがなければ not_applicable（RO-7）'}
    - {id: 'LC-CV-07', name: '処理失敗', input: '受信側の処理を失敗させる（注入）', expected: '自サービスの dead letter に移し、削除要求なら期限内に outcome=failed を報告する（RO-8）'}
    - {id: 'LC-CV-08', name: '停止と独自 session', input: 'membership.suspended を配送した後に独自 session で要求する', expected: '独自 session が無効になっている。T_user_susp 以内（値は TBD）（RO-6、ONB-R9）'}
    - {id: 'LC-CV-09', name: '送信者の偽装', input: 'publisher 以外の workload から事象を送る。broker 経由（broker に書き込める別 workload が署名なしで書く）と直接の両方', expected: '処理しない（RO-1、RO-11）。broker 経由でも mTLS の成功を真正性の根拠にしない'}
    - {id: 'LC-CV-10', name: '他の鍵による署名', input: '非本番の鍵、別 cell の鍵、別の用途族の鍵（例 内部 token）で署名した tenant.deletion.requested を配送する', expected: '処理せず隔離し警報する。sequence の処理済みに数えず、replay で真正な事象を取り直す（RO-11）'}
    - {id: 'LC-CV-11', name: '署名なし・封筒の改変', input: '(a) lcsig のない事象、(b) alg none の JWS、(c) 署名は正しいが封筒の source または type を書き換えた事象を配送する', expected: 'いずれも処理せず隔離し警報する（RO-11）'}
    - {id: 'LC-CV-12', name: '正本と食い違う削除要求', input: '正しく署名されているが、照会 API（モック）では request_id が存在しない、または対象テナントが削除要求の状態にない tenant.deletion.requested を配送する', expected: '削除を実行せず、outcome=failed（正本不一致）で報告し警報する（RO-12）'}
    - {id: 'LC-CV-13', name: '猶予中の撤回', input: 'tenant.deletion.requested の後、G_del の満了前に tenant.deletion.withdrawn を配送する。別の試行では撤回事象を落とし、照会 API だけが撤回を返す', expected: 'どちらも不可逆な削除を実行せず、outcome=withdrawn で報告する（RO-13、RO-12）'}
    - {id: 'LC-CV-14', name: '保全中の解除事象', input: '照会 API では保全が継続している hold_ref について、署名済みの tenant.legal_hold.released を配送する', expected: '削除を再開せず、正本不一致として報告し警報する（RO-12）'}
  x-lint-notes: '版 0.2.0 は YAML としての構文解析（PyYAML）だけを確認し、Redocly lint と @asyncapi/parser は再実行していない。以下は版 0.1.0 の結果。Redocly lint 2.63.0（recommended）の警告 info-license-strict 1 件: License Object に url を置いていない。社内限定で公開 URL がないため（README §4.7 P-1）。AsyncAPI の構文は @asyncapi/parser で検証する（README §2.3 への記録は申し送り）。payload は封筒の要約スキーマを置き、正本の JSON Schema 2020-12（CON-13）は x-dataschema で参照する。CON-13 は CON-02 を絶対 URI の $ref で参照しており、parser の解決対象にすると未決の <id-domain> を取得しにいくためである。'
channels:
  tenantLifecycle:
    address: lifecycle.v1.tenants
    description: 'テナント・所属の事象。source=https://lifecycle.<id-domain>/tenants/<tid>、partitionkey=tenant:<tid>。順序キーは tid [D]。 address は論理名で、broker 上の名前は配備で決める（凍結しない）[D]。'
    messages:
      TenantCreated:
        $ref: '#/components/messages/TenantCreated'
      TenantSuspended:
        $ref: '#/components/messages/TenantSuspended'
      TenantResumed:
        $ref: '#/components/messages/TenantResumed'
      TenantTerminationEffective:
        $ref: '#/components/messages/TenantTerminationEffective'
      TenantDeletionRequested:
        $ref: '#/components/messages/TenantDeletionRequested'
      TenantDeletionWithdrawn:
        $ref: '#/components/messages/TenantDeletionWithdrawn'
      TenantDeleted:
        $ref: '#/components/messages/TenantDeleted'
      TenantMergeCutover:
        $ref: '#/components/messages/TenantMergeCutover'
      TenantSplitCutover:
        $ref: '#/components/messages/TenantSplitCutover'
      TenantCellMoveScheduled:
        $ref: '#/components/messages/TenantCellMoveScheduled'
      TenantCellMoveCutover:
        $ref: '#/components/messages/TenantCellMoveCutover'
      TenantLegalHoldSet:
        $ref: '#/components/messages/TenantLegalHoldSet'
      TenantLegalHoldReleased:
        $ref: '#/components/messages/TenantLegalHoldReleased'
      MembershipAdded:
        $ref: '#/components/messages/MembershipAdded'
      MembershipChanged:
        $ref: '#/components/messages/MembershipChanged'
      MembershipSuspended:
        $ref: '#/components/messages/MembershipSuspended'
      MembershipResumed:
        $ref: '#/components/messages/MembershipResumed'
      MembershipRemoved:
        $ref: '#/components/messages/MembershipRemoved'
      RevocationBulk:
        $ref: '#/components/messages/RevocationBulk'
  principalLifecycle:
    address: lifecycle.v1.principals
    description: '主体の事象。source=…/principals/<sub>、partitionkey=principal:<sub>。テナント単位で購読するサービスは購読しなくてよい（membership.* で受ける）[D]。 address は論理名で、broker 上の名前は配備で決める（凍結しない）[D]。'
    messages:
      UserCreated:
        $ref: '#/components/messages/UserCreated'
      UserSuspended:
        $ref: '#/components/messages/UserSuspended'
      UserResumed:
        $ref: '#/components/messages/UserResumed'
      UserDeletionRequested:
        $ref: '#/components/messages/UserDeletionRequested'
      UserDeletionWithdrawn:
        $ref: '#/components/messages/UserDeletionWithdrawn'
      UserDeleted:
        $ref: '#/components/messages/UserDeleted'
      UserLegalHoldSet:
        $ref: '#/components/messages/UserLegalHoldSet'
      UserLegalHoldReleased:
        $ref: '#/components/messages/UserLegalHoldReleased'
      RevocationBulk:
        $ref: '#/components/messages/RevocationBulk'
  platformLifecycle:
    address: lifecycle.v1.platform
    description: '範囲がテナントや主体に収まらない revocation.bulk（preview）。source=…/platform [D]。 address は論理名で、broker 上の名前は配備で決める（凍結しない）[D]。'
    messages:
      RevocationBulk:
        $ref: '#/components/messages/RevocationBulk'
  deletionReports:
    address: lifecycle.v1.deletion-reports
    description: '受信側が削除・付け替え・保全の反映を報告する（RO-7）。送信者は DL-55 の workload ID で認証し、source と一致しなければ棄却する [D]。'
    messages:
      DeletionReport:
        $ref: '#/components/messages/DeletionReport'
  replayRequests:
    address: lifecycle.v1.replay-requests
    description: '受信側が欠番・復旧時に再配送を求める（RO-4、RO-9）。再配送は元の channel に同じ id・sequence で行う（PO-9）[D]。preview。'
    x-freeze-class: preview
    x-preview-expires: '2027-10-15'
    messages:
      ReplayRequest:
        $ref: '#/components/messages/ReplayRequest'
operations:
  publishTenantLifecycle:
    action: send
    channel:
      $ref: '#/channels/tenantLifecycle'
    description: 'publisher がテナント・所属の事象を送る（PO-1〜PO-13）。'
    security:
      - $ref: '#/components/securitySchemes/workloadMtls'
  publishPrincipalLifecycle:
    action: send
    channel:
      $ref: '#/channels/principalLifecycle'
    description: 'publisher が主体の事象を送る。'
    security:
      - $ref: '#/components/securitySchemes/workloadMtls'
  publishPlatformLifecycle:
    action: send
    channel:
      $ref: '#/channels/platformLifecycle'
    description: 'publisher が platform 範囲の revocation.bulk を送る（preview）。'
    security:
      - $ref: '#/components/securitySchemes/workloadMtls'
  receiveDeletionReports:
    action: receive
    channel:
      $ref: '#/channels/deletionReports'
    description: 'publisher が受信側の完了報告を受ける（PO-12）。'
    security:
      - $ref: '#/components/securitySchemes/workloadMtls'
  receiveReplayRequests:
    action: receive
    channel:
      $ref: '#/channels/replayRequests'
    description: 'publisher が replay の要求を受ける（PO-9、preview）。'
    security:
      - $ref: '#/components/securitySchemes/workloadMtls'
components:
  securitySchemes:
    workloadMtls:
      type: X509
      description: 'publisher と受信者は workload ID（X.509 の SVID など）で相互に TLS 認証する（PO-10、RO-1、DL-55）。方式の詳細は ADR-009 の決定に従い、本契約では凍結しない [D]。broker を経由する場合、この認証の相手は broker なので事象の真正性の根拠にしない。真正性は PO-13 の lcsig と RO-11 の検証で担保する [D]。'
  schemas:
    CloudEventEnvelope:
      description: '封筒の要約（構文検証とモック生成用）。正本は CON-13 の $defs/Envelope と type ごとの $defs/Event_*。'
      type: object
      required: [specversion, id, source, type, time, datacontenttype, dataschema, partitionkey, sequence, lcsig, data]
      properties:
        specversion: {type: string, const: '1.0'}
        id: {type: string, minLength: 1, maxLength: 64}
        source: {type: string, format: uri-reference}
        type: {type: string, minLength: 1}
        time: {type: string, format: date-time}
        datacontenttype: {type: string, const: application/json}
        dataschema: {type: string, const: 'https://contracts.id-domain.example/schemas/lifecycle-event/v1/lifecycle-event.schema.json'}
        partitionkey: {type: string, minLength: 1}
        sequence: {type: string, pattern: '^[0-9]{20}$'}
        lcsig: {type: string, pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$', description: 'PO-13 の JWS Compact Serialization（protected header に alg・kid・typ=lifecycle-event+jws）。CON-13 の Envelope への追加は申し送り（§10 H2-3）[D]。'}
        data: {type: object}
    ReportEnvelope:
      description: '完了報告・replay 要求の封筒の要約。正本は CON-13 の $defs/DeletionReport・$defs/ReplayRequest。'
      type: object
      required: [specversion, id, source, type, time, data]
      properties:
        specversion: {type: string, const: '1.0'}
        id: {type: string, minLength: 1, maxLength: 64}
        source: {type: string, format: uri-reference}
        type: {type: string, minLength: 1}
        time: {type: string, format: date-time}
        data: {type: object}
  messages:
    TenantCreated:
      name: 'example.id-domain.lifecycle.tenant.created'
      title: 'テナントの作成'
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/CloudEventEnvelope'
