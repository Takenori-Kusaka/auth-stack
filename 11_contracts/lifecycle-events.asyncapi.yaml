    ## 8. 契約試験（CON-11 への写し）
    - モック MK-08（事象 publisher）: 正例の事象を出し、制御 API で重複・順序の逆転・欠番・未知 type・dead letter・replay を注入する。deletion.report を受けて CON-13 で検証する [D]。
    - MK-08 は環境別・cell 別の試験用署名鍵と、他の鍵・署名なし・封筒の改変・正本と食い違う事象を出す注入と、照会 API（LC-OI-3）のモックを持つ（CON-11 への申し送り）[D]。
    - 試験ベクタ LC-CV-01〜LC-CV-14（`x-conformance-vectors`）。CON-11 §6 の CV 番号への採番は CON-11 の所有者が行う [D]。

    ## 9. 作成方法と誠実性
    AI エージェント（Claude）が DL-49 §7・DL-08 §16.3・ADR-022・ADR-021・ARC-09 を正本として起草した。模擬パネル（自己レビュー。実在の CTO/CISO の決裁ではない）のラウンド1の指摘（Critical、G-137・I-11）への対応である [D]。
    CloudEvents 1.0.2 本体（spec.md）、JSON 形式（formats/json-format.md）、Sequence 拡張、Partitioning 拡張は ce@v1.0.2 タグの原文を 2026-10-15 に取得して照合した。本体の id・dataschema・Privacy and Security は research の検証済み主張（RS-16#9, #10、RS-17#32）にもある。JSON 形式の media type と 2 つの拡張は research に収録がなく、本書の作成時に原典を確認した（人による照合は未実施）。
    AsyncAPI 3.1.0 の Operation Object の action の定義も同日に原文（asyncapi/spec の v3.1.0 タグ）を取得して確認した。作成者以外による独立レビューは未実施である [D]。
    ラウンド2（版 0.2.0）では、RFC 9967 §5（RS-14#35）、RFC 8725 §3.12（RS-05#37）、CloudEvents 1.0.2 の Attribute Naming Convention と Privacy and Security の原文を 2026-10-15 に再取得して照合した。RFC 7515 は research の検証済み主張（RS-11#52）だけに依拠した [D]。

