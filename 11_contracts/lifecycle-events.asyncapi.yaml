    ## 11. レビュー記録

    > 模擬パネルは自己レビューであり、実在の CTO/CISO の決裁ではない（CONVENTIONS §8）[D]。

    | ラウンド | # | 重大度 | 指摘（要旨） | 対応 | 箇所 |
