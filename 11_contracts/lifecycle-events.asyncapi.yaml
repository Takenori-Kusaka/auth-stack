      con13-example: { type: 'example.id-domain.lifecycle.tenant.suspended', id: e7kq3mz2vx5ha4td6rn2cwb7py }
      expected: '検証に成功し処理する（LC-CV-17 (b)）'
      lcsig: 'eyJhbGciOiJFUzI1NiIsImtpZCI6ImxjLXRlc3QtazEiLCJ0eXAiOiJsaWZlY3ljbGUtZXZlbnQrandzIn0..LNXvoy--m-GEnYYkkVgPs6U43ELKOqdsE-13Rs1SeVTXuVXRaJtYdXIHojXZeYjGglb5eTFkSrvc2Q7pB_TWIw'
