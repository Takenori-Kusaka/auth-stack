    - '[^aa] AsyncAPI Initiative『AsyncAPI Specification 3.1.0』. https://www.asyncapi.com/docs/reference/specification/v3.1.0 （参照箇所: Versions（RS-16#6）、Operation Object の action（本書の作成時に asyncapi/spec の v3.1.0 タグの原文を取得して確認）、確認日: 2026-10-15）'
    - '[^9967] P. Hunt ほか『RFC 9967 System for Cross-Domain Identity Management (SCIM) Profile for Security Event Tokens (SETs)』Proposed Standard, 2026-05. https://www.rfc-editor.org/rfc/rfc9967 （参照箇所: §5 Security Considerations（ack 前の永続化、publisher と直接通信しない場合の JWS による発信者の検証）、確認日: 2026-10-03、ラウンド2で 2026-10-15 に原文を再確認。RS-14#35）'
    - '[^7515] M. Jones, J. Bradley, N. Sakimura『JSON Web Signature (JWS)』RFC 7515, 2015-05. https://www.rfc-editor.org/rfc/rfc7515 （参照箇所: §1, §4.1.1, §7.2.1、確認日: 2026-10-03。RS-11#52）'
    - '[^8725] Y. Sheffer, D. Hardt, M. Jones『RFC 8725 (BCP 225): JSON Web Token Best Current Practices』2020-02. https://www.rfc-editor.org/rfc/rfc8725 （参照箇所: §3.8, §3.12、確認日: 2026-10-03、ラウンド2で 2026-10-15 に §3.12 の原文を再確認。RS-05#36, #37）'
    - '[^63c] NIST『SP 800-63C-4 Digital Identity Guidelines: Federation and Assertions』Final, 2025-07. https://pages.nist.gov/800-63-4/sp800-63c.html （参照箇所: §4.8、確認日: 2026-10-03。RS-14#61）'
