        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StreamStatusUpdateRequest'
            examples:
              pause:
                summary: 受信者の保守による一時停止
                value:
                  stream_id: f67e39a0a4d34d56b3aa1bc4cff0069f
