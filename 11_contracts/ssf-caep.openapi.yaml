  /ssf/status:
    get:
      tags: [stream-management]
      operationId: readStreamStatus
      summary: stream 状態の読取り（SSF §8.1.2.1）
      description: |
        未認証の要求には 401 を返さなければならない（MUST）。存在しない stream には 404 を返さなければならない（MUST）[N][^ssf]。
      security:
        - ssfOAuth: [core.ssf_stream.read]
          receiverMtls: []
        - ssfOAuth: [core.ssf_stream.read]
          dpopProof: []
      x-contract-tier: GA
      x-requirements: [G-118]
      parameters:
        - $ref: '#/components/parameters/StreamIdQueryRequired'
      responses:
        '200':
          description: stream の状態
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamStatus'
              examples:
                paused:
                  summary: 保守で一時停止
                  value:
                    stream_id: f67e39a0a4d34d56b3aa1bc4cff0069f
                    status: paused
