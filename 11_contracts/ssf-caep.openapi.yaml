        受信者は stream を enabled・paused・disabled に変えられる [N][^ssf]。
        paused の間、本基盤は送信せず SET を保持し、enabled に戻ったら送る（SHOULD の適用）。保持は R_ret まで [N][^ssf][D]。
        disabled の間は送信してはならず（MUST NOT）、保持もしない（保持しないことは §8.1.2.1 の規範語のない記述）[N][^ssf]。判断を保留する場合は 202 を返さなければならない（MUST）[N][^ssf]。
