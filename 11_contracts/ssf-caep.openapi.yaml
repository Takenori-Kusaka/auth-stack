openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: SSF/CAEP stream API profile
  version: 0.1.1
  summary: OpenID Shared Signals Framework 1.0 の stream 管理・push/poll 配送・検証のうち、本基盤が送受信する範囲の profile
  description: |
    文書ID: CON-09 / 成果物: DL-78 / 版: 0.1.1 / 状態: draft / 最終更新: 2026-10-15

    本契約は、OpenID Shared Signals Framework 1.0（以下 SSF。OIDF Final、Published 2025-08-29、
    standards-status.md SS-C09、確認日 2026-10-03）、RFC 8935（push 配送）、RFC 8936（poll 配送）を
    準拠基準とし、本基盤が送受信する範囲だけを profile として定める [N][^ssf][^8935][^8936]（RS-04#77）。
    SET の payload（イベント種別ごとの中身と受信義務）は DL-79（11_contracts/schemas/ssf-caep-set.schema.json、CON-10）が正本であり、
    本契約は stream・配送・検証・受信者認証・配送保証・再送を扱う [D]。

    ## 1. 本基盤の役割（ADR-006 D6-23〜D6-26 の写し）
    | 役割 | 部品（ARC-01） | 相手 | 本契約での表現 |
    |---|---|---|---|
    | Transmitter（基盤が送信者） | C17 SSF transmitter | trust agreement を結んだ顧客の受信者（SIEM・自社アプリ）、SSF stream を登録した外部連携アプリ（PC-15） | `paths` の `/.well-known/ssf-configuration`、`/ssf/*`（stream 管理・poll）と `webhooks.setPushDelivery`（push） |
    | Receiver（基盤が受信者） | C16 SSF receiver | 顧客 IdP・外部 IdP | `paths` の `/ssf-receiver/{binding_id}/events`（push 受信）と `x-ssf-receiver-profile`（顧客 IdP の stream 管理 API・poll endpoint を呼ぶ側の義務） |

    - SSF/CAEP/RISC は組織の境界だけで使い、内部の約 300 依存サービスを SSF の受信者にしない [D]（ADR-006 D6-25）。
      依存サービスへの伝播はライフサイクル事象（ADR-022 のイベント配送契約、G-137）と失効状態の配布（ADR-006 D6-04）で行う [D]。
    - 失効の効力は基盤所有の強制点（E1〜E6）で生じる。本契約の配送の成否は強制に影響させない [D]（ADR-006 D6-03、D6-24）。
      したがって本契約の「配送保証」は外部の受信者が後始末（アプリ内 session・保存データ）を行うための保証であり、拒否の保証ではない [D]。

    ## 2. 凍結区分（ADR-022 D-2）
    - GA: stream 管理、push/poll、SET の形式（secevent+jwt）、v1 イベント種別（CAEP session-revoked・credential-change・
      token-claims-change・assurance-level-change、RISC account-disabled・credential-compromise・identifier-recycled）と受信義務の枠 [D]（ADR-022 D-2）。
    - preview: CAEP Interoperability Profile（Implementer's Draft 1。Final 化のレビューやり直し中、SS-C12）への準拠表明。本契約は同 profile に依存しない [N][^caepinterop][D]（RS-04#79）。
    - 凍結しない: 配送基盤（queue・broker 製品）[D]。
    - 各要素の区分は `x-contract-tier` に記す。値（秒・件数）はすべて TBD であり、DL-20（07_slo）で決裁する [D]（ADR-006 §2.10）。

    ## 3. 標準からの変更の有無
    - SSF・RFC 8935・RFC 8936 の項目名・意味・状態コードは変えない [D]。本 profile は (a) 標準が OPTIONAL・配備委任とする点の選択、
      (b) 標準が範囲外とする点（受信者認証の方式、保持期間、再送間隔、テナント境界）の追加、だけを行う [D]。
    - 追加要素は `x-` 接頭辞の拡張か、本書で「profile 追加」と明示した応答本文（RFC 9457 problem details。SSF は管理 API のエラー本文を定めない）に限る [D]。

    ## 4. 未決事項（本契約では決めない）
    | 項目 | 状態 |
    |---|---|
    | SET・Transmitter の `iss` の粒度（単一 issuer かテナント別 issuer か。テナント別なら約 1 万） | 未決（ADR-006 L6-7、DEC-3 の U-01）。本契約は両方を `/.well-known/ssf-configuration/{issuer_path}` で表せるようにした |
    | テナント停止（EV-05・EV-06）の外部通知 | 未決（ARC-09 §5.4。ADR-022 改版へ申し送り） |
    | RISC account-purged の受信時の処理 | 未決（ADR-006 L6-1、ADR-022 改版） |
    | RISC recovery-activated の送受信 | 未決（ADR-006 L6-8） |
    | OIDC Back-Channel Logout の契約上の位置 | 未決（ADR-006 L6-2）。本契約の対象外 |
    | 外部連携アプリの受信義務を契約条件にするか | 決裁案 K6-3（ADR-006 D6-26、NA-006-4） |
    | 配送・再送・保持・検証間隔・D_in・D_tx の数値 | TBD（ADR-006 §2.10、DL-20） |
    | 記述言語の版（ADR-022 D-2 は OpenAPI 3.1.2 を凍結版とする。本ファイルは作業指示に従い 3.1.0 で記述） | 11_contracts/README.md（DL-69）で統一を判断する申し送り |

    ## 5. 作成方法と誠実性
    AI エージェント（Claude）が ADR-006・ARC-09 を正本として起草した。判断は自己レビューであり、実在の CTO/CISO の決裁ではない（CONVENTIONS §8）。
    SSF §6〜§9 と RFC 8935・RFC 8936 の各節は research ノートの検証済み主張（RS-04#77）が対象とする節を超えるため、
    起草者が 2026-10-15 に原典を取得して照合した。同日、作成者以外の独立レビュー（11_contracts/review-notes/CON-09.md）が SSF §3〜§10、RFC 8935 §2〜§4、
    RFC 8936 §2〜§3、RISC §2.6・§2.11 を原典で再照合し、指摘を本ファイルに反映した（版 0.1.1）。traceability/ の照合ログへの追記は未了である [D]。
