        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [stream-management]
      operationId: deleteStream
      summary: stream の削除（SSF §8.1.1.5）
      description: |
        `stream_id` を query で指定しなければならない（MUST）[N][^ssf]。成功時は 204。
        削除した stream の未確認 SET は破棄し、件数を監査イベントに残す [D]。
        外部連携アプリが受信義務（ADR-006 D6-26。K6-3 の決裁次第）を負う場合、削除は連携契約上の義務違反の兆候として運用に通知する [D]。
