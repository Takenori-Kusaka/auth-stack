          expected: 201。`events_delivered` は空配列。受信者は events_delivered だけを当てにする
          reason: Transmitter は理解しない値を無視しなければならず（MUST）、受信者は events_delivered を当てにしなければならない（MUST）[N][^ssf]（§8.1.1）
    get:
      tags: [stream-management]
      operationId: readStreamConfiguration
      summary: stream 構成の読取り（SSF §8.1.1.2）
      description: |
        `stream_id` があればその stream を、なければこの受信者が参照できる全 stream の配列を返す（MUST）[N][^ssf]。
        stream がなければ空配列を返す（MUST）[N][^ssf]。他の受信者の stream は存在の有無を含めて見せない（404）[D]。
      security:
        - ssfOAuth: [core.ssf_stream.read]
