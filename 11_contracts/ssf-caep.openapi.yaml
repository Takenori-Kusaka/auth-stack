      summary: stream 構成の部分更新（SSF §8.1.1.3）
      description: |
        `stream_id` は必須（MUST）。要求にある受信者側の項目は更新し（MUST）、ない項目は変えない（MUST NOT）[N][^ssf]。
        Transmitter 側の項目を含める場合は期待値と一致しなければならず、`events_delivered` は更新前の値と一致しなければならない（MUST）[N][^ssf]。
        処理を保留した場合は 202 を返し、受信者は後で同じ要求を再試行してよい [N][^ssf]。
        `delivery` の変更は endpoint_url_policy の検査と監査・通知の対象とする [D]。
      x-contract-tier: GA
