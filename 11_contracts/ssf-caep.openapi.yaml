      summary: stream 構成の置換（SSF §8.1.1.4）
      description: |
        `stream_id` と受信者側の項目の全体を含めなければならず（MUST）、欠けた受信者側の項目は削除要求と解釈しなければならない（MUST）[N][^ssf]。
