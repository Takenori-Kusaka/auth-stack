          expected: 400
          reason: status は enabled・paused・disabled のいずれかでなければならない（MUST）[N][^ssf]（§8.1.2.1）

  /ssf/subjects/add:
    post:
      tags: [stream-management]
      operationId: addSubject
      summary: stream への主体の追加（SSF §8.1.3.2）
      description: |
        主体は complex subject で指定し、`tenant` メンバーを必須とする（本 profile の追加）[D]。
        `tenant` だけを指定すると、SSF の主体照合規則（未定義の欄は一致と見なす）により、そのテナントの全主体のイベントが対象になる [N][^ssf]（§8.1.3.1）。

        profile の追加:
        - 受信者が trust agreement・連携契約・テナント管理者の同意で認められていないテナントを指定した場合は 403 [D]。
        - 認められたテナント内の個別の利用者が存在しない場合も 200 を返す。SSF §8.1.3.2 Table 8 は認識できない主体に 404 を返すか黙って 200 を返すことを許し、
          §9.1 は add subject の誤り応答の条件を慎重に評価すべき（SHOULD）とする [N][^ssf]。主体の存在の推測を防ぐため 200 を選ぶ [D]。
          §9.1 は成功応答をイベントが届く約束と見なしてはならない（MUST NOT）とする。同節の本文は成功応答を 204 と書き §8.1.3.2 の 200 と食い違うため、本 profile は 200 に読み替える [N][^ssf][D]。
        - `verified` は省略時 true と見なされる（SHOULD）[N][^ssf]。本基盤は false の追加を受け付けるが、送る内容は変えない [D]。
      x-contract-tier: GA
      x-requirements: [G-118, R-112]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddSubjectRequest'
            examples:
              wholeTenant:
                $ref: '#/components/examples/AddSubjectTenant'
      responses:
        '200':
          description: 追加した（または黙って無視した）。本文は空
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-negative-examples:
        - id: NEG-SUB-01
          input: テナント T1 とだけ trust agreement を結んだ受信者が、tenant=T2 の complex subject を追加する
          expected: 403。T2 のイベントは送られない
          reason: cross-tenant の情報収集の防止（SSF §9.2 の SHOULD の適用、DL-80 の cross-tenant 負例）[N][^ssf][D]
        - id: NEG-SUB-02
          input: '`tenant` を含まない単純主体（format=email）を追加する'
          expected: 400
          reason: 本 profile は主体にテナント文脈を必須とする（critical_subject_members=tenant）[D]
        - id: NEG-SUB-03
          input: 認められたテナント内の存在しない利用者を、complex subject の user（iss_sub）と tenant で追加する
          expected: 200（404 ではない）
          reason: 主体の存在の推測を防ぐ（SSF §8.1.3.2 Table 8 が許す黙った 200、§9.1 の SHOULD の適用）[N][^ssf][D]

  /ssf/subjects/remove:
    post:
      tags: [stream-management]
      operationId: removeSubject
      summary: stream からの主体の削除（SSF §8.1.3.3）
      description: |
        成功時は 204 [N][^ssf]。悪意ある削除への対策として、本基盤は削除後も一定時間（TBD）イベントを送り続けてよい（MAY）。
        受信者は削除済み主体のイベントを許容し、誤りとして報告してはならない（MUST NOT）[N][^ssf]（§9.3）。
        stream の検証用主体（stream 自身）は削除できない [N][^ssf]（§8.1.4.1）。
      x-contract-tier: GA
      x-requirements: [G-118]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveSubjectRequest'
      responses:
        '204':
          description: 削除した
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /ssf/verify:
    post:
      tags: [verification]
      operationId: requestVerification
      summary: 検証イベントの要求（SSF §8.1.4.2）
      description: |
        受信者は stream 上に検証イベント（`https://schemas.openid.net/secevent/ssf/event-type/verification`）を要求できる [N][^ssf]。
        本基盤は `state` をそのまま検証イベントに入れて返さなければならない（MUST）[N][^ssf]。成功時は 204 で、204 は送信済みを意味しない [N][^ssf]。
        SSF は検証イベントの送信時間の SLA を公開すべき（SHOULD）とするので、本基盤は値を DL-20 で公開する（値は TBD）[N][^ssf][D]。
        `min_verification_interval` より短い間隔の要求には 429 を返してよく、超えていない要求に 429 を返すべきでない（SHOULD NOT）[N][^ssf]（§8.1.1）。
        本基盤は受信者からの要求がなくても、配送経路の健全性確認のために検証イベントを送ることがある（MAY）。その場合 `state` は付けない（MUST not set）[N][^ssf]。
        SSF §8.1.4.2 Table 10 は 403 を挙げないが、本 profile は token の scope 不足に 403 を返す（profile 追加）[D]。
      x-contract-tier: GA
      x-requirements: [G-118, G-111]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationRequest'
            examples:
              withState:
                summary: 相関用の state を付けた要求
                value:
                  stream_id: f67e39a0a4d34d56b3aa1bc4cff0069f
                  state: VGhpcyBpcyBhbiBleGFtcGxlIHN0YXRlIHZhbHVlLgo=
      responses:
        '204':
          description: 受け付けた（送信済みとは限らない）
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-negative-examples:
        - id: NEG-VER-01
          input: 受信者が min_verification_interval 未満の間隔で検証を繰り返し要求する
          expected: 429（Retry-After 付き）
          reason: SSF §8.1.1 の MAY
        - id: NEG-VER-02
          input: 受信した検証イベントの `state` が要求時の値と異なる
          expected: 受信者は `invalid_state` を返し（push は 400、poll は setErrs）、stream を健全と見なさない
          reason: SSF §8.1.4.1 の SHALL（state の確認）と SHOULD（invalid_state）[N][^ssf]

  /ssf/poll/{stream_id}:
    post:
      tags: [poll-delivery]
      operationId: pollSets
      summary: SET の poll と確認（RFC 8936、SSF §6.1.2）
      description: |
        poll 配送の stream で本基盤が払い出す endpoint。URL は受信者ごと・stream ごとに一意でなければならない（MUST）[N][^ssf]（§6.1.2）。
        認証は管理 API と同じ方式を使う（SSF §7.1.1 の SHOULD の適用）[N][^ssf]。
        要求は poll のみ・確認のみ（maxEvents=0）・確認と poll の 3 通り [N][^8936]（§2.4）。
        `returnImmediately` が true でなく SET がない場合、本基盤は SET が出るか timeout（TBD）まで応答を遅らせる（SHALL）[N][^8936]（§2.5）。
        確認（`ack`）された SET は保持しない。未確認の SET は再配送間隔（TBD）の後に再び返す [N][^8936][D]。
        無効な poll 要求には 400 を返し、本文は定めない（RFC 8936 §2.5.1）[N][^8936]。
      security:
        - ssfOAuth: [core.ssf_events.poll]
          receiverMtls: []
        - ssfOAuth: [core.ssf_events.poll]
          dpopProof: []
      x-contract-tier: GA
      x-requirements: [G-118, R-112, R-143]
      parameters:
        - name: stream_id
          in: path
