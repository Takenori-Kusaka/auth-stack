x-ssf-profile:
  x-contract-tier: GA
  transmitter:
    spec_version: '1_0'
    delivery_methods_supported:
      - urn:ietf:rfc:8935
      - urn:ietf:rfc:8936
    default_subjects: NONE
    default_subjects_rationale: |
      新規 stream にはどの主体も含めない。受信者は trust agreement で合意したテナントだけを
      complex subject の `tenant` で追加する [D]。SP 800-63C-4 が signal に全用途の記載（SHALL）と
      対象アカウントの特定に要る範囲を超える個人情報を含めないこと（SHALL NOT）を求めるため、
      既定で全主体を流す ALL は採らない [N][^sp80063c4][D]（RS-03#72、RS-14#61）。
    critical_subject_members: [tenant]
    critical_subject_members_rationale: |
      SSF は complex subject の `tenant` メンバーを定義し [N][^ssf]（RS-14#62）、critical_subject_members に
      挙げた名前は受信者が解釈しなければならず（MUST）[N][^ssf]（§7.1）、
      解釈できない critical member を主体に持つ SET を受信者は破棄しなければならない（MUST）[N][^ssf]（§3.6）。テナント文脈を無視した処理
      （他テナントの所属への波及）を受信側で防ぐために `tenant` を必須解釈にする [D]（identity-lifecycle M-03）。
    events_supported_v1:
      - https://schemas.openid.net/secevent/caep/event-type/session-revoked
      - https://schemas.openid.net/secevent/caep/event-type/credential-change
      - https://schemas.openid.net/secevent/caep/event-type/token-claims-change
      - https://schemas.openid.net/secevent/caep/event-type/assurance-level-change
      - https://schemas.openid.net/secevent/risc/event-type/account-disabled
      - https://schemas.openid.net/secevent/risc/event-type/credential-compromise
      - https://schemas.openid.net/secevent/risc/event-type/identifier-recycled
    events_always_possible:
      - https://schemas.openid.net/secevent/ssf/event-type/verification
      - https://schemas.openid.net/secevent/ssf/event-type/stream-updated
    events_not_sent:
      - uri: https://schemas.openid.net/secevent/risc/event-type/account-enabled
        reason: 再有効化は管理操作で行う（ADR-006 L6-1、決定）
      - uri: https://schemas.openid.net/secevent/risc/event-type/sessions-revoked
        reason: 非推奨。新しい実装は CAEP session-revoked を使わなければならない（MUST）[N][^risc]（RS-03#66）
      - uri: https://schemas.openid.net/secevent/risc/event-type/recovery-activated
        reason: v1 では送らない。未決（ADR-006 L6-8）
    subject_formats_sent:
      - complex（tenant は必須。user は iss_sub、session は opaque）。identifier-recycled・verification・stream-updated 以外の v1 イベント
      - email または phone_number の単純主体。identifier-recycled に限る（RISC §2.6 の MUST）
      - opaque の単純主体（id は stream_id）。verification・stream-updated に限る（SSF §8.1.4.1・§8.1.5 の MUST）
    subject_formats_not_sent:
      - identifier-recycled 以外のイベントでの email・phone_number
    identifier_recycled_subject: |
      RISC identifier-recycled は主体の種別が email か phone でなければならない（MUST）[N][^risc]（§2.6）。このため本イベントだけは
      単純主体（email・phone_number）で送り、tenant メンバーを持たない（DL-79 の outboundProfile と同じ）[D]。
      SSF の主体照合では単純主体は完全に同一の場合だけ一致する（§8.1.3.1）[N][^ssf]。受信者が addSubject で追加した tenant の complex subject とは
      照合規則で結び付かないため、本基盤はその識別子を当該テナントの文脈でその受信者に過去に渡した stream にだけ送る（profile 追加）[D]。
      受信者が既知でない識別子は送らない（SSF §10.1 の SHOULD NOT の適用）[N][^ssf][D]。
      ADR-006 D6-24 の「主体は SSF の complex subject で表す」に対する例外であり、ADR-006 改版時の注記として申し送る [D]。
    subject_formats_rationale: |
      受信者に送る主体は、受信者がすでに知る識別子（その受信者に払い出した OIDC の sub、ADR-021 の tid）に限る [D]。
      SSF は、受信者が既知でない主張の相関を許す識別子種別を使うべきでない（SHOULD NOT）とし、同じ相手には同じ種別・値を使うべき（SHOULD）とする [N][^ssf]（§10.1）。
      RFC 9493 も複数識別子の同時提示が意図以上の情報を伝え得るとする [N][^9493]（§6.1、ADR-021 D21-31）。
    set_header:
      typ: secevent+jwt
      typ_rationale: SSF のイベントは明示的な型付けを使わなければならない（MUST）[N][^ssf]（§4.1.1、RS-04#77）
      alg: ADR-015 の暗号 profile（CP）が (issuer 区分, typ=secevent+jwt) に割り当てた fully-specified alg。値はこの契約に固定しない
      key: ADR-007 D7-10 の L2 用途族 4「SET」の鍵。jwks_uri で公開し、内部 token の鍵と共有しない
    set_claims_rules:
      - '`sub` を含めない（MUST NOT）[N][^ssf]（§4.1.2）'
      - '`exp` を含めない（MUST NOT）[N][^ssf]（§4.1.7）'
      - '`iss` は stream 構成の `iss` と同一（MUST）[N][^ssf]（§4.1.6）'
      - '`aud` は受信者の client_id の単一文字列とする。同一主体と確認できない複数受信者に同じ SET を送らない（SSF §4.1.8 の SHOULD の適用）[N][^ssf][D]'
      - '`events` は 1 イベントだけを含める（SSF §4.2.1 の SHOULD の適用）[N][^ssf][D]'
      - '`txn` を付ける（SHOULD の適用）。値は失効記録の revocation_id から導いた不透明な文字列で、同じ原因から生じた複数の SET で同じ値を使う [N][^ssf]（§4.1.9）[D]。内部の Transaction Token の `txn`（ADR-022 D-8 の相関 ID 2）とは別の値であり、内部の txn を外部へ出さない [D]'
      - payload の詳細と受信義務は DL-79 が正本
    x-example-set-payload-session-revoked:
      summary: 本基盤が送る session-revoked SET の payload（参考。正本は DL-79）
      description: |
        `sub`・`exp` を含めない。主体は complex subject で tenant と user（受信者に払い出した sub）と session。
        数値（min_verification_interval=60、inactivity_timeout=7776000）を含む他の例の値は形式の例示であり、決定値ではない（TBD、DL-20）。
      value:
        jti: 0b6a7c1e5d9f4a2b8c3d1e0f9a8b7c6d
        iss: https://ssf.id.example.net
        aud: c_8d2f61a0
        iat: 1792036800
        txn: r_5f0e2d1c
        sub_id:
          format: complex
          tenant:
            format: opaque
            id: t_01J9Z3K7Q2
          user:
            format: iss_sub
            iss: https://ssf.id.example.net
            sub: '248289761001'
          session:
            format: opaque
            id: s_7Kp2Qx
        events:
          https://schemas.openid.net/secevent/caep/event-type/session-revoked:
            event_timestamp: 1792036795
  receiver:
    x-description: |
      基盤が顧客 IdP・外部 IdP から受信するときの義務。基盤は顧客 IdP の Transmitter Configuration と
      stream 管理 API を「呼ぶ側」であり、その API は相手の契約である。ここでは本基盤側の振舞いを定める。
    x-ref-path: '#/x-ssf-receiver-profile'

x-ssf-receiver-profile:
  x-contract-tier: GA
  role: 基盤が Receiver（C16 SSF receiver、ADR-006 D6-23）
  scale_hint: 受信 stream の上限の手掛かりは顧客 IdP 連携 2,000 [A-082]。外部 IdP（社員の上流 IdP 等）の件数は前提台帳にない（前提台帳へ追加要）
  binding:
    description: |
      受信 stream は「binding」（顧客 IdP 1 つとテナント文脈 1 つの結合）ごとに 1 本作る [D]。
      受信の効果はその IdP に結合したテナント文脈に限る [D]（ADR-006 D6-23、identity-lifecycle M-03）。
      binding_id は不透明な文字列で、push 受信 endpoint の path に入れる（SSF §6.1.1 の RECOMMENDED: stream ごとに一意の URL）[N][^ssf][D]。
  discovery:
    - 顧客 IdP の issuer URL は trust agreement とテナント管理者の設定から得る。`/.well-known/ssf-configuration` の応答の `issuer` が取得に使った issuer URL と同一でなければ、その構成を使わない（SSF §7.2.4 の MUST）[N][^ssf]
    - '`spec_version` がない Transmitter は 1_0-ID1 と見なされる（SSF §7.1）。本基盤は 1_0 を表明する Transmitter だけを GA の受信対象にし、それ以外は preview として個別に受け入れ判断する [N][^ssf][D]'
    - '`/.well-known/risc-configuration`（SSF §7.2.2 の後方互換）は、`ssf-configuration` を持たない RISC Transmitter に限って使う [N][^ssf][D]'
  stream_creation:
    - 顧客 IdP の configuration_endpoint へ stream を作成し、応答の `iss` が構成取得元の issuer と一致すること（MUST）と、`aud` が本基盤の期待値と一致すること（SHOULD の適用）を確認する [N][^ssf]（§8.1.1.1, §8.1.1.1.1）[D]
    - '`events_requested` は v1 受信 7 種（ADR-006 D6-23 の表）に限る。SSF は受信者が理解し処理できるイベントだけを要求すべき（SHOULD）とする [N][^ssf]（§8.1.1）'
    - '`events_delivered` を受信できるイベントの正とする（SSF §8.1.1 の MUST）。7 種のうち欠けるものは binding の健全性表示（テナント管理者向け）に出し、SCIM の無効化（RR6-02 の残余）で補う [N][^ssf][D]'
    - push を優先し、顧客 IdP が push を提供しない場合だけ poll にする（ADR-006 D6-23 は両方を受け付ける）[D]
  receiver_authentication:
    description: |
      受信者認証は「SET の真正性」と「HTTP 要求の認証」の 2 層で行う。SET の真正性が主であり、
      HTTP 要求の認証は受信口への大量投入（未認証の SET 検証負荷）を前段で落とすための補助である [D]。
    set_authenticity:
      - JWS 署名を必須にする。`alg` が `none` の SET、署名のない SET、暗号化だけの SET は処理しない [D]。RFC 8935 は SET の真正性の確認方式を配備に委ねる [N][^8935]（§2）
      - 'header の `typ` が `secevent+jwt` であること（SSF §4.1.1 の MUST）[N][^ssf]'
      - '`iss` が binding に登録した Transmitter の issuer と一致し、署名鍵がその issuer の `jwks_uri` から得た鍵であること（SSF §4.1.6 の MUST、ADR-006 D6-23）[N][^ssf][D]'
      - '`aud` に binding の受信者識別子が含まれること（RFC 8935 §2 の SHALL）[N][^8935]'
      - '`sub` または `exp` を含む JWT は SSF の SET として受理しない（SSF §4.1.3 の識別規則）[N][^ssf][D]'
      - 主体の complex subject に `tenant` がある場合、その値が binding のテナント文脈と一致しなければ `access_denied` で拒否する [D]
      - 検証できない SET は処理しない（ADR-006 D6-23）[D]
      - 顧客 IdP の構成が critical_subject_members を宣言し、SET の主体にその member があって本基盤が解釈できない場合は、その SET を破棄する（SSF §3.6 の MUST）[N][^ssf]
    http_authentication:
      push: |
        本基盤が顧客 IdP に stream を作成するとき、binding ごとに生成した高エントロピーの不透明値を
        `delivery.authorization_header` に設定し（SSF §6.1.1 の SHOULD の適用）、push 受信 endpoint はこの値を照合する [N][^ssf][D]。
        値は秘密情報として保管し、漏えいの疑い・定期更新では stream の PATCH で差し替える（更新周期は TBD、ADR-007 の鍵・秘密の運用に合わせる）[D]。
        顧客 IdP が mutual TLS で接続できる場合は TLS client 証明書の照合を併用してよい（RFC 8935 §3 は mutual TLS を手段の例に挙げる）[N][^8935][D]。
      poll_and_management: |
        顧客 IdP の `authorization_schemes` に従う（SSF §7.1.1）[N][^ssf]。OAuth（urn:ietf:rfc:6749）の場合は client credentials で取得した
        token を使い、sender constraint の方式は ADR-005 D5（外部 M2M は mTLS を既定）に合わせる [D]。
  delivery_guarantee:
    push:
      - SET を検証し耐久記録へ書き込んだ後に限り 202 を返す。202 の前に強制処理（失効状態への書込）を行わない（RFC 8935 §2 の SHOULD / SHOULD NOT の適用）[N][^8935][D]
      - 同じ SET の再送には、初めて受け取ったときと同じ応答を返す（RFC 8935 §2 の MUST）[N][^8935]。重複排除は (iss, jti) で行い、処理は冪等にする [D]
      - 受信者は送信者の再送に依存してはならない（RFC 8935 §2 の MUST NOT）ため、202 の後の処理失敗は本基盤側の再試行で解決する [N][^8935][D]
    poll:
      - 既定は long poll（returnImmediately=false）とし、timeout と poll 間隔は TBD（DL-20）[N][^8936][D]
      - SET を検証し耐久記録へ書き込んだ後に、次の poll 要求の `ack` で確認する。確認は局所の処理より前に行う（RFC 8936 §2.4 の SHOULD）[N][^8936]
      - 検証に失敗した SET は `setErrs` で報告する。`setErrs` は解析・検証の誤り以外に使わない（RFC 8936 §2 の SHALL NOT）[N][^8936]
      - 再配送された SET は重複として受け入れ、再度 ack する（RFC 8936 §2.4 の SHOULD）[N][^8936]
    processing:
      - 受信から失効状態への書込までの時間 D_in を ADR-006 D6-29 の D_w(c) に含めて計測する。値は TBD（DL-20）。計測は TC-ARC09-01 [D]
      - 受信の停止中は顧客 IdP 側の失効が基盤に届かない（ARC-01 C16 の残余）。最終受信時刻と検証イベントの往復で無音の故障を検知する [D]
  stream_health:
    - 顧客 IdP の verification_endpoint がある場合、`min_verification_interval` 以上の間隔で検証イベントを要求し、`state` に 1 回限りの値を入れて往復を確認する（間隔は TBD）[N][^ssf][D]
    - 検証要求の 204 は送信済みを意味しない。検証イベントの到着を同期的・順序どおりと見なさない（SSF §8.1.4.2 の MUST NOT）[N][^ssf]
    - '`state` が一致しない検証イベントには `invalid_state` を返す（SSF §8.1.4.1 の SHOULD）[N][^ssf]'
    - stream-updated で paused・disabled を受けたら、binding を「劣化」と表示し、テナント管理者とプラットフォーム運用に通知する。SCIM の無効化と顧客管理者向け失効 API（ADR-006 D6-27）を代替経路として案内する [D]
    - 削除済み主体のイベントを受けても誤りとして報告しない（SSF §9.3 の MUST NOT）[N][^ssf]
  unknown_content:
    - 理解できない追加フィールドは無視する（SSF §4.2.3 の MUST）[N][^ssf]
    - '`events_delivered` 外のイベント種別、および v1 受信 7 種外のイベント種別は、検証に通れば受理（202 / ack）して記録するが強制執行しない [D]。RISC account-purged の強制処理は未決（ADR-006 L6-1）'
    - RISC sessions-revoked は互換のためだけに CAEP session-revoked と同じ処理で受ける（ADR-006 D6-23）[D]

x-ssf-transmitter-delivery:
  x-contract-tier: GA
  role: 基盤が Transmitter（C17 SSF transmitter、ADR-006 D6-24）
  scale_hint: 受信者の上限の手掛かりは顧客の受信者（テナント約 1 万 [A-007]）と外部連携アプリ（client 800 [A-013]）
  guarantee:
    summary: |
      送信は best-effort ではなく、stream ごとに送信済み・確認済みの記録を持つ（ADR-006 D6-24）[D]。
      保証の水準は「確認（push の 202 / poll の ack）または保持期限の到来まで、少なくとも 1 回」（at-least-once）である [D]。
      同じ SET の再送では同じ `jti` を使う（RFC 8935 §2 は同じ SET の複数回送信を許す）[N][^8935][D]。
      送信の成否は基盤の強制に影響させない（ADR-006 D6-24）[D]。
    ordering: |
      同じ主体（Subject Principal）に関する SET は生成順に送る [D]。paused 中に保持した SET は、生成順に送るか、
      後のイベントで取り消された・古くなったものを除いて最後のものだけを送る（SSF §8.1.2.1 の MUST）[N][^ssf]。
      stream 全体の順序は保証しない。受信者は `iat` と `txn` で前後関係を判断する [D]。
    retention: 未確認の SET の保持期限 R_ret は TBD（DL-20。所有者・決め方は ADR-006 §2.10）。期限を超えた SET は dead letter に移し、受信者別の件数を運用に通知する [D]
    metrics: 送信済み・確認済み・未確認の件数と最古の未確認 SET の滞留時間を stream ごとに計測し、K-17 (b) に入れる [D]（01_governance/kri.md、ARC-09 §5.3）。送信遅延 D_tx は TC-ARC09-11 で測る
  push_retry:
    retry_when:
      - 接続失敗・TLS 失敗・timeout（RFC 8935 §2 の「回復可能な誤りの疑い」）[N][^8935]
      - HTTP 5xx、429、503（Retry-After があれば従う）[D]
      - 400 の `access_denied` と `authentication_failed`。RFC 8935 §4 は access_denied を、送信側が資格情報を更新すれば回復し得る一時的な誤りの例に挙げる [N][^8935]。SSF の push で送信側が使う資格情報は受信者が与えた authorization_header であり（SSF §6.1.1）、受信者の PATCH による差替えで回復し得るので、authentication_failed も同じ扱いにする。再送回数の上限を別に設ける [D]
    do_not_retry:
      - 400 の `invalid_request`、`invalid_key`、`invalid_issuer`、`invalid_audience`。RFC 8935 §4 が再送で成功する見込みが極めて小さい例に挙げるのは invalid_request である [N][^8935]。他の 3 種も同じ SET の再送では内容が変わらないので同じ扱いにする [D]。dead letter に移し、送信側の構成誤りとして運用へ通知する [D]
      - それ以外の場合は再送しない（RFC 8935 §2 の SHOULD NOT）[N][^8935]
    backoff: 指数 backoff＋jitter。初回間隔・上限間隔・最大再送時間（≦ R_ret）は TBD（DL-20）。受信者を過負荷にしないよう遅延させる（RFC 8935 §2 の SHOULD）[N][^8935][D]
    unknown_outcome: 応答を受け取れず配送の成否が不明な場合は、確認されるまで再送する（重複の可能性を受信者の (iss, jti) 重複排除に委ねる）。RFC 8935 §4 が実装者に委ねる選択のうち、配送を優先する側を採る [N][^8935][D]
    stream_pause: 連続失敗が閾値（TBD）を超えた stream は paused にできる。paused にする前に stream-updated を送らなければならない（SSF §8.1.5 の MUST）[N][^ssf]。送れない場合も状態の変更と理由を監査イベント（DL-77）に残す [D]
  poll_redelivery:
    - 未確認の SET は再配送間隔（TBD）の後に再び `sets` に含める（RFC 8936 §2.4 の MAY）[N][^8936]
    - 確認済みの SET は保持しない（RFC 8936 §2 は確認後の保持義務を課さない）[N][^8936][D]
    - 長期間 poll されない stream の未確認 SET は R_ret で破棄でき（RFC 8936 §2 の配備依存の破棄）、破棄件数を K-17 (b) に入れる [N][^8936][D]
  inactivity:
    - inactivity_timeout（値は TBD）を超えて受信者の活動がない stream は、削除せず paused にし、stream-updated を送る（SSF §8.1.1 の MUST）[N][^ssf][D]
  endpoint_url_policy:
    - push の `endpoint_url` は https に限る [N][^8935]（§2.1 TLS-enabled）。host は trust agreement または client 登録で事前に登録したものに限る [D]
    - 'IP literal、内部アドレス、本基盤の内部 host への配送は拒否する（SET を攻撃者の endpoint へ向けさせる設定変更と SSRF への対策）[D]'
    - endpoint_url・authorization_header の変更は監査イベント（DL-77）に残し、テナント管理者に通知する [D]
  data_minimization:
    - 送るイベントは ADR-022 D-2 の v1 範囲に限り、trust agreement に全用途を記載する（SP 800-63C-4 の SHALL）[N][^sp80063c4][D]（ADR-006 D6-24）
    - 受信者に送る前に、その受信者がそのテナントの情報を受け取る権限を持つことを確認する（SSF §9.2 の SHOULD）[N][^ssf][D]

paths:
  /.well-known/ssf-configuration:
    get:
      tags: [discovery]
      operationId: getTransmitterConfiguration
      summary: Transmitter Configuration Metadata の取得（単一 issuer の場合）
      description: |
        SSF §7.2 の discovery。Transmitter は `/.well-known/ssf-configuration` に JSON 文書を置かなければならない（MUST）[N][^ssf]。
        応答の `issuer` は取得に使った issuer URL と同一で、SET の `iss` と同一でなければならない（MUST）[N][^ssf]（§7.2.4）。
        `authorization_schemes` は認証なしで取得できるべき（SHOULD）とされるため、本 endpoint は認証を要求しない [N][^ssf]（§7.1）。
      security: []
      x-contract-tier: GA
      x-requirements: [G-118, R-109]
      responses:
        '200':
          description: 構成メタデータ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransmitterConfiguration'
              examples:
                singleIssuer:
                  $ref: '#/components/examples/TransmitterConfiguration'
        '404':
          $ref: '#/components/responses/NotFound'
      x-negative-examples:
        - id: NEG-CFG-01
          input: 受信者が http スキームの issuer URL で構成を取得する
          expected: 受信者は構成を使わない
          reason: 受信者は issuer URL が信頼できる取得元から得たもので https であることを確認すべき（SHOULD）[N][^ssf]（§7.2）
        - id: NEG-CFG-02
          input: 応答の `issuer` が取得に使った issuer URL と 1 文字でも異なる（末尾スラッシュの有無を含む）
          expected: 受信者は構成を破棄し、以後の stream 操作を中止する
          reason: SSF §7.2.4 の MUST（issuer mix-up の防止。ADR-022 D-6 の負例ベクタ 3）[N][^ssf][D]
  /.well-known/ssf-configuration/{issuer_path}:
    get:
      tags: [discovery]
      operationId: getTransmitterConfigurationWithPath
      summary: Transmitter Configuration Metadata の取得（issuer が path を持つ場合）
      description: |
        issuer が path 成分を持つ場合、末尾の `/` を除いて host と path の間に `/.well-known/ssf-configuration` を挿入する（MUST）[N][^ssf]（§7.2.1）。
        テナント別 issuer を採るかは未決（ADR-006 L6-7、DEC-3 の U-01）。採る場合の `issuer_path` の形式は ADR-021 の issuer URL 規則に従う [D]。
      security: []
      x-contract-tier: GA
      x-requirements: [G-118]
      parameters:
        - name: issuer_path
          in: path
          required: true
          description: issuer URL の path 成分（先頭・末尾の `/` を除いたもの）
          schema:
            type: string
            pattern: '^[A-Za-z0-9._~-]+(/[A-Za-z0-9._~-]+)*$'
          example: t/7f3c9a2e
      responses:
        '200':
          description: 構成メタデータ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransmitterConfiguration'
        '404':
          $ref: '#/components/responses/NotFound'

  /ssf/stream:
    post:
      tags: [stream-management]
      operationId: createStream
      summary: stream の作成（SSF §8.1.1.1）
      description: |
        受信者（顧客の受信者・外部連携アプリ）が stream を作る。要求に含めてよいのは受信者が与える
        `events_requested`・`delivery`・`description` である [N][^ssf]。
        `delivery` がなければ poll（urn:ietf:rfc:8936）と見なし、本基盤が `endpoint_url` を払い出す（MUST）[N][^ssf]。

        profile の追加:
        - stream を作れるのは、trust agreement（顧客の受信者）または連携契約（外部連携アプリ）が登録済みの client に限る（ADR-006 D6-24）[D]。それ以外は 403。
        - 1 受信者あたりの stream 数の上限は TBD。本基盤は複数 stream を許すので 409 は返さず、上限超過は 403 とする [D]。
        - push の `endpoint_url` は `x-ssf-transmitter-delivery.endpoint_url_policy` に従い、外れれば 400。
        - 作成直後の stream は主体を含まない（`default_subjects: NONE`）。受信者は `addSubject` でテナントを追加する [D]。
        - 作成・変更・削除はすべて監査イベント（DL-77）に残す [D]。
      x-contract-tier: GA
      x-requirements: [G-118, G-138, R-112]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StreamCreateRequest'
            examples:
              push:
                $ref: '#/components/examples/StreamCreatePushRequest'
              poll:
                $ref: '#/components/examples/StreamCreatePollRequest'
      responses:
        '201':
          description: 作成された stream の構成。受信者は `iss` が構成取得元の issuer と一致することを確認しなければならない（MUST）[N][^ssf]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamConfiguration'
              examples:
                push:
                  $ref: '#/components/examples/StreamConfigurationPush'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-negative-examples:
        - id: NEG-STR-01
          input: trust agreement も連携契約も登録されていない client が stream を作る
          expected: 403。stream は作られない
          reason: 送信先を trust agreement と連携契約のある受信者に限る（ADR-006 D6-24、SP 800-63C-4 の SHALL）[N][^sp80063c4][D]
        - id: NEG-STR-02
          input: '`delivery.endpoint_url` が http://、IP literal、内部 host、または未登録の host'
          expected: 400。problem の type は endpoint-not-allowed
