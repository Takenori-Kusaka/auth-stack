# CON-11 §7.2 consumer manifest (provisional name/format; DL-120 not delivered). Trial draft.
consumer_id: { client_id: "TBD-sandbox-registration", workload_id: "spiffe://sandbox.invalid/ns/expense/sa/api" }
roles: [CR-1, CR-2, CR-3, CR-5, CR-8, CR-9]
contracts:
  - { id: CON-03, version: "profile 1.x", operations: [evaluation, evaluations, search_resource], depends_on: ["/decision", "/context/x-authz-profile/decision_id", "/context/x-authz-profile/reason", "/context/x-authz-profile/consistency/mode", "/context/x-authz-profile/consistency/token", "/context/x-authz-profile/obligations", "/evaluations", "/results", "/page/next_token", "/context/x-authz-profile/completeness"] }
  - { id: CON-04, version: "0.3.x", operations: [writeRelationships], depends_on: ["/consistency_token"] }
  - { id: CON-05, version: "0.1.x", operations: [token, txn-token], depends_on: ["/access_token", "/issued_token_type", "/expires_in", "/scope"] }
  - { id: CON-06, version: "0.1.x", depends_on_claims: [iss, sub, aud, exp, iat, jti, client_id, tid, ptype, ver] }
  - { id: CON-08, version: "1.0.0-draft.1", event_types: [pep.enforce] }
