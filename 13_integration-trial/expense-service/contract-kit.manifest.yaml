open_enum_unknown: deny
options: { sender_constrained: false, long_lived_connections: false, list_endpoints: ["GET /t/{tid}/expenses"], own_session: false }
preview_dependencies:   # CON-00 §2.5 step 2 / INT-05 RD-04: preview elements used and why
  - { element: "CON-03 searchResources", why: "candidate generator only; P-09 says SDK-internal -> not used by the business path (see report)" }
